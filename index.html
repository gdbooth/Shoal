      setAlpaca({
        connected: true,
        env: form.env,
        token,
        keyMasked: apiKey.slice(0, 4) + '····' + apiKey.slice(-4),
        secretMasked: username,
        account: acc.id,
        currency: acc.currency,
        balance: acc.equity || acc.buyingPower || 0,
        brokerId: 'ig',
        broker: broker?.name || 'IG',
        endpoint: broker?.endpoint,
      });
    } catch (err) {
      setConnectErr(`Cannot reach Shoal backend at ${BACKEND_URL}. Is it running? (npm install && npm start)`);
    }
    setConnecting(false);
  };

  return (
    <div className="page" data-screen-label="07 Settings">
      <div className="page-head">
        <div className="page-eyebrow">Settings</div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:12}}>
          <h1 className="page-title">Broker, risk, <em>and the rules of the game.</em></h1>
          {loginOn && (
            <button className="btn ghost" style={{fontSize:10,padding:'5px 10px',flexShrink:0}}
              onClick={async () => { try { await fetch(`${BACKEND_URL}/api/logout`, { method: 'POST' }); } catch (_) {} location.href = '/login'; }}>LOG OUT</button>
          )}
        </div>
        <p className="page-sub">The settings that change results are <b>Style</b> and <b>Risk level</b>. Replay data chooses the history SIMULATED uses. Leave Autopilot off and Advanced at the defaults unless a lab or the Optimiser's held-out check says otherwise; the Guide explains each one.</p>
      </div>
      {alpaca?.expired && !alpaca?.connected && (
        <div className="card" style={{borderColor:'var(--warn)',padding:'10px 16px',marginBottom:16}}>
          <div className="tiny" style={{color:'var(--ink-2)'}}><span className="mono" style={{color:'var(--warn)',letterSpacing:'0.12em'}}>SESSION EXPIRED · </span>For safety a broker session lasts 8 hours. Reconnect below to keep trading from this browser (the server's daily job, if on, is not affected).</div>
        </div>
      )}

      <div className="grid-2" style={{marginBottom:16}}>
        <div className="card">
          <div className="card-head"><div className="card-title">Broker connection</div><div className="card-meta">{alpaca.connected ? alpaca.broker : 'Alpaca · IG'}</div></div>

          {backendOk === true && (
            <div style={{display:'flex',gap:10,padding:'10px 12px',background:'rgba(125,216,125,0.06)',border:'1px solid rgba(125,216,125,0.3)',borderRadius:4,marginBottom:14,alignItems:'flex-start'}}>
              <span style={{color:'var(--virtual)',fontSize:14,lineHeight:1,marginTop:1}}>◉</span>
              <div style={{lineHeight:1.5}}>
                <div className="mono tiny" style={{color:'var(--virtual)',letterSpacing:'0.1em',marginBottom:3}}>BACKEND ONLINE</div>
                <div className="tiny" style={{color:'var(--ink-2)'}}>
                  Shoal backend is running. Your credentials are sent to the backend, validated against your broker, and held in server memory only — never written to disk or logged. The backend proxies all order and account requests.
                </div>
              </div>
            </div>
          )}
          {backendOk === false && (
            <div style={{display:'flex',gap:10,padding:'10px 12px',background:'rgba(255,170,40,0.06)',border:'1px solid rgba(255,170,40,0.3)',borderRadius:4,marginBottom:14,alignItems:'flex-start'}}>
              <span style={{color:'var(--warn)',fontSize:14,lineHeight:1,marginTop:1}}>◉</span>
              <div style={{lineHeight:1.5}}>
                <div className="mono tiny" style={{color:'var(--warn)',letterSpacing:'0.1em',marginBottom:3}}>BACKEND OFFLINE · SIMULATED</div>
                <div className="tiny" style={{color:'var(--ink-2)'}}>
                  Backend not reachable at <span className="mono" style={{fontSize:11}}>{BACKEND_URL}</span>. Start it with <span className="mono" style={{fontSize:11}}>npm install &amp;&amp; npm start</span> to enable real broker trading. Until then, trades and P&amp;L are simulated locally.
                </div>
              </div>
            </div>
          )}
          {backendOk === null && (
            <div style={{display:'flex',gap:10,padding:'10px 12px',background:'rgba(100,100,100,0.06)',border:'1px solid var(--line-2)',borderRadius:4,marginBottom:14,alignItems:'center'}}>
              <span className="mono tiny muted">○</span>
              <div className="mono tiny muted" style={{letterSpacing:'0.1em'}}>CHECKING BACKEND…</div>
            </div>
          )}

          {!alpaca.connected ? (
            <div>
              <div style={{padding:'24px 16px',textAlign:'center',background:'var(--bg-2)',borderRadius:6,marginBottom:14}}>
                <div style={{width:48,height:48,margin:'0 auto 12px',borderRadius:'50%',background:'var(--bg-3)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--mono)',fontSize:16,color:'var(--ink-3)'}}>α</div>
                <div className="serif" style={{fontSize:18,marginBottom:6}}>No broker connected</div>
                <div className="tiny muted">Live trading is disabled until you connect an account.</div>
              </div>
              <button className="btn primary" style={{width:'100%'}} onClick={startConnect}>CONNECT BROKER →</button>
              <div className="mono tiny muted" style={{marginTop:10,textAlign:'center'}}>Alpaca (US equities) or IG (spread betting).</div>
            </div>
          ) : (
            <div>
              <div style={{padding:'14px 16px',background:'var(--bg-2)',borderRadius:6,marginBottom:14,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    <span style={{width:8,height:8,borderRadius:'50%',background:'var(--virtual)',boxShadow:'0 0 6px currentColor'}}></span>
                    <span className="mono" style={{fontSize:12,letterSpacing:'0.06em'}}>{alpaca.broker}</span>
                  </div>
                  <div className="mono tiny muted" style={{marginTop:6}}>
                    {alpaca.env === 'live' ? 'LIVE' : alpaca.brokerId === 'ig' ? 'DEMO' : 'PAPER'} · Account {alpaca.account}
                  </div>
                </div>
                <button className="btn ghost" onClick={async () => {
                  if (alpaca.token) {
                    try { await fetch(`${BACKEND_URL}/api/disconnect`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + alpaca.token } }); } catch (_) {}
                  }
                  setAlpaca({ ...alpaca, connected: false, token: null });
                }}>DISCONNECT</button>
              </div>
              <div className="dialog-list">
                <div className="dialog-row"><span className="l">Environment</span><span className="v" style={{color: alpaca.env === 'live' ? 'var(--live)' : 'var(--virtual)'}}>{alpaca.env === 'live' ? 'Live' : alpaca.brokerId === 'ig' ? 'Demo' : 'Paper'} · {alpaca.endpoint ? alpaca.endpoint.replace('https://','') : 'paper-api.alpaca.markets'}</span></div>
                <div className="dialog-row"><span className="l">{alpaca.brokerId === 'ig' ? 'API key' : 'API key ID'}</span><span className="v mono">{alpaca.keyMasked || '—'}</span></div>
                <div className="dialog-row"><span className="l">{alpaca.brokerId === 'ig' ? 'Username' : 'Secret'}</span><span className="v mono">{alpaca.secretMasked || '—'}</span></div>
                <div className="dialog-row"><span className="l">Buying power</span><span className="v">{fmtMoney(alpaca.balance)}</span></div>
                {alpaca.brokerId === 'ig' ? (<>
                <div className="dialog-row"><span className="l">Account type</span><span className="v">Spread bet · {alpaca.currency || 'GBP'} per point · DFB</span></div>
                <div className="dialog-row"><span className="l">Data feed</span><span className="v">IG Lightstreamer · daily bars via REST</span></div>
                </>) : (<>
                <div className="dialog-row"><span className="l">Account type</span><span className="v">Margin · individual</span></div>
                <div className="dialog-row"><span className="l">Day trades used</span><span className="v">2 / 3</span></div>
                <div className="dialog-row"><span className="l">Data feed</span><span className="v">IEX (free) · upgrade for SIP</span></div>
                </>)}
                <div className="dialog-row"><span className="l">API permission</span><span className="v" style={{color:'var(--virtual)'}}>READ + TRADE</span></div>
              </div>
            </div>
          )}
        </div>

        <div className="card">
          <div className="card-head"><div className="card-title">Strategy</div><div className="card-meta">applies to every mode</div></div>
          {frozen && <FrozenNotice frozen={frozen} onOpen={onOpenOptimiser}/>}
          <div style={frozen ? {pointerEvents:'none',opacity:0.5} : undefined}>

          <div className="field">
            <div className="field-label" style={{marginBottom:8}}>Risk level</div>
            <div className="tweak-opts">
              {[['cautious','Cautious'],['balanced','Balanced'],['bold','Bold']].map(([k, label]) => (
                <div key={k} className={'tweak-opt ' + (risk.riskLevel === k ? 'on' : '')} onClick={() => setRisk({ ...risk, ...RISK_LEVELS[k], riskLevel: k })}>{label}</div>
              ))}
            </div>
            <div className="mono tiny muted" style={{marginTop:6}}>
              {risk.riskLevel === 'cautious' ? 'Invest 60% of equity, sell on weakness sooner, 2% daily loss limit.'
                : risk.riskLevel === 'bold' ? 'Invest 100% of equity, bigger and more positions, 5% daily loss limit.'
                : risk.riskLevel === 'balanced' ? 'Invest 90% of equity, 1% risk per trade, 3% daily loss limit.'
                : 'Custom: you changed values under Advanced.'}
            </div>
          </div>

          <div className="field">
            <div className="field-label" style={{marginBottom:8}}>Style</div>
            <div className="tweak-opts">
              {[['tilt','Rank & tilt'],['invested','Stay invested'],['both','Trade both ways']].map(([k, label]) => (
                <div key={k} className={'tweak-opt ' + ((risk.style || 'tilt') === k ? 'on' : '')} onClick={() => setRisk({ ...risk, style: k })}>{label}</div>
              ))}
            </div>
            <div className="mono tiny muted" style={{marginTop:6}}>
              {risk.style === 'both'
                ? 'Long and short trades when enough agents agree, with ATR stops and targets. On 2015–2018 daily data this lost to simply holding the stocks.'
                : risk.style === 'invested'
                ? 'Hold all the stocks and sell one only when it shows weakness (Trend Persistence by default); buy it back when that clears. On 2015–2018 daily data: 88% vs 95% for holding everything, with a −10% worst drop instead of −15%.'
                : `Stay fully invested in the ${risk.topK || 12} stocks with the strongest trend (return from 6 months to 1 month ago), re-ranked at each month end. Tested on real daily data after costs, it is not a reliable way to beat simply holding everything. On 12 stocks and sector funds over 2017–2026 it made about the same (+1153% vs +1178%) with a smaller worst drop (−39% vs −49%). On 6 sector funds alone it trailed (+119% vs +176%). Its earlier wins came mostly from riding a few big winners such as NVDA. Expect it to help most in long bear markets like 2022; watch the buy-and-hold comparison and paper-trade before going live.`}
            </div>
          </div>

          <WatchlistEditor brokerId={alpaca?.brokerId}/>

          <ServerTradingCard alpaca={alpaca} st={serverTrading}/>

          <div className="field">
            <div className="field-label" style={{marginBottom:8}}>Replay data <span className="muted">(SIMULATED mode)</span></div>
            <div className="tweak-opts">
              {[['auto','Auto'],['fictional','Fictional'],['broker','Broker'],['imported','Imported']].map(([k, label]) => (
                <div key={k} className={'tweak-opt ' + ((risk.replaySource || 'auto') === k ? 'on' : '')}
                  style={k === 'imported' && !importedUniverse ? {opacity:0.4,pointerEvents:'none'} : undefined}
                  onClick={() => setRisk({ ...risk, replaySource: k })}>{label}</div>
              ))}
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',marginTop:8,flexWrap:'wrap'}}>
              <button className="btn" style={{fontSize:10,padding:'4px 10px'}} onClick={() => importFileRef.current?.click()}>IMPORT CSV…</button>
              {importedUniverse && <button className="btn ghost" style={{fontSize:10,padding:'4px 10px'}} onClick={async () => { await onRemoveImport(); setImportMsg(null); if (risk.replaySource === 'imported') setRisk({ ...risk, replaySource: 'auto' }); }}>REMOVE IMPORT</button>}
              <input ref={importFileRef} type="file" accept=".csv,text/csv" multiple style={{display:'none'}}
                onChange={async e => { const f = [...(e.target.files || [])]; e.target.value = ''; if (!f.length) return; setImportMsg({ ok: true, msg: 'Reading…' }); const r = await onImportCsv(f); setImportMsg(r); if (r.ok) setRisk({ ...risk, replaySource: 'imported' }); }}/>
              <span className="mono tiny muted">{importedUniverse ? `Imported: ${importedUniverse.meta.symbols} stocks, ${importedUniverse.meta.from} → ${importedUniverse.meta.to}` : 'Longer history for validation: one or more CSVs with date,symbol,open,high,low,close,volume (pick several to combine them). Read in your browser only; never uploaded.'}</span>
            </div>
            {importMsg && <div className="tiny" style={{marginTop:6,color: importMsg.ok ? 'var(--ink-2)' : 'var(--down)'}}>{importMsg.msg}</div>}
            <div className="mono tiny muted" style={{marginTop:6}}>
              {risk.replaySource === 'imported' ? 'Replay, backtest and optimise on the history you imported.'
                : (risk.replaySource || 'auto') === 'fictional' ? 'Always replay the built-in fictional market: 2 years of generated prices ending today.'
                : risk.replaySource === 'broker' ? "Only replay your broker's history (about 3 years from Alpaca, 220 days from IG)."
                : "Your broker's history when connected, otherwise the fictional 2-year market."}
            </div>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div className="field-label">Autopilot</div>
              <button className={'tweak-opt ' + (risk.autopilot ? 'on' : '')} onClick={() => setRisk({ ...risk, autopilot: !risk.autopilot })}>{risk.autopilot ? 'ON' : 'OFF'}</button>
            </div>
            <div className="mono tiny muted" style={{marginTop:6}}>
              The combination model: a regression that turns the trend score plus the scores of agents with positive evidence into an expected next-month return for each stock. It refits each quarter on past data only, and a new version is adopted only if it ranked stocks better on the 60 days it wasn't fitted on. Rank & tilt then ranks by it; the other styles take their agent weights from it. Off by default: on 2015–2018 daily data it made 153% vs 175% for the plain trend score.
            </div>
            {risk.autopilot && (
              <div style={{marginTop:10}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
                  <span className="tiny" style={{color:'var(--ink-2)'}}>Freeze tuning <span className="muted">(keep the current weights and settings)</span></span>
                  <button className={'tweak-opt ' + (risk.autopilotFrozen ? 'on' : '')} onClick={() => setRisk({ ...risk, autopilotFrozen: !risk.autopilotFrozen })}>{risk.autopilotFrozen ? 'FROZEN' : 'ACTIVE'}</button>
                </div>
                {mode === 'LIVE' && <div className="mono tiny" style={{color:'var(--live)',marginBottom:8}}>LIVE: at most one weight change and one setting change per day, each agent's weight moves at most 5 points.</div>}
                <div className="mono tiny muted" style={{letterSpacing:'0.1em',marginBottom:6}}>RECENT CHANGES</div>
                <AutopilotLog log={autopilotLog} limit={4} empty="No changes yet: the model refits every quarter (63 trading days)." />
              </div>
            )}
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">Daily loss limit</div>
              <div className="mono" style={{fontSize:13}}>{risk.dailyLoss}%</div>
            </div>
            <input type="range" min="1" max="10" step="0.5" value={risk.dailyLoss} onChange={e=>setRisk({...risk, dailyLoss: +e.target.value})}/>
            <div className="mono tiny muted" style={{marginTop:4}}>When equity falls this much in a day, Shoal opens no new positions until the next day and alerts you. Selling on weakness and stops keep working.</div>
          </div>

          <div className="divider"></div>
          <div className="dialog-row" style={{cursor:'pointer'}} onClick={() => setShowAdvanced(v => !v)}>
            <span className="l"><div>Advanced settings</div><div className="tiny muted" style={{marginTop:2}}>Position sizing, stops, confidence, agent filters — set by the risk level</div></span>
            <span className="mono tiny">{showAdvanced ? '▾ HIDE' : '▸ SHOW'}</span>
          </div>
          {showAdvanced && (<>
          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">Stocks held <span className="muted">(Rank & tilt)</span></div>
              <div className="mono" style={{fontSize:13}}>top {risk.topK || 12}</div>
            </div>
            <input type="range" min="3" max="20" step="1" value={risk.topK || 12} onChange={e=>setRisk({...risk, topK: +e.target.value, riskLevel: 'custom'})}/>
            <div className="mono tiny muted" style={{marginTop:4}}>Fewer = more concentrated in the strongest trends (higher potential return, bigger swings).</div>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div className="field-label">Trading cost per trade side</div>
              <div className="mono" style={{fontSize:13}}>{risk.costBps === 'auto' || risk.costBps == null ? `auto · ${autoCostBps}bp` : `${risk.costBps}bp`}</div>
            </div>
            <div className="tweak-opts" style={{marginTop:6}}>
              {[['auto','Auto'],[3,'3bp'],[5,'5bp'],[10,'10bp'],[20,'20bp']].map(([k, label]) => (
                <div key={String(k)} className={'tweak-opt ' + (String(risk.costBps ?? 'auto') === String(k) ? 'on' : '')} onClick={() => setRisk({ ...risk, costBps: k })}>{label}</div>
              ))}
            </div>
            <div className="mono tiny muted" style={{marginTop:4}}>Half the bid/ask spread + slippage + commission, charged on every buy and sell in replays, backtests and the optimiser. Auto: Alpaca 5bp, IG spread bets 12bp, fictional 5bp.</div>
          </div>

          <div className="field">
            <div className="field-label" style={{marginBottom:8}}>Broker history to load <span className="muted">(Alpaca)</span></div>
            <div className="tweak-opts">
              {[[1100,'3 years'],[1850,'5 years'],[3700,'10 years']].map(([k, label]) => (
                <div key={k} className={'tweak-opt ' + ((risk.historyDays || 1100) === k ? 'on' : '')} onClick={() => setRisk({ ...risk, historyDays: k })}>{label}</div>
              ))}
            </div>
            <div className="mono tiny muted" style={{marginTop:4}}>More history makes backtests and the optimiser more trustworthy. Alpaca returns what its data plan covers; IG stays at 220 days (weekly data allowance).</div>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div className="field-label">Only agents with evidence vote</div>
              <button className={'tweak-opt ' + (risk.pruneAgents !== false ? 'on' : '')} onClick={() => setRisk({ ...risk, pruneAgents: risk.pruneAgents === false })}>{risk.pruneAgents !== false ? 'ON' : 'OFF'}</button>
            </div>
            <div className="mono tiny muted" style={{marginTop:4}}>Agents whose scores haven't predicted next-month returns on the history so far (rank IC t ≥ 1) become advisory: shown with their evidence in Agent config, but excluded from votes. The model always prunes this way.</div>
          </div>


          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">Risk per trade</div>
              <div className="mono" style={{fontSize:13}}>{risk.perTrade.toFixed(1)}%</div>
            </div>
            <input type="range" min="0.1" max="5" step="0.1" value={risk.perTrade} onChange={e=>setRisk({...risk, perTrade: +e.target.value, riskLevel: 'custom'})}/>
            <div className="mono tiny muted" style={{marginTop:4}}>With ATR stops on, each position is sized so hitting its stop loses about this % of equity (capped by the max trade size).</div>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">Max concurrent positions</div>
              <div className="mono" style={{fontSize:13}}>{risk.maxPos} positions</div>
            </div>
            <input type="range" min="1" max="50" step="1" value={risk.maxPos} onChange={e=>setRisk({...risk, maxPos: +e.target.value, riskLevel: 'custom'})}/>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">Confidence threshold <span className="muted">(stay invested: sell when a weakness call is at least this confident)</span></div>
              <div className="mono" style={{fontSize:13}}>≥ {risk.confidence}%</div>
            </div>
            <input type="range" min="40" max="90" step="1" value={risk.confidence} onChange={e=>setRisk({...risk, confidence: +e.target.value, riskLevel: 'custom'})}/>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">Share of equity invested <span className="muted">(stay invested)</span></div>
              <div className="mono" style={{fontSize:13}}>{Math.round((risk.investFraction ?? 0.9) * 100)}%</div>
            </div>
            <input type="range" min="0.2" max="1" step="0.05" value={risk.investFraction ?? 0.9} onChange={e=>setRisk({...risk, investFraction: +e.target.value, riskLevel: 'custom'})}/>
            <div className="mono tiny muted" style={{marginTop:4}}>Split equally across the stocks; the rest stays in cash.</div>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">% of equity as max trade</div>
              <div className="mono" style={{fontSize:13}}>{(risk.maxTradePct ?? 5).toFixed(1)}%</div>
            </div>
            <input type="range" min="0.5" max="25" step="0.5" value={risk.maxTradePct ?? 5} onChange={e=>setRisk({...risk, maxTradePct: +e.target.value, riskLevel: 'custom'})}/>
            <div className="mono tiny muted" style={{marginTop:4}}>Maximum trade size as a percentage of current equity</div>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div className="field-label">Auto-disable under-performing agents</div>
              <button className={'tweak-opt ' + ((risk.autoDisableAgents !== false)?'on':'')} onClick={()=>setRisk({...risk, autoDisableAgents: risk.autoDisableAgents === false})}>{(risk.autoDisableAgents !== false)?'ON':'OFF'}</button>
            </div>
            <div className="mono tiny muted" style={{marginTop:4}}>When ON, agents whose rolling accuracy drops below the threshold below are automatically removed from consensus. When OFF, every enabled agent always votes regardless of accuracy.</div>
          </div>

          <div className="field" style={{opacity: (risk.autoDisableAgents !== false) ? 1 : 0.4, pointerEvents: (risk.autoDisableAgents !== false) ? 'auto' : 'none'}}>
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">Min agent accuracy</div>
              <div className="mono" style={{fontSize:13}}>≥ {risk.minAgentAccuracy ?? 35}%</div>
            </div>
            <input type="range" min="10" max="80" step="1" value={risk.minAgentAccuracy ?? 35} onChange={e=>setRisk({...risk, minAgentAccuracy: +e.target.value})}/>
            <div className="mono tiny muted" style={{marginTop:4}}>Agents below this accuracy (after ≥5 trades) are excluded from consensus. They rejoin automatically when they recover.</div>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">Max agent disagreement</div>
              <div className="mono" style={{fontSize:13}}>≤ {risk.maxDisagreement ?? 65}%</div>
            </div>
            <input type="range" min="20" max="100" step="5" value={risk.maxDisagreement ?? 65} onChange={e=>setRisk({...risk, maxDisagreement: +e.target.value})}/>
            <div className="mono tiny muted" style={{marginTop:4}}>Block trades when agent vote spread (std-dev) exceeds this level. Lower = only trade when agents strongly agree. 65% is the recommended balance.</div>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">Max sector concentration</div>
              <div className="mono" style={{fontSize:13}}>≤ {risk.maxSectorPct ?? 40}% per sector</div>
            </div>
            <input type="range" min="10" max="100" step="5" value={risk.maxSectorPct ?? 40} onChange={e=>setRisk({...risk, maxSectorPct: +e.target.value})}/>
            <div className="mono tiny muted" style={{marginTop:4}}>Maximum fraction of open positions that can be in one sector. Enforces diversification when ≥3 positions are open.</div>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div className="field-label">ATR stops &amp; sizing</div>
              <button className={'tweak-opt ' + ((risk.atrStops !== false)?'on':'')} onClick={()=>setRisk({...risk, atrStops: risk.atrStops === false})}>{(risk.atrStops !== false)?'ON':'OFF'}</button>
            </div>
            <div className="mono tiny muted" style={{marginTop:4}}>Stops and targets scale with each stock's average true range (ATR), so a volatile stock gets a wider stop and a smaller position. OFF uses the fixed percentages below for every stock.</div>
          </div>

          <div style={{opacity: (risk.atrStops !== false) ? 1 : 0.4, pointerEvents: (risk.atrStops !== false) ? 'auto' : 'none'}}>
            <div className="field">
              <div style={{display:'flex',justifyContent:'space-between'}}>
                <div className="field-label">Stop distance</div>
                <div className="mono" style={{fontSize:13}}>{(risk.atrStop ?? 2).toFixed(1)} × ATR</div>
              </div>
              <input type="range" min="0.5" max="5" step="0.25" value={risk.atrStop ?? 2} onChange={e=>setRisk({...risk, atrStop: +e.target.value})}/>
            </div>
            <div className="field">
              <div style={{display:'flex',justifyContent:'space-between'}}>
                <div className="field-label">Target distance</div>
                <div className="mono" style={{fontSize:13}}>{(risk.atrTarget ?? 3).toFixed(1)} × ATR</div>
              </div>
              <input type="range" min="0.5" max="8" step="0.25" value={risk.atrTarget ?? 3} onChange={e=>setRisk({...risk, atrTarget: +e.target.value})}/>
              <div className="mono tiny muted" style={{marginTop:4}}>A target further than the stop (default 3 vs 2 ATR) lets a strategy profit with a hit rate under 50%.</div>
            </div>
          </div>

          <div style={{opacity: (risk.atrStops !== false) ? 0.4 : 1, pointerEvents: (risk.atrStops !== false) ? 'none' : 'auto'}}>
          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">Stop-loss per trade</div>
              <div className="mono" style={{fontSize:13}}>{(risk.stopLoss ?? 2.5).toFixed(1)}%</div>
            </div>
            <input type="range" min="0.5" max="10" step="0.5" value={risk.stopLoss ?? 2.5} onChange={e=>setRisk({...risk, stopLoss: +e.target.value})}/>
            <div className="mono tiny muted" style={{marginTop:4}}>Used when ATR stops are off: force-close a position this far against the entry.</div>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">Take-profit target</div>
              <div className="mono" style={{fontSize:13}}>{(risk.takeProfit ?? 5).toFixed(1)}%</div>
            </div>
            <input type="range" min="1" max="20" step="0.5" value={risk.takeProfit ?? 5} onChange={e=>setRisk({...risk, takeProfit: +e.target.value})}/>
            <div className="mono tiny muted" style={{marginTop:4}}>Used when ATR stops are off: lock in gains at this return.</div>
          </div>

          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div className="field-label">Regime-aware weights</div>
              <button className={'tweak-opt ' + (risk.regimeWeights ? 'on' : '')} onClick={()=>setRisk({...risk, regimeWeights: !risk.regimeWeights})}>{risk.regimeWeights ? 'ON' : 'OFF'}</button>
            </div>
            <div className="mono tiny muted" style={{marginTop:4}}>Scales each agent's vote by its own track record in the current regime (trend/range × calm/volatile), after 15 closed votes there. Off by default: on 2014–2018 daily data it lowered returns in every test period.</div>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div className="field-label">Correlation penalty</div>
              <button className={'tweak-opt ' + (risk.corrPenalty ? 'on' : '')} onClick={()=>setRisk({...risk, corrPenalty: !risk.corrPenalty})}>{risk.corrPenalty ? 'ON' : 'OFF'}</button>
            </div>
            <div className="mono tiny muted" style={{marginTop:4}}>Down-weights agents that keep voting together so one idea isn't counted several times. Off by default: on 2014–2018 daily data it lowered returns.</div>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">Min agent consensus</div>
              <div className="mono" style={{fontSize:13}}>≥ {risk.minConsensus ?? 7} agents</div>
            </div>
            <input type="range" min="4" max="16" step="1" value={risk.minConsensus ?? 7} onChange={e=>setRisk({...risk, minConsensus: +e.target.value})}/>
            <div className="mono tiny muted" style={{marginTop:4}}>Only enter a trade when at least N of 16 agents vote in the same direction. Higher = more selective, fewer trades.</div>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">Max holding period</div>
              <div className="mono" style={{fontSize:13}}>{fmtHold(risk.maxHoldHours ?? 48)}</div>
            </div>
            <input type="range" min="0" max={HOLD_STEPS.length - 1} step="1" value={holdStepIndex(risk.maxHoldHours ?? 48)} onChange={e=>setRisk({...risk, maxHoldHours: HOLD_STEPS[+e.target.value]})}/>
            <div className="mono tiny muted" style={{marginTop:4}}>Time-stop for Trade both ways: force-close positions open longer than this (5 minutes to 7 days). Rank & tilt and Stay invested don't use it. Replays step one day at a time, so there anything under a trading day closes at the next day's close. With a broker account under $25,000, a buy and sell on the same day counts as a day trade (at most 3 in 5 business days).</div>
          </div>

          <div className="divider"></div>

          <div className="dialog-row">
            <span className="l">Allow shorts</span>
            <button className={'tweak-opt ' + (risk.shorts?'on':'')} onClick={()=>setRisk({...risk,shorts:!risk.shorts})}>{risk.shorts?'ON':'OFF'}</button>
          </div>
          <div className="dialog-row">
            <span className="l">Trade direction</span>
            <div className="tweak-opts">
              {['LONG','SHORT','BOTH'].map(d => (
                <div key={d} className={'tweak-opt '+(direction===d?'on':'')} onClick={()=>setDirection(d)}>
                  {d==='LONG'?'↑':d==='SHORT'?'↓':'⇅'} {d}
                </div>
              ))}
            </div>
          </div>
          </>)}
          </div>
          <div className="dialog-row">
            <span className="l">
              <div>Reset virtual account</div>
              <div className="tiny muted" style={{marginTop:2}}>Wipe P&L, keep learned weights</div>
            </span>
            <button className="btn" onClick={onReset}>RESET →</button>
          </div>
          <div className="dialog-row">
            <span className="l">
              <div>Reset learned weights</div>
              <div className="tiny muted" style={{marginTop:2}}>Clear agent history, restore the style's starting weights</div>
            </span>
            <button className="btn" onClick={onResetWeights}>RESET →</button>
          </div>
          <div className="dialog-row">
            <span className="l">
              <div>Weights history</div>
              <div className="tiny muted" style={{marginTop:2}}>Export or import agent weights &amp; vote history as CSV</div>
            </span>
            <div style={{display:'flex',gap:6}}>
              <button className="btn" onClick={onExportWeights}>EXPORT CSV</button>
              <button className="btn" onClick={()=>importCsvRef.current?.click()}>IMPORT CSV</button>
              <input
                ref={importCsvRef}
                type="file"
                accept=".csv"
                style={{display:'none'}}
                onChange={e => {
                  const file = e.target.files?.[0];
                  if (!file) return;
                  const reader = new FileReader();
                  reader.onload = ev => onImportWeights(ev.target.result);
                  reader.readAsText(file);
                  e.target.value = '';
                }}
              />
            </div>
          </div>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">Trading mode</div><div className="card-meta">currently <ModeBadge mode={mode}/></div></div>
        <div style={{padding:'10px 0',display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:14}}>
          <div style={{padding:16,border:'1px solid '+(mode==='SIMULATED'?'var(--virtual)':'var(--line-2)'),borderRadius:6,cursor:'pointer'}} onClick={()=>{}}>
            <div className="mono tiny" style={{color:'var(--virtual)',letterSpacing:'0.14em'}}>◐ SIMULATED</div>
            <div className="serif" style={{fontSize:19,marginTop:8,marginBottom:6}}>History replay</div>
            <div className="tiny" style={{color:'var(--ink-2)',lineHeight:1.5,marginBottom:10}}>
              Replays daily price history one day per tick with local fills: your broker's when connected, otherwise a fictional 2-year market. No orders are sent.
            </div>
            <div className="mono tiny muted">Broker or fictional history · no capital exposure</div>
          </div>
          <div style={{padding:16,border:'1px solid '+(mode==='VIRTUAL'?'var(--info)':'var(--line-2)'),borderRadius:6,background: mode==='VIRTUAL' ? 'rgba(126,192,238,0.04)' : 'transparent',cursor:'pointer'}} onClick={()=>{}}>
            <div className="mono tiny" style={{color:'var(--info)',letterSpacing:'0.14em'}}>◑ VIRTUAL</div>
            <div className="serif" style={{fontSize:19,marginTop:8,marginBottom:6}}>Broker paper</div>
            <div className="tiny" style={{color:'var(--ink-2)',lineHeight:1.5,marginBottom:10}}>
              Connected to your broker's paper/demo account (Alpaca paper or IG demo). Orders are sent to it via the API when the market is open — real order flow, no real capital at risk.
            </div>
            <div className="mono tiny" style={{color: alpaca.connected && alpaca.env === 'paper' ? 'var(--info)' : 'var(--ink-4)'}}>{alpaca.connected && alpaca.env === 'paper' ? '● Paper account ready' : 'Requires paper account connection'}</div>
          </div>
          <div style={{padding:16,border:'1px solid '+(mode==='LIVE'?'var(--live)':'var(--line-2)'),borderRadius:6,background: mode==='LIVE' ? 'rgba(255,138,61,0.04)' : 'transparent',cursor:'pointer'}} onClick={()=>{}}>
            <div className="mono tiny" style={{color:'var(--live)',letterSpacing:'0.14em'}}>◉ LIVE</div>
            <div className="serif" style={{fontSize:19,marginTop:8,marginBottom:6}}>Real trading</div>
            <div className="tiny" style={{color:'var(--ink-2)',lineHeight:1.5,marginBottom:10}}>
              Orders route to your live broker account. Real capital. Real fills. Real losses. The chrome turns orange so you'll never confuse the two.
            </div>
            <div className="mono tiny" style={{color: alpaca.connected && alpaca.env === 'live' ? 'var(--live)' : 'var(--ink-4)'}}>{alpaca.connected && alpaca.env === 'live' ? '● Live account ready · use header toggle' : 'Requires live account connection'}</div>
          </div>
        </div>
      </div>

      {showConnect && (
        <div className="modal-backdrop" onClick={()=>!connecting && setShowConnect(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:520}}>
            <div className="modal-head">
              <div className="modal-title">Connect {fb.short}</div>
              <button className="btn ghost" onClick={()=>!connecting && setShowConnect(false)}>×</button>
            </div>
            <div className="modal-body">
              {alpaca.connected && !connecting ? (
                <div style={{textAlign:'center',padding:'20px 0'}}>
                  <div className="serif" style={{fontSize:24,marginBottom:6}}>Connected ✓</div>
                  <div className="tiny" style={{color:'var(--ink-2)',marginBottom:4}}>
                    {alpaca.env === 'live' ? 'LIVE' : 'PAPER'} account <span className="mono">{alpaca.account}</span>
                  </div>
                  <div className="mono tiny muted">{alpaca.endpoint}</div>
                  <button className="btn primary" style={{marginTop:22}} onClick={()=>setShowConnect(false)}>DONE</button>
                </div>
              ) : connecting ? (
                <div style={{textAlign:'center',padding:'28px 0'}}>
                  <div style={{margin:'0 auto 16px',width:44,height:44,border:'2px solid var(--line-2)',borderTopColor:'var(--virtual)',borderRadius:'50%',animation:'rotate 0.9s linear infinite'}}></div>
                  <div className="serif" style={{fontSize:18}}>Validating credentials…</div>
                  <div className="mono tiny muted" style={{marginTop:6}}>POST {BACKEND_URL}/api/connect → {form.broker === 'ig' ? 'IG /session' : 'Alpaca /v2/account'}</div>
                </div>
              ) : (
                <div>
                  <div className="field-label" style={{marginBottom:8}}>Broker</div>
                  <div className="tweak-opts" style={{marginBottom:18}}>
                    {Object.entries(BROKERS).map(([id, b]) => (
                      <div key={id} className={'tweak-opt '+(form.broker===id?'on':'')} onClick={()=>{ setConnectErr(''); setForm(f=>({...f,broker:id})); }}>
                        {b.short.toUpperCase()} <span className="tiny muted" style={{marginLeft:4}}>{id === 'ig' ? 'spread betting' : 'US equities'}</span>
                      </div>
                    ))}
                  </div>

                  <div className="tiny" style={{color:'var(--ink-2)',lineHeight:1.55,marginBottom:16}}>
                    {form.broker === 'ig'
                      ? <>Enter your IG API key and login. Shoal trades your <b>spread betting</b> account (daily funded bets, £ per point). </>
                      : <>Paste an API key pair from your Alpaca dashboard. </>}
                    Credentials go to your Shoal backend, which checks them with {fb.short} and holds them in memory only, never on disk. You can revoke access anytime from{' '}
                    <a href={fb.dashboard} target="_blank" rel="noreferrer" style={{color:'var(--ink)'}}>{fb.dashboardLabel}</a>.
                  </div>

                  <div className="field-label" style={{marginBottom:8}}>Environment</div>
                  <div className="tweak-opts" style={{marginBottom:18}}>
                    <div className={'tweak-opt '+(form.env==='paper'?'on':'')} onClick={()=>setForm(f=>({...f,env:'paper'}))}>
                      {fb.paperLabel} <span className="tiny muted" style={{marginLeft:4}}>{fb.hosts.paper}</span>
                    </div>
                    <div className={'tweak-opt '+(form.env==='live'?'on':'')} onClick={()=>setForm(f=>({...f,env:'live'}))} style={form.env==='live'?{color:'var(--live)',borderColor:'var(--live)'}:{}}>
                      LIVE <span className="tiny muted" style={{marginLeft:4}}>{fb.hosts.live}</span>
                    </div>
                  </div>

                  {form.broker === 'ig' ? (<>
                  <div className="field">
                    <div className="field-label">API key</div>
                    <input className="field-input mono" placeholder="IG API key" value={form.apiKey}
                      onChange={e=>setForm(f=>({...f,apiKey:e.target.value}))} spellCheck={false} autoComplete="off"/>
                  </div>
                  <div className="field">
                    <div className="field-label">Username</div>
                    <input className="field-input mono" placeholder="IG username" value={form.username}
                      onChange={e=>setForm(f=>({...f,username:e.target.value}))} spellCheck={false} autoComplete="username"/>
                  </div>
                  <div className="field">
                    <div className="field-label" style={{display:'flex',justifyContent:'space-between'}}>
                      <span>Password</span>
                      <span className="tiny muted" style={{cursor:'pointer',letterSpacing:'0.08em'}} onClick={()=>setForm(f=>({...f,showSecret:!f.showSecret}))}>
                        {form.showSecret ? '◉ HIDE' : '○ SHOW'}
                      </span>
                    </div>
                    <input className="field-input mono" type={form.showSecret ? 'text' : 'password'} placeholder="IG password" value={form.password}
                      onChange={e=>setForm(f=>({...f,password:e.target.value}))} spellCheck={false} autoComplete="current-password"/>
                  </div>
                  <div className="field">
                    <div className="field-label">Spread betting account ID <span className="tiny muted">(optional)</span></div>
                    <input className="field-input mono" placeholder="Picked automatically if blank" value={form.accountId}
                      onChange={e=>setForm(f=>({...f,accountId:e.target.value}))} spellCheck={false} autoComplete="off"/>
                  </div>
                  </>) : (<>
                  <div className="field">
                    <div className="field-label">API Key ID</div>
                    <input
                      className="field-input mono"
                      placeholder={form.env === 'paper' ? 'PKXXXXXXXXXXXXXXXXXX' : 'AKXXXXXXXXXXXXXXXXXX'}
                      value={form.keyId}
                      onChange={e=>setForm(f=>({...f,keyId:e.target.value}))}
                      spellCheck={false}
                      autoComplete="off"
                    />
                  </div>

                  <div className="field">
                    <div className="field-label" style={{display:'flex',justifyContent:'space-between'}}>
                      <span>API Secret Key</span>
                      <span className="tiny muted" style={{cursor:'pointer',letterSpacing:'0.08em'}} onClick={()=>setForm(f=>({...f,showSecret:!f.showSecret}))}>
                        {form.showSecret ? '◉ HIDE' : '○ SHOW'}
                      </span>
                    </div>
                    <input
                      className="field-input mono"
                      type={form.showSecret ? 'text' : 'password'}
                      placeholder="40-character secret"
                      value={form.secret}
                      onChange={e=>setForm(f=>({...f,secret:e.target.value}))}
                      spellCheck={false}
                      autoComplete="off"
                    />
                  </div>
                  </>)}

                  {form.env === 'live' && (
                    <div className="tiny" style={{color:'var(--live)',padding:'10px 12px',background:'rgba(230,110,60,0.08)',border:'1px solid rgba(230,110,60,0.35)',borderRadius:3,marginTop:4,lineHeight:1.5}}>
                      <b style={{letterSpacing:'0.06em'}}>LIVE ACCOUNT:</b> Orders placed from this session will execute with real capital. {form.broker === 'ig' ? 'Double-check you are logging in to the right IG account.' : "Double-check you're pasting the correct key pair."}
                    </div>
                  )}

                  {accessNeeded && (
                    <div style={{marginTop:12}}>
                      <div className="field-label" style={{marginBottom:6}}>Access code <span className="muted">(this Shoal server)</span></div>
                      <input className="field-input mono" type="password" value={accessCode} onChange={e => setAccessCode(e.target.value)} placeholder="set by the server's owner" autoComplete="off" style={{width:'100%'}}/>
                      <div className="mono tiny muted" style={{marginTop:4}}>Stops strangers who find this web address from using its server. Remembered in this browser.</div>
                    </div>
                  )}

                  {connectErr && (
                    <div className="tiny" style={{color:'var(--down)',marginTop:12,padding:'8px 12px',background:'rgba(220,80,80,0.08)',border:'1px solid rgba(220,80,80,0.3)',borderRadius:3}}>
                      {connectErr}
                    </div>
                  )}
                </div>
              )}
            </div>
            {!alpaca.connected && !connecting && (
              <div className="modal-foot">
                <button className="btn ghost" onClick={()=>setShowConnect(false)}>CANCEL</button>
                <button className="btn primary" onClick={submitConnect} disabled={!formReady}>
                  CONNECT {form.env === 'paper' ? fb.paperLabel : 'LIVE'} →
                </button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
};

window.ScreenSettings = ScreenSettings;

</script>
<script type="text/babel" data-presets="react">
// First-run onboarding

const ScreenOnboarding = ({ onDone }) => {
  const [step, setStep] = React.useState(0);
  const steps = [
    {
      eyebrow: 'Welcome to Shoal',
      title: <>A trading bot that <em>learns from itself.</em></>,
      body: 'Shoal runs 16 specialist agents that read daily prices and volume: trend, Bollinger bands, volume, gaps, volatility, market breadth and more. Its default strategy, Rank & tilt, holds the stocks with the strongest trends and re-ranks once a month. Built-in labs test every idea on days it was not fitted to, so you can see what actually works.',
      art: 'swarm',
    },
    {
      eyebrow: 'Step 1 of 3 · Safety',
      title: <>You'll always start in <em>virtual mode.</em></>,
      body: 'Start in SIMULATED: the bot replays real or fictional price history in your browser, with no orders sent. Then connect an Alpaca paper account and switch to VIRTUAL to trade with play money at the real market. Judge it against simply holding the same stocks.',
      art: 'virtual',
    },
    {
      eyebrow: 'Step 2 of 3 · Connect',
      title: <>When ready, plug in <em>Alpaca.</em></>,
      body: "Brokers: Alpaca (paper and live) or IG (demo and live spread bets). Your keys are used only to talk to the broker and can be revoked at any time. The interface turns orange whenever real money is at stake, so you always know which mode you're in.",
      art: 'broker',
    },
    {
      eyebrow: 'Step 3 of 3 · Watch & adapt',
      title: <>The swarm <em>tells you what it's thinking.</em></>,
      body: 'Every trade comes with its reason, and the dashboard shows what the bot is waiting for and how it compares with buy & hold. You stay in control: pause it, change the risk level, or stop it. The Guide at the top of the menu explains every screen and setting.',
      art: 'reasoning',
    },
  ];

  const s = steps[step];

  const renderArt = (kind) => {
    if (kind === 'swarm') {
      return <SwarmViz agents={AGENTS} decision="BUY" confidence={0.71} tick={0}/>;
    }
    if (kind === 'virtual') {
      return (
        <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',padding:30,flexDirection:'column'}}>
          <div className="pill virtual" style={{fontSize:11,padding:'6px 14px',marginBottom:18}}>◐ VIRTUAL MODE</div>
          <div style={{width:'100%',height:160}}>
            <LineChart series={[EQUITY.bot.slice(0,90)]} colors={['var(--virtual)']} yFmt={v=>'$'+Math.round(v/1000)+'k'} height={160}/>
          </div>
          <div className="mono tiny muted" style={{marginTop:12,letterSpacing:'0.12em'}}>+12.4% · 90 PAPER SESSIONS</div>
        </div>
      );
    }
    if (kind === 'broker') {
      return (
        <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',gap:30}}>
          <div style={{width:90,height:90,borderRadius:'50%',background:'radial-gradient(circle at 30% 30%, var(--virtual), var(--virtual-dim))',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--serif)',fontSize:32,color:'#0a1f0a',fontStyle:'italic'}}>S</div>
          <div style={{display:'flex',flexDirection:'column',gap:6,alignItems:'center'}}>
            <div className="mono tiny muted">←—— OAUTH ——→</div>
            <div style={{height:1,width:80,background:'var(--virtual)'}}></div>
            <div className="mono tiny up">SECURE TOKEN</div>
          </div>
          <div style={{width:90,height:90,borderRadius:6,background:'var(--bg-2)',border:'1px solid var(--line-2)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--mono)',fontSize:30,color:'var(--ink-2)'}}>α</div>
        </div>
      );
    }
    if (kind === 'reasoning') {
      return (
        <div style={{padding:30,height:'100%',display:'flex',alignItems:'center'}}>
          <div className="reasoning" style={{width:'100%'}}>
            <div className="reason-node fired"><div className="reason-row"><span className="reason-label">Regime: risk-on</span><span className="reason-value up">PASS</span></div></div>
            <div className="reason-node fired"><div className="reason-row"><span className="reason-label">Momentum +2.1σ</span><span className="reason-value up">FIRE</span></div></div>
            <div className="reason-node fired"><div className="reason-row"><span className="reason-label">Order flow imbal.</span><span className="reason-value up">FIRE</span></div></div>
            <div className="reason-node fired"><div className="reason-row"><span className="reason-label">Risk gate</span><span className="reason-value up">PASS</span></div></div>
            <div className="reason-node fired" style={{borderLeftColor:'transparent'}}><div className="reason-row"><span className="reason-label" style={{fontWeight:500}}>EXECUTE</span><span className="reason-value up">BUY 32 NVDA</span></div></div>
          </div>
        </div>
      );
    }
  };

  return (
    <div className="onb">
      <div className="onb-top">
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          <span className="brand-mark" style={{display:'inline-block'}}></span>
          <span className="serif" style={{fontSize:16,color:'var(--ink)',letterSpacing:'-0.01em'}}>Shoal</span>
        </div>
        <button className="btn ghost" onClick={onDone}>SKIP →</button>
      </div>
      <div className="onb-step">
        <div>
          <div className="onb-eyebrow">{s.eyebrow}</div>
          <h1 className="onb-title">{s.title}</h1>
          <p className="onb-body">{s.body}</p>
          <div style={{display:'flex',gap:10}}>
            {step > 0 && <button className="btn" onClick={()=>setStep(step-1)}>← BACK</button>}
            {step < steps.length - 1
              ? <button className="btn primary" onClick={()=>setStep(step+1)}>CONTINUE →</button>
              : <button className="btn primary" onClick={onDone}>ENTER DASHBOARD →</button>}
          </div>
        </div>
        <div className="onb-art">{renderArt(s.art)}</div>
      </div>
      <div className="onb-foot">
        <div className="mono tiny muted">SHOAL v0.4.2 · ALL DATA SHOWN IS SIMULATED</div>

};

</script>
