  const liveSignalsRef = React.useRef(null);
  const livePricesRef  = React.useRef({});
  React.useEffect(() => { liveSignalsRef.current = liveSignals; }, [liveSignals]);
  React.useEffect(() => { livePricesRef.current  = livePrices;  }, [livePrices]);

  // Fetch 252 daily bars for all tickers when connected; recompute signals from real prices.
  React.useEffect(() => {
    if (!alpaca.connected || !alpaca.token) {
      setLiveUniverse(null);
      setLivePrices({});
      return;
    }
    const wanted = brokerSymbols(alpaca), wantedSet = new Set(wanted);
    // Bars are kept in this browser (IndexedDB) per broker account type, so a cold server only needs the
    // newest days — IG allows ~10,000 historical points a week and a full load of 25 stocks costs ~5,500.
    const cacheKey = `bars_${alpaca.brokerId || 'alpaca'}_${alpaca.env || 'paper'}${alpaca.brokerId === 'ig' ? '' : `_${riskRef.current?.historyDays || 1100}`}`;
    let cached = null; // { SYM: [bars] }
    const dayOf = (b) => String(b.t || '').slice(0, 10);
    const useBars = (bySym) => {
      const barsBySym = {}, prices = {};
      for (const sym of Object.keys(bySym)) {
        if (!wantedSet.has(sym)) continue; // removed from the watchlist
        const b = bySym[sym].filter(x => x.c > 0);
        if (b.length >= 60) { barsBySym[sym] = b; prices[sym] = b[b.length - 1].c; }
      }
      const sig = Object.entries(barsBySym).map(([s, b]) => `${s}:${b.length}:${b[b.length - 1].t || ''}:${b[b.length - 1].c}`).join('|');
      if (Object.keys(barsBySym).length > 0 && sig !== liveUniverseRef.sig) {
        liveUniverseRef.sig = sig;
        setLiveUniverse(SS.buildUniverse(barsBySym, SECTOR_OF));
        setLivePrices(p => ({ ...p, ...prices }));
      }
      return Object.keys(barsBySym).length;
    };
    const fetchBars = async () => {
      try {
        if (cached == null) {
          const c = await idbStore.get(cacheKey).catch(() => null);
          cached = c && c.bars ? c.bars : {};
          if (Object.keys(cached).length) useBars(cached);
        }
        // Symbols this browser already holds get a top-up from the earliest of their last days (re-fetching
        // that day refreshes a partial bar); symbols new to the watchlist get their full history.
        const have = wanted.filter(sym => (cached[sym] || []).length >= 60), missing = wanted.filter(sym => !have.includes(sym));
        const lasts = have.map(sym => dayOf(cached[sym][cached[sym].length - 1] || {})).filter(Boolean).sort();
        const groups = [];
        if (have.length) groups.push({ syms: have, since: lasts[0] || null });
        if (missing.length) groups.push({ syms: missing, since: null });
        const data = { bars: {}, warning: null };
        for (const grp of groups) {
          const r = await fetch(
            `${BACKEND_URL}/api/bars?symbols=${encodeURIComponent(grp.syms.join(','))}&days=${riskRef.current?.historyDays || 1100}${grp.since ? `&since=${grp.since}` : ''}`,
            // IG's first load resolves ticker→epic and fetches history under tight rate limits (~2 min); later loads hit the backend's cache
            { headers: { 'Authorization': 'Bearer ' + alpaca.token }, signal: AbortSignal.timeout(alpaca.brokerId === 'ig' ? 180000 : 120000) }
          );
          if (r.status === 401) { expireSession(); return; }
          if (!r.ok) { liveBarsNoteRef.current = `The broker's price history request failed (HTTP ${r.status}). Retrying every 10 minutes.`; return; }
          const d = await r.json();
          Object.assign(data.bars, d.bars || {});
          if (d.warning) data.warning = d.warning;
        }
        // Merge new bars over the cached ones by day. Keep full OHLCV bars: the agents use opens (gaps),
        // highs/lows (ATR, squeezes) and volume.
        const merged = { ...cached };
        for (const sym of Object.keys(data.bars)) {
          const byDay = new Map((cached[sym] || []).map(b => [dayOf(b), b]));
          for (const b of data.bars[sym]) byDay.set(dayOf(b), b);
          merged[sym] = [...byDay.values()].sort((a, b) => dayOf(a).localeCompare(dayOf(b))).slice(-3000);
        }
        cached = merged;
        idbStore.set(cacheKey, { bars: merged, savedAt: Date.now() }).catch(() => {});
        const n = useBars(merged);
        liveBarsNoteRef.current = n ? null : data.warning === 'allowance'
          ? "IG's weekly allowance for price history is used up, and this browser has no saved copy yet. IG restores it within a week; trading starts as soon as the history loads (retrying every 10 minutes). After that, this browser keeps the history and only fetches the newest days."
          : 'The broker returned no usable price history yet. Retrying every 10 minutes.';
      } catch (err) {
        liveBarsNoteRef.current = `Could not load price history from the broker (${err.name === 'TimeoutError' ? 'timed out' : err.message}). Retrying every 10 minutes.`;
      }
    };
    fetchBars();
    const id = setInterval(fetchBars, 10 * 60 * 1000); // refresh every 10 min
    return () => clearInterval(id);
  }, [alpaca.connected, alpaca.token, risk.historyDays]);

  // Backend health-check — polls every 15 s
  React.useEffect(() => {
    const check = async () => {
      try {
        const r = await fetch(`${BACKEND_URL}/api/health`, { signal: AbortSignal.timeout(2000) });
        setBackendOk(r.ok);
      } catch {
        setBackendOk(false);
      }
    };
    check();
    const hcIvl = setInterval(check, 15000);
    return () => clearInterval(hcIvl);
  }, []);

  // SSE bridge — when Alpaca is connected via the backend, replace simulated data with real fills.
  // EventSource can't send headers, so the token is swapped for a one-minute ticket first; the token
  // itself never goes in a URL. A 401 means the session expired (8 hours) or was revoked.
  const streamRef = React.useRef(null);
  React.useEffect(() => {
    if (!alpaca.connected || !alpaca.token) {
      if (streamRef.current) { streamRef.current.close(); streamRef.current = null; }
      return;
    }
    let es = null, stopped = false;
    const start = async () => {
    let ticket = null;
    try {
      const r = await fetch(`${BACKEND_URL}/api/stream-ticket`, { method: 'POST', headers: { Authorization: 'Bearer ' + alpaca.token } });
      if (r.status === 401) { if (!stopped) expireSession(); return; }
      ticket = (await r.json()).ticket;
    } catch (_) { if (!stopped) setTimeout(() => setStreamRetry(n => n + 1), 5000); return; }
    if (stopped || !ticket) return;
    es = new EventSource(`${BACKEND_URL}/api/stream?ticket=${encodeURIComponent(ticket)}`);
    streamRef.current = es;
    es.onmessage = (e) => {
      try {
        const { account, positions, orders, clock, prices, error } = JSON.parse(e.data);
        if (error) return;

        // IG streams prices (Lightstreamer) through the backend; merge them over the daily-bar closes
        if (prices && Object.keys(prices).length) setLivePrices(p => ({ ...p, ...prices }));

        if (clock) {
          setMarketStatus(s => ({
            ...s,
            isOpen: clock.is_open,
            nextOpen: clock.next_open ? new Date(clock.next_open) : s.nextOpen,
            source: alpacaRef.current?.brokerId || 'alpaca',
          }));
        }

        // Account, positions and orders belong to VIRTUAL / LIVE. In SIMULATED the connection only supplies
        // history for the replay, whose equity and positions are local.
        if (modeRef.current === 'SIMULATED') return;

        // Real account equity → replace simulated balance
        if (account?.equity) {
          const eq = parseFloat(account.equity);
          if (eq > 0) setBalance(eq);
        }
        if (account?.buying_power) {
          setAlpaca(a => ({ ...a, balance: parseFloat(account.buying_power) }));
        }

        // Real orders → replace trade list only in LIVE mode (paper env keeps local swarm fills)
        const isLiveEnv = alpacaRef.current?.env === 'live';
        if (isLiveEnv && Array.isArray(orders) && orders.length > 0) {
          const mapped = orders.map(o => ({
            id:     o.id,
            ts:     new Date(o.submitted_at || o.created_at).getTime(),
            exitTs: o.filled_at ? new Date(o.filled_at).getTime() : null,
            sym:    o.symbol,
            side:   o.side === 'buy' ? 'BUY' : 'SELL',
            // Parse first then OR — filled_qty is "0" (truthy string) for unfilled orders
            qty:    parseFloat(o.filled_qty) || parseFloat(o.qty) || 0,
            // filled_avg_price is null for market orders that haven't filled yet
            price:  parseFloat(o.filled_avg_price) || parseFloat(o.limit_price) || 0,
            exit:   o.filled_at && o.filled_avg_price ? parseFloat(o.filled_avg_price) : null,
            conf:   0.75,
            reason: `${o.type || 'market'} · ${o.time_in_force} · ${o.status} via ${brokerShort(alpacaRef.current)}`,
            pnl: null, pnlPct: null,
            status: ['filled','partially_filled'].includes(o.status) ? 'OPEN'
                  : ['canceled','expired','replaced','rejected'].includes(o.status) ? 'LOSS' : 'OPEN',
            mode: 'LIVE',
            consensus: 12, isNew: false, _real: true,
          }));
          setTrades(mapped.slice(0, 5000));
        }

        // Real positions → merge with local fills in VIRTUAL mode; replace in LIVE mode
        if (Array.isArray(positions)) {
          const realPos = positions.map(p => ({
            id:     'POS-' + p.symbol,
            ts:     Date.now() - 7200000,
            exitTs: null,
            sym:    p.symbol,
            side:   parseFloat(p.qty) >= 0 ? 'BUY' : 'SELL',
            qty:    Math.abs(parseFloat(p.qty)),
            price:  parseFloat(p.avg_entry_price),
            exit:   null,
            conf:   0.75,
            reason: `Live position · ${p.side} · unrealized ${parseFloat(p.unrealized_plpc || 0) >= 0 ? '+' : ''}${(parseFloat(p.unrealized_plpc || 0) * 100).toFixed(2)}%`,
            pnl: null, pnlPct: null,
            status: 'OPEN',
            mode: isLiveEnv ? 'LIVE' : 'VIRTUAL',
            consensus: 12, isNew: false, _real: true,
            _upnl:    parseFloat(p.unrealized_pl  || 0),
            _upnlPct: parseFloat(p.unrealized_plpc || 0),
          }));
          setTrades(prev => {
            if (isLiveEnv) {
              const closedHistory = prev.filter(t => t._real && t.status !== 'OPEN');
              return [...realPos, ...closedHistory].slice(0, 5000);
            }
            // VIRTUAL: keep Shoal's own fills (they carry the reason and agent votes) and add only the broker
            // positions Shoal didn't open; a fill whose stock the broker no longer holds was sold.
            const brokerBy = new Map(realPos.map(p => [p.sym, p]));
            const localFills = prev.filter(t => !t._real).map(t => {
              if (t.status !== 'OPEN' || t.replay || !t._brokerSent) return t;
              const bp = brokerBy.get(t.sym);
              if (bp) return { ...t, _upnl: bp._upnl, _upnlPct: bp._upnlPct };
              if (Date.now() - (t.ts || 0) < 120_000) return t; // order may not have filled yet
              const exit = livePricesRef.current[t.sym] || t.price;
              const pnlAmt = (exit - t.price) * t.qty * (t.side === 'BUY' ? 1 : -1);
              return { ...t, status: pnlAmt > 0 ? 'WIN' : 'LOSS', pnl: pnlAmt, pnlPct: pnlAmt / (t.qty * t.price), exit, exitTs: Date.now(), isNew: false, closeReason: t.closeReason || 'CLOSED AT BROKER' };
            });
            const ownSyms = new Set(localFills.filter(t => t.status === 'OPEN' && !t.replay && t._brokerSent).map(t => t.sym));
            const closedReal = prev.filter(t => t._real && t.status !== 'OPEN');
            return [...realPos.filter(p => !ownSyms.has(p.sym)), ...localFills, ...closedReal].slice(0, 5000);
          });
          if (account?.portfolio_value) setBalance(parseFloat(account.portfolio_value));
        }
      } catch (_) {}
    };
    let _errFired = false;
    es.onerror = () => {
      if (_errFired) return;
      _errFired = true;
      es.close();
      streamRef.current = null;
      setTimeout(() => setStreamRetry(n => n + 1), 5000);
    };
    };
    start();
    return () => { stopped = true; if (es) es.close(); streamRef.current = null; };
  }, [alpaca.connected, alpaca.token, streamRetry]);

  // Server trading: is the server's daily job trading this same account? Then this browser only watches.
  const [serverTrading, setServerTrading] = React.useState(null);
  const serverTradingRef = React.useRef(null);
  React.useEffect(() => { serverTradingRef.current = serverTrading; }, [serverTrading]);
  React.useEffect(() => {
    if (!alpaca.connected || !alpaca.token || alpaca.brokerId === 'ig') { setServerTrading(null); return; }
    let live = true;
    const load = () => fetch(`${BACKEND_URL}/api/server-trading`, { headers: { Authorization: 'Bearer ' + alpaca.token } })
      .then(r => (r.status === 401 ? (expireSession(), null) : r.ok ? r.json() : null)).then(d => { if (live) setServerTrading(d); }).catch(() => {});
    load();
    const id = setInterval(load, 15 * 60 * 1000);
    return () => { live = false; clearInterval(id); };
  }, [alpaca.connected, alpaca.token]);

  React.useEffect(() => { localStorage.setItem('shoal_agent_history_v3', JSON.stringify(agentHistory)); }, [agentHistory]);
  React.useEffect(() => { localStorage.setItem('shoal_weight_history_v3', JSON.stringify(weightHistory)); }, [weightHistory]);
  React.useEffect(() => { localStorage.setItem('shoal_sym', activeSymbol); }, [activeSymbol]);
  React.useEffect(() => { localStorage.setItem('shoal_dir', direction); }, [direction]);
  React.useEffect(() => { localStorage.setItem('shoal_balance', balance); }, [balance]);
  React.useEffect(() => { localStorage.setItem('shoal_starting_balance', startingBalance); }, [startingBalance]);
  React.useEffect(() => { localStorage.setItem('shoal_pnl', pnl); }, [pnl]);
  React.useEffect(() => { localStorage.setItem('shoal_trades_reset_at', tradesResetAt); }, [tradesResetAt]);

  React.useEffect(() => {
    const h = (e) => {
      if (e.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) {
        e.preventDefault(); setSymbolPicker(true);
      }
      if (e.key === 'Escape') { setSymbolPicker(false); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  const resetAccount = (startingBal) => {
    setBalance(startingBal);
    setStartingBalance(startingBal);
    setPnl(0);
    const now = Date.now();
    setTradesResetAt(now);
    setTrades([]);
    setShowReset(false);
  };

  const resetWeights = () => {
    setAgentWeights(optimiserRef.current?.frozen ? SS.configWeights(optimiserRef.current.frozen.cfg) : defaultWeightsFor(risk.style));
    setAgentHistory({});
    setAgentAccuracySeries({});
    setWeightHistory({});
    localStorage.removeItem('shoal_agent_history_v3');
    localStorage.removeItem('shoal_weight_history_v3');
    setAgentRegimeHistory({});
    localStorage.removeItem('shoal_agent_regime_history_v1');
    setShowWeightReset(false);
  };

  const exportWeights = () => {
    const csv = serializeWeightsCSV(AGENTS, agentWeights, agentHistory);
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `shoal_weights_${new Date().toISOString().slice(0, 10)}.csv`;
    link.click();
    URL.revokeObjectURL(url);
  };

  const importWeights = (csvText) => {
    const addToast = (type, text) => {
      const t = { id: Date.now(), type, sym: 'CSV', text };
      setToasts(prev => [...prev.slice(-4), t]);
      setTimeout(() => setToasts(prev => prev.filter(x => x.id !== t.id)), 4500);
    };
    try {
      const { weights, history } = parseWeightsCSV(csvText, AGENTS);
      const imported = Object.keys(weights).length;
      if (imported === 0) throw new Error('No valid agent rows found in file');
      // Merge imported over current, then re-normalise across all agents
      const merged = { ...agentWeights, ...weights };
      const sum = Object.values(merged).reduce((s, v) => s + v, 0);
      if (sum > 0) AGENTS.forEach(a => { merged[a.id] = (merged[a.id] || 0) / sum; });
      setAgentWeights(merged);
      setAgentHistory(h => ({ ...h, ...history }));
      setAgentAccuracySeries({});
      addToast('close-win', `Imported weights for ${imported} agent${imported !== 1 ? 's' : ''}`);
    } catch (err) {
      addToast('close-loss', 'Import failed: ' + err.message);
    }
  };

  // ── Autopilot: the combination model ───────────────────────────────────────────────────────────────
  // Rank & tilt ranks by the model's score; the other styles take their agent weights from it. Every 63
  // bars the model re-measures each agent's evidence on the history so far, keeps agents with positive
  // evidence, and a candidate fitted on data known 60 days ago must rank stocks better than the current
  // model over those 60 days before it is adopted (refitted on all data known now). In LIVE mode at most
  // one weight change per day, each agent's weight moving at most 5 points.
  const scorerCacheRef = React.useRef({ U: null, key: null, ms: null, fitsSeen: 0 });
  const scorerFor = (U, book, useModel, params) => {
    const key = `${useModel ? 'model' : 'trend'}|${JSON.stringify(params || {})}`;
    const c = scorerCacheRef.current;
    if (c.U !== U || c.key !== key) scorerCacheRef.current = { U, key, ms: useModel ? SS.createModelScorer(U, book.signalsAt) : null, fitsSeen: 0 };
    const ms = scorerCacheRef.current.ms;
    const earnP = SS.mergeParams(params).earn;
    return ms ? ms.scoreAt : (sym, i) => SS.trendScore(U.F[sym], i, earnP);
  };
  const pctTxt = (x) => `${(x * 100).toFixed(0)}%`;
  // Weight snapshots from a replay belong to that pass; a new pass (or data source) starts the chart over
  const dropReplaySnapshots = () => setWeightHistory(prev => {
    const src = prev._src || [];
    if (!src.includes('replay')) return prev;
    const keep = src.map((x, k) => x !== 'replay' ? k : -1).filter(k => k >= 0);
    const n = {};
    for (const key of Object.keys(prev)) n[key] = keep.map(k => prev[key]?.[k]);
    if (!n._when) n._when = [];
    return n;
  });
  const runAutopilot = ({ U, asOf, book, replay, style, riskNow, isLive }) => {
    if (riskNow.autopilotFrozen) return;
    const scorer = scorerFor(U, book, true, agentParamsRef.current);
    const s0 = U.syms.find(sym => asOf - U.off[sym] >= 130);
    if (s0) scorer(s0, asOf - U.off[s0]); // runs any refit that is due
    const c = scorerCacheRef.current, fits = c.ms.state.fits;
    const when = replay ? barDate(U, asOf) : new Date().toISOString().slice(0, 10);
    while (c.fitsSeen < fits.length) {
      const f = fits[c.fitsSeen++];
      const names = (f.kept || []).map(id => AGENTS.find(a => a.id === id)?.name || id);
      setAutopilotLog(prev => [{ ts: Date.now(), kind: 'weights', when,
        text: f.icNew == null
          ? `Model refit: ranks by the trend score${names.length ? ` plus ${names.join(', ')}` : ' only (no other agent has positive evidence yet)'}.`
          : f.adopted
            ? `Model updated: a version fitted 60 days ago ranked stocks better than the current one on the 60 days since (rank IC ${f.icNew.toFixed(3)} vs ${f.icCur.toFixed(3)}). Inputs: trend score${names.length ? ` + ${names.join(', ')}` : ''}.`
            : `Model kept: the candidate ranked stocks worse on the last 60 days it hadn't seen (rank IC ${f.icNew.toFixed(3)} vs ${f.icCur.toFixed(3)}).` }, ...prev].slice(0, 100));
    }
    const target = weightsFromModel(c.ms.state.model);
    if (!target) return;
    const st = autopilotStateRef.current, today = new Date().toISOString().slice(0, 10);
    if (isLive && st.lastPromoDay === today) return;
    const cur = agentWeightsRef.current;
    let next = { ...target };
    if (isLive) {
      AGENTS.forEach(a => { const v = cur[a.id] ?? 0; next[a.id] = Math.max(0, v + Math.max(-0.05, Math.min(0.05, (next[a.id] ?? 0) - v))); });
      const tot = Object.values(next).reduce((x, y) => x + y, 0);
      if (tot > 0) AGENTS.forEach(a => { next[a.id] /= tot; });
    }
    const moved = AGENTS.reduce((sum, a) => sum + Math.abs((next[a.id] ?? 0) - (cur[a.id] ?? 0)), 0);
    if (moved < 0.02) return;
    if (isLive) st.lastPromoDay = today;
    setAgentWeights(next);
    const lastFit = fits[fits.length - 1];
    setWeightHistory(prev => {
      const n = { ...prev };
      AGENTS.forEach(a => { n[a.id] = [...(n[a.id] || []), next[a.id] ?? 0].slice(-90); });
      n._when = [...(prev._when || []), when].slice(-90);
      n._src = [...(prev._src || []), replay ? 'replay' : (isLive ? 'live' : 'virtual')].slice(-90);
      n._ic = [...(prev._ic || []), lastFit && lastFit.icNew != null ? lastFit.icNew : null].slice(-90);
      return n;
    });
  };
  const evidenceCacheRef = React.useRef({ U: null, bucket: null, ev: null });
  const evidenceAt = (U, asOf, book) => {
    const bucket = Math.floor(asOf / 21), c = evidenceCacheRef.current;
    if (c.U !== U || c.bucket !== bucket) evidenceCacheRef.current = { U, bucket, ev: SS.agentEvidence(U, { signalsAt: book.signalsAt, from: 130, to: asOf }) };
    return evidenceCacheRef.current.ev;
  };
  const tiltStateRef = React.useRef((() => { try { return JSON.parse(localStorage.getItem('shoal_tilt_state_v1') || '{}'); } catch (_) { return {}; } })());

  // Global swarm execution — signal-driven trades with real TA, regardless of which screen is mounted.
  React.useEffect(() => {
    if (!running) return;
    const ivl = setInterval(() => {
      const alpacaNow = alpacaRef.current;
      const riskNow = riskRef.current || {};
      const style = riskNow.style || 'invested';
      // SIMULATED replays daily history one bar per tick: the broker's when connected (or chosen), the
      // fictional market otherwise. VIRTUAL and LIVE only ever trade on real broker bars.
      const replay = mode === 'SIMULATED';
      const U = replay ? replayUniverseFor(riskNow.replaySource, liveUniverseRef.current, importedUniverseRef.current) : liveUniverseRef.current;
      if (!U) {
        if (replay) setReplayInfo(r => (r && r.waiting ? r : { waiting: true }));
        else sayStatus({ warn: true, text: liveBarsNoteRef.current || "Waiting for price history from your broker. Trading starts once it has loaded." });
        return;
      }
      if (replay) sayStatus(null);
      const srcKey = replayKey(U);
      const cost = costBpsFor(riskNow, replay ? U : null, alpacaNow?.brokerId) / 1e4; // per trade side
      let rollover = false;
      if (replay) {
        const start = replayStartFor(U);
        let g = replayIdxRef.current;
        if (replayIdxRef.key !== srcKey) { replayIdxRef.key = srcKey; g = null; dropReplaySnapshots(); } // data source changed: start over
        if (g == null || g < start - 1 || g > U.L - 1) { g = start - 1; replayAnchorRef.current = null; }
        g += 1;
        if (g > U.L - 1) { g = start; rollover = true; dropReplaySnapshots(); }
        replayIdxRef.current = g;
        window.SHOAL_REPLAY = { U, g, key: srcKey };
        if (!replayAnchorRef.current || rollover) replayAnchorRef.current = { g, equity: balanceRef.current };
        setReplayInfo({ g, start, end: U.L - 1, date: barDate(U, g), anchor: replayAnchorRef.current, fictional: !!U.fictional, key: srcKey });
      }
      const asOf = replay ? replayIdxRef.current : U.L - 1;
      const book = bookFor(U, agentParamsRef.current);
      const localIdx = (sym) => (U.F[sym] ? asOf - U.off[sym] : null);
      const sigsFor = (sym) => { const i = localIdx(sym); return i != null && i >= 60 ? book.signalsAt(sym, i) : null; };
      const priceFor = (sym) => {
        const F = U.F[sym], i = localIdx(sym);
        if (!F || i == null || i < 0) return null;
        return replay ? F.c[i] : (livePricesRef.current[sym] || F.c[F.n - 1]);
      };
      if (replay) {
        const rs = {};
        for (const sym of U.syms) { const x = sigsFor(sym); if (x) rs[sym] = x; }
        setReplaySignals(rs);
      }
      const isLiveReal   = mode === 'LIVE'    && !!alpacaNow?.token && alpacaNow?.env === 'live';
      const isBrokerPaper= mode === 'VIRTUAL' && !!alpacaNow?.token && alpacaNow?.env === 'paper';
      if (riskNow.autopilot) runAutopilot({ U, asOf, book, replay, style, riskNow, isLive: isLiveReal });

      // Order helper: sends to the broker; VIRTUAL keeps a local copy once confirmed, LIVE reads positions back
      const placeOrder = (newTrade) => {
        pendingOrdersRef.current.set(newTrade.sym, Date.now());
        const orderBody = { symbol: newTrade.sym, notional: String(newTrade._notional), side: newTrade.side === 'BUY' ? 'buy' : 'sell', type: 'market', time_in_force: 'day' };
        console.log(`[Shoal] → ${brokerShort(alpacaNow)} order`, orderBody);
        fetch(`${BACKEND_URL}/api/orders`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + alpacaNow.token },
          body: JSON.stringify(orderBody),
        }).then(async r => {
          const body = await r.json();
          if (!r.ok) {
            const errMsg = body.message || body.error || `HTTP ${r.status}`;
            console.warn(`[Shoal] ${brokerShort(alpacaNow)} order rejected`, newTrade.sym, errMsg, body);
            const errToast = { id: Date.now(), type: 'close-loss', sym: newTrade.sym, text: 'rejected: ' + errMsg };
            setToasts(prev => [...prev.slice(-4), errToast]);
            setTimeout(() => setToasts(prev => prev.filter(t => t.id !== errToast.id)), 5000);
            return;
          }
          console.log('[Shoal] ✓ Order confirmed', body.id, body.status, body.symbol);
          const filledPrice = parseFloat(body.filled_avg_price || 0);
          if (filledPrice > 0) {
            const slip = (filledPrice - newTrade.price) / newTrade.price;
            setSlippageLog(prev => [...prev.slice(-49), { sym: newTrade.sym, side: newTrade.side, expected: newTrade.price, actual: filledPrice, slip, ts: Date.now() }]);
          }
          if (!isLiveReal) setTrades(prev => [{ ...newTrade, _brokerSent: true }, ...prev].slice(0, 5000));
        }).catch(err => {
          console.warn('[Shoal] Order fetch error:', err.message);
          const errToast = { id: Date.now(), type: 'close-loss', sym: newTrade.sym, text: 'network: ' + err.message };
          setToasts(prev => [...prev.slice(-4), errToast]);
          setTimeout(() => setToasts(prev => prev.filter(t => t.id !== errToast.id)), 5000);
        });
      };

      // [4] Exits for positions Shoal manages locally (not real broker positions). Stay-invested holdings
      // only leave on a weakness signal (below). Trade-both-ways positions use their ATR stop and target
      // (or the fixed % settings with ATR stops off): replayed trades against the bar's high and low
      // (stop first if both are touched), broker trades against the live price.
      const stopLossPct   = (riskNow.stopLoss   ?? 2.5) / 100;
      const takeProfitPct = (riskNow.takeProfit  ?? 5.0) / 100;
      const maxHoldMs     = (riskNow.maxHoldHours ?? 48) * 3600_000;
      const maxHoldBars   = Math.max(1, Math.round((riskNow.maxHoldHours ?? 48) / 6.5)); // 6.5 market hours per session
      const lpNow = livePricesRef.current || {};

      const closedSyms = new Set();
      const exitFn = (t) => {
          if (t.status !== 'OPEN' || t._real) return t;
          if (t.entryIdx != null && !t.replay) return t; // legacy simulated-market trade
          const side = t.side === 'BUY' ? 1 : -1;
          const sl = t.stopPct ?? stopLossPct, tp = t.tpPct ?? takeProfitPct;
          const stopPx = t.price * (1 - side * sl), tgtPx = t.price * (1 + side * tp);
          let exit = null, reason = null;
          if (t.replay) {
            if (!replay) return t; // replayed position: frozen while another mode is active
            if (t.replaySrc && t.replaySrc !== srcKey) {
              // opened on the other data source: close flat rather than mark it against a different market
              return { ...t, status: 'LOSS', pnl: 0, pnlPct: 0, exit: t.price, exitTs: Date.now(), isNew: false, closeReason: 'REPLAY-SOURCE-CHANGED' };
            }
            const F = U.F[t.sym];
            if (!F) return t;
            const i = asOf - U.off[t.sym];
            if (rollover) { exit = F.c[F.n - 1]; reason = 'REPLAY-END'; }
            else if (t.style !== 'invested' && t.style !== 'tilt' && asOf > t.entryG && i >= 0) {
              const hitStop = side === 1 ? F.l[i] <= stopPx : F.h[i] >= stopPx;
              const hitTgt  = side === 1 ? F.h[i] >= tgtPx  : F.l[i] <= tgtPx;
              if (hitStop) { exit = side === 1 ? Math.min(stopPx, F.o[i]) : Math.max(stopPx, F.o[i]); reason = 'STOP-LOSS'; }
              else if (hitTgt) { exit = side === 1 ? Math.max(tgtPx, F.o[i]) : Math.min(tgtPx, F.o[i]); reason = 'TAKE-PROFIT'; }
              else if (asOf - t.entryG >= maxHoldBars) { exit = F.c[i]; reason = 'TIME-STOP'; }
            }
          } else if (t.style !== 'invested' && t.style !== 'tilt') {
            const mark = lpNow[t.sym];
            if (mark > 0) {
              if ((mark - stopPx) * side <= 0) { exit = mark; reason = 'STOP-LOSS'; }
              else if ((mark - tgtPx) * side >= 0) { exit = mark; reason = 'TAKE-PROFIT'; }
            }
            if (!exit && Date.now() - t.ts > maxHoldMs) { exit = mark > 0 ? mark : t.price; reason = 'TIME-STOP'; }
          }
          if (exit == null) return t;
          exit = exit * (1 - side * cost); // closing cost
          const pnlAmt = (exit - t.price) * t.qty * side;
          if (t._brokerSent) closedSyms.add(t.sym);
          return { ...t, status: pnlAmt > 0 ? 'WIN' : 'LOSS', pnl: pnlAmt, pnlPct: pnlAmt / (t.qty * t.price), exit, exitTs: Date.now(), isNew: false, closeReason: reason };
      };
      setTrades(prev => prev.map(exitFn));
      tradesRef.current = tradesRef.current.map(exitFn);
      if ((isLiveReal || isBrokerPaper) && alpacaNow?.token && closedSyms.size) {
        closedSyms.forEach(sym => {
          fetch(`${BACKEND_URL}/api/positions/${sym}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + alpacaNow.token },
          }).catch(() => {});
        });
      }

      const hist = agentHistoryRef.current;
      const minAccuracy = (riskNow.minAgentAccuracy ?? 35) / 100;
      const autoDisableOn = riskNow.autoDisableAgents !== false;

      // Cache decay-weighted accuracy once per tick — reused by dynamicEnabled and Kelly sizing
      const accCache = new Map(AGENTS.map(a => [a.id, decayAccuracy(hist[a.id])]));

      // Agents without positive evidence on the history so far are advisory: shown, but they don't vote
      const ev = riskNow.pruneAgents !== false ? evidenceAt(U, asOf, book) : null;
      const dynamicEnabled = new Set(
        [...enabledAgentsRef.current].filter(id => {
          if (ev && !(ev[id] && ev[id].mean > 0 && ev[id].t >= 1)) return false;
          if (!autoDisableOn) return true;
          const h = hist[id];
          if (!h || h.length < 5) return true;
          const acc = accCache.get(id);
          return acc === null || acc >= minAccuracy;
        })
      );

      // Confidence history — always runs every tick so the chart reflects live universe confidence
      {
        const shuffled = TICKERS.slice();
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        const sample = shuffled.slice(0, Math.min(12, shuffled.length));
        let confSum = 0, confCnt = 0;
        for (const tk2 of sample) {
          const s2 = sigsFor(tk2.sym);
          if (!s2 || !Object.keys(s2).length) continue;
          confSum += computeEnsemble(s2, agentWeightsRef.current, dynamicEnabled).confidence;
          confCnt++;
        }
        if (confCnt > 0) setConfHistory(prev => [...prev.slice(-89), +(confSum / confCnt).toFixed(3)]);
      }

      // Broker connected + market closed: pause new trades entirely (no simulated fallback).
      // Real signals are still computed, but execution waits for the next session open.
      const mktNowGate = marketStatusRef.current;
      if ((isLiveReal || isBrokerPaper) && mktNowGate && !mktNowGate.isOpen) {
        const nx = mktNowGate.nextOpen ? new Date(mktNowGate.nextOpen) : null;
        sayStatus({ warn: true, text: `US market closed. Orders are only placed while it is open (9:30–16:00 New York time)${nx ? `; next open ${nx.toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' })} your time` : ''}.` });
        return;
      }
      const srv = serverTradingRef.current;
      if (!replay && srv && srv.enabled && srv.sameAccount) {
        sayStatus({ text: `The server engine trades this ${srv.env} account (${srv.schedule}; top ${srv.topK} of ${srv.watchlistSize} stocks), so this browser only watches and places no orders. Close the tab whenever you like; Settings → Server engine shows its runs and daily reports.` });
        return;
      }
      if (!replay && !isLiveReal && !isBrokerPaper) { sayStatus({ warn: true, text: mode === 'VIRTUAL' ? 'VIRTUAL needs a connected paper/demo account. Reconnect your broker in Settings.' : 'LIVE needs a connected live account. Reconnect your broker in Settings.' }); return; }

      // Daily loss limit: once today's equity is down by the limit, no new positions until the next day
      // (a replayed bar is a day). Selling on weakness and stops keep working.
      const dayKey = replay ? `bar:${asOf}` : new Date().toLocaleDateString('en-US', { timeZone: 'America/New_York' });
      const eqNow = balanceRef.current ?? 0;
      if (dayStartRef.current.key !== dayKey) { dayStartRef.current = { key: dayKey, equity: eqNow, hit: false }; setLossHit(null); }
      const dayRet = dayStartRef.current.equity > 0 ? eqNow / dayStartRef.current.equity - 1 : 0;
      if (!dayStartRef.current.hit && dayRet <= -(riskNow.dailyLoss ?? 3) / 100) {
        dayStartRef.current.hit = true;
        setLossHit({ dayRet, limit: riskNow.dailyLoss ?? 3, when: replay ? barDate(U, asOf) : dayKey });
        const t0 = { id: Date.now(), type: 'close-loss', sym: '⚠', text: `daily loss limit hit (${(dayRet * 100).toFixed(1)}%): no new positions today` };
        setToasts(prev => [...prev.slice(-4), t0]);
        setTimeout(() => setToasts(prev => prev.filter(x => x.id !== t0.id)), 8000);
      }
      const blockNew = dayStartRef.current.hit;
      const isPending = (sym) => { const ts = pendingOrdersRef.current.get(sym); return ts != null && Date.now() - ts < 90_000; };
      // Positions belonging to this mode: a replay's own positions in SIMULATED, broker-side ones otherwise.
      // (Replayed positions stay frozen while VIRTUAL/LIVE runs and must not count as holdings there.)
      const mineOpen = () => tradesRef.current.filter(t => t.status === 'OPEN' && (replay ? !!t.replay : !t.replay));

      // ── Rank & tilt ──
      // Fully invested in the top-K stocks by score (trend score, or the model with Autopilot on). Re-ranked
      // at each month end in a replay, once per calendar month live. Swap-only: dropped names are sold,
      // new names bought with an equal share of equity; names that stay are not resized.
      if (style === 'tilt') {
        const frac = riskNow.investFraction ?? 0.9;
        const K = SS.effectiveTopK(riskNow.topK || 12, U.syms.length);
        const blacklist = blacklistedSymbolsRef.current;
        const open = mineOpen();
        const heldBy = new Map(open.map(t => [t.sym, t]));
        const curMonth = replay ? barDate(U, asOf).slice(0, 7) : new Date().toISOString().slice(0, 7);
        const tKey = replay ? 'replay' : 'broker';
        const monthEnds = replay ? (asOf < U.L - 1 && barDate(U, asOf + 1).slice(0, 7) !== curMonth) : (tiltStateRef.current[tKey] || {}).month !== curMonth;
        // At the broker, sells and buys can't settle in one tick: buys only spend cash the account already has
        // (proceeds of pending sells don't count yet). So after the monthly re-rank, keep working towards that
        // month's picks — sell what's not in them, buy what's missing as cash frees up — until done.
        const stT = tiltStateRef.current[tKey] || {};
        const rerank = heldBy.size === 0 || monthEnds;
        if (!rerank) {
          const pick = !replay && stT.month === curMonth && Array.isArray(stT.keep) ? new Set(stT.keep) : null;
          const missing = pick ? [...pick].filter(sym => !heldBy.has(sym)) : [];
          const extra = pick ? open.filter(t => !pick.has(t.sym)) : [];
          if (!missing.length && !extra.length) {
            if (!replay) sayStatus({ text: `Rank & tilt: holding ${heldBy.size} position${heldBy.size === 1 ? '' : 's'}, chosen this month. It re-ranks once a month, so the next trades come in the first market session of next month.` });
            return;
          }
          if ([...missing, ...extra.map(t => t.sym)].every(isPending)) {
            sayStatus({ text: `Rank & tilt: finishing this month's re-rank — ${extra.length ? `selling ${extra.map(t => t.sym).join(', ')}` : ''}${extra.length && missing.length ? '; ' : ''}${missing.length ? `buying ${missing.join(', ')} as cash frees up` : ''}. Waiting for the broker.` });
            return;
          }
        }
        const scorer = scorerFor(U, book, !!riskNow.autopilot, agentParamsRef.current);
        const ranked = U.syms.filter(sym => !blacklist.has(sym))
          .map(sym => [sym, localIdx(sym) >= 130 ? scorer(sym, localIdx(sym)) : NaN])
          .filter(x => Number.isFinite(x[1])).sort((x, y) => y[1] - x[1]);
        if (ranked.length < K) {
          if (!replay) sayStatus({ warn: true, text: `Rank & tilt needs at least 130 days of history for ${K} stocks to rank them; only ${ranked.length} have enough.` });
          return;
        }
        const keep = rerank ? new Set(ranked.slice(0, K).map(x => x[0])) : new Set(stT.keep);
        if (rerank) {
          tiltStateRef.current = { ...tiltStateRef.current, [tKey]: { month: curMonth, keep: [...keep] } };
          if (!replay) { try { localStorage.setItem('shoal_tilt_state_v1', JSON.stringify(tiltStateRef.current)); } catch (_) {} }
        }
        const topSigs = sigsFor(ranked[0][0]);
        if (topSigs) { const e = computeEnsemble(topSigs, agentWeightsRef.current, null); setSwarmFocus({ sym: ranked[0][0], votes: e.votes, dir: 'BUY', confidence: e.confidence, ts: Date.now() }); }
        const toSell = open.filter(t => !keep.has(t.sym) && !isPending(t.sym));
        const toBuy = [...keep].filter(sym => !heldBy.has(sym) && !isPending(sym));
        const scoreName = riskNow.autopilot ? 'model' : 'trend';
        let freed = 0;
        if (toSell.length) {
          const sellSet = new Set(toSell.map(t => t.id));
          const closeFn = (t) => {
            if (!sellSet.has(t.id) || t.status !== 'OPEN' || t._real) return t;
            const exit = (priceFor(t.sym) || t.price) * (1 - cost);
            const pnlAmt = (exit - t.price) * t.qty * (t.side === 'BUY' ? 1 : -1);
            return { ...t, status: pnlAmt > 0 ? 'WIN' : 'LOSS', pnl: pnlAmt, pnlPct: pnlAmt / (t.qty * t.price), exit, exitTs: Date.now(), isNew: false, closeReason: 'REBALANCE', exitReason: `dropped out of the top ${K} by ${scoreName} score` };
          };
          setTrades(prev => prev.map(closeFn));
          tradesRef.current = tradesRef.current.map(closeFn);
          for (const t of toSell) {
            freed += t.qty * (priceFor(t.sym) || t.price);
            if ((isLiveReal || isBrokerPaper) && alpacaNow?.token && (t._brokerSent || t._real)) {
              pendingOrdersRef.current.set(t.sym, Date.now());
              fetch(`${BACKEND_URL}/api/positions/${t.sym}`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + alpacaNow.token } }).catch(() => {});
            }
          }
        }
        const bought = [];
        if (toBuy.length && !blockNew) {
          const equity = balanceRef.current ?? 0;
          const per = equity * frac / K;
          const sellsOutstanding = !replay && open.some(t => !keep.has(t.sym));
          // replay fills sells and buys together; at the broker only cash already in the account can be spent
          const bp = parseFloat(alpacaNow?.balance);
          let cashLeft = replay ? equity - open.reduce((sum, t) => sum + t.qty * t.price, 0) + freed
            : Math.min(equity - open.reduce((sum, t) => sum + t.qty * t.price, 0), Number.isFinite(bp) && bp > 0 ? bp : Infinity);
          const newTrades = [];
          for (const sym of toBuy) {
            const px = priceFor(sym);
            if (!(px > 0)) continue;
            // at the broker, while sells are still settling, wait for a full share instead of buying a sliver now
            if (sellsOutstanding && cashLeft < per * 0.95) break;
            const notional = parseFloat(Math.min(per, cashLeft).toFixed(2));
            if (notional < 1) break;
            cashLeft -= notional;
            const rank = ranked.findIndex(x => x[0] === sym) + 1;
            const sg = sigsFor(sym) || {};
            const e = computeEnsemble(sg, agentWeightsRef.current, null);
            const F = U.F[sym], i = localIdx(sym), regime = SS.regimeAt(F, i);
            newTrades.push({
              id: 'TX-' + (nextTradeId++), ts: Date.now(), exitTs: null,
              sym, side: 'BUY', qty: parseFloat((notional / (px * (1 + cost))).toFixed(4)), price: px * (1 + cost), exit: null,
              conf: 1 - (rank - 1) / ranked.length, reason: `Rank & tilt · #${rank} of ${ranked.length} by ${scoreName} score`,
              pnl: null, pnlPct: null, status: 'OPEN', mode,
              consensus: e.consensus, votes: e.votes, signals: sg, disagreement: e.disagreement,
              annVol: F.vol(20)[i] || 0, style: 'tilt', replay, replaySrc: replay ? srcKey : null, entryG: replay ? asOf : null,
              regime: regime.label, regimeKey: regime.key, isNew: true, _notional: notional,
            });
            bought.push(sym);
          }
          if (newTrades.length) {
            if (isLiveReal || isBrokerPaper) newTrades.forEach(placeOrder);
            else { setTrades(prev => [...newTrades, ...prev].slice(0, 5000)); tradesRef.current = [...newTrades, ...tradesRef.current]; }
          }
        }
        const stillMissing = toBuy.filter(sym => !bought.includes(sym));
        if (!replay) sayStatus(blockNew && toBuy.length ? { warn: true, text: 'Daily loss limit hit: buys wait until the next trading day.' }
          : { text: `Rank & tilt: ${rerank ? `re-ranked for ${curMonth}.` : "finishing this month's re-rank."} ${bought.length ? `Sent buy orders for ${bought.join(', ')}.` : ''}${toSell.length ? ` Sent sells for ${toSell.map(t => t.sym).join(', ')}.` : ''}${stillMissing.length ? ` ${stillMissing.join(', ')} will be bought as cash frees up (after the sells fill).` : ''}${!bought.length && !toSell.length && !stillMissing.length ? 'Top stocks already held.' : ''}` });
        if (toSell.length || bought.length) {
          setAutopilotLog(prev => [{ ts: Date.now(), kind: 'info', when: replay ? barDate(U, asOf) : new Date().toISOString().slice(0, 10),
            text: `${rerank ? 'Monthly re-rank' : 'Re-rank continued'} (top ${K} by ${scoreName} score): ${toSell.length ? `sold ${toSell.map(t => t.sym).join(', ')}` : 'nothing sold'}; ${bought.length ? `bought ${bought.join(', ')}` : 'nothing bought'}.` }, ...prev].slice(0, 100));
        }
        return;
      }

      // ── Stay invested, sell on weakness ──
      // Hold every stock at an equal share of `investFraction` of equity. Sell a holding when the weighted
      // swarm calls SELL with confidence ≥ the threshold; buy it back once the SELL call clears.
      if (style === 'invested') {
        const minConf = (riskNow.confidence ?? 55) / 100;
        const frac = riskNow.investFraction ?? 0.9;
        const blacklist = blacklistedSymbolsRef.current;
        const open = mineOpen();
        const heldBy = new Map(open.map(t => [t.sym, t]));
        const toSell = [], toBuy = [];
        let focus = null;
        for (const sym of U.syms) {
          const sigs = sigsFor(sym);
          if (!sigs) continue;
          const F = U.F[sym], i = localIdx(sym);
          const regime = SS.regimeAt(F, i);
          const regimeMult = riskNow.regimeWeights ? SS.regimeMultipliers(agentRegimeHistoryRef.current[regime.key]) : null;
          const ens = computeEnsemble(sigs, agentWeightsRef.current, dynamicEnabled, { regimeMult });
          const weak = ens.dir === 'SELL' && ens.confidence >= minConf;
          if (!focus || ens.confidence > focus.ens.confidence) focus = { sym, ens };
          if (isPending(sym)) continue;
          const held = heldBy.get(sym);
          if (weak && held) toSell.push({ sym, held, ens, sigs });
          else if (!weak && !held && !blacklist.has(sym)) toBuy.push({ sym, ens, sigs, regime, F, i });
        }
        if (focus) setSwarmFocus({ sym: focus.sym, votes: focus.ens.votes, dir: focus.ens.dir, confidence: focus.ens.confidence, ts: Date.now() });
        let freedCash = 0;
        if (toSell.length) {
          const sellBy = new Map(toSell.map(x => [x.sym, x]));
          const closeFn = (t) => {
            const x = sellBy.get(t.sym);
            if (!x || t.status !== 'OPEN' || t._real) return t;
            const exit = (priceFor(t.sym) || t.price) * (1 - cost);
            const pnlAmt = (exit - t.price) * t.qty * (t.side === 'BUY' ? 1 : -1);
            return { ...t, status: pnlAmt > 0 ? 'WIN' : 'LOSS', pnl: pnlAmt, pnlPct: pnlAmt / (t.qty * t.price), exit, exitTs: Date.now(), isNew: false, closeReason: 'WEAKNESS', exitReason: buildReason(x.sigs, x.ens) };
          };
          setTrades(prev => prev.map(closeFn));
          // ticks can outrun React renders at high replay speed: keep the ref current so the next tick
          // doesn't see stale positions (and buy or sell twice)
          tradesRef.current = tradesRef.current.map(closeFn);
          for (const x of toSell) {
            freedCash += x.held.qty * (priceFor(x.sym) || x.held.price);
            if ((isLiveReal || isBrokerPaper) && alpacaNow?.token) {
              pendingOrdersRef.current.set(x.sym, Date.now());
              fetch(`${BACKEND_URL}/api/positions/${x.sym}`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + alpacaNow.token } }).catch(() => {});
            }
          }
        }
        if (toBuy.length && !blockNew) {
          const equity = balanceRef.current ?? 0;
          const per = equity * frac / Math.max(1, U.syms.length);
          let cash = equity - open.reduce((sum, t) => sum + t.qty * t.price, 0) + freedCash;
          const newTrades = [];
          for (const x of toBuy) {
            const px = priceFor(x.sym);
            if (!(px > 0)) continue;
            const notional = parseFloat(Math.min(per, cash).toFixed(2));
            if (notional < 1) break;
            cash -= notional;
            const price = px * (1 + cost);
            newTrades.push({
              id: 'TX-' + (nextTradeId++), ts: Date.now(), exitTs: null,
              sym: x.sym, side: 'BUY', qty: parseFloat((notional / price).toFixed(4)), price, exit: null,
              conf: x.ens.confidence, reason: 'Stay invested · no weakness signal',
              pnl: null, pnlPct: null, status: 'OPEN', mode,
              consensus: x.ens.consensus, votes: x.ens.votes, signals: x.sigs, disagreement: x.ens.disagreement,
              annVol: x.F.vol(20)[x.i] || 0, style: 'invested', replay, replaySrc: replay ? srcKey : null, entryG: replay ? asOf : null,
              regime: x.regime.label, regimeKey: x.regime.key, isNew: true, _notional: notional,
            });
          }
          if (newTrades.length) {
            if (isLiveReal || isBrokerPaper) newTrades.forEach(placeOrder);
            else {
              setTrades(prev => [...newTrades, ...prev].slice(0, 5000));
              tradesRef.current = [...newTrades, ...tradesRef.current];
            }
          }
        }
        return;
      }

      if (Math.random() < 0.55) {
        const maxDisagree = (riskNow.maxDisagreement ?? 65) / 100;
        const maxSectPct  = (riskNow.maxSectorPct  ?? 40) / 100;
        const minConf     = (riskNow.confidence    ?? 55) / 100;
        const minCons     = riskNow.minConsensus   ?? 5;
        const blacklist   = blacklistedSymbolsRef.current;

        // Guard rail: never place a new trade if the account would be wiped.
        // Skip the entire scan if free cash (balance − open exposure) is below
        // a minimum threshold, or below the new trade's notional.
        if (blockNew) return;
        const balanceNow = balanceRef.current ?? 0;
        const maxVal     = balanceNow * (riskNow.maxTradePct ?? 5) / 100;
        const openExposure = mineOpen().reduce((s, t) => s + t.qty * t.price, 0);
        const freeCash = balanceNow - openExposure;
        if (balanceNow <= 100 || freeCash <= 0) return;

        // [8] Half-Kelly sizing from cached decay-weighted accuracy
        const avgWinRate = AGENTS.reduce((s, a) => s + (accCache.get(a.id) ?? a.accuracy), 0) / AGENTS.length;
        const kellyFrac = Math.max(0.15, Math.min(0.5, 2 * (avgWinRate - 0.5)));

        // Snapshot current open-position sector concentrations
        const openTrades = mineOpen();
        const sectorCounts = {};
        openTrades.forEach(t => {
          const sect = (TICKERS.find(tk => tk.sym === t.sym) || {}).sector || 'Other';
          sectorCounts[sect] = (sectorCounts[sect] || 0) + 1;
        });
        const totalOpen = openTrades.length;
        const maxPos = riskNow.maxPos ?? 50;

        if (totalOpen >= maxPos) return;

        // [10] Per-ticker win rate — O(N) with Map grouping, computed only when a trade will be attempted
        const allClosed = tradesRef.current.filter(t => t.pnl != null);
        const byTicker = new Map();
        for (const t of allClosed) { const arr = byTicker.get(t.sym); if (arr) arr.push(t); else byTicker.set(t.sym, [t]); }
        const tickerEdge = {};
        TICKERS.forEach(tk => {
          const recent = (byTicker.get(tk.sym) || []).slice(-10);
          if (recent.length >= 3) tickerEdge[tk.sym] = recent.filter(t => t.pnl > 0).length / recent.length;
        });

        // Correlation sample: every agent's vote on every ticker, once per bar
        if (voteRowsRef.lastAsOf !== asOf) {
          voteRowsRef.lastAsOf = asOf;
          for (const sym of U.syms) {
            const sg = sigsFor(sym);
            if (sg) voteRowsRef.current.push(Object.fromEntries(AGENTS.map(a => [a.id, sg[a.id]?.dir || 0])));
          }
          voteRowsRef.current = voteRowsRef.current.slice(-600);
        }
        const corrAdj = riskNow.corrPenalty ? SS.correlationAdjust(voteRowsRef.current, AGENTS.map(a => a.id)) : null;
        const candidates = [];
        let scanBest = null; // highest-confidence ticker seen this scan (gate-independent)
        for (const tk of TICKERS) {
          if (blacklist.has(tk.sym) || isPending(tk.sym)) continue;
          const sigs = sigsFor(tk.sym);
          if (!sigs) continue;
          const F = U.F[tk.sym], bi = localIdx(tk.sym);
          const regime = F && bi != null ? SS.regimeAt(F, bi) : null;
          const regimeMult = riskNow.regimeWeights && regime ? SS.regimeMultipliers(agentRegimeHistoryRef.current[regime.key]) : null;
          const ens = computeEnsemble(sigs, agentWeightsRef.current, dynamicEnabled, { regimeMult, corrAdj });
          if (!scanBest || ens.confidence > scanBest.ens.confidence) scanBest = { tk, sigs, ens };
          // [1] Confidence gate
          if (ens.confidence < minConf) continue;
          // [2] Minimum consensus gate (N agents must agree on direction)
          if (ens.consensus < minCons) continue;
          if (ens.dir === 'SELL' && !(riskNow.shorts ?? true)) continue;
          if (ens.disagreement > maxDisagree) continue;
          // [7] Volatility is handled by ATR sizing (volatile names get smaller positions), not a hard filter
          const tkVol = F && bi != null ? (F.vol(20)[bi] || 0) : 0;
          const atr = F && bi != null ? F.atr(14)[bi] : NaN;
          // Sector concentration cap only activates once enough positions exist for it
          // to be mathematically achievable (e.g. 40% needs ≥5 positions: 2/5 = 40%).
          if (totalOpen >= 5) {
            const sect = tk.sector || 'Other';
            const sectFrac = ((sectorCounts[sect] || 0) + 1) / (totalOpen + 1);
            if (sectFrac > maxSectPct) continue;
          }
          let side;
          if (direction === 'LONG') side = 'BUY';
          else if (direction === 'SHORT') side = 'SELL';
          else { if (!ens.dir) continue; side = ens.dir; }
          candidates.push({ tk, sigs, ens, side, tkVol, regime, atr, F, bi });
        }

        if (candidates.length === 0 && scanBest) {
          setSwarmFocus({ sym: scanBest.tk.sym, votes: scanBest.ens.votes, dir: scanBest.ens.dir, confidence: scanBest.ens.confidence, ts: Date.now() });
        }

        if (candidates.length > 0) {
          // Pick up to 3 trades per tick via weighted sampling without replacement
          const maxPerTick = Math.min(3, candidates.length);
          const pool = [...candidates];
          let cashLeft = freeCash;
          const batchTrades = [];

          for (let pick = 0; pick < maxPerTick && cashLeft > 1; pick++) {
            const totalScore = pool.reduce((s, c) => {
              const edge = tickerEdge[c.tk.sym] ?? 0.5;
              return s + c.ens.confidence ** 2 * (0.6 + edge * 0.8);
            }, 0);
            if (totalScore <= 0) break;

            let rand = Math.random() * totalScore;
            let chosenIdx = 0;
            for (let ci = 0; ci < pool.length; ci++) {
              const edge = tickerEdge[pool[ci].tk.sym] ?? 0.5;
              rand -= pool[ci].ens.confidence ** 2 * (0.6 + edge * 0.8);
              if (rand <= 0) { chosenIdx = ci; break; }
            }

            const chosen = pool.splice(chosenIdx, 1)[0];
            const { tk, sigs, ens: ensemble, side, tkVol, regime, atr, F, bi } = chosen;
            if (pick === 0) setSwarmFocus({ sym: tk.sym, votes: ensemble.votes, dir: ensemble.dir, confidence: ensemble.confidence, ts: Date.now() });

            const basePx = priceFor(tk.sym) || tk.last;
            const price = basePx * (1 + (side === 'BUY' ? 1 : -1) * cost);
            // [8] Size: ATR stops risk `Risk per trade` % of equity over a stop of atrStop × ATR, capped at
            // the max trade size. With ATR stops off (or no bars): the original confidence × half-Kelly sizing.
            let rawNotional, stopPct = null, tpPct = null;
            const plan = riskNow.atrStops !== false && Number.isFinite(atr)
              ? SS.atrPlan({ price: basePx, atr, equity: balanceNow, riskPct: riskNow.perTrade ?? 1.1, maxTradePct: riskNow.maxTradePct ?? 5,
                  atrStop: riskNow.atrStop ?? 2, atrTarget: riskNow.atrTarget ?? 3, confidence: ensemble.confidence })
              : null;
            if (plan) { rawNotional = plan.notional; stopPct = plan.stopPct; tpPct = plan.tpPct; }
            else rawNotional = maxVal * ensemble.confidence * (0.5 + kellyFrac);
            const notional = parseFloat(Math.min(rawNotional, cashLeft).toFixed(2));
            const qty = parseFloat((notional / price).toFixed(4));

            if (notional < 1 || qty < 0.001) continue;
            cashLeft -= notional;

            const voteHistory = Array.from({length:3}, (_, i) => {
              const perturbedSigs = {};
              AGENTS.forEach(a => {
                const s = sigs[a.id];
                if (!s) return;
                const noise = (Math.random() - 0.5) * 0.15 * (3 - i);
                perturbedSigs[a.id] = { ...s, strength: Math.max(0, Math.min(1, s.strength + noise)), dir: Math.random() < (0.05 * (3 - i)) ? -s.dir : s.dir };
              });
              return computeEnsemble(perturbedSigs, agentWeightsRef.current, dynamicEnabled).votes;
            });

            batchTrades.push({
              id: 'TX-' + (nextTradeId++),
              ts: Date.now() + pick, exitTs: null,
              sym: tk.sym, side, qty, price, exit: null,
              conf: ensemble.confidence,
              reason: buildReason(sigs, ensemble),
              pnl: null, pnlPct: null, status: 'OPEN', mode,
              consensus: ensemble.consensus,
              votes: ensemble.votes,
              signals: sigs,
              disagreement: ensemble.disagreement,
              annVol: tkVol,
              style: 'both', replay, replaySrc: replay ? srcKey : null, entryG: replay ? asOf : null,
              stopPct, tpPct,
              regime: regime?.label, regimeKey: regime?.key,
              voteHistory,
              isNew: true,
              _notional: notional,
            });
          }

          if (batchTrades.length > 0) {
            if (isLiveReal || isBrokerPaper) {
              batchTrades.forEach(placeOrder);
            } else {
              setTrades(prev => [...batchTrades, ...prev].slice(0, 5000));
              tradesRef.current = [...batchTrades, ...tradesRef.current];
            }
          }
        }
      }

    }, Math.max(35, Math.round(3500 / (mode === 'SIMULATED' ? simSpeed : 1))));
    return () => clearInterval(ivl);
  }, [running, mode, direction, risk, simSpeed]);

  // Live equity = startingBalance + Σ realized P&L + Σ unrealized P&L on open positions.
  // Recomputed on every tick so the dashboard equity, P/L trend, and the swarm tick's
  // zero-balance guard all read the same number. Bypassed when an Alpaca account is
  // connected — SSE pushes the real account equity directly via setBalance().
  React.useEffect(() => {
    if (!running) return;
    const recompute = () => {
      if (alpacaRef.current?.token && (mode === 'LIVE' || mode === 'VIRTUAL')) return;
      const ts = tradesRef.current || [];
      const lp = livePricesRef.current || {};
      let realized = 0, unrealized = 0;
      for (const t of ts) {
        if (t.pnl != null) realized += t.pnl;
        else if (t.status === 'OPEN') unrealized += unrealizedPnl(t, lp);
      }
      const equity = startingBalanceRef.current + realized + unrealized;
      setBalance(equity);
      setPnl(realized + unrealized);
    };
    recompute();
    const ivl = setInterval(recompute, 800);
    return () => clearInterval(ivl);
  }, [running, mode]);

  // Theme: apply/remove .light class on <html>
  React.useEffect(() => {
    if (themeMode === 'light') document.documentElement.classList.add('light');
    else document.documentElement.classList.remove('light');
    localStorage.setItem('shoal_theme', themeMode);
  }, [themeMode]);

  // Toast detection: fire on newly opened or newly closed trades
  const prevToastTradesRef = React.useRef([]);
  React.useEffect(() => {
    const prev = prevToastTradesRef.current;
    const prevMap = new Map(prev.map(t => [t.id, t]));
    const newToasts = [];
    trades.forEach(t => {
      if (!prevMap.has(t.id)) {
        newToasts.push({ id: t.id + '-o', type: t.side === 'BUY' ? 'buy' : 'sell', sym: t.sym, text: t.side + ' ' + t.qty + ' @ ' + fmtNum(t.price) });
      } else {
        const p = prevMap.get(t.id);
        if (p.status === 'OPEN' && (t.status === 'WIN' || t.status === 'LOSS')) {
          newToasts.push({ id: t.id + '-c', type: t.status === 'WIN' ? 'close-win' : 'close-loss', sym: t.sym, text: t.status + ' ' + (t.pnl >= 0 ? '+' : '') + fmtMoney(t.pnl) });
        }
      }
    });
    if (newToasts.length > 0) {
      setToasts(prev => [...prev, ...newToasts].slice(-5));
      newToasts.forEach(toast => {
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== toast.id)), 3200);
      });
    }
    prevToastTradesRef.current = trades;
  }, [trades]);

  React.useEffect(() => { localStorage.setItem('shoal_mode', mode); }, [mode]);
  // Drop to SIMULATED whenever the broker connection is lost
  React.useEffect(() => {
    if (!alpaca.connected && mode !== 'SIMULATED') setMode('SIMULATED');
  }, [alpaca.connected]);
  React.useEffect(() => { localStorage.setItem('shoal_route', route); }, [route]);
  React.useEffect(() => { localStorage.setItem('shoal_alpaca', JSON.stringify(alpaca)); }, [alpaca]);

  // global tick for animations
  React.useEffect(() => {
    const tickMs = Math.max(50, Math.round(800 / (mode === 'SIMULATED' ? simSpeed : 1)));
    const ivl = setInterval(() => setTick(t => t + 1), tickMs);
    return () => clearInterval(ivl);
  }, [simSpeed, mode]);

  // edit mode protocol
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setEditMode(true);
      if (e.data?.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({type:'__edit_mode_available'}, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const handleTradeClick = (t) => { setSelectedTrade(t); setRoute('trade'); };

  const handleCloseAll = () => {
    const isLiveReal    = mode === 'LIVE'    && !!alpaca?.token && alpaca?.env === 'live';
    const isBrokerPaper = mode === 'VIRTUAL' && !!alpaca?.token && alpaca?.env === 'paper';
    const openSyms = new Set(tradesRef.current.filter(t => t.status === 'OPEN').map(t => t.sym));
    setTrades(prev => prev.map(t => {
      if (t.status !== 'OPEN' || t._real) return t;
      const exitPrice = livePricesRef.current[t.sym] || t.price;
      const pnlAmt = (exitPrice - t.price) * t.qty * (t.side === 'BUY' ? 1 : -1);
      return { ...t, status: pnlAmt > 0 ? 'WIN' : 'LOSS', pnl: pnlAmt, pnlPct: pnlAmt / (t.qty * t.price), exit: exitPrice, exitTs: Date.now(), isNew: false };
    }));
    if (isLiveReal || isBrokerPaper) {
      openSyms.forEach(sym => {
        fetch(`${BACKEND_URL}/api/positions/${sym}`, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + alpaca.token },
        }).catch(() => {});
      });
    }
  };

  const requestMode = (m) => {
    if (m === mode) return;
    setPendingMode(m);
  };
  const confirmMode = () => {
    setMode(pendingMode);
    setPendingMode(null);
  };

  // Agents excluded from consensus: manually toggled off OR (when auto-disable is on) below accuracy threshold (≥ 5 trades required)
  const dynamicExcluded = React.useMemo(() => {
    const minAcc = (risk.minAgentAccuracy ?? 35) / 100;
    const autoOff = risk.autoDisableAgents === false;
    return new Set(AGENTS.filter(a => {
      if (!enabledAgents.has(a.id)) return true;
      if (autoOff) return false;
      const h = agentHistory[a.id];
      if (!h || h.length < 5) return false;
      const acc = decayAccuracy(h);
      return acc !== null && acc < minAcc;
    }).map(a => a.id));
  }, [enabledAgents, agentHistory, risk.minAgentAccuracy, risk.autoDisableAgents]);

  // Each mode shows only its own trades: a replay's in SIMULATED, the broker account's in VIRTUAL / LIVE.
  // (Replayed positions stay frozen while another mode runs; listing them there looked like stuck trades.)
  const modeTrades = React.useMemo(() => trades.filter(t => mode === 'SIMULATED'
    ? (!!t.replay || (!t._real && t.mode === 'SIMULATED'))
    : (!t.replay && t.mode !== 'SIMULATED')), [trades, mode]);
  // Session P&L: realized closed trades since ET midnight (US market day boundary)
  const sessionPnl = React.useMemo(() => {
    const now = new Date();
    const etNow = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
    const etMidnight = new Date(etNow); etMidnight.setHours(0, 0, 0, 0);
    const midnight = etMidnight.getTime() + (now.getTime() - etNow.getTime());
    return modeTrades.filter(t => t.pnl != null && (t.exitTs || 0) >= midnight).reduce((s, t) => s + t.pnl, 0);
  }, [modeTrades]);

  // Available balance = equity − notional locked in open positions.
  // This is the free cash the swarm can deploy on the next trade. Matches the
  // free-cash guard inside the swarm tick.
  const openExposure = React.useMemo(() => (
    modeTrades.filter(t => t.status === 'OPEN').reduce((s, t) => s + t.qty * t.price, 0)
  ), [modeTrades]);
  const availableBalance = Math.max(0, balance - openExposure);

  // Agent evidence for display: next-month rank IC on the whole history of the data being analysed
  const [agentEvidenceDisplay, setAgentEvidenceDisplay] = React.useState(null);
  const evidenceUniverse = (mode === 'SIMULATED' ? replayUniverseFor(risk.replaySource, liveUniverse, importedUniverse) : liveUniverse) || SIM_U;
  React.useEffect(() => {
    const t = setTimeout(() => {
      try {
        setAgentEvidenceDisplay({
          U: evidenceUniverse,
          ev: SS.agentEvidence(evidenceUniverse, { signalsAt: bookFor(evidenceUniverse, agentParams).signalsAt }),
          trend: SS.rankIC(evidenceUniverse, (sym, i) => SS.trendScore(evidenceUniverse.F[sym], i, SS.mergeParams(agentParams).earn), { from: 130, to: evidenceUniverse.L - 1 }),
        });
      } catch (_) {}
    }, 400);
    return () => clearTimeout(t);
  }, [evidenceUniverse, agentParams]);

  // After every hook above — returning earlier changes the hook count when onboarding ends.
  if (showOnboarding) {
    return <ScreenOnboarding onDone={() => { localStorage.setItem('shoal_onboarded', '1'); setShowOnboarding(false); }}/>;
  }

  const alpacaConnected = !!(alpaca?.connected && alpaca?.token);
  const ctx = { activeSymbol, setActiveSymbol, direction, balance, startingBalance, availableBalance, openExposure, pnl, tradesResetAt, trades: modeTrades, agentWeights, agentHistory, agentAccuracySeries, lastSignals, setSelectedTrade, risk, setRisk, marketStatus, dynamicExcluded, confHistory, blacklistedSymbols, setBlacklistedSymbols, slippageLog, liveSignals, livePrices, handleCloseAll, swarmFocus, weightHistory, setWeightHistory, alpacaConnected, liveUniverse, agentParams, agentEvidence: agentEvidenceDisplay, goTo: (r) => setRoute(r), replayInfo, tradeStatus: running ? tradeStatus : { warn: true, text: 'Paused. Press RESUME to let the bot trade.' }, lossHit, autopilotLog, mode,
    replayUniverse: replayUniverseFor(risk.replaySource, liveUniverse, importedUniverse),
    analysisUniverse: (mode === 'SIMULATED' ? replayUniverseFor(risk.replaySource, liveUniverse, importedUniverse) : liveUniverse) || SIM_U,
    importedUniverse, costBps: costBpsFor(risk, mode === 'SIMULATED' ? replayUniverseFor(risk.replaySource, liveUniverse, importedUniverse) : null, alpaca?.brokerId) };
  const screens = {
    guide:       <ScreenGuide onGo={(r) => { setRoute(r); window.scrollTo && window.scrollTo(0, 0); }}/>,
    dashboard:   <ScreenDashboard mode={mode} tick={tick} onTradeClick={handleTradeClick} onMode={requestMode} ctx={ctx}/>,
    activity:    <ScreenActivity mode={mode} tick={tick} onTradeClick={handleTradeClick} running={running} ctx={ctx}/>,
    history:     <ScreenHistory mode={mode} tick={tick} onTradeClick={handleTradeClick} ctx={ctx}/>,
    learning:    <ScreenLearning mode={mode} ctx={ctx}/>,
    trade:       <ScreenTrade trade={selectedTrade || TRADES[0]} onBack={()=>setRoute('dashboard')} mode={mode} ctx={ctx}/>,
    backtest:    <ScreenBacktest mode={mode} ctx={ctx}/>,
    intraday:    <ScreenIntraday alpaca={alpaca}/>,
    swing:       <ScreenSwing ctx={ctx}/>,
    optimiser:   <ScreenOptimiser ctx={ctx} optimiser={optimiser} onApplyFreeze={applyAndFreeze} onUnfreeze={unfreeze} onRecordComparison={recordComparison}/>,
    market:      <ScreenMarket tick={tick} mode={mode} ctx={ctx}/>,
    agentperf:   <ScreenAgentPerf mode={mode} ctx={ctx}/>,
    pnltrend:    <ScreenPnlTrend mode={mode} ctx={ctx}/>,
    sectors:     <ScreenSectorUniverse mode={mode} ctx={ctx}/>,
    agentconfig: optimiser.frozen
      ? <div className="page"><FrozenNotice frozen={optimiser.frozen} onOpen={() => setRoute('optimiser')}/><div style={{pointerEvents:'none',opacity:0.5}}><ScreenAgentConfig agentParams={agentParams} setAgentParams={setAgentParams} enabledAgents={enabledAgents} setEnabledAgents={setEnabledAgents} agentWeights={agentWeights} agentHistory={agentHistory} agentParamPresets={agentParamPresets} setAgentParamPresets={setAgentParamPresets} universe={ctx.analysisUniverse} autopilot={!!risk.autopilot} evidence={agentEvidenceDisplay}/></div></div>
      : <ScreenAgentConfig agentParams={agentParams} setAgentParams={setAgentParams} enabledAgents={enabledAgents} setEnabledAgents={setEnabledAgents} agentWeights={agentWeights} agentHistory={agentHistory} agentParamPresets={agentParamPresets} setAgentParamPresets={setAgentParamPresets} universe={ctx.analysisUniverse} autopilot={!!risk.autopilot} evidence={agentEvidenceDisplay}/>,
    settings:    <ScreenSettings serverTrading={serverTrading} mode={mode} alpaca={alpaca} setAlpaca={setAlpaca} risk={risk} setRisk={setRisk} direction={direction} setDirection={setDirection} onReset={()=>setShowReset(true)} onResetWeights={()=>setShowWeightReset(true)} onExportWeights={exportWeights} onImportWeights={importWeights} backendOk={backendOk} autopilotLog={autopilotLog} frozen={optimiser.frozen} onOpenOptimiser={() => setRoute('optimiser')}
      importedUniverse={importedUniverse} onImportCsv={importCsv} onRemoveImport={removeImport} autoCostBps={costBpsFor({ costBps: 'auto' }, mode === 'SIMULATED' ? ctx.replayUniverse : null, alpaca?.brokerId)}/>,
  };

  const navItem = NAV.find(n => n.id === route);
  const navItemLabel = navItem ? navItem.label : 'Dashboard';

  const closeNavOnMobile = () => setSidebarOpen(false);

  return (
    <div className={'shell ' + (mode === 'LIVE' ? 'live' : '')}>
      {/* Mobile sidebar backdrop */}
      {sidebarOpen && <div className="sidebar-backdrop" onClick={()=>setSidebarOpen(false)}/>}

      <aside className={'sidebar ' + (sidebarOpen ? 'mob-open' : '')}>
        <div className="brand">
          <div className="brand-row">
            <span className="brand-mark"></span>
            <span className="brand-name">Shoal</span>
          </div>
          <div className="brand-sub">Adaptive · v0.4.2</div>
        </div>

        <div className="mode-pill" onClick={()=>{ requestMode(mode==='SIMULATED'?'VIRTUAL':mode==='VIRTUAL'?'LIVE':'SIMULATED'); closeNavOnMobile(); }}>
          <div className="mode-pill-row">
            <span className="mode-pill-label">Trading mode</span>
            <span className="mono tiny muted">↻ cycle</span>
          </div>
          <div style={{marginTop:6}}>
            <span className="mode-dot"></span>
            <span className="mode-pill-value">{mode==='LIVE'?'LIVE TRADING':mode==='VIRTUAL'?'VIRTUAL · BROKER':'SIMULATED · LOCAL'}</span>
          </div>
        </div>

        {/* Collapsible workspace group */}
        <div className="nav-section">
          <div className="nav-group-header" onClick={()=>setNavGroups(g=>({...g, workspace: !g.workspace}))}>
            <div className="nav-label" style={{paddingLeft:0,paddingTop:0,paddingBottom:0}}>Workspace</div>
            <span className={'nav-chevron ' + (navGroups.workspace ? 'open' : '')}>▶</span>
          </div>
          {navGroups.workspace && NAV.slice(0, 7).map(n => (
            <div key={n.id} className={'nav-item ' + (route===n.id?'active':'')} onClick={()=>{ setRoute(n.id); closeNavOnMobile(); }}>
              <span className="nav-icon"><Icon name={n.icon}/></span>
              <span>{n.label}</span>
            </div>
          ))}
        </div>

        {/* Collapsible system group */}
        <div className="nav-section">
          <div className="nav-group-header" onClick={()=>setNavGroups(g=>({...g, system: !g.system}))}>
            <div className="nav-label" style={{paddingLeft:0,paddingTop:0,paddingBottom:0}}>Test &amp; tune</div>
            <span className={'nav-chevron ' + (navGroups.system ? 'open' : '')}>▶</span>
          </div>
          {navGroups.system && NAV.slice(7).map(n => (
            <div key={n.id} className={'nav-item ' + (route===n.id?'active':'')} onClick={()=>{ setRoute(n.id); closeNavOnMobile(); }}>
              <span className="nav-icon"><Icon name={n.icon}/></span>
              <span>{n.label}</span>
              {n.id === 'settings' && !alpaca.connected && <span className="nav-num warn" style={{color:'var(--warn)'}}>!</span>}
            </div>
          ))}
        </div>

        <div className="sidebar-foot">
          <div className="row"><span>Engine</span><span className="ok">● online</span></div>
          <div className="row"><span>Backend</span><span className={backendOk===true?'ok':backendOk===false?'dn':'muted'}>{backendOk===true?'● online':backendOk===false?'○ offline':'○ …'}</span></div>
          <div className="row"><span>Broker</span><span className={alpaca.connected ? 'ok' : ''}>{alpaca.connected ? '● ' + brokerShort(alpaca) + (alpaca.token ? ' ⟳' : '') : '○ none'}</span></div>
          <div className="row"><span>Market</span><span className={!alpaca.connected ? '' : marketStatus.isOpen ? 'ok' : ''} style={!alpaca.connected ? {color:'var(--ink-4)'} : !marketStatus.isOpen ? {color:'var(--warn)'} : {}}>{!alpaca.connected ? '— not connected' : marketStatus.isOpen ? '● open' : '○ closed'}</span></div>
          <div className="row"><span>Latency</span><span>{42 + (tick % 8)}ms</span></div>
          <div className="theme-toggle" onClick={()=>setThemeMode(m=>m==='dark'?'light':'dark')}>
            <span>{themeMode === 'light' ? '◑ Light mode' : '◐ Dark mode'}</span>
            <div className="theme-pill"/>
          </div>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          {/* Hamburger — visible only on mobile via CSS */}
          <button className={'hamburger ' + (sidebarOpen ? 'open' : '')} onClick={()=>setSidebarOpen(o=>!o)} aria-label="Toggle menu">
            <span/><span/><span/>
          </button>
          <div className="crumb">SHOAL / <b>{navItemLabel}</b></div>
          <button className="btn" style={{marginLeft:8,padding:'6px 12px',display:'flex',alignItems:'center',gap:10}} onClick={()=>setSymbolPicker(true)} title="Switch symbol ( / )">
            <span className="mono" style={{color:'var(--ink)',fontWeight:500,letterSpacing:'0.02em'}}>◎ {activeSymbol}</span>
            {alpaca.connected && !marketStatus.isOpen && <span style={{fontSize:9,letterSpacing:'0.12em',padding:'2px 6px',borderRadius:3,background:'var(--line-2)',color:'var(--warn)',fontFamily:'var(--mono)',fontWeight:500}}>CLOSED</span>}
            <span className="mono tiny muted" style={{letterSpacing:'0.1em'}}>⌘/</span>
          </button>
          <div className="tweak-opts" style={{marginLeft:6}}>
            {['LONG','SHORT','BOTH'].map(d => (
              <div key={d} className={'tweak-opt '+(direction===d?'on':'')} onClick={()=>setDirection(d)}
                title={d==='LONG'?'Buy-only · no shorting':d==='SHORT'?'Short-only · contrarian':'Both directions'}>
                {d==='LONG'?'↑ LONG':d==='SHORT'?'↓ SHORT':'⇅ BOTH'}
              </div>
            ))}
          </div>
          <div className="topbar-spacer"></div>
          {/* Available balance badge */}
          <div className="session-pnl" style={{color:'var(--ink-2)',background:'var(--bg-2)',cursor:'help'}}
               title={`Free cash available for new trades.\nEquity ${fmtMoney(balance, 0)} − locked ${fmtMoney(openExposure, 0)} = available ${fmtMoney(availableBalance, 0)}`}>
            Available {fmtMoney(availableBalance, 0)}
          </div>
          {/* Session P&L badge */}
          <div className={'session-pnl ' + (sessionPnl >= 0 ? 'up' : 'dn')}>
            Session {sessionPnl >= 0 ? '+' : ''}{fmtMoney(sessionPnl)}
          </div>
          {tweaks.animated && <TickerStrip tickers={TICKERS} tick={tick}/>}
          {mode === 'SIMULATED' && (
            <div className="tweak-opts" style={{marginRight:6}} title="Simulation speed multiplier">
              {[1, 5, 10, 100].map(s => (
                <div key={s} className={'tweak-opt ' + (simSpeed === s ? 'on' : '')}
                     onClick={() => setSimSpeed(s)}>
                  {s}x
                </div>
              ))}
            </div>
          )}
          <div className={'bot-status ' + (running ? '' : 'paused')}>
            <span className="led"></span>
            <span>{running ? 'BOT RUNNING' : 'BOT PAUSED'}</span>
            <button onClick={()=>setRunning(!running)}>{running ? 'PAUSE' : 'RESUME'}</button>
          </div>
        </div>

        <div className="notif-strip">
          <ToastOverlay toasts={toasts} onRemove={id=>setToasts(prev=>prev.filter(t=>t.id!==id))}/>
        </div>

        <div className="main-scroll">
          {screens[route]}
        </div>
      </main>

      {pendingMode && <ModeSwitchModal targetMode={pendingMode} alpaca={alpaca} onConfirm={confirmMode} onCancel={()=>setPendingMode(null)}/>}
      {symbolPicker && <SymbolPicker onPick={(s)=>{setActiveSymbol(s); setSymbolPicker(false);}} onClose={()=>setSymbolPicker(false)} marketStatus={marketStatus}/>}
      {showReset && <ResetModal onConfirm={resetAccount} onCancel={()=>setShowReset(false)}/>}
      {showWeightReset && <WeightResetModal onConfirm={resetWeights} onCancel={()=>setShowWeightReset(false)}/>}
      {editMode && <TweaksPanel tweaks={tweaks} setTweaks={(nt) => {
        setTweaks(nt);
        window.parent.postMessage({type:'__edit_mode_set_keys', edits: nt}, '*');
      }}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>

</body>
</html>
