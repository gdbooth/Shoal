<script type="text/babel" data-presets="react">
// Top-level App + sidebar nav + mode chrome

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "Compact",
  "accent": "Green",
  "reasoning": true,
  "animated": true,
  "glyph": "◐"
}/*EDITMODE-END*/;

// ── Per-trade P&L bars (used in ScreenPnlTrend) ─────────────────────────────
const PnlBars = ({ trades, height = 110 }) => {
  if (!trades.length) return null;
  const maxAbs = Math.max(...trades.map(t => Math.abs(t.pnl || 0)), 1);
  const W = 700, H = height, pad = { l: 50, r: 12 }, mid = H / 2;
  const innerW = W - pad.l - pad.r;
  const barW = Math.max(2, Math.floor(innerW / trades.length) - 1);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart" preserveAspectRatio="none" style={{height}}>
      <line x1={pad.l} x2={W - pad.r} y1={mid} y2={mid} stroke="var(--line-2)" strokeWidth="0.5"/>
      {trades.map((t, i) => {
        const x = pad.l + i * (innerW / trades.length);
        const h = Math.max(1, (Math.abs(t.pnl) / maxAbs) * (mid - 6));
        return <rect key={t.id} x={x} y={t.pnl > 0 ? mid - h : mid} width={Math.max(1, barW)} height={h} fill={t.pnl > 0 ? 'var(--up)' : 'var(--down)'} opacity="0.85"/>;
      })}
    </svg>
  );
};

// ── ScreenAgentPerf ──────────────────────────────────────────────────────────
const ScreenAgentPerf = ({ mode, ctx }) => {
  const agentAccuracySeries = ctx?.agentAccuracySeries || {};
  const agentHistory        = ctx?.agentHistory        || {};
  const agentWeights        = ctx?.agentWeights        || {};
  const minAccThreshold     = (ctx?.risk?.minAgentAccuracy ?? 35) / 100;
  const maxLen = AGENTS.reduce((m, a) => Math.max(m, (agentAccuracySeries[a.id] || []).length), 0);

  const [sortKey, setSortKey] = React.useState('acc');
  const [sortDir, setSortDir] = React.useState(-1); // -1 = desc, 1 = asc

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir(d => d * -1);
    else { setSortKey(key); setSortDir(-1); }
  };

  const SortTh = ({ col, label, align = 'right' }) => (
    <th className="sortable" style={{textAlign: align}} onClick={() => toggleSort(col)}>
      {label}
      <span className={'sort-arrow' + (sortKey === col ? ' active' : '')}>{sortKey === col ? (sortDir === -1 ? ' ↓' : ' ↑') : ' ↕'}</span>
    </th>
  );

  // Determine which agents are currently excluded (≥5 history trades, accuracy < threshold)
  const isExcluded = (a) => {
    const hist = agentHistory[a.id] || [];
    if (hist.length < 5) return false;
    return hist.filter(Boolean).length / hist.length < minAccThreshold;
  };

  // Build series: append null for excluded agents at the current end to show a gap
  const agentSeries = AGENTS.map(a => {
    const s = agentAccuracySeries[a.id] || [a.accuracy];
    return isExcluded(a) ? [...s, null] : s;
  });

  const sortedAgents = React.useMemo(() => {
    return AGENTS
      .map(a => {
        const hist = agentHistory[a.id] || [];
        const acc  = hist.length >= 3 ? hist.filter(Boolean).length / hist.length : null;
        const w    = agentWeights[a.id] ?? a.weight;
        const excl = isExcluded(a);
        return { ...a, hist, acc, w, excl };
      })
      .sort((a, b) => {
        let va, vb;
        if (sortKey === 'acc')    { va = a.acc ?? a.accuracy; vb = b.acc ?? b.accuracy; }
        else if (sortKey === 'w') { va = a.w; vb = b.w; }
        else if (sortKey === 'calls') { va = a.hist.length; vb = b.hist.length; }
        else if (sortKey === 'name') { return sortDir * a.name.localeCompare(b.name); }
        else if (sortKey === 'family') { return sortDir * a.family.localeCompare(b.family); }
        else { va = a.acc ?? a.accuracy; vb = b.acc ?? b.accuracy; }
        return sortDir * ((vb ?? 0) - (va ?? 0));
      });
  }, [agentHistory, agentWeights, sortKey, sortDir]);

  return (
    <div className="page" data-screen-label="08 Agent Performance">
      <div className="page-head">
        <div className="page-eyebrow">Agent intelligence · win/loss accuracy over time</div>
        <h1 className="page-title">Which agents are <em>earning their weight</em>?</h1>
        <p className="page-sub">Rolling accuracy is computed from each agent's last 30 closed calls. Weights shift via reinforcement after every close — strong agents grow, weak agents shrink. Agents below the {(minAccThreshold*100).toFixed(0)}% threshold are excluded from consensus until they recover.</p>
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div className="card-head">
          <div className="card-title">Rolling accuracy · all agents</div>
          <div className="card-meta">{maxLen} data point{maxLen !== 1 ? 's' : ''} · rolling 30-trade window per agent</div>
        </div>
        {maxLen < 3
          ? <div style={{padding:'40px 0',textAlign:'center',color:'var(--ink-3)',fontFamily:'var(--mono)',fontSize:12}}>
              Collecting… {maxLen} closed trade{maxLen !== 1 ? 's' : ''} with votes recorded — need at least 3
            </div>
          : <>
              <LineChart
                series={agentSeries}
                colors={AGENTS.map(a => isExcluded(a) ? 'var(--ink-3)' : a.color)}
                labels={AGENTS.map(a => a.name.split(' ')[0])}
                endLabels={AGENTS.map(a => {
                  const hist = agentHistory[a.id] || [];
                  const acc = hist.length >= 2 ? hist.filter(Boolean).length / hist.length : a.accuracy;
                  return a.name.split(' ')[0] + ' ' + (acc * 100).toFixed(0) + '%';
                })}
                height={280}
                yFmt={v => (v * 100).toFixed(0) + '%'}
                fillFirst={false}
                solidLines={true}
                hLines={[{value: minAccThreshold, color:'var(--down)', label: Math.round(minAccThreshold*100)+'% min'}]}
              />
              <div className="legend" style={{marginTop:10,display:'flex',flexWrap:'wrap',gap:'4px 14px'}}>
                {AGENTS.map(a => {
                  const hist = agentHistory[a.id] || [];
                  const acc  = hist.length >= 2 ? hist.filter(Boolean).length / hist.length : a.accuracy;
                  const excl = isExcluded(a);
                  return (
                    <span key={a.id} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,opacity: excl ? 0.45 : 1}}>
                      <span style={{width:12,height:2,background: excl ? 'var(--ink-3)' : a.color,display:'inline-block',borderRadius:1}}></span>
                      <span style={{color:excl ? 'var(--ink-3)' : acc >= 0.6 ? 'var(--up)' : acc < 0.5 ? 'var(--down)' : 'var(--ink-2)',textDecoration: excl ? 'line-through' : 'none'}}>
                        {a.name.split(' ')[0]}
                      </span>
                      {excl && <span style={{color:'var(--down)',fontSize:9,letterSpacing:'0.05em'}}>EXCL</span>}
                    </span>
                  );
                })}
              </div>
            </>
        }
      </div>

      <div className="card">
        <div className="card-head">
          <div className="card-title">Current standing</div>
          <div className="card-meta">click column headers to sort</div>
        </div>
        <table className="tbl">
          <thead>
            <tr>
              <SortTh col="name" label="Agent" align="left"/>
              <SortTh col="family" label="Family" align="left"/>
              <SortTh col="calls" label="Calls"/>
              <SortTh col="acc" label="Accuracy"/>
              <SortTh col="w" label="Weight"/>
              <th style={{textAlign:'right'}}>Status</th>
            </tr>
          </thead>
          <tbody>
            {sortedAgents.map(a => (
              <tr key={a.id} style={{opacity: a.excl ? 0.5 : 1}}>
                <td><span style={{color: a.excl ? 'var(--ink-3)' : a.color,marginRight:8}}>{a.glyph}</span>{a.name}</td>
                <td className="mono tiny muted">{a.family}</td>
                <td className="mono" style={{textAlign:'right'}}>{a.hist.length}</td>
                <td style={{textAlign:'right'}}>
                  {a.acc !== null
                    ? <span className={a.acc >= 0.6 ? 'up' : a.acc < 0.5 ? 'dn' : ''}>{(a.acc * 100).toFixed(1)}%</span>
                    : <span className="muted">–</span>}
                </td>
                <td className="mono" style={{textAlign:'right'}}>{(a.w * 100).toFixed(1)}%</td>
                <td style={{textAlign:'right'}}>
                  {a.excl
                    ? <span className="dn" style={{fontSize:10,letterSpacing:'0.06em'}} title={`${a.acc !== null ? (a.acc*100).toFixed(1)+'%' : '?'} accuracy across ${a.hist.length} trades — below ${(minAccThreshold*100).toFixed(0)}% threshold. Auto-reinstated when accuracy recovers.`}>
                        EXCLUDED · {a.acc !== null ? (a.acc*100).toFixed(0)+'%' : '?'} &lt; {(minAccThreshold*100).toFixed(0)}%
                      </span>
                    : <span className="up" style={{fontSize:10,letterSpacing:'0.06em'}}>ACTIVE</span>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

// ── ScreenPnlTrend ───────────────────────────────────────────────────────────
const ScreenPnlTrend = ({ mode, ctx }) => {
  const { trades, tradesResetAt } = ctx || {};
  const resetAt = tradesResetAt || 0;

  const closed = React.useMemo(() =>
    (trades || [])
      .filter(t => t.pnl != null && t.ts >= resetAt)
      .sort((a, b) => (a.exitTs || a.ts) - (b.exitTs || b.ts)),
    [trades, resetAt]
  );

  if (!closed.length) return (
    <div className="page" data-screen-label="09 P/L Trend">
      <div className="page-head">
        <div className="page-eyebrow">Portfolio performance · since last reset</div>
        <h1 className="page-title">P/L trend</h1>
        <p className="page-sub">No closed trades since last reset.</p>
      </div>
    </div>
  );

  let cum = 0;
  const cumSeries = closed.map(t => { cum += t.pnl; return cum; });
  const totalPnl  = cumSeries[cumSeries.length - 1] || 0;
  const timeLabels = closed.map(t => {
    const d = new Date(t.exitTs || t.ts);
    return `${(d.getMonth()+1)}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  });
  const wins      = closed.filter(t => t.pnl > 0);
  const losses    = closed.filter(t => t.pnl <= 0);
  const winRate   = closed.length ? wins.length / closed.length : 0;
  const avgWin    = wins.length   ? wins.reduce((s, t) => s + t.pnl, 0) / wins.length   : 0;
  const avgLoss   = losses.length ? losses.reduce((s, t) => s + t.pnl, 0) / losses.length : 0;
  const maxDD     = cumSeries.reduce((dd, v, i, a) => {
    const peak = Math.max(...a.slice(0, i + 1));
    return Math.min(dd, v - peak);
  }, 0);

  return (
    <div className="page" data-screen-label="09 P/L Trend">
      <div className="page-head">
        <div className="page-eyebrow">Portfolio performance · since last reset</div>
        <h1 className="page-title">
          Cumulative <em className={totalPnl >= 0 ? 'up' : 'dn'}>{totalPnl >= 0 ? 'gain' : 'loss'}</em> across {closed.length} closed trade{closed.length !== 1 ? 's' : ''}
        </h1>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:12,marginBottom:16}}>
        {[
          { label: 'TOTAL P&L',  val: fmtMoney(totalPnl),           cls: totalPnl >= 0 ? 'up' : 'dn' },
          { label: 'WIN RATE',   val: (winRate * 100).toFixed(1) + '%', cls: winRate >= 0.5 ? 'up' : 'dn' },
          { label: 'AVG WIN',    val: fmtMoney(avgWin),              cls: 'up' },
          { label: 'AVG LOSS',   val: fmtMoney(avgLoss),             cls: 'dn' },
          { label: 'MAX DRAWDN', val: fmtMoney(maxDD),               cls: 'dn' },
        ].map(k => (
          <div key={k.label} className="card" style={{padding:'14px 16px'}}>
            <div className="mono tiny muted" style={{letterSpacing:'0.1em',marginBottom:6}}>{k.label}</div>
            <div className={'mono ' + k.cls} style={{fontSize:18}}>{k.val}</div>
          </div>
        ))}
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div className="card-head">
          <div className="card-title">Cumulative P&L</div>
          <div className="card-meta">{closed.length} trades · running total</div>
        </div>
        <LineChart
          series={[cumSeries]}
          zeroCrossColors={['var(--up)', 'var(--down)']}
          labels={['Cumulative P&L']}
          height={240}
          yFmt={v => fmtMoney(v, 0)}
          fillFirst={true}
          xLabels={timeLabels}
        />
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div className="card-head">
          <div className="card-title">Per-trade P&L</div>
          <div className="card-meta">{wins.length}W · {losses.length}L · green above zero, red below</div>
        </div>
        <PnlBars trades={closed}/>
        <div style={{marginTop:10,display:'flex',flexWrap:'wrap',gap:8}}>
          {closed.slice(-12).reverse().map(t => (
            <div key={t.id} style={{fontFamily:'var(--mono)',fontSize:10,padding:'4px 8px',borderRadius:3,background:'var(--bg-2)',color: t.pnl > 0 ? 'var(--up)' : 'var(--down)'}}>
              {t.sym} {t.side} {t.pnl >= 0 ? '+' : ''}{fmtMoney(t.pnl, 0)}
            </div>
          ))}
        </div>
      </div>

      {/* ── Drawdown waterfall ── */}
      {(() => {
        // Find discrete drawdown episodes: peak→trough→recovery sequences
        let peak = 0, inDD = false, ddStart = -1;
        const episodes = [];
        cumSeries.forEach((v, i) => {
          if (v > peak) {
            if (inDD && ddStart >= 0) {
              episodes.push({ start: ddStart, end: i - 1, depth: peak - Math.min(...cumSeries.slice(ddStart, i)), duration: i - ddStart });
            }
            peak = v; inDD = false; ddStart = -1;
          } else if (v < peak) {
            if (!inDD) { inDD = true; ddStart = i; }
          }
        });
        if (inDD && ddStart >= 0) {
          episodes.push({ start: ddStart, end: cumSeries.length - 1, depth: peak - Math.min(...cumSeries.slice(ddStart)), duration: cumSeries.length - ddStart, open: true });
        }
        if (!episodes.length) return (
          <div className="card">
            <div className="card-head"><div className="card-title">Drawdown waterfall</div></div>
            <div style={{padding:'30px 0',textAlign:'center',color:'var(--ink-3)',fontFamily:'var(--mono)',fontSize:12}}>No drawdown episodes yet — all equity is at or near peak.</div>
          </div>
        );
        const maxDepth = Math.max(...episodes.map(e => e.depth), 1);
        const maxDur   = Math.max(...episodes.map(e => e.duration), 1);
        return (
          <div className="card">
            <div className="card-head">
              <div className="card-title">Drawdown waterfall</div>
              <div className="card-meta">{episodes.length} episode{episodes.length!==1?'s':''} · worst {fmtMoney(-maxDepth,0)}</div>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:6,padding:'8px 0'}}>
              {episodes.map((ep, i) => {
                const depthPct = ep.depth / maxDepth;
                const durPct   = ep.duration / maxDur;
                return (
                  <div key={i} style={{display:'flex',alignItems:'center',gap:10}}>
                    <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--ink-4)',width:22,flexShrink:0}}>#{i+1}</span>
                    <div style={{flex:1,position:'relative',height:18,background:'var(--bg-3)',borderRadius:2,overflow:'hidden'}}>
                      {/* depth bar */}
                      <div style={{position:'absolute',left:0,top:0,height:'100%',width:`${depthPct*100}%`,background:'rgba(255,107,107,0.6)',borderRadius:2}}/>
                      {/* duration overlay */}
                      <div style={{position:'absolute',left:0,top:'30%',height:'40%',width:`${durPct*100}%`,background:'rgba(255,107,107,0.3)'}}/>
                    </div>
                    <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--down)',width:70,textAlign:'right',flexShrink:0}}>{fmtMoney(-ep.depth,0)}</span>
                    <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--ink-4)',width:40,textAlign:'right',flexShrink:0}}>{ep.duration}t{ep.open?' ⋯':''}</span>
                  </div>
                );
              })}
            </div>
            <div className="mono tiny muted" style={{marginTop:8}}>Each row = one peak-to-trough episode. Bar width = depth (dark) and duration (light). ⋯ = episode still open (not yet recovered to prior peak).</div>
          </div>
        );
      })()}
    </div>
  );
};

const ScreenAgentConfig = ({ agentParams, setAgentParams, enabledAgents, setEnabledAgents, agentWeights, agentHistory }) => {
  const [optimizing, setOptimizing] = React.useState({});
  const [optResults, setOptResults]  = React.useState({});
  const [expanded, setExpanded]      = React.useState({});

  const gp = (id, key) => agentParams[id]?.[key] ?? AGENT_PARAMS_DEFAULT[id]?.[key];
  const sp = (id, key, val) => setAgentParams(p => ({ ...p, [id]: { ...(p[id] || {}), [key]: val } }));

  const optimize = async (agentId) => {
    setOptimizing(o => ({ ...o, [agentId]: true }));
    await new Promise(r => setTimeout(r, 0));
    const result = backtestOneAgent(agentId, 'NVDA', agentParams);
    if (result) sp(agentId, result.paramKey, result.bestValue);
    setOptResults(o => ({ ...o, [agentId]: result }));
    setOptimizing(o => ({ ...o, [agentId]: false }));
  };

  const families = [...new Set(AGENTS.map(a => a.family))];
  const enabledCount = enabledAgents ? enabledAgents.size : AGENTS.length;

  return (
    <div className="page" data-screen-label="10 Agent Config">
      <div className="page-head">
        <div className="page-eyebrow">Agent configuration · {enabledCount}/{AGENTS.length} active</div>
        <h1 className="page-title">Toggle, tune, and <em>optimise</em> each agent.</h1>
        <p className="page-sub">Enable or disable agents, adjust their signal parameters, and run a walk-forward grid search to find the best setting for each param against your price history.</p>
      </div>

      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:16,gap:10}}>
        <button className="btn" style={{fontSize:11}} onClick={() => setEnabledAgents(new Set(AGENTS.map(a => a.id)))}>Enable all</button>
        <button className="btn" style={{fontSize:11}} onClick={() => { setAgentParams({}); setOptResults({}); }}>Reset all params</button>
      </div>

      {families.map(family => (
        <div key={family} style={{marginBottom:24}}>
          <div style={{fontFamily:'var(--mono)',fontSize:10,letterSpacing:'0.14em',color:'var(--ink-3)',textTransform:'uppercase',marginBottom:10,paddingBottom:6,borderBottom:'1px solid var(--line)'}}>{family}</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(290px,1fr))',gap:10}}>
            {AGENTS.filter(a => a.family === family).map(agent => {
              const enabled = !enabledAgents || enabledAgents.has(agent.id);
              const hist = agentHistory?.[agent.id] || [];
              const acc  = hist.length >= 2 ? hist.filter(Boolean).length / hist.length : agent.accuracy;
              const w    = agentWeights?.[agent.id] ?? agent.weight;
              const defs = AGENT_PARAM_DEFS[agent.id] || [];
              const isExp = expanded[agent.id];
              const optRes = optResults[agent.id];
              const busy   = optimizing[agent.id];
              const canOpt = !!AGENT_OPTIMIZE_KEYS[agent.id]?.id;

              return (
                <div key={agent.id} className="card" style={{opacity: enabled ? 1 : 0.42, transition:'opacity 0.2s', padding:14}}>
                  <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <span style={{fontFamily:'var(--mono)',fontSize:15,color:agent.color}}>{agent.glyph}</span>
                        <span style={{fontWeight:500,fontSize:12}}>{agent.name}</span>
                      </div>
                      <div style={{fontSize:10,color:'var(--ink-3)',marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{agent.desc}</div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
                      <span style={{fontFamily:'var(--mono)',fontSize:10,color: acc >= 0.6 ? 'var(--up)' : acc < 0.5 ? 'var(--down)' : 'var(--ink-3)'}}>
                        {(acc*100).toFixed(0)}%
                      </span>
                      <button
                        style={{width:34,height:18,borderRadius:9,background:enabled?'var(--virtual)':'var(--line-2)',position:'relative',transition:'background 0.2s',flexShrink:0,border:'none',cursor:'pointer'}}
                        onClick={() => setEnabledAgents(prev => {
                          const next = new Set(prev || AGENTS.map(a=>a.id));
                          next.has(agent.id) ? next.delete(agent.id) : next.add(agent.id);
                          return next;
                        })}
                      >
                        <span style={{position:'absolute',top:2,left:enabled?18:2,width:14,height:14,borderRadius:7,background:'white',transition:'left 0.2s'}}/>
                      </button>
                    </div>
                  </div>

                  {defs.length > 0 && (
                    <div style={{marginTop:10}}>
                      <button className="mono tiny muted" style={{fontSize:9,letterSpacing:'0.06em',cursor:'pointer'}}
                        onClick={() => setExpanded(e => ({...e, [agent.id]: !isExp}))}>
                        {isExp ? '▾ hide params' : '▸ params'}
                      </button>
                      {isExp && (
                        <div style={{marginTop:8,display:'flex',flexDirection:'column',gap:8}}>
                          {defs.map(def => {
                            const val = gp(agent.id, def.key);
                            const v = val !== undefined ? val : (AGENT_PARAMS_DEFAULT[agent.id]?.[def.key] ?? def.min);
                            const defVal = AGENT_PARAMS_DEFAULT[agent.id]?.[def.key] ?? def.min;
                            const defPct = ((defVal - def.min) / (def.max - def.min)) * 100;
                            const isModified = Math.abs(v - defVal) > def.step * 0.5;
                            return (
                              <div key={def.key}>
                                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
                                  <div style={{display:'flex',alignItems:'center',gap:4}}>
                                    <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--ink-3)'}}>{def.label}</span>
                                    {def.hint && (
                                      <span title={def.hint} style={{cursor:'help',fontFamily:'var(--mono)',fontSize:8,color:'var(--ink-4)',lineHeight:1,borderRadius:'50%',border:'1px solid var(--line-2)',width:13,height:13,display:'inline-flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>?</span>
                                    )}
                                  </div>
                                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                                    {isModified && <span style={{fontFamily:'var(--mono)',fontSize:8,color:'var(--warn)',letterSpacing:'0.04em'}}>modified</span>}
                                    <span style={{fontFamily:'var(--mono)',fontSize:9,color: isModified ? 'var(--ink)' : 'var(--ink-2)'}}>{def.fmt(v)}</span>
                                  </div>
                                </div>
                                <div style={{position:'relative'}}>
                                  <input type="range" min={def.min} max={def.max} step={def.step} value={v}
                                    onChange={e => sp(agent.id, def.key, parseFloat(e.target.value))}
                                    style={{width:'100%',accentColor:agent.color}}/>
                                  {/* default-value tick mark */}
                                  <div style={{position:'absolute',bottom:-6,left:`calc(${defPct}% - 1px)`,width:2,height:5,background:'var(--ink-4)',borderRadius:1}} title={`Default: ${def.fmt(defVal)}`}/>
                                  <div style={{position:'absolute',bottom:-14,left:`calc(${defPct}% - 12px)`,width:26,textAlign:'center',fontFamily:'var(--mono)',fontSize:7,color:'var(--ink-4)',whiteSpace:'nowrap',pointerEvents:'none'}}>↑ def</div>
                                </div>
                                <div style={{height:14}}/>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}

                  <div style={{marginTop:10,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    {canOpt ? (
                      <button className="btn" style={{fontSize:9,padding:'3px 9px',opacity:busy?0.5:1}}
                        onClick={() => !busy && optimize(agent.id)} disabled={busy}>
                        {busy ? '⟳ …' : '⚡ Optimise'}
                      </button>
                    ) : <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--ink-4)'}}>no opt</span>}
                    {optRes && (
                      <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--virtual)'}}>
                        best {AGENT_OPTIMIZE_KEYS[agent.id]?.id}={optRes.bestValue} · {(optRes.bestAccuracy*100).toFixed(0)}% acc
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
};

  const [agentParams, setAgentParams] = React.useState({});
  const [enabledAgents, setEnabledAgents] = React.useState(() => new Set(AGENTS.map(a => a.id)));
  const [confHistory, setConfHistory] = React.useState(() => [...CONFIDENCE_HISTORY]);
  const agentWeightsRef  = React.useRef(agentWeights);
  const agentHistoryRef  = React.useRef(agentHistory);
  const enabledAgentsRef = React.useRef(enabledAgents);
  const riskRef          = React.useRef(risk);
  const tradesRef        = React.useRef(trades);
  const activeSymbolRef  = React.useRef(activeSymbol);
  const blacklistedSymbolsRef = React.useRef(blacklistedSymbols);
  const balanceRef       = React.useRef(balance);
  React.useEffect(() => { agentWeightsRef.current  = agentWeights;  }, [agentWeights]);
  React.useEffect(() => { agentHistoryRef.current   = agentHistory;   }, [agentHistory]);
  React.useEffect(() => { riskRef.current = risk; }, [risk]);
  React.useEffect(() => { enabledAgentsRef.current  = enabledAgents;  }, [enabledAgents]);
  React.useEffect(() => { tradesRef.current = trades; }, [trades]);
  React.useEffect(() => { activeSymbolRef.current = activeSymbol; }, [activeSymbol]);
  React.useEffect(() => { blacklistedSymbolsRef.current = blacklistedSymbols; }, [blacklistedSymbols]);
  React.useEffect(() => { balanceRef.current = balance; }, [balance]);
  // Keep lastSignals in sync with active symbol and agentParams
  React.useEffect(() => {
    setLastSignals(computeSignals(activeSymbol, PRICE_HISTORY, agentParams) || SIGNALS_ALL[activeSymbol] || null);
  }, [activeSymbol, agentParams]);

  // Watch for newly closed trades → update agent weights + accuracy history + accuracy series
  const prevTradesRef = React.useRef([]);
  React.useEffect(() => {
    const prevIds = new Set(prevTradesRef.current.filter(t => t.pnl != null).map(t => t.id));
    const newlyClosed = trades.filter(t => t.pnl != null && t.votes && !prevIds.has(t.id));
    if (newlyClosed.length > 0) {
      const newHistory = newlyClosed.reduce((acc, t) => updateAgentHistory(acc, t), agentHistoryRef.current);
      setAgentWeights(w => newlyClosed.reduce(updateAgentWeights, w));
      setAgentHistory(newHistory);
      // Append one accuracy data-point per agent for every batch of closes (keeps series lengths in sync)
      setAgentAccuracySeries(series => {
        const next = { ...series };
        for (const a of AGENTS) {
          const hist = newHistory[a.id] || [];
          const acc  = hist.length >= 2 ? hist.filter(Boolean).length / hist.length : a.accuracy;
          next[a.id] = [...(next[a.id] || []), acc];
        }
        return next;
      });
    }
    prevTradesRef.current = trades;
  }, [trades]);

  // Backend availability (null = checking, true = online, false = offline)
  const [backendOk, setBackendOk] = React.useState(null);

  const [marketStatus, setMarketStatus] = React.useState(() => getMarketStatus());
  React.useEffect(() => {
    setMarketStatus(getMarketStatus());
    const id = setInterval(() => setMarketStatus(getMarketStatus()), 30000);
    return () => clearInterval(id);
  }, []);

  // Stable ref so interval callbacks can read latest alpaca without re-subscribing
  const alpacaRef = React.useRef(alpaca);
  React.useEffect(() => { alpacaRef.current = alpaca; }, [alpaca]);

  // Backend health-check — polls every 15 s
  React.useEffect(() => {
    const check = async () => {
      try {
        const r = await fetch(`${BACKEND_URL}/api/health`, { signal: AbortSignal.timeout(2000) });
        setBackendOk(r.ok);
      } catch {
        setBackendOk(false);
      }
    };
    check();
    const hcIvl = setInterval(check, 15000);
    return () => clearInterval(hcIvl);
  }, []);

  // SSE bridge — when Alpaca is connected via the backend, replace simulated data with real fills.
  // Token passed as ?token= because EventSource does not support custom headers.
  const streamRef = React.useRef(null);
  React.useEffect(() => {
    if (!alpaca.connected || !alpaca.token) {
      if (streamRef.current) { streamRef.current.close(); streamRef.current = null; }
      return;
    }
    const es = new EventSource(`${BACKEND_URL}/api/stream?token=${encodeURIComponent(alpaca.token)}`);
    streamRef.current = es;
    es.onmessage = (e) => {
      try {
        const { account, positions, orders, clock, error } = JSON.parse(e.data);
        if (error) return;

        if (clock) {
          setMarketStatus(s => ({
            ...s,
            isOpen: clock.is_open,
            nextOpen: clock.next_open ? new Date(clock.next_open) : s.nextOpen,
            source: 'alpaca',
          }));
        }

        // Real account equity → replace simulated balance
        if (account?.equity) {
          const eq = parseFloat(account.equity);
          if (eq > 0) setBalance(eq);
        }
        if (account?.buying_power) {
          setAlpaca(a => ({ ...a, balance: parseFloat(account.buying_power) }));
        }

        // Real orders → replace trade list only in LIVE mode (paper env keeps local swarm fills)
        const isLiveEnv = alpacaRef.current?.env === 'live';
        if (isLiveEnv && Array.isArray(orders) && orders.length > 0) {
          const mapped = orders.map(o => ({
            id:     o.id,
            ts:     new Date(o.submitted_at || o.created_at).getTime(),
            exitTs: o.filled_at ? new Date(o.filled_at).getTime() : null,
            sym:    o.symbol,
            side:   o.side === 'buy' ? 'BUY' : 'SELL',
            // Parse first then OR — filled_qty is "0" (truthy string) for unfilled orders
            qty:    parseFloat(o.filled_qty) || parseFloat(o.qty) || 0,
            // filled_avg_price is null for market orders that haven't filled yet
            price:  parseFloat(o.filled_avg_price) || parseFloat(o.limit_price) || 0,
            exit:   o.filled_at && o.filled_avg_price ? parseFloat(o.filled_avg_price) : null,
            conf:   0.75,
            reason: `${o.type || 'market'} · ${o.time_in_force} · ${o.status} via Alpaca`,
            pnl: null, pnlPct: null,
            status: ['filled','partially_filled'].includes(o.status) ? 'OPEN'
                  : ['canceled','expired','replaced','rejected'].includes(o.status) ? 'LOSS' : 'OPEN',
            mode: 'LIVE',
            consensus: 12, isNew: false, _real: true,
          }));
          setTrades(mapped.slice(0, 200));
        }

        // Real positions → merge with local fills in VIRTUAL mode; replace in LIVE mode
        if (Array.isArray(positions) && positions.length > 0) {
          const realPos = positions.map(p => ({
            id:     'POS-' + p.symbol,
            ts:     Date.now() - 7200000,
            exitTs: null,
            sym:    p.symbol,
            side:   parseFloat(p.qty) >= 0 ? 'BUY' : 'SELL',
            qty:    Math.abs(parseFloat(p.qty)),
            price:  parseFloat(p.avg_entry_price),
            exit:   null,
            conf:   0.75,
            reason: `Live position · ${p.side} · unrealized ${parseFloat(p.unrealized_plpc || 0) >= 0 ? '+' : ''}${(parseFloat(p.unrealized_plpc || 0) * 100).toFixed(2)}%`,
            pnl: null, pnlPct: null,
            status: 'OPEN',
            mode: isLiveEnv ? 'LIVE' : 'VIRTUAL',
            consensus: 12, isNew: false, _real: true,
            _upnl:    parseFloat(p.unrealized_pl  || 0),
            _upnlPct: parseFloat(p.unrealized_plpc || 0),
          }));
          setTrades(prev => {
            if (isLiveEnv) {
              const closedHistory = prev.filter(t => t._real && t.status !== 'OPEN');
              return [...realPos, ...closedHistory].slice(0, 200);
            }
            // VIRTUAL: keep all local swarm fills; just merge in real positions without wiping
            const localFills = prev.filter(t => !t._real);
            const closedReal = prev.filter(t => t._real && t.status !== 'OPEN');
            return [...realPos, ...localFills, ...closedReal].slice(0, 200);
          });
          if (account?.portfolio_value) setBalance(parseFloat(account.portfolio_value));
        }
      } catch (_) {}
    };
    es.onerror = () => { streamRef.current = null; };
    return () => { es.close(); streamRef.current = null; };
  }, [alpaca.connected, alpaca.token]);

  React.useEffect(() => { localStorage.setItem('shoal_sym', activeSymbol); }, [activeSymbol]);
  React.useEffect(() => { localStorage.setItem('shoal_dir', direction); }, [direction]);
  React.useEffect(() => { localStorage.setItem('shoal_balance', balance); }, [balance]);
  React.useEffect(() => { localStorage.setItem('shoal_pnl', pnl); }, [pnl]);
  React.useEffect(() => { localStorage.setItem('shoal_trades_reset_at', tradesResetAt); }, [tradesResetAt]);

  React.useEffect(() => {
    const h = (e) => {
      if (e.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) {
        e.preventDefault(); setSymbolPicker(true);
      }
      if (e.key === 'Escape') { setSymbolPicker(false); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  const resetAccount = (startingBal) => {
    setBalance(startingBal);
    setPnl(0);
    const now = Date.now();
    setTradesResetAt(now);
    setTrades([]);
    setShowReset(false);
  };

  // Global swarm execution — signal-driven trades with real TA, regardless of which screen is mounted.
  React.useEffect(() => {
    if (!running) return;
    const ivl = setInterval(() => {
      const alpacaNow    = alpacaRef.current;
      const isLiveReal   = mode === 'LIVE'    && !!alpacaNow?.token && alpacaNow?.env === 'live';
      const isBrokerPaper= mode === 'VIRTUAL' && !!alpacaNow?.token && alpacaNow?.env === 'paper';
      if (isBrokerPaper) console.debug('[Shoal] tick: broker-paper mode active, token OK');

      const riskNow = riskRef.current || {};

      // [4] Stop-loss, take-profit, and time-stop — close non-real positions that hit exit conditions.
      // Uses a deterministic simulated mark derived from each trade's entry price and time elapsed,
      // so the same tick always evaluates to the same mark for the same trade.
      const stopLossPct   = (riskNow.stopLoss   ?? 2.5) / 100;
      const takeProfitPct = (riskNow.takeProfit  ?? 5.0) / 100;
      const maxHoldMs     = (riskNow.maxHoldHours ?? 48) * 3600_000;

      const closedSyms = new Set();
      setTrades(prev => {
        return prev.map(t => {
          if (t.status !== 'OPEN' || t._real) return t;

          const elapsedMs = Date.now() - t.ts;
          // Simulate a mark price: symbol-seeded drift + time-varying noise
          const symSeed = t.sym.split('').reduce((s, c) => s + c.charCodeAt(0), 0);
          const drift = Math.sin(symSeed * 0.07 + elapsedMs * 0.000002) * 0.03;
          const elapsedH = elapsedMs / 3600000;
          const noise = Math.sin(elapsedH * 1.7 + symSeed * 0.031) * 0.012;
          const markPct = drift + noise; // simulated % move from entry
          const upnlPct = markPct * (t.side === 'BUY' ? 1 : -1); // from trade's perspective

          // [6] Max holding period: time-stop — close at near-breakeven after maxHoldHours
          if (elapsedMs > maxHoldMs) {
            const pnlAmt = (upnlPct * 0.3) * t.qty * t.price; // slight haircut at time-stop
            const exit = t.price * (1 + markPct * 0.3 * (t.side === 'BUY' ? 1 : -1));
            if (t._brokerSent) closedSyms.add(t.sym);
            return { ...t, status: pnlAmt >= 0 ? 'WIN' : 'LOSS', pnl: pnlAmt, pnlPct: pnlAmt / (t.qty * t.price), exit, exitTs: Date.now(), isNew: false, closeReason: 'TIME-STOP' };
          }
          // [3] Stop-loss: force close if down more than stopLoss%
          if (upnlPct <= -stopLossPct) {
            const pnlAmt = -stopLossPct * t.qty * t.price;
            const exit = t.price * (1 - stopLossPct * (t.side === 'BUY' ? 1 : -1));
            if (t._brokerSent) closedSyms.add(t.sym);
            return { ...t, status: 'LOSS', pnl: pnlAmt, pnlPct: -stopLossPct, exit, exitTs: Date.now(), isNew: false, closeReason: 'STOP-LOSS' };
          }
          // [5] Take-profit: lock in gain if up more than takeProfit%
          if (upnlPct >= takeProfitPct) {
            const pnlAmt = takeProfitPct * t.qty * t.price;
            const exit = t.price * (1 + takeProfitPct * (t.side === 'BUY' ? 1 : -1));
            if (t._brokerSent) closedSyms.add(t.sym);
            return { ...t, status: 'WIN', pnl: pnlAmt, pnlPct: takeProfitPct, exit, exitTs: Date.now(), isNew: false, closeReason: 'TAKE-PROFIT' };
          }
          // Stochastic close (remaining probability)
          if (Math.random() < 0.22) {
            const pnlAmt = (Math.random() - 0.42) * t.qty * t.price * 0.02;
            const exit   = t.price + (pnlAmt / t.qty) * (t.side === 'BUY' ? 1 : -1);
            if (t._brokerSent) closedSyms.add(t.sym);
            return { ...t, status: pnlAmt > 0 ? 'WIN' : 'LOSS', pnl: pnlAmt, pnlPct: pnlAmt / (t.qty * t.price), exit, exitTs: Date.now(), isNew: false };
          }
          return t;
        });
      });
      if ((isLiveReal || isBrokerPaper) && alpacaNow?.token && closedSyms.size) {
        closedSyms.forEach(sym => {
          fetch(`${BACKEND_URL}/api/positions/${sym}`, {
            method: 'DELETE',
            headers: { 'Authorization': 'Bearer ' + alpacaNow.token },
          }).catch(() => {});
        });
      }

      // [8] Dynamic enabled set using exponentially-weighted (decay) accuracy — recent calls count more
      const minAcc = (riskNow.minAgentAccuracy ?? 35) / 100;
      const hist = agentHistoryRef.current;
      const dynamicEnabled = new Set(
        [...enabledAgentsRef.current].filter(id => {
          const h = hist[id];
          if (!h || h.length < 5) return true;
          const acc = decayAccuracy(h);
          return acc === null || acc >= minAcc;
        })
      );

      // [10] Build per-ticker recent win rate from closed trades (last 10 per ticker)
      const allClosed = tradesRef.current.filter(t => t.pnl != null);
      const tickerEdge = {};
      TICKERS.forEach(tk => {
        const recent = allClosed.filter(t => t.sym === tk.sym).slice(-10);
        if (recent.length >= 3) {
          tickerEdge[tk.sym] = recent.filter(t => t.pnl > 0).length / recent.length;
        }
      });

      if (Math.random() < 0.55) {
        const maxVal      = riskNow.maxTradeValue ?? 5000;
        const maxDisagree = (riskNow.maxDisagreement ?? 65) / 100;
        const maxSectPct  = (riskNow.maxSectorPct  ?? 40) / 100;
        const minConf     = (riskNow.confidence    ?? 55) / 100;
        const minCons     = riskNow.minConsensus   ?? 5;
        const blacklist   = blacklistedSymbolsRef.current;

        // [8] Kelly fraction from average agent decay-weighted accuracy
        const agentAccs = AGENTS.map(a => {
          const h = hist[a.id];
          return decayAccuracy(h) ?? a.accuracy;
        });
        const avgWinRate = agentAccs.reduce((s, a) => s + a, 0) / agentAccs.length;
        // Half-Kelly sizing: f = max(0.15, 2*(avgWinRate-0.5)), capped at 0.5
        const kellyFrac = Math.max(0.15, Math.min(0.5, 2 * (avgWinRate - 0.5)));

        // Snapshot current open-position sector concentrations
        const openTrades = tradesRef.current.filter(t => t.status === 'OPEN');
        const sectorCounts = {};
        openTrades.forEach(t => {
          const sect = (TICKERS.find(tk => tk.sym === t.sym) || {}).sector || 'Other';
          sectorCounts[sect] = (sectorCounts[sect] || 0) + 1;
        });
        const totalOpen = openTrades.length;

        const candidates = [];
        for (const tk of TICKERS) {
          if (blacklist.has(tk.sym)) continue;
          const sigs = SIGNALS_ALL[tk.sym];
          if (!sigs) continue;
          if (tk.last * 1.005 > maxVal) continue;
          const ens = computeEnsemble(sigs, agentWeightsRef.current, dynamicEnabled);
          // [1] Confidence gate
          if (ens.confidence < minConf) continue;
          // [2] Minimum consensus gate (N agents must agree on direction)
          if (ens.consensus < minCons) continue;
          if (ens.dir === 'SELL' && !(riskNow.shorts ?? true)) continue;
          if (ens.disagreement > maxDisagree) continue;
          // [7] Volatility regime filter — skip if annualized vol is >2× typical equity vol (>70%)
          const tkVol = rollingVol(PRICE_HISTORY[tk.sym]);
          if (tkVol > 0.70) continue;
          if (totalOpen >= 3) {
            const sect = tk.sector || 'Other';
            const sectFrac = ((sectorCounts[sect] || 0) + 1) / (totalOpen + 1);
            if (sectFrac > maxSectPct) continue;
          }
          let side;
          if (direction === 'LONG') side = 'BUY';
          else if (direction === 'SHORT') side = 'SELL';
          else { if (!ens.dir) continue; side = ens.dir; }
          candidates.push({ tk, sigs, ens, side });
        }

        if (candidates.length > 0) {
          // [10] Weighted selection: confidence² × ticker edge factor
          const totalScore = candidates.reduce((s, c) => {
            const edge = tickerEdge[c.tk.sym] ?? 0.5;
            return s + c.ens.confidence ** 2 * (0.6 + edge * 0.8);
          }, 0);
          let rand = Math.random() * totalScore;
          let chosen = candidates[0];
          for (const c of candidates) {
            const edge = tickerEdge[c.tk.sym] ?? 0.5;
            rand -= c.ens.confidence ** 2 * (0.6 + edge * 0.8);
            if (rand <= 0) { chosen = c; break; }
          }

          const { tk, sigs, ens: ensemble, side } = chosen;
          const price = tk.last * (1 + (Math.random() - 0.5) * 0.01);
          // [8] Kelly-adjusted notional — scales with historical win rate
          const notional = parseFloat((maxVal * ensemble.confidence * (0.5 + kellyFrac)).toFixed(2));
          const qty = parseFloat((notional / price).toFixed(4));

          if (qty >= 0.001) {
            const voteHistory = Array.from({length:3}, (_, i) => {
              const perturbedSigs = {};
              AGENTS.forEach(a => {
                const s = sigs[a.id];
                if (!s) return;
                const noise = (Math.random() - 0.5) * 0.15 * (3 - i);
                perturbedSigs[a.id] = { ...s, strength: Math.max(0, Math.min(1, s.strength + noise)), dir: Math.random() < (0.05 * (3 - i)) ? -s.dir : s.dir };
              });
              return computeEnsemble(perturbedSigs, agentWeightsRef.current, dynamicEnabled).votes;
            });

            const newTrade = {
              id: 'TX-' + Math.floor(11000 + Math.random() * 9999),
              ts: Date.now(), exitTs: null,
              sym: tk.sym, side, qty, price, exit: null,
              conf: ensemble.confidence,
              reason: buildReason(sigs, ensemble),
              pnl: null, pnlPct: null, status: 'OPEN', mode,
              consensus: ensemble.consensus,
              votes: ensemble.votes,
              signals: sigs,
              disagreement: ensemble.disagreement,
              voteHistory,
              isNew: true,
            };

            if (isLiveReal || isBrokerPaper) {
              // Build order body based on market state.
              // Alpaca rejects `market + day` orders when the market is closed, so we use GTC limit
              // orders outside regular hours so they queue in the broker and fill at next open.
              const mktNow = getMarketStatus();
              const alpacaSide = side === 'BUY' ? 'buy' : 'sell';
              let orderBody;
              if (mktNow.isOpen) {
                orderBody = { symbol: tk.sym, notional: String(notional), side: alpacaSide, type: 'market', time_in_force: 'day' };
              } else if (riskNow.ah) {
                const intQty = Math.max(1, Math.floor(notional / price));
                orderBody = { symbol: tk.sym, qty: String(intQty), side: alpacaSide, type: 'limit', limit_price: price.toFixed(2), time_in_force: 'day', extended_hours: true };
              } else {
                // Market closed, AH off: GTC limit at entry price ± 0.5% so it fills readily at next open
                const intQty = Math.max(1, Math.floor(notional / price));
                const lx = side === 'BUY' ? (price * 1.005).toFixed(2) : (price * 0.995).toFixed(2);
                orderBody = { symbol: tk.sym, qty: String(intQty), side: alpacaSide, type: 'limit', limit_price: lx, time_in_force: 'gtc' };
              }
              console.log('[Shoal] → Alpaca order', orderBody);
              fetch(`${BACKEND_URL}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + alpacaNow.token },
                body: JSON.stringify(orderBody),
              }).then(async r => {
                const body = await r.json();
                if (!r.ok) { console.warn('[Shoal] Alpaca order rejected', tk.sym, body.message || r.status, body); return; }
                console.log('[Shoal] ✓ Order confirmed', body.id, body.status, body.symbol);
                const filledPrice = parseFloat(body.filled_avg_price || 0);
                if (filledPrice > 0) {
                  const slip = (filledPrice - price) / price;
                  setSlippageLog(prev => [...prev.slice(-49), { sym: tk.sym, side, expected: price, actual: filledPrice, slip, ts: Date.now() }]);
                }
              }).catch(err => console.warn('[Shoal] Order fetch error:', err.message));
              if (!isLiveReal) {
                setTrades(prev => [{ ...newTrade, _brokerSent: true }, ...prev].slice(0, 200));
              }
            } else {
              setTrades(prev => [newTrade, ...prev].slice(0, 200));
            }
          }
        }
      }

      // Compute rolling average confidence across the full universe so the chart shows real variation
      // (single-symbol confidence barely changes since signals are static; cross-universe average varies each tick)
      {
        const univ2 = TICKERS;
        // Shuffle the universe each tick using a lightweight random pick so we get different subsets
        const shuffled = univ2.slice().sort(() => Math.random() - 0.5);
        const sample = shuffled.slice(0, Math.min(12, shuffled.length));
        let confSum = 0, confCnt = 0;
        for (const tk2 of sample) {
          const s2 = SIGNALS_ALL[tk2.sym];
          if (!s2 || !Object.keys(s2).length) continue;
          confSum += computeEnsemble(s2, agentWeightsRef.current, dynamicEnabled).confidence;
          confCnt++;
        }
        if (confCnt > 0) {
          const avgConf = confSum / confCnt;
          setConfHistory(prev => [...prev.slice(-89), +avgConf.toFixed(3)]);
        }
      }
    }, 3500);
    return () => clearInterval(ivl);
  }, [running, mode, direction, risk]);

  // Live equity pulse — faster when a directional bias is active.
  // Each tick: small drift + jitter. BOTH = slow & balanced, LONG/SHORT = faster with directional drift.
  React.useEffect(() => {
    if (!running) return;
    const hz = direction === 'BOTH' ? 1400 : 600; // ms between updates
    const driftBias = direction === 'LONG' ? 0.0008 : direction === 'SHORT' ? 0.0007 : 0.0004;
    const vol = direction === 'BOTH' ? 0.0008 : 0.0018;
    const ivl = setInterval(() => {
      // Don't overwrite real balance when SSE is streaming live account data
      if (alpacaRef.current?.token && mode === 'LIVE') return;
      const r = (Math.random() - 0.5) * vol * 2 + driftBias;
      setBalance(b => Math.max(1000, b * (1 + r)));
      setPnl(p => p + (Math.random() - 0.48) * 140 * (direction === 'BOTH' ? 0.6 : 1.4));
    }, hz);
    return () => clearInterval(ivl);
  }, [running, direction]);

  // Theme: apply/remove .light class on <html>
  React.useEffect(() => {
    if (themeMode === 'light') document.documentElement.classList.add('light');
    else document.documentElement.classList.remove('light');
    localStorage.setItem('shoal_theme', themeMode);
  }, [themeMode]);

  // Toast detection: fire on newly opened or newly closed trades
  const prevToastTradesRef = React.useRef([]);
  React.useEffect(() => {
    const prev = prevToastTradesRef.current;
    const prevMap = new Map(prev.map(t => [t.id, t]));
    const newToasts = [];
    trades.forEach(t => {
      if (!prevMap.has(t.id)) {
        newToasts.push({ id: t.id + '-o', type: t.side === 'BUY' ? 'buy' : 'sell', sym: t.sym, text: t.side + ' ' + t.qty + ' @ ' + fmtNum(t.price) });
      } else {
        const p = prevMap.get(t.id);
        if (p.status === 'OPEN' && (t.status === 'WIN' || t.status === 'LOSS')) {
          newToasts.push({ id: t.id + '-c', type: t.status === 'WIN' ? 'close-win' : 'close-loss', sym: t.sym, text: t.status + ' ' + (t.pnl >= 0 ? '+' : '') + fmtMoney(t.pnl) });
        }
      }
    });
    if (newToasts.length > 0) {
      setToasts(prev => [...prev, ...newToasts].slice(-5));
      newToasts.forEach(toast => {
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== toast.id)), 3200);
      });
    }
    prevToastTradesRef.current = trades;
  }, [trades]);

  React.useEffect(() => { localStorage.setItem('shoal_mode', mode); }, [mode]);
  React.useEffect(() => { localStorage.setItem('shoal_route', route); }, [route]);
  React.useEffect(() => { localStorage.setItem('shoal_alpaca', JSON.stringify(alpaca)); }, [alpaca]);

  // global tick for animations
  React.useEffect(() => {
    const ivl = setInterval(() => setTick(t => t + 1), 800);
    return () => clearInterval(ivl);
  }, []);

  // edit mode protocol
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setEditMode(true);
      if (e.data?.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({type:'__edit_mode_available'}, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const handleTradeClick = (t) => { setSelectedTrade(t); setRoute('trade'); };

  const requestMode = (m) => {
    if (m === mode) return;
    setPendingMode(m);
  };
  const confirmMode = () => {
    setMode(pendingMode);
    setPendingMode(null);
  };

  if (showOnboarding) {
    return <ScreenOnboarding onDone={() => { localStorage.setItem('shoal_onboarded', '1'); setShowOnboarding(false); }}/>;
  }

  // Agents excluded from consensus this tick (below accuracy threshold)
  // [8] Dynamic exclusion uses exponentially-weighted accuracy so recent mistakes matter more
  const dynamicExcluded = React.useMemo(() => {
    const minAcc = (risk.minAgentAccuracy ?? 35) / 100;
    return new Set(AGENTS.filter(a => {
      if (!enabledAgents.has(a.id)) return true;
      const h = agentHistory[a.id] || [];
      if (h.length < 5) return false;
      const acc = decayAccuracy(h);
      return acc !== null && acc < minAcc;
    }).map(a => a.id));
  }, [agentHistory, risk.minAgentAccuracy, enabledAgents]);

  // Session P&L: realized closed trades since midnight local time
  const sessionPnl = React.useMemo(() => {
    const midnight = (() => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); })();
    return trades.filter(t => t.pnl != null && (t.exitTs || 0) >= midnight).reduce((s, t) => s + t.pnl, 0);
  }, [trades]);

  const ctx = { activeSymbol, setActiveSymbol, direction, balance, pnl, tradesResetAt, trades, agentWeights, agentHistory, agentAccuracySeries, lastSignals, setSelectedTrade, risk, setRisk, marketStatus, dynamicExcluded, confHistory, blacklistedSymbols, setBlacklistedSymbols, slippageLog };
  const screens = {
    guide:       <ScreenGuide/>,
    dashboard:   <ScreenDashboard mode={mode} tick={tick} onTradeClick={handleTradeClick} onMode={requestMode} ctx={ctx}/>,
    activity:    <ScreenActivity mode={mode} tick={tick} onTradeClick={handleTradeClick} running={running} ctx={ctx}/>,
    history:     <ScreenHistory mode={mode} tick={tick} onTradeClick={handleTradeClick} ctx={ctx}/>,
    learning:    <ScreenLearning mode={mode} ctx={ctx}/>,
    trade:       <ScreenTrade trade={selectedTrade || TRADES[0]} onBack={()=>setRoute('dashboard')} mode={mode} ctx={ctx}/>,
    backtest:    <ScreenBacktest mode={mode} ctx={ctx}/>,
    market:      <ScreenMarket tick={tick} mode={mode} ctx={ctx}/>,
    agentperf:   <ScreenAgentPerf mode={mode} ctx={ctx}/>,
    pnltrend:    <ScreenPnlTrend mode={mode} ctx={ctx}/>,
    agentconfig: <ScreenAgentConfig agentParams={agentParams} setAgentParams={setAgentParams} enabledAgents={enabledAgents} setEnabledAgents={setEnabledAgents} agentWeights={agentWeights} agentHistory={agentHistory}/>,
    settings:    <ScreenSettings mode={mode} alpaca={alpaca} setAlpaca={setAlpaca} risk={risk} setRisk={setRisk} direction={direction} setDirection={setDirection} onReset={()=>setShowReset(true)} backendOk={backendOk}/>,
  };

  const navItem = NAV.find(n => n.id === route);
  const navItemLabel = navItem ? navItem.label : 'Dashboard';

  const closeNavOnMobile = () => setSidebarOpen(false);

  return (
    <div className={'shell ' + (mode === 'LIVE' ? 'live' : '')}>
      {/* Mobile sidebar backdrop */}
      {sidebarOpen && <div className="sidebar-backdrop" onClick={()=>setSidebarOpen(false)}/>}

      <aside className={'sidebar ' + (sidebarOpen ? 'mob-open' : '')}>
        <div className="brand">
          <div className="brand-row">
            <span className="brand-mark"></span>
            <span className="brand-name">Shoal</span>
          </div>
          <div className="brand-sub">Adaptive · v0.4.2</div>
        </div>

        <div className="mode-pill" onClick={()=>{ requestMode(mode==='SIMULATED'?'VIRTUAL':mode==='VIRTUAL'?'LIVE':'SIMULATED'); closeNavOnMobile(); }}>
          <div className="mode-pill-row">
            <span className="mode-pill-label">Trading mode</span>
            <span className="mono tiny muted">↻ cycle</span>
          </div>
          <div style={{marginTop:6}}>
            <span className="mode-dot"></span>
            <span className="mode-pill-value">{mode==='LIVE'?'LIVE TRADING':mode==='VIRTUAL'?'VIRTUAL · BROKER':'SIMULATED · LOCAL'}</span>
          </div>
        </div>

        {/* Collapsible workspace group */}
        <div className="nav-section">
          <div className="nav-group-header" onClick={()=>setNavGroups(g=>({...g, workspace: !g.workspace}))}>
            <div className="nav-label" style={{paddingLeft:0,paddingTop:0,paddingBottom:0}}>Workspace</div>
            <span className={'nav-chevron ' + (navGroups.workspace ? 'open' : '')}>▶</span>
          </div>
          {navGroups.workspace && NAV.slice(0, 7).map(n => (
            <div key={n.id} className={'nav-item ' + (route===n.id?'active':'')} onClick={()=>{ setRoute(n.id); closeNavOnMobile(); }}>
              <span className="nav-icon"><Icon name={n.icon}/></span>
              <span>{n.label}</span>
            </div>
          ))}
        </div>

        {/* Collapsible system group */}
        <div className="nav-section">
          <div className="nav-group-header" onClick={()=>setNavGroups(g=>({...g, system: !g.system}))}>
            <div className="nav-label" style={{paddingLeft:0,paddingTop:0,paddingBottom:0}}>System</div>
            <span className={'nav-chevron ' + (navGroups.system ? 'open' : '')}>▶</span>
          </div>
          {navGroups.system && NAV.slice(7).map(n => (
            <div key={n.id} className={'nav-item ' + (route===n.id?'active':'')} onClick={()=>{ setRoute(n.id); closeNavOnMobile(); }}>
              <span className="nav-icon"><Icon name={n.icon}/></span>
              <span>{n.label}</span>
              {n.id === 'settings' && !alpaca.connected && <span className="nav-num warn" style={{color:'var(--warn)'}}>!</span>}
            </div>
          ))}
        </div>

        <div className="sidebar-foot">
          <div className="row"><span>Engine</span><span className="ok">● online</span></div>
          <div className="row"><span>Backend</span><span className={backendOk===true?'ok':backendOk===false?'dn':'muted'}>{backendOk===true?'● online':backendOk===false?'○ offline':'○ …'}</span></div>
          <div className="row"><span>Broker</span><span className={alpaca.connected ? 'ok' : ''}>{alpaca.connected ? '● Alpaca' + (alpaca.token ? ' ⟳' : '') : '○ none'}</span></div>
          <div className="row"><span>Market</span><span className={marketStatus.isOpen ? 'ok' : ''} style={!marketStatus.isOpen ? {color:'var(--warn)'} : {}}>{marketStatus.isOpen ? '● open' : '○ closed'}</span></div>
          <div className="row"><span>Latency</span><span>{42 + (tick % 8)}ms</span></div>
          <div className="theme-toggle" onClick={()=>setThemeMode(m=>m==='dark'?'light':'dark')}>
            <span>{themeMode === 'light' ? '◑ Light mode' : '◐ Dark mode'}</span>
            <div className="theme-pill"/>
          </div>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          {/* Hamburger — visible only on mobile via CSS */}
          <button className={'hamburger ' + (sidebarOpen ? 'open' : '')} onClick={()=>setSidebarOpen(o=>!o)} aria-label="Toggle menu">
            <span/><span/><span/>
          </button>
          <div className="crumb">SHOAL / <b>{navItemLabel}</b></div>
          <button className="btn" style={{marginLeft:8,padding:'6px 12px',display:'flex',alignItems:'center',gap:10}} onClick={()=>setSymbolPicker(true)} title="Switch symbol ( / )">
            <span className="mono" style={{color:'var(--ink)',fontWeight:500,letterSpacing:'0.02em'}}>◎ {activeSymbol}</span>
            {!marketStatus.isOpen && <span style={{fontSize:9,letterSpacing:'0.12em',padding:'2px 6px',borderRadius:3,background:'var(--line-2)',color:'var(--warn)',fontFamily:'var(--mono)',fontWeight:500}}>CLOSED</span>}
            <span className="mono tiny muted" style={{letterSpacing:'0.1em'}}>⌘/</span>
          </button>
          <div className="tweak-opts" style={{marginLeft:6}}>
            {['LONG','SHORT','BOTH'].map(d => (
              <div key={d} className={'tweak-opt '+(direction===d?'on':'')} onClick={()=>setDirection(d)}
                title={d==='LONG'?'Buy-only · no shorting':d==='SHORT'?'Short-only · contrarian':'Both directions'}>
                {d==='LONG'?'↑ LONG':d==='SHORT'?'↓ SHORT':'⇅ BOTH'}
              </div>
            ))}
          </div>
          <div className="topbar-spacer"></div>
          {/* Session P&L badge */}
          <div className={'session-pnl ' + (sessionPnl >= 0 ? 'up' : 'dn')}>
            Session {sessionPnl >= 0 ? '+' : ''}{fmtMoney(sessionPnl)}
          </div>
          {tweaks.animated && <TickerStrip tickers={TICKERS} tick={tick}/>}
          <div className={'bot-status ' + (running ? '' : 'paused')}>
            <span className="led"></span>
            <span>{running ? 'BOT RUNNING' : 'BOT PAUSED'}</span>
            <button onClick={()=>setRunning(!running)}>{running ? 'PAUSE' : 'RESUME'}</button>
          </div>
        </div>

        {screens[route]}
      </main>

      {pendingMode && <ModeSwitchModal targetMode={pendingMode} alpaca={alpaca} onConfirm={confirmMode} onCancel={()=>setPendingMode(null)}/>}
      {symbolPicker && <SymbolPicker onPick={(s)=>{setActiveSymbol(s); setSymbolPicker(false);}} onClose={()=>setSymbolPicker(false)} marketStatus={marketStatus}/>}
      {showReset && <ResetModal onConfirm={resetAccount} onCancel={()=>setShowReset(false)}/>}
      {editMode && <TweaksPanel tweaks={tweaks} setTweaks={(nt) => {
        setTweaks(nt);
        window.parent.postMessage({type:'__edit_mode_set_keys', edits: nt}, '*');
      }}/>}
      <ToastOverlay toasts={toasts} onRemove={id=>setToasts(prev=>prev.filter(t=>t.id!==id))}/>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>

</body>
</html>
