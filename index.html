<script type="text/babel" data-presets="react">
// Settings screen — Alpaca connection + risk parameters

const ScreenSettings = ({ mode, alpaca, setAlpaca, risk, setRisk, direction, setDirection, onReset, backendOk }) => {
  const [showConnect, setShowConnect] = React.useState(false);
  const [connecting, setConnecting] = React.useState(false);
  const [connectErr, setConnectErr] = React.useState('');
  const [form, setForm] = React.useState({
    env: 'paper',   // 'paper' | 'live'
    keyId: '',
    secret: '',
    showSecret: false,
  });

  const startConnect = () => {
    setConnectErr('');
    setConnecting(false);
    setForm({ env: 'paper', keyId: '', secret: '', showSecret: false });
    setShowConnect(true);
  };

  const submitConnect = async () => {
    setConnectErr('');
    const id = form.keyId.trim();
    const sec = form.secret.trim();
    if (id.length < 16) { setConnectErr('Key ID looks too short. Check you copied the whole value.'); return; }
    if (sec.length < 30) { setConnectErr('Secret looks too short. Alpaca secrets are ~40 characters.'); return; }
    if (form.env === 'paper' && !/^PK/i.test(id)) {
      setConnectErr('Paper key IDs start with "PK". Did you mean to select Live?'); return;
    }
    if (form.env === 'live' && !/^AK/i.test(id)) {
      setConnectErr('Live key IDs start with "AK". Did you mean to select Paper?'); return;
    }
    setConnecting(true);
    try {
      const resp = await fetch(`${BACKEND_URL}/api/connect`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ keyId: id, secret: sec, env: form.env }),
      });
      const data = await resp.json();
      if (!resp.ok) {
        setConnectErr(data.error || 'Connection failed — check your key pair and try again.');
        setConnecting(false);
        return;
      }
      const { token, account: acc } = data;
      const masked = id.slice(0, 4) + '····' + id.slice(-4);
      setAlpaca({
        connected: true,
        env: form.env,
        keyId: id,
        token,
        secretMasked: '••••••••••••••' + sec.slice(-4),
        keyMasked: masked,
        account: acc.id,
        balance: acc.equity || acc.buyingPower || 0,
        broker: 'Alpaca Markets',
        endpoint: form.env === 'paper' ? 'https://paper-api.alpaca.markets' : 'https://api.alpaca.markets',
      });
    } catch (err) {
      setConnectErr(`Cannot reach Shoal backend at ${BACKEND_URL}. Is it running? (npm install && npm start)`);
    }
    setConnecting(false);
  };

  return (
    <div className="page" data-screen-label="07 Settings">

      </div>

      <div className="grid-2" style={{marginBottom:16}}>
        <div className="card">
          <div className="card-head"><div className="card-title">Broker connection</div><div className="card-meta">Alpaca Markets API</div></div>

          {backendOk === true && (
            <div style={{display:'flex',gap:10,padding:'10px 12px',background:'rgba(125,216,125,0.06)',border:'1px solid rgba(125,216,125,0.3)',borderRadius:4,marginBottom:14,alignItems:'flex-start'}}>
              <span style={{color:'var(--virtual)',fontSize:14,lineHeight:1,marginTop:1}}>◉</span>
              <div style={{lineHeight:1.5}}>
                <div className="mono tiny" style={{color:'var(--virtual)',letterSpacing:'0.1em',marginBottom:3}}>BACKEND ONLINE</div>
                <div className="tiny" style={{color:'var(--ink-2)'}}>
                  Shoal backend is running. Your keys are sent to the backend, validated against Alpaca, and held in server memory only — never written to disk or logged. The backend proxies all order and account requests.
                </div>
              </div>
            </div>
          )}
          {backendOk === false && (
            <div style={{display:'flex',gap:10,padding:'10px 12px',background:'rgba(255,170,40,0.06)',border:'1px solid rgba(255,170,40,0.3)',borderRadius:4,marginBottom:14,alignItems:'flex-start'}}>
              <span style={{color:'var(--warn)',fontSize:14,lineHeight:1,marginTop:1}}>◉</span>
              <div style={{lineHeight:1.5}}>
                <div className="mono tiny" style={{color:'var(--warn)',letterSpacing:'0.1em',marginBottom:3}}>BACKEND OFFLINE · SIMULATED</div>
                <div className="tiny" style={{color:'var(--ink-2)'}}>
                  Backend not reachable at <span className="mono" style={{fontSize:11}}>{BACKEND_URL}</span>. Start it with <span className="mono" style={{fontSize:11}}>npm install &amp;&amp; npm start</span> to enable real Alpaca trading. Until then, trades and P&amp;L are simulated locally.
                </div>
              </div>
            </div>
          )}
          {backendOk === null && (
            <div style={{display:'flex',gap:10,padding:'10px 12px',background:'rgba(100,100,100,0.06)',border:'1px solid var(--line-2)',borderRadius:4,marginBottom:14,alignItems:'center'}}>

              <div className="mono tiny muted" style={{letterSpacing:'0.1em'}}>CHECKING BACKEND…</div>
            </div>

              </div>

              <div className="mono tiny muted" style={{marginTop:10,textAlign:'center'}}>You'll be redirected to alpaca.markets to authorize.</div>
            </div>
          ) : (
            <div>
              <div style={{padding:'14px 16px',background:'var(--bg-2)',borderRadius:6,marginBottom:14,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div>
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    <span style={{width:8,height:8,borderRadius:'50%',background:'var(--virtual)',boxShadow:'0 0 6px currentColor'}}></span>
                    <span className="mono" style={{fontSize:12,letterSpacing:'0.06em'}}>{alpaca.broker}</span>
                  </div>
                  <div className="mono tiny muted" style={{marginTop:6}}>
                    {alpaca.env === 'live' ? 'LIVE' : 'PAPER'} · Account {alpaca.account}

                </div>
                <button className="btn ghost" onClick={async () => {
                  if (alpaca.token) {
                    try { await fetch(`${BACKEND_URL}/api/disconnect`, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + alpaca.token } }); } catch (_) {}
                  }
                  setAlpaca({ ...alpaca, connected: false, token: null });

              </div>
              <div className="dialog-list">
                <div className="dialog-row"><span className="l">Environment</span><span className="v" style={{color: alpaca.env === 'live' ? 'var(--live)' : 'var(--virtual)'}}>{alpaca.env === 'live' ? 'Live' : 'Paper'} · {alpaca.endpoint ? alpaca.endpoint.replace('https://','') : 'paper-api.alpaca.markets'}</span></div>
                <div className="dialog-row"><span className="l">API key ID</span><span className="v mono">{alpaca.keyMasked || '—'}</span></div>
                <div className="dialog-row"><span className="l">Secret</span><span className="v mono">{alpaca.secretMasked || '—'}</span></div>
                <div className="dialog-row"><span className="l">Buying power</span><span className="v">{fmtMoney(alpaca.balance)}</span></div>
                <div className="dialog-row"><span className="l">Account type</span><span className="v">Margin · individual</span></div>
                <div className="dialog-row"><span className="l">Day trades used</span><span className="v">2 / 3</span></div>
                <div className="dialog-row"><span className="l">Data feed</span><span className="v">IEX (free) · upgrade for SIP</span></div>
                <div className="dialog-row"><span className="l">API permission</span><span className="v" style={{color:'var(--virtual)'}}>READ + TRADE</span></div>
              </div>
            </div>
          )}
        </div>

        <div className="card">
          <div className="card-head"><div className="card-title">Risk parameters</div><div className="card-meta">applies to current mode</div></div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>

            <input type="range" min="0.1" max="5" step="0.1" value={risk.perTrade} onChange={e=>setRisk({...risk, perTrade: +e.target.value})}/>

            <div style={{display:'flex',justifyContent:'space-between'}}>

            <input type="range" min="1" max="20" step="1" value={risk.maxPos} onChange={e=>setRisk({...risk, maxPos: +e.target.value})}/>
          </div>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>
              <div className="field-label">Daily loss limit</div>
              <div className="mono" style={{fontSize:13}}>{risk.dailyLoss}% kill switch</div>

            <input type="range" min="1" max="10" step="0.5" value={risk.dailyLoss} onChange={e=>setRisk({...risk, dailyLoss: +e.target.value})}/>

          <div className="field">
            <div style={{display:'flex',justifyContent:'space-between'}}>

<script type="text/babel" data-presets="react">
// Top-level App + sidebar nav + mode chrome

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "Compact",
  "accent": "Green",
  "reasoning": true,
  "animated": true,
  "glyph": "◐"
}/*EDITMODE-END*/;

// ── Per-trade P&L bars (used in ScreenPnlTrend) ─────────────────────────────
const PnlBars = ({ trades, height = 110 }) => {
  if (!trades.length) return null;
  const maxAbs = Math.max(...trades.map(t => Math.abs(t.pnl || 0)), 1);
  const W = 700, H = height, pad = { l: 50, r: 12 }, mid = H / 2;
  const innerW = W - pad.l - pad.r;
  const barW = Math.max(2, Math.floor(innerW / trades.length) - 1);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart" preserveAspectRatio="none" style={{height}}>
      <line x1={pad.l} x2={W - pad.r} y1={mid} y2={mid} stroke="var(--line-2)" strokeWidth="0.5"/>
      {trades.map((t, i) => {
        const x = pad.l + i * (innerW / trades.length);
        const h = Math.max(1, (Math.abs(t.pnl) / maxAbs) * (mid - 6));
        return <rect key={t.id} x={x} y={t.pnl > 0 ? mid - h : mid} width={Math.max(1, barW)} height={h} fill={t.pnl > 0 ? 'var(--up)' : 'var(--down)'} opacity="0.85"/>;
      })}
    </svg>
  );
};

// ── ScreenPnlTrend ───────────────────────────────────────────────────────────
const ScreenPnlTrend = ({ mode, ctx }) => {
  const { trades, tradesResetAt } = ctx || {};
  const resetAt = tradesResetAt || 0;

  const closed = React.useMemo(() =>
    (trades || [])
      .filter(t => t.pnl != null && t.ts >= resetAt)
      .sort((a, b) => (a.exitTs || a.ts) - (b.exitTs || b.ts)),
    [trades, resetAt]
  );

  if (!closed.length) return (
    <div className="page" data-screen-label="09 P/L Trend">
      <div className="page-head">
        <div className="page-eyebrow">Portfolio performance · since last reset</div>
        <h1 className="page-title">P/L trend</h1>
        <p className="page-sub">No closed trades since last reset.</p>
      </div>
    </div>
  );

  let cum = 0;
  const cumSeries = closed.map(t => { cum += t.pnl; return cum; });
  const totalPnl  = cumSeries[cumSeries.length - 1] || 0;
  const timeLabels = closed.map(t => {
    const d = new Date(t.exitTs || t.ts);
    return `${(d.getMonth()+1)}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  });
  const wins      = closed.filter(t => t.pnl > 0);
  const losses    = closed.filter(t => t.pnl <= 0);
  const winRate   = closed.length ? wins.length / closed.length : 0;
  const avgWin    = wins.length   ? wins.reduce((s, t) => s + t.pnl, 0) / wins.length   : 0;
  const avgLoss   = losses.length ? losses.reduce((s, t) => s + t.pnl, 0) / losses.length : 0;
  const maxDD     = cumSeries.reduce((dd, v, i, a) => {
    const peak = Math.max(...a.slice(0, i + 1));
    return Math.min(dd, v - peak);
  }, 0);

  return (
    <div className="page" data-screen-label="09 P/L Trend">
      <div className="page-head">
        <div className="page-eyebrow">Portfolio performance · since last reset</div>
        <h1 className="page-title">
          Cumulative <em className={totalPnl >= 0 ? 'up' : 'dn'}>{totalPnl >= 0 ? 'gain' : 'loss'}</em> across {closed.length} closed trade{closed.length !== 1 ? 's' : ''}
        </h1>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:12,marginBottom:16}}>
        {[
          { label: 'TOTAL P&L',  val: fmtMoney(totalPnl),           cls: totalPnl >= 0 ? 'up' : 'dn' },
          { label: 'WIN RATE',   val: (winRate * 100).toFixed(1) + '%', cls: winRate >= 0.5 ? 'up' : 'dn' },
          { label: 'AVG WIN',    val: fmtMoney(avgWin),              cls: 'up' },
          { label: 'AVG LOSS',   val: fmtMoney(avgLoss),             cls: 'dn' },
          { label: 'MAX DRAWDN', val: fmtMoney(maxDD),               cls: 'dn' },
        ].map(k => (
          <div key={k.label} className="card" style={{padding:'14px 16px'}}>
            <div className="mono tiny muted" style={{letterSpacing:'0.1em',marginBottom:6}}>{k.label}</div>
            <div className={'mono ' + k.cls} style={{fontSize:18}}>{k.val}</div>
          </div>
        ))}
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div className="card-head">
          <div className="card-title">Cumulative P&L</div>
          <div className="card-meta">{closed.length} trades · running total</div>
        </div>
        <LineChart
          series={[cumSeries]}
          colors={[totalPnl >= 0 ? 'var(--up)' : 'var(--down)']}
          labels={['Cumulative P&L']}
          height={240}
          yFmt={v => fmtMoney(v, 0)}
          fillFirst={true}
          xLabels={timeLabels}
        />
      </div>

      <div className="card">
        <div className="card-head">
          <div className="card-title">Per-trade P&L</div>
          <div className="card-meta">{wins.length}W · {losses.length}L · green above zero, red below</div>
        </div>
        <PnlBars trades={closed}/>
        <div style={{marginTop:10,display:'flex',flexWrap:'wrap',gap:8}}>
          {closed.slice(-12).reverse().map(t => (
            <div key={t.id} style={{fontFamily:'var(--mono)',fontSize:10,padding:'4px 8px',borderRadius:3,background:'var(--bg-2)',color: t.pnl > 0 ? 'var(--up)' : 'var(--down)'}}>
              {t.sym} {t.side} {t.pnl >= 0 ? '+' : ''}{fmtMoney(t.pnl, 0)}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ── ScreenAgentConfig ─────────────────────────────────────────────────────────
const ScreenAgentConfig = ({ agentParams, setAgentParams, enabledAgents, setEnabledAgents, agentWeights, agentHistory }) => {
  const [optimizing, setOptimizing] = React.useState({});
  const [optResults, setOptResults]  = React.useState({});
  const [expanded, setExpanded]      = React.useState({});

  const gp = (id, key) => agentParams[id]?.[key] ?? AGENT_PARAMS_DEFAULT[id]?.[key];
  const sp = (id, key, val) => setAgentParams(p => ({ ...p, [id]: { ...(p[id] || {}), [key]: val } }));

  const optimize = async (agentId) => {
    setOptimizing(o => ({ ...o, [agentId]: true }));
    await new Promise(r => setTimeout(r, 0));
    const result = backtestOneAgent(agentId, 'NVDA', agentParams);
    if (result) sp(agentId, result.paramKey, result.bestValue);
    setOptResults(o => ({ ...o, [agentId]: result }));
    setOptimizing(o => ({ ...o, [agentId]: false }));
  };

  const families = [...new Set(AGENTS.map(a => a.family))];
  const enabledCount = enabledAgents ? enabledAgents.size : AGENTS.length;

  return (
    <div className="page" data-screen-label="10 Agent Config">
      <div className="page-head">
        <div className="page-eyebrow">Agent configuration · {enabledCount}/{AGENTS.length} active</div>
        <h1 className="page-title">Toggle, tune, and <em>optimise</em> each agent.</h1>
        <p className="page-sub">Enable or disable agents, adjust their signal parameters, and run a walk-forward grid search to find the best setting for each param against your price history.</p>
      </div>

      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:16,gap:10}}>
        <button className="btn" style={{fontSize:11}} onClick={() => setEnabledAgents(new Set(AGENTS.map(a => a.id)))}>Enable all</button>
        <button className="btn" style={{fontSize:11}} onClick={() => setAgentParams({}); setOptResults({})}>Reset all params</button>
      </div>

      {families.map(family => (
        <div key={family} style={{marginBottom:24}}>
          <div style={{fontFamily:'var(--mono)',fontSize:10,letterSpacing:'0.14em',color:'var(--ink-3)',textTransform:'uppercase',marginBottom:10,paddingBottom:6,borderBottom:'1px solid var(--line)'}}>{family}</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(290px,1fr))',gap:10}}>
            {AGENTS.filter(a => a.family === family).map(agent => {
              const enabled = !enabledAgents || enabledAgents.has(agent.id);
              const hist = agentHistory?.[agent.id] || [];
              const acc  = hist.length >= 2 ? hist.filter(Boolean).length / hist.length : agent.accuracy;
              const w    = agentWeights?.[agent.id] ?? agent.weight;
              const defs = AGENT_PARAM_DEFS[agent.id] || [];
              const isExp = expanded[agent.id];
              const optRes = optResults[agent.id];
              const busy   = optimizing[agent.id];
              const canOpt = !!AGENT_OPTIMIZE_KEYS[agent.id]?.id;

              return (
                <div key={agent.id} className="card" style={{opacity: enabled ? 1 : 0.42, transition:'opacity 0.2s', padding:14}}>
                  <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <span style={{fontFamily:'var(--mono)',fontSize:15,color:agent.color}}>{agent.glyph}</span>
                        <span style={{fontWeight:500,fontSize:12}}>{agent.name}</span>
                      </div>
                      <div style={{fontSize:10,color:'var(--ink-3)',marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{agent.desc}</div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
                      <span style={{fontFamily:'var(--mono)',fontSize:10,color: acc >= 0.6 ? 'var(--up)' : acc < 0.5 ? 'var(--down)' : 'var(--ink-3)'}}>
                        {(acc*100).toFixed(0)}%
                      </span>
                      <button
                        style={{width:34,height:18,borderRadius:9,background:enabled?'var(--virtual)':'var(--line-2)',position:'relative',transition:'background 0.2s',flexShrink:0,border:'none',cursor:'pointer'}}
                        onClick={() => setEnabledAgents(prev => {
                          const next = new Set(prev || AGENTS.map(a=>a.id));
                          next.has(agent.id) ? next.delete(agent.id) : next.add(agent.id);
                          return next;
                        })}
                      >
                        <span style={{position:'absolute',top:2,left:enabled?18:2,width:14,height:14,borderRadius:7,background:'white',transition:'left 0.2s'}}/>
                      </button>
                    </div>
                  </div>

                  {defs.length > 0 && (
                    <div style={{marginTop:10}}>
                      <button className="mono tiny muted" style={{fontSize:9,letterSpacing:'0.06em',cursor:'pointer'}}
                        onClick={() => setExpanded(e => ({...e, [agent.id]: !isExp}))}>
                        {isExp ? '▾ hide params' : '▸ params'}
                      </button>
                      {isExp && (
                        <div style={{marginTop:8,display:'flex',flexDirection:'column',gap:8}}>
                          {defs.map(def => {
                            const val = gp(agent.id, def.key);
                            const v = val !== undefined ? val : (AGENT_PARAMS_DEFAULT[agent.id]?.[def.key] ?? def.min);
                            return (
                              <div key={def.key}>
                                <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                                  <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--ink-3)'}}>{def.label}</span>
                                  <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--ink-2)'}}>{def.fmt(v)}</span>
                                </div>
                                <input type="range" min={def.min} max={def.max} step={def.step} value={v}
                                  onChange={e => sp(agent.id, def.key, parseFloat(e.target.value))}
                                  style={{width:'100%',accentColor:agent.color}}/>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}

                  <div style={{marginTop:10,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    {canOpt ? (
                      <button className="btn" style={{fontSize:9,padding:'3px 9px',opacity:busy?0.5:1}}
                        onClick={() => !busy && optimize(agent.id)} disabled={busy}>
                        {busy ? '⟳ …' : '⚡ Optimise'}
                      </button>
                    ) : <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--ink-4)'}}>no opt</span>}
                    {optRes && (
                      <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--virtual)'}}>
                        best {AGENT_OPTIMIZE_KEYS[agent.id]?.id}={optRes.bestValue} · {(optRes.bestAccuracy*100).toFixed(0)}% acc
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
};

const App = () => {
  const [mode, setMode] = React.useState(() => {
    const saved = localStorage.getItem('shoal_mode');
    // Migrate old 'VIRTUAL' (no broker) to 'SIMULATED'
    if (saved === 'VIRTUAL') return 'SIMULATED';
    return saved || 'SIMULATED';
  });
  const [route, setRoute] = React.useState(() => localStorage.getItem('shoal_route') || 'dashboard');
  const [showOnboarding, setShowOnboarding] = React.useState(() => !localStorage.getItem('shoal_onboarded'));
  const [running, setRunning] = React.useState(true);
  const [tick, setTick] = React.useState(0);
  const [selectedTrade, setSelectedTrade] = React.useState(null);
  const [pendingMode, setPendingMode] = React.useState(null);
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [editMode, setEditMode] = React.useState(false);
  const [activeSymbol, setActiveSymbol] = React.useState(() => localStorage.getItem('shoal_sym') || 'NVDA');
  const [direction, setDirection] = React.useState(() => localStorage.getItem('shoal_dir') || 'BOTH');
  const [symbolPicker, setSymbolPicker] = React.useState(false);
  const [showReset, setShowReset] = React.useState(false);
  const [tradesResetAt, setTradesResetAt] = React.useState(() => {
    const s = localStorage.getItem('shoal_trades_reset_at');
    return s ? +s : 0;
  });
  // Global trade store — seeded from TRADES (filtered by reset), appended-to by the swarm tick.
  const [trades, setTrades] = React.useState(() => {
    const resetAt = +(localStorage.getItem('shoal_trades_reset_at') || 0);
    return TRADES.filter(t => t.ts >= resetAt);
  });
  const [balance, setBalance] = React.useState(() => {
    const s = localStorage.getItem('shoal_balance');
    return s ? +s : EQUITY.bot[EQUITY.bot.length-1];
  });
  const [pnl, setPnl] = React.useState(() => {
    const s = localStorage.getItem('shoal_pnl');
    return s ? +s : EQUITY.bot[EQUITY.bot.length-1] - EQUITY.bot[0];
  });
  const [alpaca, setAlpaca] = React.useState(() => {
    const saved = localStorage.getItem('shoal_alpaca');
    return saved ? JSON.parse(saved) : { connected: false, balance: 0, account: null, broker: 'Alpaca Markets' };
  });
  const [risk, setRisk] = React.useState({ perTrade: 1.1, maxPos: 6, dailyLoss: 3, confidence: 55, shorts: true, ah: false, maxTradeValue: 5000 });

  // Agent learning state
  const [agentWeights, setAgentWeights] = React.useState(() => {
    const total = AGENTS.reduce((s, a) => s + a.weight, 0);
    const w = {};
    AGENTS.forEach(a => w[a.id] = a.weight / total);
    return w;
  });
  const [agentHistory, setAgentHistory] = React.useState({});
  const [agentAccuracySeries, setAgentAccuracySeries] = React.useState({});
  const [lastSignals, setLastSignals] = React.useState(() => SIGNALS_ALL['NVDA'] || null);
  const [agentParams, setAgentParams] = React.useState({});
  const [enabledAgents, setEnabledAgents] = React.useState(() => new Set(AGENTS.map(a => a.id)));
  const agentWeightsRef  = React.useRef(agentWeights);
  const agentHistoryRef  = React.useRef(agentHistory);
  const enabledAgentsRef = React.useRef(enabledAgents);
  React.useEffect(() => { agentWeightsRef.current  = agentWeights;  }, [agentWeights]);
  React.useEffect(() => { agentHistoryRef.current   = agentHistory;   }, [agentHistory]);
  React.useEffect(() => { enabledAgentsRef.current  = enabledAgents;  }, [enabledAgents]);
  // Keep lastSignals in sync with active symbol and agentParams
  React.useEffect(() => {
    setLastSignals(computeSignals(activeSymbol, PRICE_HISTORY, agentParams) || SIGNALS_ALL[activeSymbol] || null);
  }, [activeSymbol, agentParams]);

  // Watch for newly closed trades → update agent weights + accuracy history + accuracy series
  const prevTradesRef = React.useRef([]);
  React.useEffect(() => {
    const prevIds = new Set(prevTradesRef.current.filter(t => t.pnl != null).map(t => t.id));
    const newlyClosed = trades.filter(t => t.pnl != null && t.votes && !prevIds.has(t.id));
    if (newlyClosed.length > 0) {
      const newHistory = newlyClosed.reduce((acc, t) => updateAgentHistory(acc, t), agentHistoryRef.current);
      setAgentWeights(w => newlyClosed.reduce(updateAgentWeights, w));
      setAgentHistory(newHistory);
      // Append one accuracy data-point per agent for every batch of closes (keeps series lengths in sync)
      setAgentAccuracySeries(series => {
        const next = { ...series };
        for (const a of AGENTS) {
          const hist = newHistory[a.id] || [];
          const acc  = hist.length >= 2 ? hist.filter(Boolean).length / hist.length : a.accuracy;
          next[a.id] = [...(next[a.id] || []), acc];
        }
        return next;
      });
    }
    prevTradesRef.current = trades;
  }, [trades]);

  // Backend availability (null = checking, true = online, false = offline)
  const [backendOk, setBackendOk] = React.useState(null);

  const [marketStatus, setMarketStatus] = React.useState(() => getMarketStatus());
  React.useEffect(() => {
    setMarketStatus(getMarketStatus());
    const id = setInterval(() => setMarketStatus(getMarketStatus()), 30000);
    return () => clearInterval(id);
  }, []);

  // Stable ref so interval callbacks can read latest alpaca without re-subscribing
  const alpacaRef = React.useRef(alpaca);
  React.useEffect(() => { alpacaRef.current = alpaca; }, [alpaca]);

  // Backend health-check — polls every 15 s
  React.useEffect(() => {
    const check = async () => {
      try {
        const r = await fetch(`${BACKEND_URL}/api/health`, { signal: AbortSignal.timeout(2000) });
        setBackendOk(r.ok);
      } catch {
        setBackendOk(false);
      }
    };
    check();
    const hcIvl = setInterval(check, 15000);
    return () => clearInterval(hcIvl);
  }, []);

  // SSE bridge — when Alpaca is connected via the backend, replace simulated data with real fills.
  // Token passed as ?token= because EventSource does not support custom headers.
  const streamRef = React.useRef(null);
  React.useEffect(() => {
    if (!alpaca.connected || !alpaca.token) {
      if (streamRef.current) { streamRef.current.close(); streamRef.current = null; }
      return;
    }
    const es = new EventSource(`${BACKEND_URL}/api/stream?token=${encodeURIComponent(alpaca.token)}`);
    streamRef.current = es;
    es.onmessage = (e) => {
      try {
        const { account, positions, orders, clock, error } = JSON.parse(e.data);
        if (error) return;

        if (clock) {
          setMarketStatus(s => ({
            ...s,
            isOpen: clock.is_open,
            nextOpen: clock.next_open ? new Date(clock.next_open) : s.nextOpen,
            source: 'alpaca',
          }));
        }

        // Real account equity → replace simulated balance
        if (account?.equity) {
          const eq = parseFloat(account.equity);
          if (eq > 0) setBalance(eq);
        }
        if (account?.buying_power) {
          setAlpaca(a => ({ ...a, balance: parseFloat(account.buying_power) }));
        }

        // Real orders → replace trade list (most recent 50)
        if (Array.isArray(orders) && orders.length > 0) {
          const mapped = orders.map(o => ({
            id:     o.id,
            ts:     new Date(o.submitted_at || o.created_at).getTime(),
            exitTs: o.filled_at ? new Date(o.filled_at).getTime() : null,
            sym:    o.symbol,
            side:   o.side === 'buy' ? 'BUY' : 'SELL',
            // Parse first then OR — filled_qty is "0" (truthy string) for unfilled orders
            qty:    parseFloat(o.filled_qty) || parseFloat(o.qty) || 0,
            // filled_avg_price is null for market orders that haven't filled yet
            price:  parseFloat(o.filled_avg_price) || parseFloat(o.limit_price) || 0,
            exit:   o.filled_at && o.filled_avg_price ? parseFloat(o.filled_avg_price) : null,
            conf:   0.75,
            reason: `${o.type || 'market'} · ${o.time_in_force} · ${o.status} via Alpaca`,
            pnl: null, pnlPct: null,
            status: ['filled','partially_filled'].includes(o.status) ? 'OPEN'
                  : ['canceled','expired','replaced','rejected'].includes(o.status) ? 'LOSS' : 'OPEN',
            mode: alpacaRef.current?.env === 'live' ? 'LIVE' : 'VIRTUAL',
            consensus: 12, isNew: false, _real: true,
          }));
          setTrades(mapped.slice(0, 200));
        }

        // Real positions → keep as OPEN entries, merge with closed history
        if (Array.isArray(positions) && positions.length > 0) {
          const realPos = positions.map(p => ({
            id:     'POS-' + p.symbol,
            ts:     Date.now() - 7200000,
            exitTs: null,
            sym:    p.symbol,
            side:   parseFloat(p.qty) >= 0 ? 'BUY' : 'SELL',
            qty:    Math.abs(parseFloat(p.qty)),
            price:  parseFloat(p.avg_entry_price),
            exit:   null,
            conf:   0.75,
            reason: `Live position · ${p.side} · unrealized ${parseFloat(p.unrealized_plpc || 0) >= 0 ? '+' : ''}${(parseFloat(p.unrealized_plpc || 0) * 100).toFixed(2)}%`,
            pnl: null, pnlPct: null,
            status: 'OPEN',
            mode: alpacaRef.current?.env === 'live' ? 'LIVE' : 'VIRTUAL',
            consensus: 12, isNew: false, _real: true,
            // Use Alpaca's real unrealized P&L — keys match what ScreenHistory reads
            _upnl:    parseFloat(p.unrealized_pl  || 0),
            _upnlPct: parseFloat(p.unrealized_plpc || 0),
          }));
          setTrades(prev => {
            const closedHistory = prev.filter(t => t._real && t.status !== 'OPEN');
            return [...realPos, ...closedHistory].slice(0, 200);
          });
          if (account?.portfolio_value) setBalance(parseFloat(account.portfolio_value));
        }
      } catch (_) {}
    };
    es.onerror = () => { streamRef.current = null; };
    return () => { es.close(); streamRef.current = null; };
  }, [alpaca.connected, alpaca.token]);

  React.useEffect(() => { localStorage.setItem('shoal_sym', activeSymbol); }, [activeSymbol]);
  React.useEffect(() => { localStorage.setItem('shoal_dir', direction); }, [direction]);
  React.useEffect(() => { localStorage.setItem('shoal_balance', balance); }, [balance]);
  React.useEffect(() => { localStorage.setItem('shoal_pnl', pnl); }, [pnl]);
  React.useEffect(() => { localStorage.setItem('shoal_trades_reset_at', tradesResetAt); }, [tradesResetAt]);

  React.useEffect(() => {
    const h = (e) => {
      if (e.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)) {
        e.preventDefault(); setSymbolPicker(true);
      }
      if (e.key === 'Escape') { setSymbolPicker(false); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  const resetAccount = (startingBal) => {
    setBalance(startingBal);
    setPnl(0);
    const now = Date.now();
    setTradesResetAt(now);
    setTrades([]);
    setShowReset(false);
  };

  // Global swarm execution — signal-driven trades with real TA, regardless of which screen is mounted.
  React.useEffect(() => {
    if (!running) return;
    const ivl = setInterval(() => {
      // 1) close some open positions stochastically (turn into WIN/LOSS)
      setTrades(prev => {
        return prev.map(t => {
          if (t.status !== 'OPEN') return t;
          if (Math.random() < 0.25) {
            const pnlAmt = (Math.random() - 0.42) * t.qty * t.price * 0.022;
            const exit   = t.price + (pnlAmt / t.qty) * (t.side === 'BUY' ? 1 : -1);
            return { ...t, status: pnlAmt > 0 ? 'WIN' : 'LOSS', pnl: pnlAmt, pnlPct: pnlAmt / (t.qty * t.price), exit, exitTs: Date.now(), isNew: false };
          }
          return t;
        });
      });

      // 2) Scan all tickers for conviction; probabilistic selection weighted by confidence²
      // LIVE = real orders to Alpaca live account; VIRTUAL = paper broker but local fills; SIMULATED = local only
      const alpacaNow = alpacaRef.current;
      const isLiveReal   = mode === 'LIVE'    && !!alpacaNow?.token && alpacaNow?.env === 'live';
      const isBrokerPaper= mode === 'VIRTUAL' && !!alpacaNow?.token && alpacaNow?.env === 'paper';
      if (Math.random() < 0.55) {
        const candidates = [];
        for (const tk of TICKERS) {
          const sigs = SIGNALS_ALL[tk.sym];
          if (!sigs) continue;
          const ens = computeEnsemble(sigs, agentWeightsRef.current, enabledAgentsRef.current);
          // Determine side based on direction constraint (fixes SHORT mode always being empty)
          let side;
          if (direction === 'LONG') side = 'BUY';
          else if (direction === 'SHORT') side = 'SELL';
          else { if (!ens.dir) continue; side = ens.dir; }
          candidates.push({ tk, sigs, ens, side });
        }
        if (!candidates.length) return;

        // Weighted random selection — higher confidence² is more likely but not guaranteed
        const totalScore = candidates.reduce((s, c) => s + c.ens.confidence ** 2, 0);
        let rand = Math.random() * totalScore;
        let chosen = candidates[0];
        for (const c of candidates) { rand -= c.ens.confidence ** 2; if (rand <= 0) { chosen = c; break; } }

        const { tk, sigs, ens: ensemble, side } = chosen;
        const price = tk.last * (1 + (Math.random() - 0.5) * 0.01);
        const maxVal = risk?.maxTradeValue ?? 5000;
        const maxQtyByVal = Math.floor(maxVal / price);
        const qty = Math.max(1, Math.min(maxQtyByVal, Math.round(ensemble.confidence * 70)));

        if (isLiveReal) {
          fetch(`${BACKEND_URL}/api/orders`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + alpacaNow.token },
            body: JSON.stringify({ symbol: tk.sym, qty: String(qty), side: side === 'BUY' ? 'buy' : 'sell', type: 'market', time_in_force: 'day' }),
          }).catch(() => {});
        } else {
          // VIRTUAL (broker paper) and SIMULATED both fill locally so trading works even when market is closed
          setTrades(prev => [{
            id:        'TX-' + Math.floor(11000 + Math.random() * 9999),
            ts:        Date.now(), exitTs: null,
            sym:       tk.sym, side, qty, price, exit: null,
            conf:      ensemble.confidence,
            reason:    buildReason(sigs, ensemble),
            pnl: null, pnlPct: null, status: 'OPEN', mode,
            consensus: ensemble.consensus,
            votes:     ensemble.votes,
            signals:   sigs,
            isNew:     true,
          }, ...prev].slice(0, 200));
        }
      }
    }, 3500);
    return () => clearInterval(ivl);
  }, [running, mode, direction, risk]);

  // Live equity pulse — faster when a directional bias is active.
  // Each tick: small drift + jitter. BOTH = slow & balanced, LONG/SHORT = faster with directional drift.
  React.useEffect(() => {
    if (!running) return;
    const hz = direction === 'BOTH' ? 1400 : 600; // ms between updates
    const driftBias = direction === 'LONG' ? 0.0008 : direction === 'SHORT' ? 0.0007 : 0.0004;
    const vol = direction === 'BOTH' ? 0.0008 : 0.0018;
    const ivl = setInterval(() => {
      // Don't overwrite real balance when SSE is streaming live account data
      if (alpacaRef.current?.token && mode === 'LIVE') return;
      const r = (Math.random() - 0.5) * vol * 2 + driftBias;
      setBalance(b => Math.max(1000, b * (1 + r)));
      setPnl(p => p + (Math.random() - 0.48) * 140 * (direction === 'BOTH' ? 0.6 : 1.4));
    }, hz);
    return () => clearInterval(ivl);
  }, [running, direction]);

  React.useEffect(() => { localStorage.setItem('shoal_mode', mode); }, [mode]);
  React.useEffect(() => { localStorage.setItem('shoal_route', route); }, [route]);
  React.useEffect(() => { localStorage.setItem('shoal_alpaca', JSON.stringify(alpaca)); }, [alpaca]);

  // global tick for animations
  React.useEffect(() => {
    const ivl = setInterval(() => setTick(t => t + 1), 800);
    return () => clearInterval(ivl);
  }, []);

  // edit mode protocol
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setEditMode(true);
      if (e.data?.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({type:'__edit_mode_available'}, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const handleTradeClick = (t) => { setSelectedTrade(t); setRoute('trade'); };

  const requestMode = (m) => {
    if (m === mode) return;
    setPendingMode(m);
  };
  const confirmMode = () => {
    setMode(pendingMode);
    setPendingMode(null);
  };

  if (showOnboarding) {
    return <ScreenOnboarding onDone={() => { localStorage.setItem('shoal_onboarded', '1'); setShowOnboarding(false); }}/>;
  }

  const ctx = { activeSymbol, setActiveSymbol, direction, balance, pnl, tradesResetAt, trades, agentWeights, agentHistory, agentAccuracySeries, lastSignals };
  const screens = {
    dashboard:   <ScreenDashboard mode={mode} tick={tick} onTradeClick={handleTradeClick} onMode={requestMode} ctx={ctx}/>,
    activity:    <ScreenActivity mode={mode} tick={tick} onTradeClick={handleTradeClick} running={running} ctx={ctx}/>,
    history:     <ScreenHistory mode={mode} tick={tick} onTradeClick={handleTradeClick} ctx={ctx}/>,
    learning:    <ScreenLearning mode={mode} ctx={ctx}/>,
    trade:       <ScreenTrade trade={selectedTrade || TRADES[0]} onBack={()=>setRoute('dashboard')} mode={mode} ctx={ctx}/>,
    backtest:    <ScreenBacktest mode={mode} ctx={ctx}/>,
    market:      <ScreenMarket tick={tick} mode={mode} ctx={ctx}/>,
    agentperf:   <ScreenAgentPerf mode={mode} ctx={ctx}/>,
    pnltrend:    <ScreenPnlTrend mode={mode} ctx={ctx}/>,
    agentconfig: <ScreenAgentConfig agentParams={agentParams} setAgentParams={setAgentParams} enabledAgents={enabledAgents} setEnabledAgents={setEnabledAgents} agentWeights={agentWeights} agentHistory={agentHistory}/>,
    settings:    <ScreenSettings mode={mode} alpaca={alpaca} setAlpaca={setAlpaca} risk={risk} setRisk={setRisk} direction={direction} setDirection={setDirection} onReset={()=>setShowReset(true)} backendOk={backendOk}/>,
  };

  const navItem = NAV.find(n => n.id === route);
  const navItemLabel = navItem ? navItem.label : 'Dashboard';

  return (
    <div className={'shell ' + (mode === 'LIVE' ? 'live' : '')}>
      <aside className="sidebar">
        <div className="brand">
          <div className="brand-row">
            <span className="brand-mark"></span>
            <span className="brand-name">Shoal</span>
          </div>
          <div className="brand-sub">Adaptive · v0.4.2</div>
        </div>

        <div className="mode-pill" onClick={()=>requestMode(mode==='SIMULATED'?'VIRTUAL':mode==='VIRTUAL'?'LIVE':'SIMULATED')}>
          <div className="mode-pill-row">
            <span className="mode-pill-label">Trading mode</span>
            <span className="mono tiny muted">↻ cycle</span>
          </div>
          <div style={{marginTop:6}}>
            <span className="mode-dot"></span>
            <span className="mode-pill-value">{mode==='LIVE'?'LIVE TRADING':mode==='VIRTUAL'?'VIRTUAL · BROKER':'SIMULATED · LOCAL'}</span>
          </div>
        </div>

        <div className="nav-section">
          <div className="nav-label">Workspace</div>
          {NAV.slice(0, 7).map(n => (
            <div key={n.id} className={'nav-item ' + (route===n.id?'active':'')} onClick={()=>setRoute(n.id)}>
              <span className="nav-icon"><Icon name={n.icon}/></span>
              <span>{n.label}</span>
            </div>
          ))}
        </div>

        <div className="nav-section">
          <div className="nav-label">System</div>
          {NAV.slice(7).map(n => (
            <div key={n.id} className={'nav-item ' + (route===n.id?'active':'')} onClick={()=>setRoute(n.id)}>
              <span className="nav-icon"><Icon name={n.icon}/></span>
              <span>{n.label}</span>
              {n.id === 'settings' && !alpaca.connected && <span className="nav-num warn" style={{color:'var(--warn)'}}>!</span>}
            </div>
          ))}
        </div>

        <div className="sidebar-foot">
          <div className="row"><span>Engine</span><span className="ok">● online</span></div>
          <div className="row"><span>Backend</span><span className={backendOk===true?'ok':backendOk===false?'dn':'muted'}>{backendOk===true?'● online':backendOk===false?'○ offline':'○ …'}</span></div>
          <div className="row"><span>Broker</span><span className={alpaca.connected ? 'ok' : ''}>{alpaca.connected ? '● Alpaca' + (alpaca.token ? ' ⟳' : '') : '○ none'}</span></div>
          <div className="row"><span>Market</span><span className={marketStatus.isOpen ? 'ok' : ''} style={!marketStatus.isOpen ? {color:'var(--warn)'} : {}}>{marketStatus.isOpen ? '● open' : '○ closed'}</span></div>
          <div className="row"><span>Latency</span><span>{42 + (tick % 8)}ms</span></div>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          <div className="crumb">SHOAL / <b>{navItemLabel}</b></div>
          <button className="btn" style={{marginLeft:8,padding:'6px 12px',display:'flex',alignItems:'center',gap:10}} onClick={()=>setSymbolPicker(true)} title="Switch symbol ( / )">
            <span className="mono" style={{color:'var(--ink)',fontWeight:500,letterSpacing:'0.02em'}}>◎ {activeSymbol}</span>
            {!marketStatus.isOpen && <span style={{fontSize:9,letterSpacing:'0.12em',padding:'2px 6px',borderRadius:3,background:'var(--line-2)',color:'var(--warn)',fontFamily:'var(--mono)',fontWeight:500}}>CLOSED</span>}
            <span className="mono tiny muted" style={{letterSpacing:'0.1em'}}>⌘/</span>
          </button>
          <div className="tweak-opts" style={{marginLeft:6}}>
            {['LONG','SHORT','BOTH'].map(d => (
              <div key={d} className={'tweak-opt '+(direction===d?'on':'')} onClick={()=>setDirection(d)}
                title={d==='LONG'?'Buy-only · no shorting':d==='SHORT'?'Short-only · contrarian':'Both directions'}>
                {d==='LONG'?'↑ LONG':d==='SHORT'?'↓ SHORT':'⇅ BOTH'}
              </div>
            ))}
          </div>
          <div className="topbar-spacer"></div>
          {tweaks.animated && <TickerStrip tickers={TICKERS} tick={tick}/>}
          <div className={'bot-status ' + (running ? '' : 'paused')}>
            <span className="led"></span>
            <span>{running ? 'BOT RUNNING' : 'BOT PAUSED'}</span>
            <button onClick={()=>setRunning(!running)}>{running ? 'PAUSE' : 'RESUME'}</button>
          </div>
        </div>

        {screens[route]}
      </main>

      {pendingMode && <ModeSwitchModal targetMode={pendingMode} alpaca={alpaca} onConfirm={confirmMode} onCancel={()=>setPendingMode(null)}/>}
      {symbolPicker && <SymbolPicker onPick={(s)=>{setActiveSymbol(s); setSymbolPicker(false);}} onClose={()=>setSymbolPicker(false)} marketStatus={marketStatus}/>}
      {showReset && <ResetModal onConfirm={resetAccount} onCancel={()=>setShowReset(false)}/>}
      {editMode && <TweaksPanel tweaks={tweaks} setTweaks={(nt) => {
        setTweaks(nt);
        window.parent.postMessage({type:'__edit_mode_set_keys', edits: nt}, '*');
      }}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

</script>

</body>
</html>
