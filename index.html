                      <span>{a.name}</span>
                    </div>
                  </td>
                  <td><span className={'pill ' + (a.dir==='BUY'?'buy':a.dir==='SELL'?'sell':'hold')}>{a.dir}</span></td>
                  <td className="mono">{(a.conf*100).toFixed(0)}%</td>
                  <td className="mono" style={{textAlign:'right',color:'var(--ink)'}}>{(a.conf*a.weight*100).toFixed(2)}</td>
                </tr>
              ))}
            </tbody>
            <tfoot>
              <tr style={{borderTop:'1px solid var(--line-2)'}}>
                <td colSpan="3" className="mono tiny muted" style={{paddingTop:14}}>NET CONSENSUS</td>
                <td className="mono" style={{textAlign:'right',color:t.side==='BUY'?'var(--up)':'var(--down)',paddingTop:14,fontSize:15}}>{(t.conf*100).toFixed(0)}% {t.side}</td>
              </tr>
            </tfoot>
          </table>
        </div>
      </div>

      <div className="card">
        <div className="card-head"><div className="card-title">Order detail</div></div>
        <div className="dialog-list" style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'4px 30px'}}>
          {[
            ['Order ID', t.id],
            ['Mode', t.mode || mode],
            ['Symbol', t.sym],
            ['Side', t.side],
            ['Quantity', t.qty + ' shares'],
            ['Avg fill', '$' + fmtNum(t.price)],
            ['Notional', fmtMoney(t.qty * t.price)],
            ['Routed via', 'Alpaca Markets · IEX'],
            ['Status', t.status],
            ['Stop loss', '$' + fmtNum(t.price * (t.side==='BUY' ? 0.984 : 1.016))],
            ['Target', '$' + fmtNum(t.price * (t.side==='BUY' ? 1.032 : 0.968))],
            ['Hold horizon', '1–3 sessions'],
          ].map(([l, v]) => (
            <div key={l} className="dialog-row">
              <span className="l">{l}</span>
              <span className="v">{v}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

window.ScreenTrade = ScreenTrade;

</script>
<script type="text/babel" data-presets="react">
// Plain-English list of what Autopilot changed and why
const AutopilotLog = ({ log = [], limit = 8, empty = 'No changes yet.' }) => (
  log.length === 0
    ? <div className="mono tiny muted" style={{padding:'6px 0'}}>{empty}</div>
    : <div style={{display:'flex',flexDirection:'column',gap:8}}>
        {log.slice(0, limit).map((e, k) => (
          <div key={e.ts + ':' + k} style={{display:'grid',gridTemplateColumns:'86px 64px 1fr',gap:10,alignItems:'baseline'}}>
            <span className="mono tiny muted">{e.when}</span>
            <span className="mono tiny" style={{color: e.kind === 'weights' ? 'var(--info)' : e.kind === 'param' ? 'var(--virtual)' : 'var(--ink-3)', letterSpacing:'0.08em'}}>{e.kind === 'weights' ? 'WEIGHTS' : e.kind === 'param' ? 'SETTING' : 'INFO'}</span>
            <span className="tiny" style={{color:'var(--ink-2)',lineHeight:1.45}}>{e.text}</span>
          </div>
        ))}
      </div>
);

// Backtest screen — walk-forward simulation via SS.runBacktest

// Strategy definitions: which agents are active and how they're weighted
const STRAT_ENABLED = {
  'Momentum only':    new Set(['momo', 'brkt', 'earn', 'fund', 'corr', 'soc', 'news', 'flow']),
  'Mean revert only': new Set(['mean', 'vwap', 'pair', 'skew', 'mm']),
};

// Walk-forward backtest on the broker's daily bars, using the current style:
//  · Stay invested — hold every stock, sell on a weakness call, buy back when it clears (SS.runInvested)
//  · Trade both ways — ATR stops and targets, entries at the next open (SS.runBacktest)
// With Autopilot on, weights are re-proposed every 5 days through the same watch-it-first gate as live.
function runBacktestSim(period, strategy, universe, opts = {}) {
  const periodDays = { '3M': 63, '6M': 126, '1Y': 252, '3Y': 756 }[period] || 252;
  const capital = 100000;
  const style = opts.style === 'both' ? 'both' : opts.style === 'tilt' ? 'tilt' : 'invested';
  const enabledSet = STRAT_ENABLED[strategy] || null;
  let weights;
  if (strategy === 'Equal weight') weights = Object.fromEntries(AGENTS.map(a => [a.id, 1 / AGENTS.length]));
  else if (enabledSet) weights = Object.fromEntries(AGENTS.map(a => [a.id, enabledSet.has(a.id) ? 1 / enabledSet.size : 0]));
  else weights = defaultWeightsFor(style);
  const end = universe.L - 1;
  const start = Math.max(130, end - periodDays);
  const book = SS.createScoreBook(universe, opts.params);
  const costs = opts.costBps != null ? { costBps: opts.costBps } : {};
  // Autopilot: the combination model (walk-forward, gated) — ranks for Rank & tilt, weights for the others
  const ms = opts.autopilot && !enabledSet && strategy !== 'Equal weight' ? SS.createModelScorer(universe, book.signalsAt) : null;
  let weightsAt = null;
  if (ms && style !== 'tilt') {
    weightsAt = (g) => { const s0 = universe.syms[0]; ms.scoreAt(s0, g - universe.off[s0]); return weightsFromModel(ms.state.model) || weights; };
  }
  const r = style === 'tilt'
    ? SS.runTilt(universe, { start, end, capital, topK: opts.topK, investFraction: opts.investFraction ?? 0.9, scoreAt: ms ? ms.scoreAt : undefined, params: opts.params, ...costs })
    : style === 'invested'
    ? SS.runInvested(universe, { start, end, capital, weights, weightsAt, signalsAt: book.signalsAt,
        minConf: (opts.confidence ?? 55) / 100, investFraction: opts.investFraction ?? 0.9, dailyLoss: opts.dailyLoss, ...costs })
    : SS.runBacktest(universe, {
        start, end, capital, weights, weightsAt, enabled: enabledSet, signalsAt: book.signalsAt,
        minConf: (opts.confidence ?? 55) / 100, minConsensus: 1,
        maxPos: opts.maxPos ?? 25, riskPct: opts.perTrade ?? 1, maxTradePct: opts.maxTradePct ?? 5, atrStop: opts.atrStop ?? 2, atrTarget: opts.atrTarget ?? 3,
        maxHold: Math.max(1, Math.round((opts.maxHoldHours ?? 48) / 6.5)),
        regimeAware: !!opts.regimeWeights, corrAware: !!opts.corrPenalty, ...costs,
      });
  const monthlyRets = Array.from({ length: 12 }, (_, m) => {
    const si = Math.floor(m * r.curve.length / 12);
    const ei = Math.min(r.curve.length - 1, Math.floor((m + 1) * r.curve.length / 12) - 1);
    return r.curve[si] > 0 ? (r.curve[ei] - r.curve[si]) / r.curve[si] : 0;
  });
  return {
    bot: r.curve, bench: r.bench, finalEq: r.finalEq,
    tradeCount: r.tradeCount, winRate: r.winRate, maxDD: r.maxDD, sharpe: r.sharpe, monthlyRets,
    avgTradePct: r.avgTradePct, invested: r.invested, style, turnover: r.turnover,
  };
}

// ── Optimiser ─────────────────────────────────────────────────────────────────────────────────────────
// The app's current settings as an optimiser config (see SS.optimiseSettings)
const configFromSettings = (risk, frozen) => ({
  style: risk.style === 'both' ? 'both' : risk.style === 'tilt' ? 'tilt' : 'invested',
  topK: risk.topK || 12, score: risk.autopilot ? 'model' : 'trend',
  agents: frozen ? frozen.cfg.agents : 'default',
  minConf: (risk.confidence ?? 55) / 100,
  investFraction: risk.investFraction ?? 0.9,
  atrStop: risk.atrStop ?? 2, atrTarget: risk.atrTarget ?? 3,
  maxHold: Math.max(1, Math.round((risk.maxHoldHours ?? 48) / 6.5)),
  param: frozen ? frozen.cfg.param : null,
});
const describeConfig = (cfg) => {
  if (cfg.style === 'tilt') return `Rank & tilt · top ${cfg.topK} by ${cfg.score === 'model' ? 'model' : 'trend'} score · ${Math.round(cfg.investFraction * 100)}% invested · re-ranked monthly`;
  const who = cfg.agents === 'default' ? (cfg.style === 'both' ? 'the whole swarm' : 'Trend Persistence (default)')
    : cfg.agents === 'swarm' ? 'the whole swarm' : (AGENTS.find(a => a.id === cfg.agents)?.name || cfg.agents);
  const how = cfg.style === 'both'
    ? `stop ${cfg.atrStop}× ATR, target ${cfg.atrTarget}× ATR, max ${cfg.maxHold} days`
    : `${Math.round(cfg.investFraction * 100)}% invested`;
  const tuned = cfg.param ? ` · ${AGENTS.find(a => a.id === cfg.param.agent)?.name} ${cfg.param.key} = ${cfg.param.value}` : '';
  return `${cfg.style === 'both' ? 'Trade both ways' : 'Stay invested'} · decided by ${who} · confidence ≥ ${Math.round(cfg.minConf * 100)}% · ${how}${tuned}`;
};
const pct1 = (x) => (x == null || !Number.isFinite(x) ? '—' : `${x >= 0 ? '+' : ''}${(x * 100).toFixed(1)}%`);
const pts = (x) => `${x >= 0 ? '+' : ''}${(x * 100).toFixed(1)} pts`;

// Where "the past N days" ends: the day being replayed in SIMULATED (before the replay starts, the day
// before its first day), otherwise the latest broker bar.
const optimiserContext = (ctx) => {
  const sim = ctx?.mode === 'SIMULATED';
  const U = sim ? ctx?.replayUniverse : ctx?.liveUniverse;
  if (!U) return { U: null };
  const live = sim && ctx?.replayInfo && ctx.replayInfo.g != null && ctx.replayInfo.key === replayKey(U);
  const asOf = sim ? (live ? ctx.replayInfo.g : replayStartFor(U) - 1) : U.L - 1;
  return { U, asOf, srcKey: replayKey(U), sim };
};

// ── Intraday lab (Phase 1): do the intraday agents predict the next 15–60 minutes well enough to beat costs? ──
// Bars and the last result are kept for the session, so leaving the screen doesn't lose them.
const INTRADAY_CACHE = { key: null, bars: null, P: null, result: null, meta: null };
const ScreenIntraday = ({ alpaca }) => {
  const IL = window.ShoalIntraday;
  const isAlpaca = !!alpaca?.connected && (alpaca.brokerId || 'alpaca') === 'alpaca' && !!alpaca.token;
  const [source, setSource] = React.useState(() => INTRADAY_CACHE.meta?.source || (isAlpaca ? 'alpaca' : 'fictional'));
  const [tdays, setTdays] = React.useState(() => INTRADAY_CACHE.meta?.tdays || 40);
  const [H, setH] = React.useState(() => INTRADAY_CACHE.meta?.H || 6);
  const [cost, setCost] = React.useState(() => INTRADAY_CACHE.meta?.cost ?? 5);
  const [shorts, setShorts] = React.useState(() => INTRADAY_CACHE.meta?.shorts ?? true);
  const [busy, setBusy] = React.useState(null);
  const [error, setError] = React.useState(null);
  const [result, setResult] = React.useState(() => INTRADAY_CACHE.result);
  const symbols = [...TICKERS.slice(0, INTRADAY_MAX_SYMBOLS).map(t => t.sym), 'SPY'];

  const run = async () => {
    setError(null);
    try {
      const key = `${source}:${tdays}`;
      let P = INTRADAY_CACHE.key === key ? INTRADAY_CACHE.P : null;
      if (!P) {
        let bars;
        if (source === 'alpaca') {
          if (!isAlpaca) throw new Error('Connect an Alpaca account in Settings first (IG has no intraday history allowance to spare).');
          setBusy(`Loading ${tdays} days of 5-minute bars for ${symbols.length} symbols from Alpaca…`);
          const r = await fetch(`${BACKEND_URL}/api/bars?symbols=${symbols.join(',')}&timeframe=5Min&days=${Math.ceil(tdays * 1.45) + 3}`,
            { headers: { Authorization: 'Bearer ' + alpaca.token }, signal: AbortSignal.timeout(280000) });
          const body = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(body.message || body.error || `Alpaca returned HTTP ${r.status}`);
          bars = body.bars || {};
        } else {
          setBusy('Generating a fictional 5-minute market…');
          await new Promise(res => setTimeout(res, 30));
          bars = IL.synthIntraday({ syms: TICKERS.slice(0, 12).map(t => t.sym), days: tdays, seed: 21 });
        }
        P = IL.prepare(bars);
        if (P.dates.length > tdays) { // keep the most recent trading days
          const keep = new Set(P.dates.slice(-tdays));
          for (const s of P.syms) P.S[s] = P.S[s].filter(D => keep.has(D.date));
          P.dates = P.dates.filter(d => keep.has(d));
        }
        if (!P.syms.length || P.dates.length < 15) throw new Error(`Only ${P.dates.length} full trading days came back; need at least 15.`);
        Object.assign(INTRADAY_CACHE, { key, P, result: null });
      }
      setBusy(`Scoring ${P.syms.length} symbols × ${P.dates.length} days with ${IL.AGENTS.length} agents, then testing on the later days…`);
      await new Promise(res => setTimeout(res, 30));
      const R = IL.evaluate(P, { H, costBps: cost, shorts });
      R.source = source;
      INTRADAY_CACHE.result = R; INTRADAY_CACHE.meta = { source, tdays, H, cost, shorts };
      setResult(R);
    } catch (err) { setError(err.message || String(err)); }
    setBusy(null);
  };

  const bp = (x, d = 1) => (Number.isFinite(x) ? `${x >= 0 ? '+' : ''}${x.toFixed(d)}bp` : '—');
  const ic = (s) => (Number.isFinite(s.ic) && s.days ? <span>{s.ic.toFixed(3)} <span className="muted">t {s.icT.toFixed(1)}</span></span> : <span className="muted">—</span>);
  const statusOf = (a) => {
    const tr = a.train, te = a.test;
    if (te.icT >= 2 && tr.icT >= 1) return { t: 'Predicts', c: 'var(--up)' };
    if (te.icT <= -2 && tr.icT <= -1) return { t: 'Predicts in reverse', c: 'var(--warn)' };
    return { t: 'No reliable signal', c: 'var(--ink-4)' };
  };
  const vColor = { go: 'var(--up)', borderline: 'var(--warn)', nogo: 'var(--down)', insufficient: 'var(--ink-3)' };
  const R = result;
  const pairs = R ? IL.AGENTS.flatMap((a, i) => IL.AGENTS.slice(i + 1).map((b, j) => ({ a: a.name, b: b.name, c: R.corr[i][i + 1 + j] }))).filter(x => Number.isFinite(x.c)).sort((x, y) => Math.abs(y.c) - Math.abs(x.c)) : [];
  const avgAbs = pairs.length ? pairs.reduce((s, x) => s + Math.abs(x.c), 0) / pairs.length : 0;
  const maxImpact = R?.combined ? Math.max(1e-9, ...R.combined.weights.map(w => w.impactBp)) : 1;

  return (
    <div className="page" data-screen-label="05c Intraday lab">
      <div className="page-head">
        <div className="page-eyebrow">Intraday lab · Phase 1 · go / no-go</div>
        <h1 className="page-title">Can the agents call the next <em>{H * 5} minutes</em> well enough to pay for trading?</h1>
        <p className="page-sub">Eleven agents score every stock at the close of every 5-minute bar, using only what was known then. The earlier days fit how to combine them; the later days, which the fit never saw, decide: does following them make money after costs? No orders are placed here.</p>
      </div>

      <div className="grid-2" style={{marginBottom:16}}>
        <div className="card">
          <div className="card-head"><div className="card-title">Run the test</div><div className="card-meta">{source === 'alpaca' ? 'Alpaca 5-minute bars (IEX feed)' : 'fictional market'}</div></div>
          <div className="field">
            <div className="field-label" style={{marginBottom:8}}>Data</div>
            <div className="tweak-opts">
              <div className={'tweak-opt ' + (source === 'alpaca' ? 'on' : '')} onClick={() => setSource('alpaca')}>Alpaca history</div>
              <div className={'tweak-opt ' + (source === 'fictional' ? 'on' : '')} onClick={() => setSource('fictional')}>Fictional (demo)</div>
            </div>
            <div className="mono tiny muted" style={{marginTop:6}}>{source === 'alpaca'
              ? (isAlpaca ? `${symbols.length} symbols: the first ${symbols.length - 1} of your ${TICKERS.length} watched stocks (5-minute history is large) plus SPY for the market.` : 'Needs an Alpaca connection (Settings).')
              : 'Random prices with no pattern: shows how the lab works and should come out NO-GO.'}</div>
          </div>
          <div className="field">
            <div className="field-label" style={{marginBottom:8}}>Trading days of history</div>
            <div className="tweak-opts">{[20, 40, 60].map(d => <div key={d} className={'tweak-opt ' + (tdays === d ? 'on' : '')} onClick={() => setTdays(d)}>{d}</div>)}</div>
            <div className="mono tiny muted" style={{marginTop:6}}>The first 60% fit the model; the last 40% test it. More days, firmer verdict.</div>
          </div>
          <div className="field">
            <div className="field-label" style={{marginBottom:8}}>Predicting the next</div>
            <div className="tweak-opts">{[[3, '15 min'], [6, '30 min'], [12, '60 min']].map(([h, l]) => <div key={h} className={'tweak-opt ' + (H === h ? 'on' : '')} onClick={() => setH(h)}>{l}</div>)}</div>
          </div>
          <div className="field">
            <div className="field-label" style={{marginBottom:8}}>Cost per side <span className="muted">(spread + slippage)</span></div>
            <div className="tweak-opts">{[2, 5, 10].map(c => <div key={c} className={'tweak-opt ' + (cost === c ? 'on' : '')} onClick={() => setCost(c)}>{c}bp</div>)}</div>
            <div className="mono tiny muted" style={{marginTop:6}}>Each round trip pays {cost * 2}bp ({(cost * 2 / 100).toFixed(2)}%). Alpaca charges no commission; this is the spread and slippage.</div>
          </div>
          <div className="dialog-row" style={{marginBottom:12}}><span className="l">Allow short trades</span><button className={'tweak-opt ' + (shorts ? 'on' : '')} onClick={() => setShorts(!shorts)}>{shorts ? 'ON' : 'OFF'}</button></div>
          <button className="btn primary" style={{width:'100%'}} disabled={!!busy} onClick={run}>{busy ? 'RUNNING…' : 'RUN THE TEST'}</button>
          {busy && <div className="mono tiny muted" style={{marginTop:8}}>{busy}</div>}
          {error && <div className="tiny" style={{color:'var(--down)',marginTop:10}}>{error}</div>}
        </div>

        <div className="card">
          <div className="card-head"><div className="card-title">How to read it</div></div>
          <div className="tiny" style={{color:'var(--ink-2)',lineHeight:1.6}}>
            <p style={{margin:'0 0 8px'}}><b>Predictive power</b> (information coefficient, IC): how well an agent's score lines up with the move that followed. 0 is none; 0.02–0.05 is typical of anything real intraday. The <b>t</b> beside it is how consistent that was across days: about 2 or more is unlikely to be luck.</p>
            <p style={{margin:'0 0 8px'}}><b>After costs</b>: the average result of following an agent's strong calls, minus the round-trip cost. Most agents land near minus the cost: they don't predict.</p>
            <p style={{margin:'0 0 8px'}}><b>Combined</b>: all agents together, weighted by how much each actually helped on the earlier days. The bars show each agent's say in the decision.</p>
            <p style={{margin:0}}><b>GO</b> needs the combined agents to make money per trade on unseen days after costs, consistently (daily t ≥ 2), with at least one agent predicting reliably on its own.</p>
          </div>
        </div>
      </div>

      {R && (<>
        <div className="card" style={{marginBottom:16,borderColor:vColor[R.verdict.level]}}>
          <div className="mono tiny" style={{color:vColor[R.verdict.level],letterSpacing:'0.12em',marginBottom:4}}>VERDICT · {R.source === 'alpaca' ? 'ALPACA HISTORY' : 'FICTIONAL MARKET'} · NEXT {R.minutes} MIN · {R.costBps}BP PER SIDE</div>
          <div style={{color:'var(--ink-1)',fontSize:14,lineHeight:1.5}}>{R.verdict.text}</div>
          <div className="mono tiny muted" style={{marginTop:6}}>{R.symbols.length} stocks · fitted on {R.from} → {R.testFromDate} ({R.trainDays} days) · tested on {R.testDays} later days to {R.to} · {R.rows.toLocaleString()} bar samples</div>
        </div>

        {R.openClose && R.openClose.enough && (
          <div className="card" style={{marginBottom:16,borderColor: R.openClose.verdict.level === 'go' ? 'var(--up)' : 'var(--line-2)'}}>
            <div className="card-head"><div className="card-title">Market open → close · {R.openClose.sym}</div><div className="card-meta">{R.openClose.n} days · {R.openClose.from} → {R.openClose.to} · nothing fitted</div></div>
            <div className="tiny" style={{color:'var(--ink-2)',marginBottom:10}}>A published effect: the market's first half hour (yesterday's close → 10:00) points the way of its last half hour (15:30 → 16:00). The rule is fixed in advance, so every day counts as a test: at 15:30 trade {R.openClose.sym} in the direction of the first half hour and close at 16:00.</div>
            <div style={{color:'var(--ink-1)',marginBottom:10}}>{R.openClose.verdict.text}</div>
            <table className="tbl">
              <thead><tr><th>Rule</th><th style={{textAlign:'right'}}>Days traded</th><th style={{textAlign:'right'}}>Right way</th><th style={{textAlign:'right'}}>Before costs</th><th style={{textAlign:'right'}}>After costs</th><th style={{textAlign:'right'}}>Total</th><th style={{textAlign:'right'}}>t</th></tr></thead>
              <tbody>{[['First half hour', R.openClose.simple], ['… only when 15:00–15:30 agrees', R.openClose.both]].map(([l, x]) => (
                <tr key={l}><td>{l}</td><td className="mono" style={{textAlign:'right'}}>{x.trades}</td><td className="mono" style={{textAlign:'right'}}>{(x.hit * 100).toFixed(0)}%</td>
                  <td className="mono" style={{textAlign:'right'}}>{bp(x.grossBp)}</td><td className="mono" style={{textAlign:'right',color: x.netBp > 0 ? 'var(--up)' : 'var(--down)'}}>{bp(x.netBp)}</td>
                  <td className="mono" style={{textAlign:'right'}}>{pct1(x.total)}</td><td className="mono" style={{textAlign:'right'}}>{x.t.toFixed(1)}</td></tr>))}</tbody>
            </table>
            <div className="mono tiny muted" style={{marginTop:8}}>Correlation of the first and last half hours: {R.openClose.corr.toFixed(3)} (t {R.openClose.corrT.toFixed(1)}). One trade a day at most, so {R.openClose.n} days is a small sample: use 60 days, and treat a GO as a hypothesis to confirm on later days.</div>
          </div>
        )}

        <div className="card" style={{marginBottom:16}}>
          <div className="card-head"><div className="card-title">Each agent on its own</div><div className="card-meta">strong calls = score ≥ {R.thr} either way</div></div>
          <table className="tbl">
            <thead><tr><th>Agent</th><th style={{textAlign:'right'}}>IC · earlier days</th><th style={{textAlign:'right'}}>IC · unseen days</th><th style={{textAlign:'right'}}>Strong calls</th><th style={{textAlign:'right'}}>Before costs</th><th style={{textAlign:'right'}}>After costs</th><th>Verdict</th></tr></thead>
            <tbody>{R.agents.map(a => { const st = statusOf(a); return (
              <tr key={a.id}>
                <td><b>{a.name}</b><div className="mono tiny muted">{a.desc}</div></td>
                <td className="mono" style={{textAlign:'right'}}>{ic(a.train)}</td>
                <td className="mono" style={{textAlign:'right'}}>{ic(a.test)}</td>
                <td className="mono" style={{textAlign:'right'}}>{a.test.signals.toLocaleString()}</td>
                <td className="mono" style={{textAlign:'right'}}>{a.test.signals ? bp(a.test.grossBp) : '—'}</td>
                <td className="mono" style={{textAlign:'right',color: a.test.netBp > 0 ? 'var(--up)' : 'var(--down)'}}>{a.test.signals ? bp(a.test.netBp) : '—'}</td>
                <td><span className="mono tiny" style={{color:st.c}}>{st.t}</span></td>
              </tr>); })}</tbody>
          </table>
        </div>

        {R.combined && (
          <div className="grid-2" style={{marginBottom:16}}>
            <div className="card">
              <div className="card-head"><div className="card-title">Working together · each agent's say</div><div className="card-meta">IC on unseen days {R.combined.ic.toFixed(3)} · t {R.combined.icT.toFixed(1)}</div></div>
              {R.combined.weights.slice().sort((a, b) => b.impactBp - a.impactBp).map(w => (
                <div key={w.id} style={{display:'grid',gridTemplateColumns:'140px 1fr 72px',gap:8,alignItems:'center',fontSize:11,marginBottom:4}}>
                  <span>{w.name}</span>
                  <div style={{height:8,background:'var(--line-2)',borderRadius:2}}><div style={{height:8,width:`${(w.impactBp / maxImpact) * 100}%`,background: w.bpPerUnit >= 0 ? 'var(--up)' : 'var(--warn)',borderRadius:2}}></div></div>
                  <span className="mono" style={{textAlign:'right'}}>{w.impactBp.toFixed(2)}bp</span>
                </div>))}
              <div className="mono tiny muted" style={{marginTop:8}}>Bar length: how far a typical score from that agent moves the expected {R.minutes}-minute return. Green: followed as designed; amber: the fit learned to use it the other way round. Direction calls right {(R.combined.hit * 100).toFixed(1)}% of the time (50% is a coin toss).</div>
            </div>
            <div className="card">
              <div className="card-head"><div className="card-title">Confidence vs what happened</div><div className="card-meta">unseen days</div></div>
              <table className="tbl">
                <thead><tr><th>Confidence of a rise</th><th style={{textAlign:'right'}}>Bars</th><th style={{textAlign:'right'}}>Actually rose</th><th style={{textAlign:'right'}}>Avg move</th></tr></thead>
                <tbody>{R.calibration.map(c => (
                  <tr key={c.range}><td className="mono">{c.range}</td><td className="mono" style={{textAlign:'right'}}>{c.n.toLocaleString()}</td><td className="mono" style={{textAlign:'right'}}>{c.n ? `${(c.upRate * 100).toFixed(1)}%` : '—'}</td><td className="mono" style={{textAlign:'right'}}>{c.n ? bp(c.avgBp) : '—'}</td></tr>))}</tbody>
              </table>
              <div className="mono tiny muted" style={{marginTop:8}}>If confidence means anything, the "actually rose" column climbs as confidence does.</div>
            </div>
          </div>
        )}

        {R.backtest && (
          <div className="card" style={{marginBottom:16}}>
            <div className="card-head"><div className="card-title">Trading it on the unseen days</div><div className="card-meta">enter at the next bar's open, exit {R.minutes} min later or at the close; flat overnight</div></div>
            <div style={{display:'flex',gap:28,flexWrap:'wrap',marginBottom:12}}>
              {[['Trades', R.backtest.trades.toLocaleString()], ['Per day', R.backtest.perDay.toFixed(1)], ['Won', `${(R.backtest.winRate * 100).toFixed(0)}%`], ['Per trade after costs', bp(R.backtest.avgNetBp)],
                ['Total', pct1(R.backtest.totalReturn)], ['Worst drop', pct1(R.backtest.maxDD)], ['Daily t', R.backtest.dailyT.toFixed(1)], ['Holding the stocks all day', pct1(R.backtest.holdReturn)]].map(([k, v]) => (
                <div key={k}><div className="mono tiny muted" style={{letterSpacing:'0.08em'}}>{k.toUpperCase()}</div><div className="mono" style={{fontSize:16}}>{v}</div></div>))}
            </div>
            <div className="mono tiny muted">Trades when the combined confidence of a move is ≥ 55% and the expected move beats the {R.costBps * 2}bp round-trip cost{R.backtest.shorts ? ` (${R.backtest.longs} long, ${R.backtest.shorts} short)` : ''}. Each stock gets an equal share of the account. Other confidence levels, for information only (choosing the best of these would be fitting to the test):
              {' '}{R.grid.map(g => `${Math.round(g.pThr * 100)}%: ${g.trades} trades, ${bp(g.avgNetBp)}/trade, ${pct1(g.totalReturn)}`).join(' · ')}</div>
          </div>
        )}

        <div className="card" style={{marginBottom:16}}>
          <div className="card-head"><div className="card-title">Independent or saying the same thing?</div><div className="card-meta">average |correlation| {avgAbs.toFixed(2)}</div></div>
          <div className="tiny" style={{color:'var(--ink-2)',marginBottom:8}}>Pairs of agents whose scores move together most. Highly correlated agents are one opinion counted twice; the combined model shares the weight between them.</div>
          <table className="tbl"><tbody>{pairs.slice(0, 6).map(x => (
            <tr key={x.a + x.b}><td>{x.a} · {x.b}</td><td className="mono" style={{textAlign:'right',color: Math.abs(x.c) > 0.5 ? 'var(--warn)' : 'var(--ink-2)'}}>{x.c.toFixed(2)}</td></tr>))}</tbody></table>
        </div>
      </>)}
    </div>
  );
};
window.ScreenIntraday = ScreenIntraday;

// ── Swing lab: the 16 daily agents together, probability and confidence per stock, 2–10 day holds ──
const SWING_CACHE = { result: null, meta: null };
const ScreenSwing = ({ ctx }) => {

  const [R, setR] = React.useState(() => SWING_CACHE.result);
  const U = (sources.find(x => x[0] === source) || [])[2] || null;

  const run = async () => {

    setBusy(0);
    try {

        signalsAt: book.signalsAt, ids: AGENTS.map(a => a.id), names: AGENTS.map(a => a.name), H, costBps: cost, maxPos, shorts,
        dateOf: (g) => barDate(U, g), onProgress: (x) => setBusy(x) });

    setBusy(null);
  };

  const bp = (x, d = 0) => (Number.isFinite(x) ? `${x >= 0 ? '+' : ''}${x.toFixed(d)}bp` : '—');
  const vColor = { go: 'var(--up)', borderline: 'var(--warn)', nogo: 'var(--down)' };
  const statusOf = (a) => ({ predicts: { t: 'Predicts (t ≥ 3)', c: 'var(--up)' }, promising: { t: 'Promising (t 2–3)', c: 'var(--info)' }, reverse: { t: 'Predicts in reverse', c: 'var(--warn)' } }[a.status] || { t: 'No reliable signal', c: 'var(--ink-4)' });
  const rel = R?.relative;
  const maxImpact = R ? Math.max(1e-9, ...R.weights.map(w => w.impactBp)) : 1;
  const row = (label, x, note) => (
    <tr><td><b>{label}</b>{note && <div className="mono tiny muted">{note}</div>}</td>
      <td className="mono" style={{textAlign:'right'}}>{pct1(x.totalReturn)}</td><td className="mono" style={{textAlign:'right'}}>{pct1(x.cagr)}</td>
      <td className="mono" style={{textAlign:'right'}}>{x.sharpe.toFixed(2)}</td><td className="mono" style={{textAlign:'right'}}>{pct1(x.maxDD)}</td>
      <td className="mono" style={{textAlign:'right'}}>{x.trades != null ? x.trades.toLocaleString() : '—'}</td>
      <td className="mono" style={{textAlign:'right'}}>{x.winRate != null ? `${(x.winRate * 100).toFixed(0)}%` : '—'}</td>
      <td className="mono" style={{textAlign:'right'}}>{x.avgNetBp != null ? bp(x.avgNetBp) : '—'}</td></tr>);

  return (
    <div className="page" data-screen-label="05d Swing lab">
      <div className="page-head">
        <div className="page-eyebrow">Swing lab · agents together · {H}-day holds</div>
        <h1 className="page-title">Do the agents, <em>together</em>, call the next {H === 21 ? 'month' : `${H} days`}?</h1>
        <p className="page-sub">Every day each of the 16 agents scores every stock. A combined model turns the scores into a probability of a rise and an expected move, weighting each agent by how much it actually helped. It is refitted every quarter on past data only and tested on the days after, so every result below is from days it hadn't seen. No orders are placed.</p>
      </div>

      <div className="grid-2" style={{marginBottom:16}}>
        <div className="card">
          <div className="card-head"><div className="card-title">Run the test</div><div className="card-meta">{U ? `${U.syms.length} stocks · ${barDate(U, 0)} → ${barDate(U, U.L - 1)}` : 'no data'}</div></div>
          <div className="field">
            <div className="field-label" style={{marginBottom:8}}>Daily history</div>
            <div className="tweak-opts" style={{flexWrap:'wrap'}}>{sources.map(([k, l, u]) => <div key={k} className={'tweak-opt ' + (source === k ? 'on' : '')} style={{opacity: u ? 1 : 0.5}} onClick={() => setSource(k)}>{l}</div>)}</div>
            <div className="mono tiny muted" style={{marginTop:6}}>Longer is better: the first ~30% only warms up and fits; the rest is tested. Broker history length is set under Settings → Advanced; an imported 10-year CSV gives the firmest answer.</div>
          </div>
          <div className="field">
            <div className="field-label" style={{marginBottom:8}}>Hold for</div>
            <div className="tweak-opts">{[2, 5, 10, 21].map(h => <div key={h} className={'tweak-opt ' + (H === h ? 'on' : '')} onClick={() => setH(h)}>{h === 21 ? '1 month' : `${h} days`}</div>)}</div>
          </div>
          <div className="field">
            <div className="field-label" style={{marginBottom:8}}>Agent scores</div>
            <div className="tweak-opts">
              <div className={'tweak-opt ' + (mode === 'ranked' ? 'on' : '')} onClick={() => setMode('ranked')}>Ranked readings</div>

            </div>
            <div className="mono tiny muted" style={{marginTop:6}}>{mode === 'ranked'

              : 'Each agent votes buy/sell only when its rule triggers. Judged on the stock going up. Trading test: buy when the combined probability is high enough.'}</div>
          </div>
          <div className="field">
            <div className="field-label" style={{marginBottom:8}}>Cost per side</div>
            <div className="tweak-opts">{[2, 5, 10].map(c => <div key={c} className={'tweak-opt ' + (cost === c ? 'on' : '')} onClick={() => setCost(c)}>{c}bp</div>)}</div>
          </div>
          <div className="field">
            <div className="field-label" style={{marginBottom:8}}>Most positions at once</div>
            <div className="tweak-opts">{[5, 10].map(m => <div key={m} className={'tweak-opt ' + (maxPos === m ? 'on' : '')} onClick={() => setMaxPos(m)}>{m}</div>)}</div>
          </div>
          <div className="dialog-row" style={{marginBottom:12}}><span className="l">Allow short trades</span><button className={'tweak-opt ' + (shorts ? 'on' : '')} onClick={() => setShorts(!shorts)}>{shorts ? 'ON' : 'OFF'}</button></div>
          <button className="btn primary" style={{width:'100%'}} disabled={busy != null} onClick={run}>{busy != null ? `RUNNING… ${Math.round(busy * 100)}%` : 'RUN THE TEST'}</button>
          {busy != null && <div style={{height:3,background:'var(--line-2)',marginTop:8}}><div style={{height:3,width:`${busy * 100}%`,background:'var(--virtual)'}}></div></div>}
          {error && <div className="tiny" style={{color:'var(--down)',marginTop:10}}>{error}</div>}
        </div>
        <div className="card">
          <div className="card-head"><div className="card-title">How it decides</div></div>
          <div className="tiny" style={{color:'var(--ink-2)',lineHeight:1.6}}>
            <p style={{margin:'0 0 8px'}}><b>Each agent</b> gives every stock a score from −1 (expects a fall) to +1 (expects a rise), or 0 when it has no view.</p>
            <p style={{margin:'0 0 8px'}}><b>Together</b>: the scores are combined into the <b>probability of a rise</b> over the next {H} days and an <b>expected move</b>. An agent's say depends on how well its scores lined up with what happened next on the earlier days; agents that never helped get almost none, and an agent that worked the wrong way round is used the wrong way round.</p>
            {mode === 'ranked'
              ? <p style={{margin:'0 0 8px'}}><b>Trade</b>: every {H} days hold the {maxPos} stocks (at most half of them) the combined model ranks best, equal weights, always invested; costs paid on the names that change. That isolates stock picking: the fair comparison is holding all of them.</p>
              : <p style={{margin:'0 0 8px'}}><b>Buy</b> when the probability is at least 55% and the expected move beats the {cost * 2}bp round-trip cost; hold {H} days; best probabilities first, up to {maxPos} at once.</p>}
            <p style={{margin:'0 0 8px'}}><b>An agent counts</b> only with t ≥ 3 on unseen days (2–3 is "promising"): with 16 agents, one or two will look good by luck at t ≈ 2.</p>
            <p style={{margin:0}}><b>GO</b> needs reliable stock picking by the agents together on unseen days (t ≥ 2), a profit per trade after costs, and a better risk-adjusted return than both buy &amp; hold and the trend score alone.</p>

      {R && (<>

        <div className="card" style={{marginBottom:16}}>

          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))',gap:12}}>

          <table className="tbl">

            <tbody>
              {row('All agents together', R.model, rel ? `hold the ${R.maxPos} best-ranked stocks, re-ranked every ${R.H} days` : 'buy when the combined probability ≥ 55% and the expected move beats costs')}
              {R.trendOnly && row('Trend score only', R.trendOnly, 'the same rules using Trend Persistence alone (Rank & tilt is this idea)')}
              {row('Buy & hold', R.hold, 'every stock, equal weights, never sold')}
            </tbody>
          </table>
          <div className="mono tiny muted" style={{marginTop:8}}>Sharpe: return per unit of risk (higher is better). Per trade is after the {R.costBps * 2}bp round-trip cost.</div>
        </div>

        <div className="grid-2" style={{marginBottom:16}}>
          <div className="card">
            <div className="card-head"><div className="card-title">Each agent's say today</div><div className="card-meta">in the latest model</div></div>
            {R.weights.slice().sort((a, b) => b.impactBp - a.impactBp).map(w => (
              <div key={w.id} style={{display:'grid',gridTemplateColumns:'140px 1fr 64px',gap:8,alignItems:'center',fontSize:11,marginBottom:4}}>

                <span className="mono" style={{textAlign:'right'}}>{w.impactBp.toFixed(1)}bp</span>
              </div>))}
            <div className="mono tiny muted" style={{marginTop:8}}>How far a typical score from each agent moves the expected {R.H}-day return. Amber: the model uses that agent the other way round.</div>
          </div>
          <div className="card">
            <div className="card-head"><div className="card-title">Confidence vs what happened</div><div className="card-meta">unseen days</div></div>
            <table className="tbl">
              <thead><tr><th>{rel ? 'Probability of beating the rest' : 'Probability of a rise'}</th><th style={{textAlign:'right'}}>Calls</th><th style={{textAlign:'right'}}>Actually rose</th><th style={{textAlign:'right'}}>Avg move</th></tr></thead>

        {R.mode === 'ranked' && (R.timing.length > 0 || R.risk.length > 0) && (
          <div className="grid-2" style={{marginBottom:16}}>
            <div className="card">

              {R.risk.map(a => { const st = statusOf(a); return (
                <div key={a.id} className="tiny" style={{marginBottom:8}}><b>{a.name}</b><div className="mono tiny muted">calm-ahead IC {fmtIc(a.ic)} · t {a.icT.toFixed(1)} · <span style={{color:st.c}}>{st.t}</span></div></div>); })}
              <div className="mono tiny muted">Judged on whether a high score came before smaller moves. Kept out of the stock-picking model; could later size positions.</div>

          </div>
        )}

        <div className="card" style={{marginBottom:16}}>
          <div className="card-head"><div className="card-title">{R.mode === 'ranked' ? 'Each stock picker on its own · unseen days' : 'Each agent on its own · unseen days'}</div><div className="card-meta">{R.mode === 'ranked' ? 'IC: ranking vs the next move relative to the others' : 'strong calls = score ≥ 0.5 either way'}</div></div>
          <table className="tbl">
            <thead><tr><th>Agent</th><th style={{textAlign:'right'}}>Stock picking (IC)</th><th style={{textAlign:'right'}}>Strong calls</th><th style={{textAlign:'right'}}>Before costs</th><th style={{textAlign:'right'}}>After costs</th><th>Verdict</th></tr></thead>
            <tbody>{R.agents.filter(a => R.mode !== 'ranked' || a.role === 'picker').map(a => { const st = statusOf(a); return (
              <tr key={a.id}>
                <td><b>{a.name}</b>{a.marketWide && <div className="mono tiny muted">market-wide: judged on timing the whole market</div>}</td>
                <td className="mono" style={{textAlign:'right'}}>{a.marketWide && a.timing ? <span>{fmtIc(a.timing.ic)} <span className="muted">t {a.timing.icT.toFixed(1)}</span></span> : <span>{fmtIc(a.ic)} <span className="muted">t {a.icT.toFixed(1)}</span></span>}</td>
                <td className="mono" style={{textAlign:'right'}}>{a.signals.toLocaleString()}</td>
                <td className="mono" style={{textAlign:'right'}}>{a.signals ? bp(a.grossBp) : '—'}</td>
                <td className="mono" style={{textAlign:'right',color: a.netBp > 0 ? 'var(--up)' : 'var(--down)'}}>{a.signals ? bp(a.netBp) : '—'}</td>
                <td><span className="mono tiny" style={{color:st.c}}>{st.t}</span></td>
              </tr>); })}</tbody>
          </table>
        </div>
      </>)}
    </div>
  );
};
const fmtIc = (x) => (Number.isFinite(x) ? x.toFixed(3) : '—');
window.ScreenSwing = ScreenSwing;

const ScreenOptimiser = ({ ctx, optimiser, onApplyFreeze, onUnfreeze, onRecordComparison }) => {
  const [days, setDays] = React.useState(250);
  const [running, setRunning] = React.useState(false);
  const [progress, setProgress] = React.useState(0);
  const [result, setResult] = React.useState(null);
  const [error, setError] = React.useState(null);
  const oc = optimiserContext(ctx);
  const frozen = optimiser?.frozen;

  const run = async () => {
    if (!oc.U || running) return;
    setRunning(true); setError(null); setResult(null); setProgress(0);
    await new Promise(r => setTimeout(r, 30));
    const start = configFromSettings(ctx.risk || {}, frozen);
    const ddCap = (RISK_LEVELS[ctx.risk?.riskLevel] || RISK_LEVELS.balanced).ddCap;
    const r = await SS.optimiseSettings(oc.U, { asOf: oc.asOf, days, start, params: ctx.agentParams || {}, onProgress: setProgress, costBps: ctx.costBps, ddCap });
    setRunning(false);
    if (r.error) { setError(r.error); return; }
    setResult({ ...r, U: oc.U, srcKey: oc.srcKey, asOf: oc.asOf, costBps: ctx.costBps });
  };

  const compare = () => {
    if (!frozen || !oc.U) return;
    if (oc.srcKey !== frozen.at.srcKey) { onRecordComparison({ error: `The settings were frozen on ${frozen.at.srcKey} data; switch Replay data back to compare.` }); return; }
    if (oc.asOf <= frozen.at.g) { onRecordComparison({ error: `No days after ${frozen.at.date} yet${oc.sim ? ' (or the replay restarted): let the replay run past that day' : ': check again after the next trading day'}.` }); return; }
    const c = SS.compareSettings(oc.U, { frozen: { cfg: frozen.cfg, params: frozen.params }, before: { cfg: frozen.before.cfg, params: frozen.before.params }, from: frozen.at.g + 1, to: oc.asOf });
    onRecordComparison({ ...c, fromDate: barDate(oc.U, c.from), toDate: barDate(oc.U, c.to), frozen: { ret: c.frozen.ret, sharpe: c.frozen.sharpe, maxDD: c.frozen.maxDD }, before: { ret: c.before.ret, sharpe: c.before.sharpe, maxDD: c.before.maxDD } });
  };

  const verdict = (a, b) => (a - b > 0.001 ? 'better' : a - b < -0.001 ? 'worse' : 'about the same');
  const latest = optimiser?.comparisons?.[0];

  return (
    <div className="page" data-screen-label="05b Optimiser">
      <div className="page-head">
        <div className="page-eyebrow">Optimiser · {oc.U ? (oc.U.fictional ? 'fictional market' : "broker's daily bars") : 'no data'}</div>
        <h1 className="page-title">Fit the settings to the past, <em>then see if it holds.</em></h1>
        <p className="page-sub">1 · Find the settings with the highest return over the last N days. 2 · Apply and freeze them. 3 · After more days, compare them with your previous settings on days they weren't chosen on. That comparison, not the optimised return, tells you whether optimising made you better or worse off.</p>
      </div>

      {!oc.U && <div className="card" style={{borderColor:'var(--warn)',marginBottom:16}}><div className="tiny">No price data: set Replay data to Auto or Fictional, or connect a broker.</div></div>}

      <div className="grid-2" style={{marginBottom:16}}>
        <div className="card">
          <div className="card-head"><div className="card-title">1 · Optimise</div><div className="card-meta">{oc.U ? `ends ${barDate(oc.U, oc.asOf)}` : ''}</div></div>
          <div className="field">
            <div className="field-label" style={{marginBottom:8}}>Window</div>
            <div className="tweak-opts" style={{flexWrap:'wrap'}}>
              {[50, 100, 150, 250].map(d => <div key={d} className={'tweak-opt ' + (days === d ? 'on' : '')} onClick={() => setDays(d)}>{d} days</div>)}
              <input className="field-input mono" type="number" min="20" max="400" value={days} style={{width:90}}
                onChange={e => setDays(Math.max(20, Math.min(400, +e.target.value || 100)))}/>
            </div>
            <div className="mono tiny muted" style={{marginTop:6}}>
              {oc.U ? `${barDate(oc.U, Math.max(0, oc.asOf - days + 1))} → ${barDate(oc.U, oc.asOf)}. ${oc.sim ? 'In SIMULATED this ends at the day being replayed, so later replay days are new data for step 3.' : 'Ends at the latest bar; step 3 needs trading days after you freeze.'}` : ''}
            </div>
          </div>
          <div className="mono tiny muted" style={{marginBottom:10}}>Goal: highest return after {ctx?.costBps ?? 5}bp trading costs per side, penalised for any drop beyond {Math.round(((RISK_LEVELS[ctx?.risk?.riskLevel] || RISK_LEVELS.balanced).ddCap) * 100)}% (your risk level). Searches each style's own settings: stocks held and score for Rank & tilt; deciding agents, confidence and share invested for Stay invested; stops, targets and holding period for Trade both ways. Applying requires passing the held-out check.</div>
          <button className="btn primary" style={{width:'100%'}} disabled={!oc.U || running} onClick={run}>{running ? `OPTIMISING… ${Math.round(progress * 100)}%` : `OPTIMISE THE LAST ${days} DAYS`}</button>
          {running && <div style={{height:3,background:'var(--line-2)',marginTop:8}}><div style={{height:3,width:`${progress * 100}%`,background:'var(--virtual)'}}></div></div>}
          {error && <div className="tiny" style={{color:'var(--down)',marginTop:10}}>{error}</div>}
        </div>

        <div className="card">
          <div className="card-head"><div className="card-title">What to expect</div><div className="card-meta">real 2015–2018 prices</div></div>
          <div className="tiny" style={{color:'var(--ink-2)',lineHeight:1.55}}>
            Across 11 rolling 100-day windows, the optimised settings averaged <b>+12.1%</b> inside their window against +5.4% for the defaults, but <b>+7.8% vs +7.2%</b> over the next 100 days: most of the advantage came from fitting that window's noise. The held-out check below (the same settings on the days <i>before</i> the window) called the next-period winner in <b>8 of 11</b> windows, so trust it more than the optimised return.
          </div>
        </div>
      </div>

      {result && (() => {
        const b = result.best, c = result.baseline, ho = result.heldOut;
        const changed = result.changed;
        const hoPass = ho ? ho.best.obj > ho.baseline.obj : null;
        return (
          <div className="card" style={{marginBottom:16}}>
            <div className="card-head"><div className="card-title">Result · {barDate(result.U, result.from)} → {barDate(result.U, result.to)}</div><div className="card-meta">{result.evals} settings tried</div></div>
            <table className="tbl">
              <thead><tr><th></th><th style={{textAlign:'right'}}>Return</th><th style={{textAlign:'right'}}>Sharpe</th><th style={{textAlign:'right'}}>Worst drop</th><th style={{textAlign:'right'}}>Trades</th></tr></thead>
              <tbody>
                <tr><td><b>Optimised</b><div className="mono tiny muted">{describeConfig(b.cfg)}</div></td><td className="mono" style={{textAlign:'right'}}>{pct1(b.ret)}</td><td className="mono" style={{textAlign:'right'}}>{b.sharpe.toFixed(2)}</td><td className="mono" style={{textAlign:'right'}}>{pct1(b.maxDD)}</td><td className="mono" style={{textAlign:'right'}}>{b.trades}</td></tr>
                <tr><td>Your current settings<div className="mono tiny muted">{describeConfig(c.cfg)}</div></td><td className="mono" style={{textAlign:'right'}}>{pct1(c.ret)}</td><td className="mono" style={{textAlign:'right'}}>{c.sharpe.toFixed(2)}</td><td className="mono" style={{textAlign:'right'}}>{pct1(c.maxDD)}</td><td className="mono" style={{textAlign:'right'}}>{c.trades}</td></tr>
                <tr><td>Buy &amp; hold (same stocks)</td><td className="mono" style={{textAlign:'right'}}>{pct1(c.bench)}</td><td></td><td></td><td></td></tr>
              </tbody>
            </table>
            <div className="tiny" style={{marginTop:12,padding:'10px 12px',borderRadius:4,border:'1px solid ' + (hoPass == null ? 'var(--line-2)' : hoPass ? 'var(--up)' : 'var(--down)'),color:'var(--ink-2)',lineHeight:1.5}}>
              <b>Held-out check:</b>{' '}
              {!changed ? 'your current settings were already the best found, so there is nothing to change.'
                : ho == null ? 'not enough history before the window to test on unseen days.'
                : <>on the {result.days} days before the window ({barDate(result.U, ho.from)} → {barDate(result.U, ho.to)}), which the search never saw, the optimised settings returned <b>{pct1(ho.best.ret)}</b> vs <b>{pct1(ho.baseline.ret)}</b> for your current settings. {hoPass ? 'They hold up on unseen data: a reasonable sign, though not a guarantee.' : 'They do worse on unseen data: the optimised return is likely to be mostly luck, and freezing them would probably leave you worse off.'}</>}
            </div>
            <div style={{display:'flex',gap:8,marginTop:12}}>
              <button className="btn primary" disabled={!result.canApply} onClick={() => { onApplyFreeze(result); setResult(null); }}>APPLY &amp; FREEZE THESE SETTINGS</button>
              {!result.canApply && changed && <span className="mono tiny muted" style={{alignSelf:'center'}}>Locked: the settings didn't pass the held-out check.</span>}
              <button className="btn ghost" onClick={() => setResult(null)}>DISCARD</button>
            </div>
          </div>
        );
      })()}

      <div className="card" style={{marginBottom:16}}>
        <div className="card-head"><div className="card-title">2 · Frozen settings &amp; 3 · Compare</div><div className="card-meta">{frozen ? `frozen ${frozen.at.date}` : 'nothing frozen'}</div></div>
        {!frozen ? <div className="mono tiny muted">Optimise above, then apply and freeze to start a comparison.</div> : (
          <div>
            <div className="dialog-row"><span className="l">Frozen settings</span><span className="v tiny">{describeConfig(frozen.cfg)}</span></div>
            <div className="dialog-row"><span className="l">Previous settings</span><span className="v tiny">{describeConfig(frozen.before.cfg)}</span></div>
            <div className="dialog-row"><span className="l">When optimised ({frozen.optimised.days} days to {frozen.at.date})</span><span className="v mono">{pct1(frozen.optimised.ret)} vs {pct1(frozen.optimised.baselineRet)} previous · {pct1(frozen.optimised.bench)} buy &amp; hold</span></div>
            <div style={{display:'flex',gap:8,margin:'12px 0'}}>
              <button className="btn primary" disabled={!oc.U} onClick={compare}>RUN AGAIN &amp; COMPARE</button>
              <button className="btn" onClick={() => onUnfreeze(false)}>UNFREEZE (KEEP VALUES)</button>
              <button className="btn ghost" onClick={() => onUnfreeze(true)}>UNFREEZE &amp; RESTORE PREVIOUS</button>
            </div>
            {latest && (latest.error
              ? <div className="tiny" style={{color:'var(--warn)'}}>{latest.error}</div>
              : (() => {
                  const v = verdict(latest.frozen.ret, latest.before.ret);
                  const optEdge = frozen.optimised.ret - frozen.optimised.baselineRet, realEdge = latest.frozen.ret - latest.before.ret;
                  return (
                    <div style={{padding:'12px 14px',borderRadius:4,border:'1px solid ' + (v === 'better' ? 'var(--up)' : v === 'worse' ? 'var(--down)' : 'var(--line-2)')}}>
                      <div className="mono tiny" style={{letterSpacing:'0.12em',marginBottom:6,color: v === 'better' ? 'var(--up)' : v === 'worse' ? 'var(--down)' : 'var(--ink-3)'}}>
                        {v === 'better' ? 'BETTER' : v === 'worse' ? 'WORSE' : 'ABOUT THE SAME'} THAN YOUR PREVIOUS SETTINGS · {latest.days} DAYS SINCE FREEZING
                      </div>
                      <div style={{display:'flex',gap:28,flexWrap:'wrap',marginBottom:8}}>
                        <div><div className="mono tiny muted">FROZEN</div><div className="mono" style={{fontSize:20}}>{pct1(latest.frozen.ret)}</div></div>
                        <div><div className="mono tiny muted">PREVIOUS</div><div className="mono" style={{fontSize:20}}>{pct1(latest.before.ret)}</div></div>
                        <div><div className="mono tiny muted">BUY &amp; HOLD</div><div className="mono" style={{fontSize:20}}>{pct1(latest.bench)}</div></div>
                      </div>
                      <div className="tiny" style={{color:'var(--ink-2)',lineHeight:1.5}}>
                        {latest.fromDate} → {latest.toDate}: the frozen settings did {v} than your previous settings ({pts(realEdge)}){latest.frozen.ret < latest.bench ? ' and trailed buy-and-hold' : ' and beat buy-and-hold'}.
                        {' '}When optimised they were {pts(optEdge)} ahead; on new days that became {pts(realEdge)}{optEdge > 0 ? (realEdge < 0 ? ', so the advantage reversed' : realEdge < optEdge ? `, so ${Math.round((realEdge / optEdge) * 100)}% of the optimised advantage carried over` : ', so it held up') : ''}.
                        {latest.days < 20 ? ' Fewer than 20 days is too short to judge; compare again later.' : ''}
                      </div>
                    </div>
                  );
                })())}
            {(optimiser.comparisons || []).filter(c => !c.error).length > 1 && (
              <table className="tbl" style={{marginTop:12}}>
                <thead><tr><th>Compared</th><th style={{textAlign:'right'}}>Days</th><th style={{textAlign:'right'}}>Frozen</th><th style={{textAlign:'right'}}>Previous</th><th style={{textAlign:'right'}}>Buy &amp; hold</th></tr></thead>
                <tbody>{optimiser.comparisons.filter(c => !c.error).slice(0, 8).map((c, k) => (
                  <tr key={k}><td className="mono tiny">{c.fromDate} → {c.toDate}</td><td className="mono" style={{textAlign:'right'}}>{c.days}</td><td className="mono" style={{textAlign:'right'}}>{pct1(c.frozen.ret)}</td><td className="mono" style={{textAlign:'right'}}>{pct1(c.before.ret)}</td><td className="mono" style={{textAlign:'right'}}>{pct1(c.bench)}</td></tr>
                ))}</tbody>
              </table>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

  const [result, setResult]       = React.useState(null);
  // Broker history when connected; otherwise the fictional market (clearly labelled)
  const universe = ctx?.analysisUniverse || SIM_U;
  const usingLive = !universe.fictional && !universe.imported;
  const btOpts = { ...(ctx?.risk || {}), params: ctx?.agentParams, costBps: ctx?.costBps };

  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  const doRun = () => {
    if (!universe) return;
    setSimRunning(true);
    setProgress(0);
    const ivl = setInterval(() => setProgress(p => p >= 85 ? 85 : p + 12), 40);
    setTimeout(() => {
      const r = runBacktestSim(period, strategy, universe, btOpts);
      clearInterval(ivl);
      setResult(r);
      setProgress(100);
      setSimRunning(false);

  };

  // First run after mount, so opening the screen doesn't block on a full backtest
  React.useEffect(() => { doRun(); }, [!!universe]);
  const { bot, bench, finalEq, tradeCount, winRate, maxDD, sharpe, monthlyRets, invested, style: resStyle } = result || {
    bot: [100000, 100000], bench: [100000, 100000], finalEq: 100000, tradeCount: 0, winRate: 0, maxDD: 0, sharpe: 0, monthlyRets: new Array(12).fill(0),
  };

  return (
    <div className="page" data-screen-label="05 Backtest">
      <div className="page-head">
        <div className="page-eyebrow">Backtest · {universe.imported ? 'imported history' : usingLive ? "your broker's daily bars" : 'fictional market (generated prices)'} · {styleLabel(ctx?.risk?.style)}{ctx?.risk?.autopilot ? ' · Autopilot' : ''}</div>

            : `Walk-forward on ${universe.L} daily bars: hold every stock, sell one at the next open when the weakness signal fires, buy it back when it clears. The grey line holds everything throughout.`)}</p>

                ))}

              <div className="config-label">Universe</div>

            </div>

<script type="text/babel" data-presets="react">
// Market analysis screen — sector / correlation map

const ScreenMarket = ({ tick, mode, ctx }) => {
  const lp = ctx?.livePrices || {};
  const universe = [];
  SECTORS.forEach((s, si) => {
    SECTOR_TICKERS[s].forEach((sym, ti) => {
      const tk = TICKERS.find(t => t.sym === sym);
      const basePrice = tk ? tk.last : 100;
      // Use live price when connected, else derive from PRICE_HISTORY
      let chg;
      if (lp[sym]) {
        chg = ((lp[sym] - basePrice) / basePrice) * 100;
      } else if (PRICE_HISTORY[sym]) {
        const ph = PRICE_HISTORY[sym];
        const idx = Math.min(ph.length - 1, Math.max(1, Math.floor(tick * 0.3) % ph.length));
        chg = ((ph[idx] - ph[Math.max(0, idx - 1)]) / ph[Math.max(0, idx - 1)]) * 100;
      } else {
        const seed = (si * 8 + ti);
        chg = (Math.sin(seed + tick * 0.07) + Math.cos(seed * 1.7 + tick * 0.03)) * 1.8;
      }
      const realSigs = (ctx?.liveSignals || SIGNALS_ALL)[sym];
      let conf;
      if (realSigs) {
        const ens = computeEnsemble(realSigs, {});
        conf = ens.confidence;
      } else {
        const seed = (si * 8 + ti);
        conf = 0.38 + (Math.abs(Math.sin(seed * 2.3 + tick * 0.11)) * 0.52);
      }
      // Sparkline from PRICE_HISTORY when available
      let spark;
      if (PRICE_HISTORY[sym]) {
        const ph = PRICE_HISTORY[sym];
        const end = Math.min(ph.length, Math.max(20, Math.floor(tick * 0.3) % ph.length));
        spark = ph.slice(Math.max(0, end - 20), end);
        if (spark.length < 20) spark = ph.slice(0, 20);
      } else {
        const seed = (si * 8 + ti);
        spark = Array.from({length:20}, (_, i) =>
          50 + Math.sin(i * 0.8 + seed + tick * 0.12) * 8 + Math.cos(i * 1.3 + seed * 0.7) * 4
        );
      }
      universe.push({ sym, sector: s, chg, conf, spark, watched: ['NVDA','AAPL','MSFT','TSLA','META','JPM'].includes(sym) });
    });
  });

  return (
    <div className="page" data-screen-label="06 Market">

      </div>

      <div className="grid-2-1" style={{marginBottom:16}}>
        <div className="card">
          <div className="card-head">
            <div className="card-title">Universe map</div>
            <div className="card-meta">{universe.length} tickers · live</div>

          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            {SECTORS.map(s => (
              <div key={s}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                  <span className="mono tiny" style={{color:'var(--ink-2)',letterSpacing:'0.14em',textTransform:'uppercase'}}>{s}</span>
                  <span className="mono tiny muted">{universe.filter(u=>u.sector===s).length} symbols</span>
                </div>
                <div className="sector-map" style={{gridTemplateColumns:'repeat(8,1fr)'}}>
                  {universe.filter(u=>u.sector===s).map(u => {
                    const isUp = u.chg >= 0;
                    const intensity = Math.min(1, Math.abs(u.chg) / 3);
                    const bg = isUp
                      ? `rgba(125, 216, 125, ${0.08 + intensity * 0.4})`
                      : `rgba(255, 107, 107, ${0.08 + intensity * 0.4})`;
                    return (
                      <div key={u.sym} className="sector-cell" style={{background:bg, border: u.watched ? '1px solid var(--virtual)' : '1px solid transparent'}}>
                        <div className="sym">{u.sym}</div>

                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="stack">
          <div className="card">
            <div className="card-head"><div className="card-title">Hot signals</div><div className="card-meta">conf ≥ 70%</div></div>
            <div style={{display:'flex',flexDirection:'column'}}>
              {universe.filter(u=>u.conf>=0.7).slice(0,8).map(u => {
                const spMin = Math.min(...u.spark), spMax = Math.max(...u.spark);
                return (

                    <span className="mono" style={{color:'var(--ink)',fontWeight:500}}>{u.sym}</span>

const ScreenSettings = ({ serverTrading = null, mode, alpaca, setAlpaca, risk, setRisk, direction, setDirection, onReset, onResetWeights, onExportWeights, onImportWeights, backendOk, autopilotLog = [], frozen = null, onOpenOptimiser, importedUniverse = null, onImportCsv, onRemoveImport, autoCostBps = 5 }) => {

  const [connectErr, setConnectErr] = React.useState('');
  // Access code for this Shoal server (when its owner set SHOAL_ACCESS_CODE); kept in this browser
  const [accessCode, setAccessCode] = React.useState(() => { try { return localStorage.getItem('shoal_access_code') || ''; } catch (_) { return ''; } });
  const [accessNeeded, setAccessNeeded] = React.useState(false);
  const [loginOn, setLoginOn] = React.useState(false);
  React.useEffect(() => { fetch(`${BACKEND_URL}/api/health`).then(r => r.json()).then(h => { setAccessNeeded(!!h.accessCode); setLoginOn(!!h.login); }).catch(() => {}); }, []);
  const accessHeaders = () => (accessCode.trim() ? { 'x-shoal-access': accessCode.trim() } : {});
  const connectFailed = (data, fallback) => {
    if (data && data.needAccessCode) { setAccessNeeded(true); return accessCode.trim() ? 'That access code is not right for this Shoal server.' : 'This Shoal server needs its access code: enter it above.'; }
    return (data && data.error) || fallback;
  };
  const rememberAccess = () => { try { if (accessCode.trim()) localStorage.setItem('shoal_access_code', accessCode.trim()); } catch (_) {} };
  const importCsvRef = React.useRef(null);
  const blankForm = { broker: 'alpaca', env: 'paper', keyId: '', secret: '', apiKey: '', username: '', password: '', accountId: '', showSecret: false };
  const [form, setForm] = React.useState(blankForm);
  const fb = BROKERS[form.broker];
  const formReady = form.broker === 'ig' ? !!(form.apiKey && form.username && form.password) : !!(form.keyId && form.secret);

    setConnectErr('');

    setForm(blankForm);
    setShowConnect(true);

  const submitConnect = async () => {
    setConnectErr('');
    if (form.broker === 'ig') return submitConnectIG();
    const id = form.keyId.trim();
    const sec = form.secret.trim();
    if (id.length < 16) { setConnectErr('Key ID looks too short. Check you copied the whole value.'); return; }

        setConnectErr(connectFailed(data, 'Connection failed — check your key pair and try again.'));

        env: form.env,
        keyId: id,

        method: 'POST',
