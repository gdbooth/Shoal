<script type="text/babel" data-presets="react">
// Top-level App + sidebar nav + mode chrome

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "density": "Compact",
  "accent": "Green",
  "reasoning": true,
  "animated": true,
  "glyph": "◐"
}/*EDITMODE-END*/;

// ── Per-trade P&L bars (used in ScreenPnlTrend) ─────────────────────────────
const PnlBars = ({ trades, height = 110 }) => {
  if (!trades.length) return null;
  const maxAbs = Math.max(...trades.map(t => Math.abs(t.pnl || 0)), 1);
  const W = 700, H = height, pad = { l: 50, r: 12 }, mid = H / 2;
  const innerW = W - pad.l - pad.r;
  const barW = Math.max(2, Math.floor(innerW / trades.length) - 1);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart" preserveAspectRatio="none" style={{height}}>
      <line x1={pad.l} x2={W - pad.r} y1={mid} y2={mid} stroke="var(--line-2)" strokeWidth="0.5"/>
      {trades.map((t, i) => {
        const x = pad.l + i * (innerW / trades.length);
        const h = Math.max(1, (Math.abs(t.pnl) / maxAbs) * (mid - 6));
        return <rect key={t.id} x={x} y={t.pnl > 0 ? mid - h : mid} width={Math.max(1, barW)} height={h} fill={t.pnl > 0 ? 'var(--up)' : 'var(--down)'} opacity="0.85"/>;
      })}
    </svg>
  );
};

// ── ScreenAgentPerf ──────────────────────────────────────────────────────────
const ScreenAgentPerf = ({ mode, ctx }) => {
  const agentAccuracySeries = ctx?.agentAccuracySeries || {};
  const agentHistory        = ctx?.agentHistory        || {};
  const agentWeights        = ctx?.agentWeights        || {};

  const maxLen = AGENTS.reduce((m, a) => Math.max(m, (agentAccuracySeries[a.id] || []).length), 0);

  const [sortKey, setSortKey] = React.useState('acc');
  const [sortDir, setSortDir] = React.useState(-1); // -1 = desc, 1 = asc

  const toggleSort = (key) => {
    if (sortKey === key) setSortDir(d => d * -1);
    else { setSortKey(key); setSortDir(-1); }
  };

  const SortTh = ({ col, label, align = 'right' }) => (
    <th className="sortable" style={{textAlign: align}} onClick={() => toggleSort(col)}>
      {label}
      <span className={'sort-arrow' + (sortKey === col ? ' active' : '')}>{sortKey === col ? (sortDir === -1 ? ' ↓' : ' ↑') : ' ↕'}</span>
    </th>
  );

  // An agent is excluded only if the user has manually disabled it via the toggle
  const isExcluded = (a) => (ctx?.dynamicExcluded || new Set()).has(a.id);

  // Build series: append null for excluded agents at the current end to show a gap
  const agentSeries = AGENTS.map(a => {
    const s = agentAccuracySeries[a.id] || [a.accuracy];
    return isExcluded(a) ? [...s, null] : s;
  });

  const sortedAgents = React.useMemo(() => {
    return AGENTS
      .map(a => {
        const hist = agentHistory[a.id] || [];
        const acc  = hist.length >= 3 ? hist.filter(Boolean).length / hist.length : null;
        const w    = agentWeights[a.id] ?? a.weight;
        const excl = isExcluded(a);
        return { ...a, hist, acc, w, excl };
      })
      .sort((a, b) => {
        // String sorts honour sortDir consistently with numeric sorts:
        // sortDir = -1 is "desc" (so for strings, that's reverse-alphabetical).
        if (sortKey === 'name')   return -sortDir * a.name.localeCompare(b.name);
        if (sortKey === 'family') return -sortDir * a.family.localeCompare(b.family);
        if (sortKey === 'status') {
          // ACTIVE (excl=false) ranks above DISABLED (excl=true) when descending.
          const sa = a.excl ? 1 : 0, sb = b.excl ? 1 : 0;
          return sortDir * (sb - sa);
        }
        let va, vb;
        if (sortKey === 'acc')   { va = a.acc ?? a.accuracy; vb = b.acc ?? b.accuracy; }
        else if (sortKey === 'w')     { va = a.w; vb = b.w; }
        else if (sortKey === 'calls') { va = a.hist.length; vb = b.hist.length; }
        else { va = a.acc ?? a.accuracy; vb = b.acc ?? b.accuracy; }
        return sortDir * ((vb ?? 0) - (va ?? 0));
      });
  }, [agentHistory, agentWeights, sortKey, sortDir]);

  return (
    <div className="page" data-screen-label="08 Agent Performance">
      <div className="page-head">
        <div className="page-eyebrow">Agent intelligence · win/loss accuracy over time</div>
        <h1 className="page-title">Which agents are <em>earning their weight</em>?</h1>
        <p className="page-sub">Each agent's hit rate on its last 30 calls in trades the bot closed. This is a record, not what sets the weights: weights change only when Autopilot adopts a refitted model (Strategy / learning). For a proper test of an agent use the Swing lab; switch agents off in Agent config.</p>
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div className="card-head">
          <div className="card-title">Rolling accuracy · all agents</div>
          <div className="card-meta">{maxLen} data point{maxLen !== 1 ? 's' : ''} · rolling 30-trade window per agent</div>
        </div>
        {maxLen < 3
          ? <div style={{padding:'40px 0',textAlign:'center',color:'var(--ink-3)',fontFamily:'var(--mono)',fontSize:12}}>
              Collecting… {maxLen} closed trade{maxLen !== 1 ? 's' : ''} with votes recorded — need at least 3
            </div>
          : <>
              <LineChart
                series={agentSeries}
                colors={AGENTS.map(a => isExcluded(a) ? 'var(--ink-3)' : a.color)}
                labels={AGENTS.map(a => a.short)}
                endLabels={AGENTS.map(a => {
                  const hist = agentHistory[a.id] || [];
                  const acc = hist.length >= 2 ? hist.filter(Boolean).length / hist.length : a.accuracy;
                  return a.short + ' ' + (acc * 100).toFixed(0) + '%';
                })}
                height={280}
                yFmt={v => (v * 100).toFixed(0) + '%'}
                fillFirst={false}
                solidLines={true}
                hLines={[{value: 0.5, color:'var(--ink-4)', label: '50%'}]}
              />
              <div className="legend" style={{marginTop:10,display:'flex',flexWrap:'wrap',gap:'4px 14px'}}>
                {AGENTS.map(a => {
                  const hist = agentHistory[a.id] || [];
                  const acc  = hist.length >= 2 ? hist.filter(Boolean).length / hist.length : a.accuracy;
                  const excl = isExcluded(a);
                  return (
                    <span key={a.id} style={{display:'flex',alignItems:'center',gap:4,fontSize:11,opacity: excl ? 0.45 : 1}}>
                      <span style={{width:12,height:2,background: excl ? 'var(--ink-3)' : a.color,display:'inline-block',borderRadius:1}}></span>
                      <span style={{color:excl ? 'var(--ink-3)' : acc >= 0.6 ? 'var(--up)' : acc < 0.5 ? 'var(--down)' : 'var(--ink-2)',textDecoration: excl ? 'line-through' : 'none'}}>
                        {a.short}
                      </span>
                      {excl && <span style={{color:'var(--down)',fontSize:9,letterSpacing:'0.05em'}}>EXCL</span>}
                    </span>
                  );
                })}
              </div>
            </>
        }
      </div>

      <div className="card">
        <div className="card-head">
          <div className="card-title">Current standing</div>
          <div className="card-meta">click column headers to sort</div>
        </div>
        <table className="tbl">
          <thead>
            <tr>
              <SortTh col="name" label="Agent" align="left"/>
              <SortTh col="family" label="Family" align="left"/>
              <SortTh col="calls" label="Calls"/>
              <SortTh col="acc" label="Accuracy"/>
              <SortTh col="w" label="Weight"/>
              <SortTh col="status" label="Status"/>
            </tr>
          </thead>
          <tbody>
            {sortedAgents.map(a => (
              <tr key={a.id} style={{opacity: a.excl ? 0.5 : 1}}>
                <td><span style={{color: a.excl ? 'var(--ink-3)' : a.color,marginRight:8}}>{a.glyph}</span>{a.name}</td>
                <td className="mono tiny muted">{a.family}</td>
                <td className="mono" style={{textAlign:'right'}}>{a.hist.length}</td>
                <td style={{textAlign:'right'}}>
                  {a.acc !== null
                    ? <span className={a.acc >= 0.6 ? 'up' : a.acc < 0.5 ? 'dn' : ''}>{(a.acc * 100).toFixed(1)}%</span>
                    : <span className="muted">–</span>}
                </td>
                <td className="mono" style={{textAlign:'right'}}>{(a.w * 100).toFixed(1)}%</td>
                <td style={{textAlign:'right'}}>
                  {a.excl
                    ? <span className="dn" style={{fontSize:10,letterSpacing:'0.06em'}} title="Manually disabled via Agent Config — toggle on to re-enable">DISABLED</span>
                    : <span className="up" style={{fontSize:10,letterSpacing:'0.06em'}}>ACTIVE</span>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

// ── ScreenPnlTrend ───────────────────────────────────────────────────────────
const ScreenPnlTrend = ({ mode, ctx }) => {
  const { trades, tradesResetAt } = ctx || {};
  const resetAt = tradesResetAt || 0;
  const startEquity = ctx?.startingBalance ?? EQUITY.bot[0];
  const currentEquity = ctx?.balance ?? startEquity;
  const equityDelta = currentEquity - startEquity;
  const equityPct = startEquity > 0 ? equityDelta / startEquity : 0;

  const EquityHeader = () => {
    const lp = ctx?.livePrices;
    const ts = trades || [];
    const realized   = ts.filter(t => t.pnl != null && t.ts >= resetAt).reduce((s, t) => s + t.pnl, 0);
    const unrealized = ts.filter(t => t.status === 'OPEN').reduce((s, t) => s + unrealizedPnl(t, lp), 0);

    const Card = ({ label, value, valueClass = '', sub }) => (
      <div className="card" style={{padding:'12px 14px'}}>
        <div className="mono tiny muted" style={{letterSpacing:'0.1em',marginBottom:6}}>{label}</div>
        <div className={'mono ' + valueClass} style={{fontSize:17}}>{value}</div>
        <div className="mono tiny muted" style={{marginTop:6,lineHeight:1.4,fontSize:10,letterSpacing:'0.02em'}}>{sub}</div>
      </div>
    );

    const signed = (n) => (n >= 0 ? '+' : '') + fmtMoney(n, 0);

    return (
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10,marginBottom:16}}>
        <Card label="STARTING EQUITY"
              value={fmtMoney(startEquity, 0)}
              sub="Account value at last reset"/>
        <Card label="CURRENT EQUITY"
              value={fmtMoney(currentEquity, 0)}
              sub="Starting + realized + unrealized"/>
        <Card label="REALIZED P&L"
              value={signed(realized)}
              valueClass={realized >= 0 ? 'up' : 'dn'}
              sub="Σ P&L of closed trades since reset"/>
        <Card label="UNREALIZED P&L"
              value={signed(unrealized)}
              valueClass={unrealized >= 0 ? 'up' : 'dn'}
              sub="Open positions, marked-to-market"/>
        <Card label="NET CHANGE"
              value={<>{signed(equityDelta)} <span style={{fontSize:12,opacity:0.7}}>({equityPct >= 0 ? '+' : ''}{(equityPct*100).toFixed(1)}%)</span></>}
              valueClass={equityDelta >= 0 ? 'up' : 'dn'}
              sub="Realized + unrealized = current − starting"/>
      </div>
    );
  };

  const closed = React.useMemo(() =>
    (trades || [])
      .filter(t => t.pnl != null && t.ts >= resetAt)
      .sort((a, b) => (a.exitTs || a.ts) - (b.exitTs || b.ts)),
    [trades, resetAt]
  );

  if (!closed.length) return (
    <div className="page" data-screen-label="09 P/L Trend">
      <div className="page-head">
        <div className="page-eyebrow">Portfolio performance · since last reset</div>
        <h1 className="page-title">P/L trend</h1>
        <p className="page-sub">No closed trades since last reset.</p>
      </div>
      <EquityHeader/>
    </div>
  );

  let cum = 0;
  // Equity after each closed trade = startEquity + cumulative realized P&L.
  // Prepend startEquity so the chart starts at the reset baseline.
  const equitySeries = [startEquity, ...closed.map(t => { cum += t.pnl; return startEquity + cum; })];
  const totalPnl  = cum;
  let cumRun = 0;
  const cumPnlSeries = [0, ...closed.map(t => { cumRun += t.pnl; return cumRun; })];
  const timeLabels = ['start', ...closed.map(t => {
    const utc = new Date(t.exitTs || t.ts);
    const et = new Date(utc.toLocaleString('en-US', { timeZone: 'America/New_York' }));
    return `${(et.getMonth()+1)}/${et.getDate()} ${String(et.getHours()).padStart(2,'0')}:${String(et.getMinutes()).padStart(2,'0')} ET`;
  })];
  const wins      = closed.filter(t => t.pnl > 0);
  const losses    = closed.filter(t => t.pnl <= 0);
  const winRate   = closed.length ? wins.length / closed.length : 0;
  const avgWin    = wins.length   ? wins.reduce((s, t) => s + t.pnl, 0) / wins.length   : 0;
  const avgLoss   = losses.length ? losses.reduce((s, t) => s + t.pnl, 0) / losses.length : 0;
  // Max drawdown computed on equity series (peak-to-trough), unchanged in dollars.
  const maxDD     = equitySeries.reduce((dd, v, i, a) => {
    const peak = Math.max(...a.slice(0, i + 1));
    return Math.min(dd, v - peak);
  }, 0);

  return (
    <div className="page" data-screen-label="09 P/L Trend">
      <div className="page-head">
        <div className="page-eyebrow">Portfolio performance · since last reset</div>
        <h1 className="page-title">
          Cumulative <em className={totalPnl >= 0 ? 'up' : 'dn'}>{totalPnl >= 0 ? 'gain' : 'loss'}</em> across {closed.length} closed trade{closed.length !== 1 ? 's' : ''}
        </h1>
      </div>

      <EquityHeader/>

      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:12,marginBottom:16}}>
        {[
          { label: 'TOTAL P&L',  val: fmtMoney(totalPnl),           cls: totalPnl >= 0 ? 'up' : 'dn' },
          { label: 'WIN RATE',   val: (winRate * 100).toFixed(1) + '%', cls: winRate >= 0.5 ? 'up' : 'dn' },
          { label: 'AVG WIN',    val: fmtMoney(avgWin),              cls: 'up' },
          { label: 'AVG LOSS',   val: fmtMoney(avgLoss),             cls: 'dn' },
          { label: 'MAX DRAWDN', val: fmtMoney(maxDD),               cls: 'dn' },
        ].map(k => (
          <div key={k.label} className="card" style={{padding:'14px 16px'}}>
            <div className="mono tiny muted" style={{letterSpacing:'0.1em',marginBottom:6}}>{k.label}</div>
            <div className={'mono ' + k.cls} style={{fontSize:18}}>{k.val}</div>
          </div>
        ))}
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
        <div className="card">
          <div className="card-head">
            <div className="card-title">Equity after each trade</div>
            <div className="card-meta">{closed.length} trades · starting at {fmtMoney(startEquity, 0)}</div>
          </div>
          <LineChart
            series={[equitySeries]}
            zeroCrossColors={['var(--up)', 'var(--down)']}
            crossValue={startEquity}
            labels={['Equity']}
            height={220}
            yFmt={v => fmtMoney(v, 0)}
            fillFirst={true}
            xLabels={timeLabels}
            hLines={[{value: startEquity, color: 'var(--ink-4)', label: 'start ' + fmtMoney(startEquity, 0)}]}
          />
        </div>
        <div className="card">
          <div className="card-head">
            <div className="card-title">Cumulative P&amp;L after each trade</div>
            <div className="card-meta">{closed.length} closed trades · realized only</div>
          </div>
          <LineChart
            series={[cumPnlSeries]}
            zeroCrossColors={['var(--up)', 'var(--down)']}
            crossValue={0}
            labels={['Cum P&L']}
            height={220}
            yFmt={v => (v >= 0 ? '+' : '') + fmtMoney(v, 0)}
            fillFirst={true}
            xLabels={timeLabels}
            hLines={[{value: 0, color: 'var(--ink-4)', label: 'breakeven'}]}
          />
        </div>
      </div>

      <div className="card" style={{marginBottom:16}}>
        <div className="card-head">
          <div className="card-title">Per-trade P&L</div>
          <div className="card-meta">{wins.length}W · {losses.length}L · green above zero, red below</div>
        </div>
        <PnlBars trades={closed}/>
        <div style={{marginTop:10,display:'flex',flexWrap:'wrap',gap:8}}>
          {closed.slice(-12).reverse().map(t => (
            <div key={t.id} style={{fontFamily:'var(--mono)',fontSize:10,padding:'4px 8px',borderRadius:3,background:'var(--bg-2)',color: t.pnl > 0 ? 'var(--up)' : 'var(--down)'}}>
              {t.sym} {t.side} {t.pnl >= 0 ? '+' : ''}{fmtMoney(t.pnl, 0)}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

// ── ScreenSectorUniverse ──────────────────────────────────────────────────────
const ScreenSectorUniverse = ({ mode, ctx }) => {
  const { trades = [], risk = {}, liveSignals, agentWeights = {}, dynamicExcluded } = ctx;

  const allSectors = React.useMemo(() => [...new Set(TICKERS.map(t => t.sector))], []);

  const symToSector = React.useMemo(() => Object.fromEntries(TICKERS.map(t => [t.sym, t.sector])), []);

  const sectorStats = React.useMemo(() => {
    return allSectors.map(sect => {
      const sectTrades = trades.filter(t => symToSector[t.sym] === sect);
      const open   = sectTrades.filter(t => t.status === 'OPEN').length;
      const closed = sectTrades.filter(t => t.status !== 'OPEN');
      const realizedPnl = closed.reduce((s, t) => s + (t.pnl || 0), 0);
      return { sect, total: sectTrades.length, open, closed: closed.length, realizedPnl };
    }).sort((a, b) => b.total - a.total);
  }, [trades, allSectors, symToSector]);

  const totalTrades  = trades.length;
  const openCount    = trades.filter(t => t.status === 'OPEN').length;
  const closedCount  = totalTrades - openCount;

  const confThreshold = risk.confidence ?? 55;

  const tickerConf = React.useMemo(() => {
    const sigSrc = liveSignals || SIGNALS_ALL;
    const wts    = agentWeights || {};
    const enabledSet = (dynamicExcluded?.size > 0)
      ? new Set(AGENTS.map(a => a.id).filter(id => !dynamicExcluded.has(id)))
      : null;
    const threshold = confThreshold / 100;

    return TICKERS.map(tk => {
      const sigs = sigSrc[tk.sym];
      if (!sigs) {
        return { ...tk, ens: null, low: true, buyCount: 0, sellCount: 0, holdCount: AGENTS.length, tradeCount: 0 };
      }
      const ens = computeEnsemble(sigs, wts, enabledSet);
      const buyCount  = AGENTS.filter(a => ens.votes[a.id] ===  1).length;
      const sellCount = AGENTS.filter(a => ens.votes[a.id] === -1).length;
      const holdCount = AGENTS.length - buyCount - sellCount;
      const tradeCount = trades.filter(t => t.sym === tk.sym).length;
      return { ...tk, ens, buyCount, sellCount, holdCount, low: ens.confidence < threshold, tradeCount };
    }).sort((a, b) => (b.ens?.confidence ?? 0) - (a.ens?.confidence ?? 0));
  }, [liveSignals, agentWeights, dynamicExcluded, confThreshold, trades]);

  const lowConfCount   = tickerConf.filter(t => t.low && t.ens).length;
  const activeSectors  = sectorStats.filter(s => s.total > 0).length;

  // Herfindahl concentration index — 0 = perfect spread, 1 = all one sector
  const hhi = totalTrades > 0
    ? sectorStats.reduce((s, x) => s + (x.total / totalTrades) ** 2, 0)
    : 0;
  const diversityScore = Math.round((1 - hhi) * 100);
  const diversityLabel = hhi < 0.25 ? 'Well diversified' : hhi < 0.40 ? 'Moderate' : 'Concentrated';

  return (
    <div style={{ padding: '0 0 40px' }}>

      {/* KPI strip */}
      <div style={{ display: 'flex', gap: 12, marginBottom: 16, flexWrap: 'wrap' }}>
        {[
          { label: 'Total trades',    value: totalTrades,           sub: openCount + ' open · ' + closedCount + ' closed' },
          { label: 'Active sectors',  value: activeSectors,          sub: 'of ' + allSectors.length + ' in universe' },
          { label: 'Diversity score', value: diversityScore + '%',   sub: diversityLabel },
          { label: 'Low confidence',  value: lowConfCount,           sub: 'tickers below ' + confThreshold + '% threshold' },
        ].map(({ label, value, sub }) => (
          <div key={label} className="card" style={{ flex: '1 1 130px', minWidth: 120, padding: '12px 16px' }}>
            <div style={{ fontSize: 10, color: 'var(--ink-4)', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: 4 }}>{label}</div>
            <div style={{ fontFamily: 'var(--mono)', fontSize: 22, fontWeight: 700 }}>{value}</div>
            <div style={{ fontSize: 11, color: 'var(--ink-4)', marginTop: 2 }}>{sub}</div>
          </div>
        ))}
      </div>

      {/* Sector distribution — SVG bar chart + stats table */}
      {(() => {
        const maxTotal = Math.max(1, ...sectorStats.map(s => s.total));
        const barH = 28, gap = 6, labelW = 56;
        const chartH = sectorStats.length * (barH + gap);
        const sectorColors = { Tech: '#7dd87d', Fin: '#7ec0ee', Energy: '#f0c674', Health: '#c594c5', Cons: '#f4a87c', Auto: '#ff8a3d', Indus: '#9dc4e8', Util: '#b0a8e0', Mat: '#e08a8a' };
        return (
          <div className="card" style={{ marginBottom: 16 }}>
            <div className="card-head">
              <div className="card-title">Sector Distribution</div>
              <div className="card-meta">Trade counts · sector cap {risk.maxSectorPct ?? 40}% · gate at ≥5 open positions</div>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, alignItems: 'start' }}>
              {/* Bar chart */}
              <svg width="100%" viewBox={`0 0 400 ${chartH}`} style={{ overflow: 'visible' }}>
                {sectorStats.map(({ sect, total, open }, idx) => {
                  const y = idx * (barH + gap);
                  const barW = total > 0 ? (total / maxTotal) * 300 : 0;
                  const openW = open > 0 ? (open / maxTotal) * 300 : 0;
                  const color = sectorColors[sect] || '#888';
                  return (
                    <g key={sect}>
                      <text x={labelW - 6} y={y + barH / 2 + 4} textAnchor="end" fill="currentColor" fontSize="11" fontFamily="var(--mono)" fontWeight="600">{sect}</text>
                      <rect x={labelW} y={y + 2} width="300" height={barH - 4} rx="3" fill="var(--bg-3)" opacity="0.5"/>
                      {barW > 0 && <rect x={labelW} y={y + 2} width={barW} height={barH - 4} rx="3" fill={color} opacity="0.35"/>}
                      {openW > 0 && <rect x={labelW} y={y + 2} width={openW} height={barH - 4} rx="3" fill={color} opacity="0.8"/>}
                      <text x={labelW + Math.max(barW, 0) + 6} y={y + barH / 2 + 4} fill="currentColor" fontSize="11" fontFamily="var(--mono)" opacity={total > 0 ? 1 : 0.3}>{total}</text>
                      {open > 0 && (
                        <text x={labelW + openW + 6} y={y + barH / 2 + 4} fill={color} fontSize="9" fontFamily="var(--mono)" opacity="0.9">{open} open</text>
                      )}
                    </g>
                  );
                })}
              </svg>
              {/* Stats table */}
              <div>
                <div style={{ display: 'grid', gridTemplateColumns: '56px 50px 50px 80px 60px', gap: 4, padding: '0 0 6px', borderBottom: '1px solid var(--bg-3)', marginBottom: 4 }}>
                  {['Sector', 'Total', 'Open', 'P&L', 'Conf'].map((h, i) => (
                    <div key={i} style={{ fontSize: 9, color: 'var(--ink-4)', textAlign: i > 0 ? 'right' : 'left', textTransform: 'uppercase', letterSpacing: '0.08em' }}>{h}</div>
                  ))}
                </div>
                {sectorStats.map(({ sect, total, open, closed, realizedPnl }) => {
                  const sectConf = tickerConf.filter(tc => tc.sector === sect && tc.ens);
                  const avgConf  = sectConf.length > 0
                    ? sectConf.reduce((s, tc) => s + tc.ens.confidence, 0) / sectConf.length
                    : 0;
                  const confOk = avgConf * 100 >= confThreshold;
                  return (
                    <div key={sect} style={{ display: 'grid', gridTemplateColumns: '56px 50px 50px 80px 60px', gap: 4, padding: '5px 0', borderBottom: '1px solid var(--bg-3)' }}>
                      <div style={{ fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 600, color: sectorColors[sect] || 'var(--ink)' }}>{sect}</div>
                      <div style={{ fontFamily: 'var(--mono)', fontSize: 11, textAlign: 'right', color: total > 0 ? 'var(--ink-2)' : 'var(--ink-4)' }}>{total}</div>
                      <div style={{ fontFamily: 'var(--mono)', fontSize: 11, textAlign: 'right' }}>
                        {open > 0 ? <span style={{ color: 'var(--accent)' }}>{open}</span> : <span style={{ color: 'var(--ink-4)' }}>0</span>}
                      </div>
                      <div style={{ fontFamily: 'var(--mono)', fontSize: 11, textAlign: 'right', color: realizedPnl > 0 ? 'var(--up)' : realizedPnl < 0 ? 'var(--down)' : 'var(--ink-4)' }}>
                        {realizedPnl !== 0 ? (realizedPnl > 0 ? '+' : '') + fmtMoney(realizedPnl, 0) : '—'}
                      </div>
                      <div style={{ fontFamily: 'var(--mono)', fontSize: 11, textAlign: 'right', color: total > 0 ? (confOk ? 'var(--up)' : 'var(--warn)') : 'var(--ink-4)' }}>
                        {total > 0 ? Math.round(avgConf * 100) + '%' : '—'}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      })()}

      {/* Universe confidence map */}
      <div className="card">
        <div className="card-head">
          <div className="card-title">Universe Confidence Map</div>
          <div className="card-meta">
            {lowConfCount} ticker{lowConfCount !== 1 ? 's' : ''} flagged below {confThreshold}% · sorted by confidence desc
          </div>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(260px, 1fr))', gap: 8 }}>
          {tickerConf.map(tc => {
            const confPct  = tc.ens ? Math.round(tc.ens.confidence * 100) : 0;
            const dir      = tc.ens?.dir;
            const isLow    = tc.low && tc.ens;
            const barColor = isLow
              ? 'var(--warn)'
              : dir === 'BUY'  ? 'var(--up)'
              : dir === 'SELL' ? 'var(--down)'
              : 'var(--accent)';
            return (
              <div key={tc.sym} style={{
                background:   'var(--bg-2)',
                border:       isLow ? '1px solid var(--warn)' : '1px solid var(--bg-3)',
                borderRadius: 6,
                padding:      '10px 12px',
                position:     'relative',
              }}>
                {isLow && (
                  <div style={{ position: 'absolute', top: 7, right: 8, fontSize: 8, color: 'var(--warn)', fontFamily: 'var(--mono)', fontWeight: 700, letterSpacing: '0.06em' }}>
                    ⚠ LOW CONF
                  </div>
                )}
                {/* Header */}
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
                  <div>
                    <div style={{ fontFamily: 'var(--mono)', fontWeight: 700, fontSize: 14 }}>{tc.sym}</div>
                    <div style={{ fontSize: 11, color: 'var(--ink-3)', marginTop: 1 }}>{tc.name}</div>
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 3 }}>
                    <span style={{ fontSize: 10, background: 'var(--bg-3)', padding: '1px 6px', borderRadius: 3, fontFamily: 'var(--mono)', color: 'var(--ink-3)' }}>{tc.sector}</span>
                    {tc.tradeCount > 0 && (
                      <span style={{ fontSize: 10, color: 'var(--ink-4)', fontFamily: 'var(--mono)' }}>{tc.tradeCount} trade{tc.tradeCount !== 1 ? 's' : ''}</span>
                    )}
                  </div>
                </div>
                {/* Confidence bar */}
                <div style={{ marginBottom: 7 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 3 }}>
                    <span style={{ fontSize: 10, color: 'var(--ink-4)' }}>Confidence</span>
                    <span style={{ fontFamily: 'var(--mono)', fontSize: 11, color: barColor, fontWeight: 700 }}>
                      {tc.ens ? confPct + '%' : 'no signal'}
                    </span>
                  </div>
                  <div style={{ height: 4, background: 'var(--bg-3)', borderRadius: 2, overflow: 'hidden' }}>
                    <div style={{ height: '100%', width: confPct + '%', background: barColor, borderRadius: 2, transition: 'width 0.4s' }}/>
                  </div>
                  {/* Threshold tick */}
                  <div style={{ position: 'relative', height: 3 }}>
                    <div style={{ position: 'absolute', left: confThreshold + '%', top: 0, width: 1, height: 3, background: 'var(--ink-4)', opacity: 0.5 }}/>
                  </div>
                </div>
                {/* Direction + vote breakdown */}
                {tc.ens ? (
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span style={{
                      fontSize: 10, fontFamily: 'var(--mono)', fontWeight: 700,
                      color: dir === 'BUY' ? 'var(--up)' : dir === 'SELL' ? 'var(--down)' : 'var(--ink-3)',
                      minWidth: 28,
                    }}>
                      {dir || 'HOLD'}
                    </span>
                    <div style={{ display: 'flex', gap: 5, fontSize: 10, fontFamily: 'var(--mono)', color: 'var(--ink-3)' }}>
                      <span style={{ color: 'var(--up)' }}>{tc.buyCount}↑</span>
                      <span style={{ color: 'var(--down)' }}>{tc.sellCount}↓</span>
                      <span style={{ color: 'var(--ink-4)' }}>{tc.holdCount}–</span>
                    </div>
                    <span style={{ marginLeft: 'auto', fontSize: 10, color: 'var(--ink-4)', fontFamily: 'var(--mono)' }}>
                      {Math.round((tc.ens.disagreement ?? 0) * 100)}% split
                    </span>
                  </div>
                ) : (
                  <div style={{ fontSize: 10, color: 'var(--ink-4)' }}>No signal data</div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

// ── ScreenAgentConfig ─────────────────────────────────────────────────────────
const ScreenAgentConfig = ({ agentParams, setAgentParams, enabledAgents, setEnabledAgents, agentWeights, agentHistory, agentParamPresets = {}, setAgentParamPresets = () => {}, universe = null, autopilot = false, evidence = null }) => {
  const [optimizing, setOptimizing] = React.useState({});
  const [optResults, setOptResults]  = React.useState({});
  const [expanded, setExpanded]      = React.useState({});
  const [presetName, setPresetName]  = React.useState('');
  const [selectedPreset, setSelectedPreset] = React.useState('');
  const [confirmRevert, setConfirmRevert]   = React.useState(false);
  const [showAllParams, setShowAllParams]   = React.useState(false);

  const gp = (id, key) => agentParams[id]?.[key] ?? AGENT_PARAMS_DEFAULT[id]?.[key];
  const sp = (id, key, val) => setAgentParams(p => ({ ...p, [id]: { ...(p[id] || {}), [key]: val } }));

  // Count how many params differ from defaults (across all agents).
  const modifiedCount = React.useMemo(() => {
    let n = 0;
    for (const a of AGENTS) {
      const defs = AGENT_PARAM_DEFS[a.id] || [];
      for (const def of defs) {
        const cur = agentParams[a.id]?.[def.key];
        const dflt = AGENT_PARAMS_DEFAULT[a.id]?.[def.key];
        if (cur !== undefined && dflt !== undefined && Math.abs(cur - dflt) > def.step * 0.5) n++;
      }
    }
    return n;
  }, [agentParams]);
  const totalParamCount = React.useMemo(() => {
    return AGENTS.reduce((s, a) => s + (AGENT_PARAM_DEFS[a.id]?.length || 0), 0);
  }, []);

  const presetNames = Object.keys(agentParamPresets);

  const savePreset = () => {
    const name = (presetName || '').trim();
    if (!name) return;
    setAgentParamPresets(p => ({ ...p, [name]: JSON.parse(JSON.stringify(agentParams)) }));
    setPresetName('');
    setSelectedPreset(name);
  };
  const loadPreset = (name) => {
    if (!name || !agentParamPresets[name]) return;
    setAgentParamPresets(p => p); // no-op, just touching
    setAgentParams(JSON.parse(JSON.stringify(agentParamPresets[name])));
    setSelectedPreset(name);
  };
  const deletePreset = (name) => {
    if (!name) return;
    setAgentParamPresets(p => { const next = { ...p }; delete next[name]; return next; });
    if (selectedPreset === name) setSelectedPreset('');
  };
  const revertAll = () => {
    setAgentParams({});
    setOptResults({});
    setSelectedPreset('');
    setConfirmRevert(false);
  };

  const optimize = async (agentId) => {
    if (!universe) { setOptResults(o => ({ ...o, [agentId]: { bestValue: null, noData: true } })); return; }
    setOptimizing(o => ({ ...o, [agentId]: true }));
    const result = await backtestOneAgent(agentId, universe, agentParams);
    if (result && result.bestValue != null) sp(agentId, result.paramKey, result.bestValue);
    setOptResults(o => ({ ...o, [agentId]: result }));
    setOptimizing(o => ({ ...o, [agentId]: false }));
  };

  const [optimizingAll, setOptimizingAll] = React.useState(false);
  const optimizeAll = async () => {
    if (optimizingAll) return;
    setOptimizingAll(true);
    for (const a of AGENTS) { await optimize(a.id); }
    setOptimizingAll(false);
  };

  const families = [...new Set(AGENTS.map(a => a.family))];
  const enabledCount = enabledAgents ? enabledAgents.size : AGENTS.length;

  return (
    <div className="page" data-screen-label="10 Agent Config">
      <div className="page-head">
        <div className="page-eyebrow">Agent configuration · {enabledCount}/{AGENTS.length} active</div>
        <h1 className="page-title">Toggle, tune, and <em>optimise</em> each agent.</h1>
        <p className="page-sub">Enable or disable agents, adjust their signal parameters, and run a walk-forward grid search for each parameter on your price history. Tuned parameters often fit the past only: confirm any change in the Swing lab before relying on it.</p>
      </div>

      <div className="card" style={{marginBottom:16,padding:14}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12,flexWrap:'wrap'}}>
          <div style={{display:'flex',alignItems:'center',gap:14,flexWrap:'wrap'}}>
            <div>
              <div className="mono tiny muted" style={{letterSpacing:'0.1em'}}>PARAMS MODIFIED</div>
              <div className="mono" style={{fontSize:16,color: modifiedCount > 0 ? 'var(--warn)' : 'var(--ink-2)'}}>
                {modifiedCount} <span style={{fontSize:11,color:'var(--ink-4)'}}>/ {totalParamCount}</span>
              </div>
            </div>
            <div>
              <div className="mono tiny muted" style={{letterSpacing:'0.1em'}}>ACTIVE PRESET</div>
              <div className="mono" style={{fontSize:13,color: selectedPreset ? 'var(--virtual)' : 'var(--ink-3)'}}>
                {selectedPreset || (modifiedCount === 0 ? 'defaults' : 'custom (unsaved)')}
              </div>
            </div>
          </div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
            <button className="btn" style={{fontSize:11}} onClick={() => setShowAllParams(s => !s)}>
              {showAllParams ? 'Hide all params' : 'View all params'}
            </button>
            <button className="btn" style={{fontSize:11}} onClick={() => setEnabledAgents(new Set(AGENTS.map(a => a.id)))}>Enable all</button>
            <button className="btn" style={{fontSize:11,opacity:optimizingAll?0.5:1}} onClick={optimizeAll} disabled={optimizingAll}>
              {optimizingAll ? '⟳ Optimising…' : '⚡ Optimise all'}
            </button>
            {confirmRevert ? (
              <React.Fragment>
                <span className="mono tiny" style={{color:'var(--warn)'}}>Sure?</span>
                <button className="btn" style={{fontSize:11,color:'var(--down)'}} onClick={revertAll}>Yes, revert</button>
                <button className="btn" style={{fontSize:11}} onClick={() => setConfirmRevert(false)}>Cancel</button>
              </React.Fragment>
            ) : (
              <button className="btn" style={{fontSize:11,opacity: modifiedCount === 0 ? 0.4 : 1}} disabled={modifiedCount === 0}
                onClick={() => setConfirmRevert(true)}>Revert to defaults</button>
            )}
          </div>
        </div>

        <div style={{borderTop:'1px solid var(--line)',marginTop:12,paddingTop:12,display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
          <span className="mono tiny muted" style={{letterSpacing:'0.1em'}}>PRESETS</span>
          <select value={selectedPreset} onChange={e => { setSelectedPreset(e.target.value); }}
            style={{fontFamily:'var(--mono)',fontSize:11,padding:'4px 8px',background:'var(--bg-2)',color:'var(--ink)',border:'1px solid var(--line)',borderRadius:3}}>
            <option value="">— choose preset —</option>
            {presetNames.map(n => <option key={n} value={n}>{n}</option>)}
          </select>
          <button className="btn" style={{fontSize:11,opacity: selectedPreset ? 1 : 0.4}} disabled={!selectedPreset}
            onClick={() => loadPreset(selectedPreset)}>Load</button>
          <button className="btn" style={{fontSize:11,opacity: selectedPreset ? 1 : 0.4,color:'var(--down)'}} disabled={!selectedPreset}
            onClick={() => deletePreset(selectedPreset)}>Delete</button>
          <span style={{flex:1}}/>
          <input type="text" value={presetName} onChange={e => setPresetName(e.target.value)} placeholder="preset name…"
            style={{fontFamily:'var(--mono)',fontSize:11,padding:'4px 8px',background:'var(--bg-2)',color:'var(--ink)',border:'1px solid var(--line)',borderRadius:3,width:160}}/>
          <button className="btn" style={{fontSize:11,opacity: presetName.trim() ? 1 : 0.4}} disabled={!presetName.trim()}
            onClick={savePreset}>Save as preset</button>
        </div>
        {presetNames.length === 0 && (
          <div className="mono tiny muted" style={{marginTop:8}}>
            No saved presets yet. Tweak any agent's params, then type a name and click <em>Save as preset</em>. Loading a preset overwrites current values; reverting wipes them back to defaults.
          </div>
        )}
      </div>

      {showAllParams && (
        <div className="card" style={{marginBottom:16,padding:14}}>
          <div className="card-head" style={{marginBottom:10}}>
            <div className="card-title">All agent params · overview</div>
            <div className="card-meta">{modifiedCount} of {totalParamCount} modified</div>
          </div>
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontFamily:'var(--mono)',fontSize:10}}>
              <thead>
                <tr style={{textAlign:'left',color:'var(--ink-3)',borderBottom:'1px solid var(--line)'}}>
                  <th style={{padding:'6px 8px'}}>Agent</th>
                  <th style={{padding:'6px 8px'}}>Param</th>
                  <th style={{padding:'6px 8px',textAlign:'right'}}>Current</th>
                  <th style={{padding:'6px 8px',textAlign:'right'}}>Default</th>
                  <th style={{padding:'6px 8px'}}>State</th>
                </tr>
              </thead>
              <tbody>
                {AGENTS.flatMap(a => (AGENT_PARAM_DEFS[a.id] || []).map(def => {
                  const cur = agentParams[a.id]?.[def.key];
                  const dflt = AGENT_PARAMS_DEFAULT[a.id]?.[def.key];
                  const eff = cur !== undefined ? cur : dflt;
                  const modified = cur !== undefined && dflt !== undefined && Math.abs(cur - dflt) > def.step * 0.5;
                  return (
                    <tr key={a.id + ':' + def.key} style={{borderBottom:'1px solid var(--line-2)'}}>
                      <td style={{padding:'4px 8px',color:a.color}}>{a.glyph} {a.name}</td>
                      <td style={{padding:'4px 8px',color:'var(--ink-2)'}}>{def.label}</td>
                      <td style={{padding:'4px 8px',textAlign:'right',color: modified ? 'var(--warn)' : 'var(--ink-2)'}}>{def.fmt(eff)}</td>
                      <td style={{padding:'4px 8px',textAlign:'right',color:'var(--ink-3)'}}>{def.fmt(dflt)}</td>
                      <td style={{padding:'4px 8px',color: modified ? 'var(--warn)' : 'var(--ink-4)'}}>{modified ? 'modified' : 'default'}</td>
                    </tr>
                  );
                }))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {families.map(family => (
        <div key={family} style={{marginBottom:24}}>
          <div style={{fontFamily:'var(--mono)',fontSize:10,letterSpacing:'0.14em',color:'var(--ink-3)',textTransform:'uppercase',marginBottom:10,paddingBottom:6,borderBottom:'1px solid var(--line)'}}>{family}</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(290px,1fr))',gap:10}}>
            {family === families[0] && evidence?.trend && (
              <div className="mono tiny" style={{gridColumn:'1 / -1',color: evidence.trend.mean > 0 && evidence.trend.t >= 1 ? 'var(--up)' : 'var(--ink-3)',marginBottom:4}}>
                TREND SCORE (what Rank &amp; tilt ranks by) · next-month IC {evidence.trend.mean >= 0 ? '+' : ''}{evidence.trend.mean.toFixed(3)} · t {evidence.trend.t.toFixed(1)} · {evidence.trend.n} months of {evidence.U?.fictional ? 'fictional' : evidence.U?.imported ? 'imported' : 'broker'} data
              </div>
            )}
            {AGENTS.filter(a => a.family === family).map(agent => {
              const enabled = !enabledAgents || enabledAgents.has(agent.id);
              const hist = agentHistory?.[agent.id] || [];
              const acc  = (hist.length >= 5 ? decayAccuracy(hist) : null) ?? (hist.length >= 2 ? hist.filter(Boolean).length / hist.length : agent.accuracy);
              const w    = agentWeights?.[agent.id] ?? agent.weight;
              const defs = AGENT_PARAM_DEFS[agent.id] || [];
              const isExp = expanded[agent.id];
              const optRes = optResults[agent.id];
              const busy   = optimizing[agent.id];
              const canOpt = !!AGENT_OPTIMIZE_KEYS[agent.id]?.id;

              return (
                <div key={agent.id} className="card" style={{opacity: enabled ? 1 : 0.42, transition:'opacity 0.2s', padding:14}}>
                  <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:'flex',alignItems:'center',gap:6}}>
                        <span style={{fontFamily:'var(--mono)',fontSize:15,color:agent.color}}>{agent.glyph}</span>
                        <span style={{fontWeight:500,fontSize:12}}>{agent.name}</span>
                      </div>
                      <div style={{fontSize:10,color:'var(--ink-3)',marginTop:2,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{agent.desc}</div>
                      {evidence?.ev?.[agent.id] && (() => {
                        const e = evidence.ev[agent.id], core = e.mean > 0 && e.t >= 1;
                        if (!e.n) return <div className="mono" style={{fontSize:9,marginTop:4,color:'var(--ink-4)',letterSpacing:'0.06em'}} title="This agent gives every stock the same score on a given day (a market-wide view), so it can't rank stocks against each other.">MARKET-WIDE · can't rank stocks</div>;
                        return <div className="mono" style={{fontSize:9,marginTop:4,color: core ? 'var(--up)' : 'var(--ink-4)',letterSpacing:'0.06em'}}
                          title="Rank correlation between this agent's score and each stock's return over the next month, averaged over non-overlapping months of the data in use. Agents without positive evidence (t ≥ 1) are advisory: shown, but excluded from decisions.">
                          {core ? 'CORE' : 'ADVISORY'} · next-month IC {e.mean >= 0 ? '+' : ''}{e.mean.toFixed(3)} · t {e.t.toFixed(1)} · {e.n} months
                        </div>;
                      })()}
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:8,flexShrink:0}}>
                      <span style={{fontFamily:'var(--mono)',fontSize:10,color: acc >= 0.6 ? 'var(--up)' : acc < 0.5 ? 'var(--down)' : 'var(--ink-3)'}}>
                        {(acc*100).toFixed(0)}%
                      </span>
                      <button
                        style={{width:34,height:18,borderRadius:9,background:enabled?'var(--virtual)':'var(--line-2)',position:'relative',transition:'background 0.2s',flexShrink:0,border:'none',cursor:'pointer'}}
                        onClick={() => setEnabledAgents(prev => {
                          const next = new Set(prev || AGENTS.map(a=>a.id));
                          next.has(agent.id) ? next.delete(agent.id) : next.add(agent.id);
                          return next;
                        })}
                      >
                        <span style={{position:'absolute',top:2,left:enabled?18:2,width:14,height:14,borderRadius:7,background:'white',transition:'left 0.2s'}}/>
                      </button>
                    </div>
                  </div>

                  {defs.length > 0 && (
                    <div style={{marginTop:10}}>
                      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
                        <button className="mono tiny muted" style={{fontSize:9,letterSpacing:'0.06em',cursor:'pointer'}}
                          onClick={() => setExpanded(e => ({...e, [agent.id]: !isExp}))}>
                          {isExp ? '▾ hide params' : '▸ params'}
                        </button>
                        {agentParams[agent.id] && Object.keys(agentParams[agent.id]).length > 0 && (
                          <button className="mono tiny" style={{fontSize:9,letterSpacing:'0.04em',cursor:'pointer',color:'var(--warn)'}}
                            onClick={() => setAgentParams(p => { const next = { ...p }; delete next[agent.id]; return next; })}
                            title="Revert this agent's params to defaults">↺ revert agent</button>
                        )}
                      </div>
                      {isExp && (
                        <div style={{marginTop:8,display:'flex',flexDirection:'column',gap:8}}>
                          {defs.map(def => {
                            const val = gp(agent.id, def.key);
                            const v = val !== undefined ? val : (AGENT_PARAMS_DEFAULT[agent.id]?.[def.key] ?? def.min);
                            const defVal = AGENT_PARAMS_DEFAULT[agent.id]?.[def.key] ?? def.min;
                            const defPct = ((defVal - def.min) / (def.max - def.min)) * 100;
                            const isModified = Math.abs(v - defVal) > def.step * 0.5;
                            return (
                              <div key={def.key}>
                                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:3}}>
                                  <div style={{display:'flex',alignItems:'center',gap:4}}>
                                    <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--ink-3)'}}>{def.label}</span>
                                    {def.hint && (
                                      <span title={def.hint} style={{cursor:'help',fontFamily:'var(--mono)',fontSize:8,color:'var(--ink-4)',lineHeight:1,borderRadius:'50%',border:'1px solid var(--line-2)',width:13,height:13,display:'inline-flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>?</span>
                                    )}
                                  </div>
                                  <div style={{display:'flex',alignItems:'center',gap:6}}>
                                    {isModified && <span style={{fontFamily:'var(--mono)',fontSize:8,color:'var(--warn)',letterSpacing:'0.04em'}}>modified</span>}
                                    <span style={{fontFamily:'var(--mono)',fontSize:9,color: isModified ? 'var(--ink)' : 'var(--ink-2)'}}>{def.fmt(v)}</span>
                                  </div>
                                </div>
                                <div style={{position:'relative'}}>
                                  <input type="range" min={def.min} max={def.max} step={def.step} value={v}
                                    onChange={e => sp(agent.id, def.key, parseFloat(e.target.value))}
                                    style={{width:'100%',accentColor:agent.color}}/>
                                  {/* default-value tick mark */}
                                  <div style={{position:'absolute',bottom:-6,left:`calc(${defPct}% - 1px)`,width:2,height:5,background:'var(--ink-4)',borderRadius:1}} title={`Default: ${def.fmt(defVal)}`}/>
                                  <div style={{position:'absolute',bottom:-14,left:`calc(${defPct}% - 12px)`,width:26,textAlign:'center',fontFamily:'var(--mono)',fontSize:7,color:'var(--ink-4)',whiteSpace:'nowrap',pointerEvents:'none'}}>↑ def</div>
                                </div>
                                <div style={{height:14}}/>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}

                  <div style={{marginTop:10,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
                    {canOpt ? (
                      <button className="btn" style={{fontSize:9,padding:'3px 9px',opacity:busy?0.5:1}}
                        onClick={() => !busy && optimize(agent.id)} disabled={busy}>
                        {busy ? '⟳ …' : '⚡ Optimise'}
                      </button>
                    ) : <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--ink-4)'}}>no opt</span>}
                    {optRes && (
                      <span style={{fontFamily:'var(--mono)',fontSize:9,color:'var(--virtual)'}}>
                        {optRes.noData ? 'connect a broker to optimise on its history' : optRes.bestValue == null ? 'too few signals to score'
                          : <>best {AGENT_OPTIMIZE_KEYS[agent.id]?.id}={optRes.bestValue} · {optRes.bestExpectancy >= 0 ? '+' : ''}{(optRes.bestExpectancy*1e4).toFixed(0)}bp / 5d</>}
                      </span>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
};

        <h1 className="page-title">How to get the most out of <em>Shoal.</em></h1>

        <Sec n="1" title="Start here: the recommended way to use Shoal">
          <ol style={{margin:'0 0 0 18px',padding:0}}>
            <li><b>Connect Alpaca paper trading</b> in <Go to="settings">Settings</Go> (free; IG works too but allows little price history per week).</li>
            <li><b>Keep the defaults</b>: style <b>Rank &amp; tilt</b>, risk level <b>Balanced</b>, Autopilot off. They're the settings with the most evidence behind them.</li>
            <li><b>Check it on history first</b>: mode SIMULATED, Replay data <b>Broker</b> (or an imported 10-year CSV), speed 100×. Watch <b>Shoal vs buy &amp; hold</b> on the <Go to="dashboard">Dashboard</Go>. The <Go to="backtest">Backtest</Go> gives the same answer in seconds.</li>
            <li><b>Paper trade</b>: switch the mode to VIRTUAL. At the next US market open (14:30–21:00 UK time) it buys its top stocks, then re-ranks once a month. If nothing happens, read the <b>BOT STATUS</b> line on the dashboard.</li>
            <li><b>Judge it over months, against buy &amp; hold</b>, not day by day. Consider LIVE only after paper results hold up, and start small.</li>
            <li><b>Test ideas in the labs before changing anything live</b>: <Go to="swing">Swing lab</Go>, <Go to="intraday">Intraday lab</Go>, <Go to="optimiser">Optimiser</Go>. Each says GO or NO-GO on days the idea wasn't fitted to.</li>
          </ol>
        </Sec>

        <Sec n="2" title="What the testing has shown so far (real prices, after costs)">
          <T head={['Approach', 'Result']} rows={[
            ['Rank & tilt (default)', 'About the same as buy & hold with smaller worst drops: 12 stocks + sector funds 2017–2026 +1153% vs +1178%, worst drop −39% vs −49%. Trailed on sector funds alone. Helps most in long bear markets (2022). Not yet tested on the 100-stock list: run the Backtest on broker history to check.'],
            ['Day trading (Intraday lab, Alpaca 5-minute, 40 days)', 'NO-GO. No agent predicted the next 30 minutes; the best made ~4bp before a 10bp round-trip cost.'],
            ['Agents together, 2 days – 1 month (Swing lab)', 'NO-GO on 2013–2018 and 2016–2026 data, as votes or ranked readings: no reliable stock picking on unseen years.'],
            ['Autopilot (combination model)', '153% vs 175% for the trend score alone (2015–2018), so it is off by default.'],
            ['Crash guard', 'Cut the drops but missed the rebounds; not used.'],
          ]}/>
          <p style={{margin:'8px 0 0'}}><b>Bottom line:</b> the trend score behind Rank &amp; tilt is the only part with consistent evidence. Treat the other agents as commentary unless a lab says otherwise. Past results don't guarantee future ones.</p>
        </Sec>

        <Sec n="3" title="Modes">
          <T rows={[
            [<span className="pill virtual">◐ SIMULATED</span>, 'Replays daily history in the browser (broker, imported CSV or a fictional market) with local fills. No orders sent. Use it to see how a style behaves.'],
            [<span className="pill virtual">◑ VIRTUAL</span>, 'Real orders to your Alpaca paper or IG demo account. No real money. Only trades while the US market is open.'],
            [<span className="pill live">◉ LIVE</span>, 'Real money through your live account. Daily loss limit and Autopilot caps apply. Use with care.'],

          <p style={{margin:'8px 0 0'}}>The bot runs in this browser tab: <b>keep the tab open</b> for VIRTUAL and LIVE to keep trading, or turn on <b>Server trading</b> (Settings) so the server runs Rank &amp; tilt once a day on your Alpaca paper account without a browser. While server trading is on for the account you're connected to, the browser only watches.</p>

          <ul style={{margin:'0 0 0 18px',padding:0}}>

            [<Go to="activity">Live activity</Go>, 'Each trade as it happens, with the reason.'],
            [<Go to="history">Trade history</Go>, 'Every order and outcome for the current mode; export to CSV.'],
            [<Go to="trade">Trade detail</Go>, 'One trade: the reason, the agents\' views at the time, the result.'],
            [<Go to="learning">Strategy / learning</Go>, 'Agent weights over time and the reason for each, plus Autopilot\'s log.'],

            [<Go to="swing">Swing lab</Go>, 'Do the agents together call the next 2 days – 1 month? Decision cards per stock, GO / NO-GO.'],
            [<Go to="intraday">Intraday lab</Go>, 'Do intraday agents call the next 15–60 minutes after costs? Plus the SPY open → close test. Alpaca only.'],
            [<Go to="agentconfig">Agent config</Go>, 'Switch agents on/off, tune their parameters, see their evidence.'],
            [<Go to="agentperf">Agent performance</Go>, 'Each agent\'s hit rate on the trades the bot closed (a record, not the weights).'],
            [<Go to="pnltrend">P/L trend</Go>, 'Cumulative profit and loss of closed trades.'],
            [<Go to="market">Market map</Go>, 'Quick overview: today\'s move and how strongly the agents agree, per stock.'],
            [<Go to="sectors">Sector / Universe</Go>, 'The stocks the bot watches, by sector (edit the list in Settings → Stocks watched).'],
          ]}/>
        </Sec>

        <Sec n="7" title="Settings that matter (and the ones to leave alone)">
          <ul style={{margin:'0 0 0 18px',padding:0}}>
            <li><b>Style</b> and <b>Risk level</b>: the two that change results. Risk level sets stocks held (Cautious 16 · Balanced 12 · Bold 8), share invested, daily loss limit and position sizes.</li>
            <li><b>Stocks watched</b>: 100 large US stocks across 11 sectors by default. Edit the list (or go back to the original 25) in Settings; the app reloads to apply it. Order matters: IG uses the first 30, the Intraday lab the first 40. Re-check Rank &amp; tilt in the Backtest after changing it.</li>
            <li><b>Replay data</b> (SIMULATED): Broker, Imported CSV or Fictional. Fictional prices show behaviour, never evidence.</li>
            <li><b>Daily loss limit</b>: stops new positions for the day once equity is down by it.</li>
            <li><b>Autopilot</b>: leave off unless the Swing lab shows the agents together beat the trend score on your data.</li>
            <li><b>Advanced</b> (trading cost, history length, stocks held, max holding period, agent pruning): leave at the defaults unless a lab or the Optimiser's held-out check says otherwise. Max holding period only affects Trade both ways.</li>
          </ul>
        </Sec>

        <Sec n="8" title="Reading the labs and results">
          <T rows={[
            ['GO / BORDERLINE / NO-GO', 'GO: it made money after costs on days it hadn\'t seen, consistently, and beat the simple alternative. BORDERLINE: positive but not reliable. NO-GO: don\'t trade it.'],
            ['Unseen days', 'Days the model or settings were not fitted on. Only these count; results on fitted days always look good.'],
            ['bp (basis point)', '0.01%. A 5bp cost per side is 10bp (0.1%) per round trip.'],
            ['IC (information coefficient)', 'How well scores line up with what happened next. 0 = none; 0.02–0.05 is typical of anything real.'],
            ['t', 'How consistent an effect was across periods. About 2 or more is unlikely to be luck; agents need 3 in the Swing lab because many are tested at once.'],
            ['Sharpe', 'Return per unit of risk (higher is better). Buy & hold of these stocks is around 1.0.'],
            ['Worst drop', 'The largest fall from a peak before recovering.'],
            ['Buy & hold', 'Owning every stock in equal amounts and never selling: the bar every strategy should beat.'],
          ]}/>
        </Sec>

        <Sec n="9" title="Limits and safety">
          <ul style={{margin:'0 0 0 18px',padding:0}}>
            <li><b>Market hours</b>: VIRTUAL and LIVE only place orders 9:30–16:00 New York time (14:30–21:00 UK).</li>
            <li><b>Day-trade rule</b>: accounts under $25,000 may make at most 3 same-day round trips in 5 business days.</li>
            <li><b>Data</b>: Alpaca's free feed covers part of US volume; IG allows ~10,000 historical price points a week (this browser keeps a copy so only new days are fetched).</li>
            <li><b>Costs</b>: every buy and sell pays spread and slippage; frequent trading needs a bigger edge to pay for it.</li>
            <li><b>Security</b>: the app sits behind a <b>login</b> (7 days, then log in again; Settings has Log out); connecting a broker needs this server's <b>access code</b> unless you're logged in; a broker session lasts 8 hours, then you reconnect; your secret is never stored in the browser or on disk, only inside an encrypted session token. To cut off access at once, regenerate your keys in Alpaca's dashboard.</li>
            <li>This is a research and paper-trading tool. Nothing here is financial advice.</li>
          </ul>
        </Sec>
      </div>
    </div>
  );

const App = () => {

  const [tradesResetAt, setTradesResetAt] = React.useState(() => {

  });
  // Global trade store — seeded from TRADES (filtered by reset), appended-to by the swarm tick.

  const [trades, setTrades] = React.useState([]);
  const [balance, setBalance] = React.useState(() => {

  const [startingBalance, setStartingBalance] = React.useState(() => {

  const [alpaca, setAlpaca] = React.useState(() => {
    const saved = localStorage.getItem('shoal_alpaca');

  });
  const [risk, setRisk] = React.useState(() => {
    try { return { ...RISK_DEFAULTS, ...JSON.parse(localStorage.getItem('shoal_risk_v2') || '{}') }; } catch (_) { return { ...RISK_DEFAULTS }; }
  });
  React.useEffect(() => { try { localStorage.setItem('shoal_risk_v2', JSON.stringify(risk)); } catch (_) {} }, [risk]);
  const [blacklistedSymbols, setBlacklistedSymbols] = React.useState(() => new Set());
  const [slippageLog, setSlippageLog] = React.useState([]);

  // Simulation speed multiplier (only affects SIMULATED mode)

  // UI state: toasts, theme, sidebar, nav group collapse
  const [toasts, setToasts] = React.useState([]);
  const [themeMode, setThemeMode] = React.useState(() => localStorage.getItem('shoal_theme') || 'dark');
  const [sidebarOpen, setSidebarOpen] = React.useState(false);
  const [navGroups, setNavGroups] = React.useState({ workspace: true, system: true });

  // Agent learning state
  const [agentWeights, setAgentWeights] = React.useState(() => defaultWeightsFor(risk.style));
  const [agentHistory, setAgentHistory] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('shoal_agent_history_v3') || '{}'); } catch (_) { return {}; }
  });
  const [agentAccuracySeries, setAgentAccuracySeries] = React.useState({});
  // Per-regime agent accuracy (feeds regime-aware weighting when it is switched on in Settings)
  const [agentRegimeHistory, setAgentRegimeHistory] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('shoal_agent_regime_history_v1') || '{}'); } catch (_) { return {}; }
  });
  React.useEffect(() => {
    try { localStorage.setItem('shoal_agent_regime_history_v1', JSON.stringify(agentRegimeHistory)); } catch (_) {}
  }, [agentRegimeHistory]);
  const agentRegimeHistoryRef = React.useRef(agentRegimeHistory);
  React.useEffect(() => { agentRegimeHistoryRef.current = agentRegimeHistory; }, [agentRegimeHistory]);
  const [lastSignals, setLastSignals] = React.useState(() => SIGNALS_ALL['NVDA'] || null);
  const [swarmFocus, setSwarmFocus] = React.useState(null); // { sym, votes, dir, confidence, ts }
  const [agentParams, setAgentParams] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('shoal_agent_params_v2') || '{}'); } catch (_) { return {}; }
  });
  React.useEffect(() => {
    try { localStorage.setItem('shoal_agent_params_v2', JSON.stringify(agentParams)); } catch (_) {}
  }, [agentParams]);
  const [agentParamPresets, setAgentParamPresets] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('shoal_agent_param_presets_v2') || '{}'); } catch (_) { return {}; }
  });
  React.useEffect(() => {
    try { localStorage.setItem('shoal_agent_param_presets_v2', JSON.stringify(agentParamPresets)); } catch (_) {}
  }, [agentParamPresets]);
  const [enabledAgents, setEnabledAgents] = React.useState(() => new Set(AGENTS.map(a => a.id)));
  const [confHistory, setConfHistory] = React.useState(() => [...CONFIDENCE_HISTORY]);
  const [weightHistory, setWeightHistory] = React.useState(() => {
    try {
      const stored = JSON.parse(localStorage.getItem('shoal_weight_history_v3') || 'null');
      // snapshots without dates come from the old per-trade reweighting and no longer mean anything
      if (stored && typeof stored === 'object' && Array.isArray(stored._when)) return stored;
    } catch (_) {}
    return {};
  });
  const agentWeightsRef  = React.useRef(agentWeights);
  const agentHistoryRef  = React.useRef(agentHistory);
  const enabledAgentsRef = React.useRef(enabledAgents);
  const riskRef          = React.useRef(risk);
  const tradesRef        = React.useRef(trades);
  const activeSymbolRef  = React.useRef(activeSymbol);
  const blacklistedSymbolsRef = React.useRef(blacklistedSymbols);
  const balanceRef       = React.useRef(balance);
  const modeRef          = React.useRef(mode);
  React.useEffect(() => { modeRef.current = mode; }, [mode]);
  const startingBalanceRef = React.useRef(startingBalance);
  // SIMULATED mode: replay of the broker's daily bars (global bar index; null until started)
  const replayIdxRef = React.useRef(null);
  const replayAnchorRef = React.useRef(null); // { g, equity } where the current replay pass started
  const [replayInfo, setReplayInfo] = React.useState(null);
  // Why the bot is (not) trading right now in VIRTUAL / LIVE — shown on the dashboard
  const [tradeStatus, setTradeStatus] = React.useState(null);
  const sayStatus = (st) => setTradeStatus(p => (p && st && p.text === st.text ? p : st));
  const [replaySignals, setReplaySignals] = React.useState(null);
  // Orders sent to the broker but not yet reflected in positions (sym → time), to avoid doubling up
  const pendingOrdersRef = React.useRef(new Map());
  // Daily loss limit: equity at the start of the trading day (a replayed bar counts as a day)
  const dayStartRef = React.useRef({ key: null, equity: 0, hit: false });
  const [lossHit, setLossHit] = React.useState(null);
  // Autopilot: score book per (universe, params), change log, scheduling state
  const bookCacheRef = React.useRef({ U: null, key: null, book: null });
  const bookFor = (U, params) => {
    const key = JSON.stringify(params || {});
    const c = bookCacheRef.current;
    if (c.U !== U || c.key !== key) bookCacheRef.current = { U, key, book: SS.createScoreBook(U, params) };
    return bookCacheRef.current.book;
  };
  const [autopilotLog, setAutopilotLog] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('shoal_autopilot_log_v1') || '[]'); } catch (_) { return []; }
  });
  React.useEffect(() => { try { localStorage.setItem('shoal_autopilot_log_v1', JSON.stringify(autopilotLog.slice(0, 100))); } catch (_) {} }, [autopilotLog]);
  const autopilotStateRef = React.useRef({ lastCheck: null, lastTune: null, queue: [], lastPromoDay: null, lastParamDay: null });
  const agentParamsRef = React.useRef(agentParams);
  React.useEffect(() => { agentParamsRef.current = agentParams; }, [agentParams]);
  // Recent votes of every agent on every ticker — sample for the correlation penalty
  const voteRowsRef = React.useRef([]);
  React.useEffect(() => { startingBalanceRef.current = startingBalance; }, [startingBalance]);
  React.useEffect(() => { agentWeightsRef.current  = agentWeights;  }, [agentWeights]);
  React.useEffect(() => { agentHistoryRef.current   = agentHistory;   }, [agentHistory]);
  React.useEffect(() => { riskRef.current = risk; }, [risk]);
  React.useEffect(() => { enabledAgentsRef.current  = enabledAgents;  }, [enabledAgents]);
  React.useEffect(() => { tradesRef.current = trades; }, [trades]);
  React.useEffect(() => { activeSymbolRef.current = activeSymbol; }, [activeSymbol]);
  React.useEffect(() => { blacklistedSymbolsRef.current = blacklistedSymbols; }, [blacklistedSymbols]);
  React.useEffect(() => { balanceRef.current = balance; }, [balance]);

  // Declared here so the lastSignals effect below (which depends on liveSignals) doesn't hit TDZ
  const [liveSignals, setLiveSignals] = React.useState(null);
  const [livePrices, setLivePrices] = React.useState({});

  // Imported history (CSV, local only) — loaded from IndexedDB on start
  const [importedUniverse, setImportedUniverse] = React.useState(null);
  const importedUniverseRef = React.useRef(null);
  React.useEffect(() => { importedUniverseRef.current = importedUniverse; }, [importedUniverse]);
  React.useEffect(() => {
    idbStore.get('import_v1').then(imp => { if (imp && imp.bars) setImportedUniverse(buildImportedUniverse(imp)); }).catch(() => {});
  }, []);
  const importCsv = async (fileList) => {
    const files = [...(fileList || [])];
    if (!files.length) return { ok: false, msg: 'No file chosen.' };
    const bytes = files.reduce((n, f) => n + f.size, 0);
    if (bytes > IMPORT_MAX_BYTES) return { ok: false, msg: `Files total ${(bytes / 1e6).toFixed(0)} MB; the limit is ${IMPORT_MAX_BYTES / 1e6} MB.` };
    try {
      const imp = parseBarsCsv(await Promise.all(files.map(f => f.text())));
      await idbStore.set('import_v1', imp).catch(() => {});
      setImportedUniverse(buildImportedUniverse(imp));
      return { ok: true, msg: `Imported ${imp.symbols.length} symbols${files.length > 1 ? ` from ${files.length} files` : ''}, ${imp.days} days (${imp.from} → ${imp.to})${imp.dropped.length ? `; dropped ${imp.dropped.join(', ')} (too short)` : ''}${imp.skipped ? `; skipped ${imp.skipped} invalid rows` : ''}.` };
    } catch (err) { return { ok: false, msg: err.message }; }
  };
  const removeImport = async () => { await idbStore.del('import_v1').catch(() => {}); setImportedUniverse(null); };

  // Live market data as an indicator universe (full OHLCV bars from the broker), when connected
  const [liveUniverse, setLiveUniverse] = React.useState(null);
  const liveUniverseRef = React.useRef(null);
  const liveBarsNoteRef = React.useRef(null); // why broker history hasn't loaded, for the bot status line
  React.useEffect(() => { liveUniverseRef.current = liveUniverse; }, [liveUniverse]);

  // Signals for the live universe at its latest bar; recomputed when bars refresh or params change
  React.useEffect(() => {
    if (!liveUniverse) { setLiveSignals(null); return; }
    const sigs = {};
    for (const sym of liveUniverse.syms) {
      const s = SS.agentSignals(liveUniverse, sym, null, agentParams);
      if (s) sigs[sym] = s;
    }
    setLiveSignals(Object.keys(sigs).length ? sigs : null);
  }, [liveUniverse, agentParams]);

  // Signals shown for the active symbol: the replayed day in SIMULATED, live bars otherwise, demo data without a broker
  React.useEffect(() => {
    const src = (mode === 'SIMULATED' && replaySignals) ? replaySignals : liveSignals;
    setLastSignals((src || {})[activeSymbol] || SIGNALS_ALL[activeSymbol] || null);
  }, [activeSymbol, liveSignals, replaySignals, mode]);

  // Optimiser: frozen settings + comparisons (persisted)
  const [optimiser, setOptimiserState] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('shoal_optimiser_v1') || 'null') || { frozen: null, comparisons: [] }; } catch (_) { return { frozen: null, comparisons: [] }; }
  });
  const optimiserRef = React.useRef(optimiser);
  const setOptimiser = (next) => { optimiserRef.current = next; setOptimiserState(next); };
  React.useEffect(() => { try { localStorage.setItem('shoal_optimiser_v1', JSON.stringify(optimiser)); } catch (_) {} }, [optimiser]);

  const applyAndFreeze = (result) => {
    const cfg = result.best.cfg;
    const before = { cfg: configFromSettings(risk, optimiserRef.current.frozen), params: agentParams, risk: { ...risk }, costBps: result.costBps };
    const params = SS.configParams(cfg, agentParams);
    const frozen = {
      cfg, params, before,
      at: { g: result.asOf, date: barDate(result.U, result.asOf), srcKey: result.srcKey },
      optimised: { days: result.days, ret: result.best.ret, baselineRet: result.baseline.ret, bench: result.baseline.bench },
      costBps: result.costBps,
    };
    setOptimiser({ frozen, comparisons: [] }); // before setRisk, so the weights effect sees the frozen config
    setRisk({ ...risk, style: cfg.style, topK: cfg.topK ?? risk.topK, confidence: Math.round(cfg.minConf * 100), investFraction: cfg.investFraction,
      atrStop: cfg.atrStop, atrTarget: cfg.atrTarget, maxHoldHours: Math.round(cfg.maxHold * 6.5), atrStops: true,
      riskLevel: 'custom', autopilot: cfg.style === 'tilt' && cfg.score === 'model', autopilotFrozen: false });
    setAgentParams(params);
    setAgentWeights(SS.configWeights(cfg));
  };
  const unfreeze = (restore) => {
    const f = optimiserRef.current.frozen;
    setOptimiser({ frozen: null, comparisons: optimiserRef.current.comparisons || [] });
    if (restore && f) { setRisk({ ...f.before.risk }); setAgentParams(f.before.params || {}); setAgentWeights(defaultWeightsFor(f.before.risk.style)); }
  };
  const recordComparison = (c) => setOptimiser({ ...optimiserRef.current, comparisons: [{ ...c, ts: Date.now() }, ...(optimiserRef.current.comparisons || [])].slice(0, 20) });

  // Style / Autopilot changes reset the agent weights to the style's starting point
  const prevStrategyRef = React.useRef(null);
  React.useEffect(() => {
    const key = `${risk.style}|${!!risk.autopilot}`;
    if (prevStrategyRef.current === key) return;
    const first = prevStrategyRef.current === null;

    const frozenNow = optimiserRef.current?.frozen;
    setAgentWeights(frozenNow ? SS.configWeights(frozenNow.cfg) : defaultWeightsFor(risk.style));
    autopilotStateRef.current = { lastCheck: null, lastTune: null, queue: [], lastPromoDay: null, lastParamDay: null };
    if (!first && risk.autopilot) {
      setAutopilotLog(prev => [{ ts: Date.now(), kind: 'info', when: new Date().toISOString().slice(0, 10),
        text: `Autopilot on: the combination model (trend score + agents with positive evidence) refits every quarter; a new version is adopted only if it ranked stocks better on the 60 days it wasn't fitted on.` }, ...prev].slice(0, 100));
    }
  }, [risk.style, risk.autopilot]);

  // Watch for newly closed trades → update agent weights + accuracy history + accuracy series
  const prevTradesRef = React.useRef([]);
  React.useEffect(() => {
    const prevIds = new Set(prevTradesRef.current.filter(t => t.pnl != null).map(t => t.id));
    const newlyClosed = trades.filter(t => t.pnl != null && t.votes && !prevIds.has(t.id));
    if (newlyClosed.length > 0) {
      const newHistory = newlyClosed.reduce((acc, t) => updateAgentHistory(acc, t), agentHistoryRef.current);
      setAgentRegimeHistory(newlyClosed.reduce((acc, t) => updateAgentRegimeHistory(acc, t), agentRegimeHistoryRef.current));
      setAgentHistory(newHistory);
      // Append one accuracy data-point per agent for every batch of closes (keeps series lengths in sync)
      setAgentAccuracySeries(series => {
        const next = { ...series };
        for (const a of AGENTS) {
          const hist = newHistory[a.id] || [];
          const acc  = hist.length >= 2 ? hist.filter(Boolean).length / hist.length : a.accuracy;
          next[a.id] = [...(next[a.id] || []), acc];
        }
        return next;
      });
    }
    prevTradesRef.current = trades;
  }, [trades]);

  // Backend availability (null = checking, true = online, false = offline)
  const [backendOk, setBackendOk] = React.useState(null);

  const [marketStatus, setMarketStatus] = React.useState(() => getMarketStatus());
  const [streamRetry, setStreamRetry] = React.useState(0);
  React.useEffect(() => {
    setMarketStatus(getMarketStatus());
    const id = setInterval(() => setMarketStatus(getMarketStatus()), 30000);
    return () => clearInterval(id);
  }, []);

  // Stable ref so interval callbacks can read latest alpaca without re-subscribing
  const alpacaRef = React.useRef(alpaca);
  // The broker session ran out (8-hour limit) or was revoked: drop it and say so
  const expireSession = () => {
    setAlpaca(a => (a.connected ? { ...a, connected: false, token: null, expired: true } : a));
    const t0 = { id: Date.now(), type: 'close-loss', sym: '⚠', text: 'broker session expired (8 h limit): reconnect in Settings' };
    setToasts(prev => [...prev.slice(-4), t0]);
    setTimeout(() => setToasts(prev => prev.filter(x => x.id !== t0.id)), 10000);
  };
  React.useEffect(() => { alpacaRef.current = alpaca; }, [alpaca]);

  const marketStatusRef = React.useRef(marketStatus);
  React.useEffect(() => { marketStatusRef.current = marketStatus; }, [marketStatus]);

  // Live signals + prices computed from real Alpaca daily bars.
