<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Shoal — Adaptive Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>:root {
  --bg: #0a0b0d;
  --bg-1: #101216;
  --bg-2: #161920;
  --bg-3: #1d2129;
  --line: #232832;
  --line-2: #2d3340;
  --ink: #ece8df;
  --ink-2: #b8b3a8;
  --ink-3: #6f6b62;
  --ink-4: #4a4740;
  --teal: #2dd4bf;
  --virtual: #7dd87d;
  --virtual-dim: #4a8a4a;
  --live: #ff8a3d;
  --live-dim: #b85a1f;
  --up: #6dd47e;
  --down: #ff6b6b;
  --warn: #f0c674;
  --info: #7ec0ee;
  --serif: 'IBM Plex Serif', Georgia, serif;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body, #root {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "ss02";
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }

/* ------- shell ------- */
.shell {
  display: grid;
  grid-template-columns: 232px 1fr;
  height: 100vh;
  position: relative;
}

.shell.live::before {
  content: '';
  position: fixed;
  inset: 0;
  border: 3px solid var(--live);
  pointer-events: none;
  z-index: 100;
  box-shadow: inset 0 0 60px rgba(255, 138, 61, 0.15);
}

.shell.live::after {
  content: '◉ LIVE TRADING — REAL CAPITAL AT RISK';
  position: fixed;
  top: 0; left: 50%;
  transform: translateX(-50%);
  background: var(--live);
  color: #1a0a00;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.18em;
  padding: 4px 18px;
  border-radius: 0 0 4px 4px;
  z-index: 101;
}

/* ------- sidebar ------- */
.sidebar {
  background: var(--bg-1);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 18px 0;
  overflow-y: auto;
}

.brand {
  padding: 0 20px 20px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 14px;
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
}

.brand-mark {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--virtual), var(--virtual-dim));
  position: relative;
}
.brand-mark::after {
  content: '';
  position: absolute;
  inset: -4px;
  border: 1px dashed var(--ink-4);
  border-radius: 50%;
  animation: rotate 22s linear infinite;
}
.shell.live .brand-mark { background: radial-gradient(circle at 30% 30%, var(--live), var(--live-dim)); }

@keyframes rotate {
  to { transform: rotate(360deg); }
}

.brand-name {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 400;
  letter-spacing: -0.01em;
}
.brand-sub {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-3);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding-left: 32px;
}

.mode-pill {
  margin: 0 16px 14px;
  border: 1px solid var(--line-2);
  border-radius: 4px;
  padding: 10px 12px;
  background: var(--bg-2);
  cursor: pointer;
  transition: border-color 120ms;
}
.mode-pill:hover { border-color: var(--ink-4); }

.mode-pill-row { display: flex; align-items: center; justify-content: space-between; }
.mode-pill-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.mode-pill-value {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--virtual);
}
.shell.live .mode-pill-value { color: var(--live); }
.mode-dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--virtual);
  margin-right: 6px;
  box-shadow: 0 0 8px currentColor;
  vertical-align: middle;
}
.shell.live .mode-dot { background: var(--live); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.nav-section {
  padding: 6px 0;
}
.nav-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-3);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 12px 22px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 22px;
  font-size: 13px;
  color: var(--ink-2);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all 120ms;
}
.nav-item:hover { color: var(--ink); background: var(--bg-2); }
.nav-item.active {
  color: var(--ink);
  background: var(--bg-2);
  border-left-color: var(--virtual);
}
.shell.live .nav-item.active { border-left-color: var(--live); }

.nav-icon {
  width: 14px; height: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-3);
}
.nav-item.active .nav-icon { color: inherit; }
.nav-num {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
}

.sidebar-foot {
  margin-top: auto;
  padding: 14px 22px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sidebar-foot .row { display: flex; justify-content: space-between; }
.sidebar-foot .ok { color: var(--virtual); }

/* ------- main ------- */
.main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.main-scroll {
  flex: 1;
  overflow-y: auto;
}
.notif-strip {
  flex-shrink: 0;
  height: 21px;
  overflow: hidden;
  display: flex;
  flex-direction: row;
  align-items: stretch;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 28px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
}

.crumb {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.crumb b { color: var(--ink); font-weight: 500; }

.topbar-spacer { flex: 1; }

.tick-strip {
  display: flex;
  gap: 18px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-2);
  overflow: hidden;
  max-width: 480px;
}
.tick {
  display: flex;
  gap: 6px;
  align-items: baseline;
  white-space: nowrap;
}
.tick-sym { color: var(--ink); font-weight: 500; }
.tick-up { color: var(--up); }
.tick-dn { color: var(--down); }

.bot-status {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  border: 1px solid var(--line-2);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.bot-status .led {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--virtual);
  box-shadow: 0 0 6px currentColor;
}
.bot-status.paused .led { background: var(--ink-4); box-shadow: none; }
.bot-status.paused { color: var(--ink-3); }

.bot-status button {
  margin-left: 4px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--ink);
}
.bot-status button:hover { color: var(--virtual); }
.shell.live .bot-status button:hover { color: var(--live); }

.page {
  padding: 26px 28px 60px;
  max-width: 1600px;
  width: 100%;
}

.page-head {
  margin-bottom: 22px;
}
.page-eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.page-title {
  font-family: var(--serif);
  font-size: 32px;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.1;
}
.page-title em { font-style: italic; color: var(--ink-2); }
.page-sub {
  margin-top: 8px;
  font-size: 14px;
  color: var(--ink-2);
  max-width: 640px;
  line-height: 1.5;
}

/* ------- cards ------- */
.card {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 18px;
  position: relative;
}
.card-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.card-title {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 400;
  letter-spacing: -0.005em;
}
.card-meta {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
.kpi {
  background: var(--bg-1);
  padding: 18px 20px;
}
.kpi-label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.kpi-value {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 300;
  line-height: 1;
  letter-spacing: -0.01em;
}
.kpi-value.mono { font-family: var(--mono); font-weight: 400; font-size: 22px; }
.kpi-delta {
  font-family: var(--mono);
  font-size: 11px;
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.kpi-delta.up { color: var(--up); }
.kpi-delta.dn { color: var(--down); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }

/* ------- chart common ------- */
.chart-wrap {
  position: relative;
  width: 100%;
}
svg.chart { display: block; width: 100%; }
.gridline { stroke: var(--line); stroke-width: 0.5; }
.axis-text {
  font-family: var(--mono);
  font-size: 9px;
  fill: var(--ink-3);
  letter-spacing: 0.08em;
}

.legend {
  display: flex;
  gap: 14px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-2);
  letter-spacing: 0.06em;
  flex-wrap: wrap;
}
.legend-dot {
  display: inline-block;
  width: 8px; height: 8px;
  margin-right: 6px;
  vertical-align: middle;
}

/* ------- agent / swarm ------- */
.swarm {
  position: relative;
  width: 100%;
  height: 360px;
  background:
    radial-gradient(circle at 50% 50%, rgba(125, 216, 125, 0.04), transparent 70%),
    var(--bg-1);
  border-radius: 6px;
  overflow: hidden;
}
.shell.live .swarm {
  background:
    radial-gradient(circle at 50% 50%, rgba(255, 138, 61, 0.04), transparent 70%),
    var(--bg-1);
}
.agent-node {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  transition: transform 200ms;
}
.agent-node:hover { transform: translate(-50%, -50%) scale(1.15); z-index: 5; }
.agent-disc {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--bg-3);
  border: 1.5px solid var(--ink-4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink);
  position: relative;
}
.agent-disc.buy { border-color: var(--up); box-shadow: 0 0 10px rgba(109, 212, 126, 0.4); }
.agent-disc.sell { border-color: var(--down); box-shadow: 0 0 10px rgba(255, 107, 107, 0.4); }
.agent-disc.hold { border-color: var(--ink-3); }
.agent-name {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 150ms;
  margin-top: 2px;
}
.agent-node:hover .agent-name { opacity: 1; }
.swarm-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.swarm-center .v {
  font-family: var(--serif);
  font-size: 36px;
  font-style: italic;
  color: var(--ink);
}
.swarm-center .l {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* ------- table ------- */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th, .tbl td {
  text-align: left;
  padding: 12px 10px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.tbl th {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
}
.tbl td { color: var(--ink-2); }
.tbl td.mono { font-family: var(--mono); color: var(--ink); }
.tbl tbody tr { transition: background 120ms; cursor: pointer; }
.tbl tbody tr:hover { background: var(--bg-2); }
.tbl tbody tr.selected { background: var(--bg-2); }

.pill {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 3px;
  border: 1px solid currentColor;
  display: inline-block;
}
.pill.buy { color: var(--up); }
.pill.sell { color: var(--down); }
.pill.hold { color: var(--ink-3); }
.pill.virtual { color: var(--virtual); }
.pill.live { color: var(--live); }
.pill.solid {
  background: currentColor;
  border: none;
}
.pill.solid span { color: var(--bg); }

/* ------- buttons ------- */
.btn {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 8px 14px;
  border: 1px solid var(--line-2);
  border-radius: 4px;
  background: var(--bg-2);
  transition: all 120ms;
}
.btn:hover { border-color: var(--ink-3); color: var(--ink); }
.btn.primary {
  background: var(--virtual);
  color: #0a1f0a;
  border-color: var(--virtual);
  font-weight: 500;
}
.btn.primary:hover { background: #95e095; }
.btn.danger {
  background: var(--live);
  color: #1a0a00;
  border-color: var(--live);
  font-weight: 500;
}
.btn.danger:hover { background: #ff9c5c; }
.btn.ghost { background: transparent; }

@keyframes equityFlash {
  0% { color: var(--virtual); text-shadow: 0 0 8px var(--virtual); }
  100% { color: var(--ink); text-shadow: none; }
}
.equity-live {
  animation: equityFlash 500ms ease-out;
}
@keyframes tickPulse {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.2); }
}
.tick-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--virtual);
  margin-right: 6px;
  vertical-align: middle;
  animation: tickPulse 1.2s ease-in-out infinite;
  box-shadow: 0 0 4px currentColor;
}
.tick-dot.fast { animation-duration: 0.5s; background: var(--virtual); }
.tick-dot.short { background: var(--down); }

/* ------- activity feed ------- */
.feed {
  display: flex;
  flex-direction: column;
}
.feed-row {
  display: grid;
  grid-template-columns: 80px 60px 80px 1fr 100px 80px;
  gap: 14px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  align-items: center;
  font-size: 13px;
  cursor: pointer;
  transition: background 120ms;
}
.feed-row:hover { background: var(--bg-2); }
.feed-row.new {
  animation: flash 1s ease-out;
}
@keyframes flash {
  from { background: rgba(125, 216, 125, 0.15); }
  to { background: transparent; }
}
.shell.live .feed-row.new { animation-name: flashLive; }
@keyframes flashLive {
  from { background: rgba(255, 138, 61, 0.15); }
  to { background: transparent; }
}
.feed-time { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.feed-sym { font-family: var(--mono); font-weight: 500; color: var(--ink); }
.feed-reason {
  color: var(--ink-2);
  font-size: 12px;
  font-style: italic;
  font-family: var(--serif);
}
.feed-pnl { font-family: var(--mono); text-align: right; }
.feed-pnl.up { color: var(--up); }
.feed-pnl.dn { color: var(--down); }

/* ------- modals ------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(5, 6, 8, 0.78);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  animation: fadein 200ms;
}
@keyframes fadein { from { opacity: 0; } }
.modal {
  background: var(--bg-1);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  max-width: 540px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  animation: rise 280ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.modal.wide { max-width: 820px; }
@keyframes rise {
  from { transform: translateY(20px); opacity: 0; }
}
.modal-head {
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-title {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 400;
}
.modal-body { padding: 24px; }
.modal-foot {
  padding: 16px 24px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.danger-banner {
  background: linear-gradient(180deg, rgba(255, 138, 61, 0.12), rgba(255, 138, 61, 0.04));
  border: 1px solid var(--live);
  border-radius: 6px;
  padding: 16px;
  margin-bottom: 18px;
  font-size: 13px;
  color: var(--ink);
}
.danger-banner b { color: var(--live); }

.checklist {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 16px 0;
}
.check-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 12px;
  background: var(--bg-2);
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-2);
  border: 1px solid transparent;
}
.check-row:hover { color: var(--ink); }
.check-row.checked { color: var(--ink); border-color: var(--live); }
.check-box {
  width: 16px; height: 16px;
  border: 1.5px solid var(--ink-3);
  border-radius: 3px;
  flex-shrink: 0;
  margin-top: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--bg);
}
.check-row.checked .check-box { background: var(--live); border-color: var(--live); }

/* ------- onboarding ------- */
.onb {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  position: relative;
  overflow: hidden;
}
.onb-top {
  display: flex;
  justify-content: space-between;
  padding: 24px 36px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.onb-step {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
  padding: 0 80px;
  max-width: 1280px;
  margin: 0 auto;
  width: 100%;
}
.onb-art {
  height: 460px;
  position: relative;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background:
    radial-gradient(circle at 30% 30%, rgba(125, 216, 125, 0.08), transparent 60%),
    radial-gradient(circle at 70% 70%, rgba(126, 192, 238, 0.06), transparent 60%),
    var(--bg-1);
}
.onb-eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--virtual);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 14px;
}
.onb-title {
  font-family: var(--serif);
  font-size: 44px;
  line-height: 1.05;
  letter-spacing: -0.02em;
  margin-bottom: 18px;
  font-weight: 300;
}
.onb-title em { font-style: italic; color: var(--ink-2); }
.onb-body {
  color: var(--ink-2);
  line-height: 1.6;
  font-size: 15px;
  margin-bottom: 24px;
  max-width: 480px;
}
.onb-foot {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 36px;
  border-top: 1px solid var(--line);
}
.onb-dots { display: flex; gap: 6px; }
.onb-dot {
  width: 24px; height: 2px;
  background: var(--ink-4);
}
.onb-dot.active { background: var(--virtual); }

/* ------- agent strip ------- */
.agent-strip {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.agent-row {
  display: grid;
  grid-template-columns: 28px 1fr 90px 60px;
  gap: 12px;
  align-items: center;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.agent-row:last-child { border-bottom: none; }
.agent-glyph {
  width: 24px; height: 24px;
  border-radius: 4px;
  background: var(--bg-3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-2);
}
.agent-info { display: flex; flex-direction: column; }
.agent-info .name { font-size: 13px; }
.agent-info .desc {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
  margin-top: 2px;
}
.weight-bar {
  width: 100%; height: 4px;
  background: var(--bg-3);
  position: relative;
  border-radius: 2px;
  overflow: hidden;
}
.weight-bar > div {
  height: 100%;
  background: var(--virtual);
}
.shell.live .weight-bar > div { background: var(--live); }
.weight-num {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink);
  text-align: right;
}

/* ------- reasoning tree ------- */
.reasoning {
  display: flex;
  flex-direction: column;
  gap: 0;
}
.reason-node {
  position: relative;
  padding: 8px 0 8px 24px;
  border-left: 1px dashed var(--line-2);
  margin-left: 8px;
}
.reason-node:last-child { border-left-color: transparent; }
.reason-node::before {
  content: '';
  position: absolute;
  left: -1px; top: 16px;
  width: 18px; height: 1px;
  background: var(--line-2);
}
.reason-node::after {
  content: '';
  position: absolute;
  left: -4px; top: 13px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--bg-1);
  border: 1px solid var(--ink-4);
}
.reason-node.fired::after { background: var(--virtual); border-color: var(--virtual); }
.reason-node.fired-dn::after { background: var(--down); border-color: var(--down); }

.reason-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 14px;
}
.reason-label { font-size: 13px; color: var(--ink); }
.reason-value {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-2);
}
.reason-meta {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  margin-top: 2px;
  letter-spacing: 0.04em;
}

/* ------- heatmap ------- */
.heat {
  display: grid;
  gap: 2px;
}
.heat-cell {
  aspect-ratio: 1.4;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 10px;
  border-radius: 2px;
  color: var(--ink);
}

/* ------- form ------- */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 16px;
}
.field-label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.field-input {
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: 4px;
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 13px;
  outline: none;
  transition: border-color 120ms;
}
.field-input:focus { border-color: var(--virtual); }
.shell.live .field-input:focus { border-color: var(--live); }

.slider-wrap {
  position: relative;
}
input[type=range] {
  -webkit-appearance: none;
  width: 100%;
  height: 4px;
  background: var(--bg-3);
  border-radius: 2px;
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--virtual);
  cursor: pointer;
  border: 2px solid var(--bg);
}
.shell.live input[type=range]::-webkit-slider-thumb { background: var(--live); }

/* ------- tweaks panel ------- */
.tweaks-panel {
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 280px;
  background: var(--bg-1);
  border: 1px solid var(--line-2);
  border-radius: 6px;
  z-index: 50;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
  font-size: 12px;
  animation: rise 220ms;
}
.tweaks-panel header {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.tweaks-panel h4 {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.tweaks-body { padding: 14px; }
.tweak-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  gap: 10px;
}
.tweak-row label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.tweak-opts {
  display: flex;
  gap: 4px;
}
.tweak-opt {
  font-family: var(--mono);
  font-size: 10px;
  padding: 4px 8px;
  border: 1px solid var(--line-2);
  border-radius: 3px;
  cursor: pointer;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.tweak-opt.on { background: var(--bg-3); color: var(--ink); border-color: var(--ink-4); }

/* ------- misc ------- */
.divider { height: 1px; background: var(--line); margin: 18px 0; }
.muted { color: var(--ink-3); }
.mono { font-family: var(--mono); }
.serif { font-family: var(--serif); }
.up { color: var(--up); }
.dn { color: var(--down); }
.warn { color: var(--warn); }
.info { color: var(--info); }
.tiny { font-size: 11px; }

.spark {
  display: inline-block;
  vertical-align: middle;
}

.dialog-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.dialog-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  font-size: 13px;
  border-bottom: 1px solid var(--line);
}
.dialog-row:last-child { border-bottom: none; }
.dialog-row .l { color: var(--ink-3); font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.dialog-row .v { font-family: var(--mono); }

/* ------- sector map ------- */
.sector-map {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 3px;
}
.sector-cell {
  aspect-ratio: 1;
  position: relative;
  border-radius: 3px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 6px;
  font-family: var(--mono);
  font-size: 10px;
  cursor: pointer;
  overflow: hidden;
}
.sector-cell .sym { color: var(--ink); font-weight: 500; }
.sector-cell .pct { font-size: 9px; opacity: 0.85; }

/* ------- backtest split ------- */
.backtest-split {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 16px;
}

.config-block {
  background: var(--bg-2);
  border-radius: 4px;
  padding: 12px;
  margin-bottom: 12px;
}
.config-label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.toggle-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}
.toggle-pill {
  font-family: var(--mono);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 6px 8px;
  border: 1px solid var(--line-2);
  border-radius: 3px;
  text-align: center;
  cursor: pointer;
  color: var(--ink-3);
}
.toggle-pill.on { background: var(--bg-3); color: var(--ink); border-color: var(--ink-4); }

/* ------- toast notifications ------- */
.toast-container {
  display: contents;
}
.toast {
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  border-radius: 0 0 5px 5px;
  border-top: none;
  padding: 0 12px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  display: flex;
  gap: 8px;
  align-items: center;
  animation: toastIn 200ms cubic-bezier(0.2, 0.7, 0.2, 1);
  cursor: pointer;
  white-space: nowrap;
}
.toast.buy { border-left: 3px solid var(--up); }
.toast.sell { border-left: 3px solid var(--down); }
.toast.close-win { border-left: 3px solid var(--up); }
.toast.close-loss { border-left: 3px solid var(--down); }
@keyframes toastIn {
  from { transform: translateY(-8px); opacity: 0; }
}

/* ------- streak badge ------- */
.streak-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  padding: 2px 8px;
  border-radius: 10px;
  border: 1px solid currentColor;
  margin-left: 8px;
}

/* ------- sortable table headers ------- */
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl th.sortable:hover { color: var(--ink-2); }
.sort-arrow { margin-left: 4px; font-size: 8px; opacity: 0.4; }
.sort-arrow.active { opacity: 1; }

/* ------- why-trade modal ------- */
.why-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  gap: 10px;
}
.why-row:last-child { border-bottom: none; }
.why-sym { font-family: var(--mono); font-weight: 500; color: var(--ink); min-width: 52px; }
.why-reason { color: var(--ink-2); font-size: 11px; font-style: italic; flex: 1; }
.why-filter {
  font-family: var(--mono);
  font-size: 9px;
  padding: 2px 7px;
  border-radius: 3px;
  background: var(--bg-3);
  color: var(--warn);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
}
.why-pass {
  font-family: var(--mono);
  font-size: 9px;
  padding: 2px 7px;
  border-radius: 3px;
  background: var(--bg-3);
  color: var(--up);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
}

/* ------- collapsible sidebar ------- */
.nav-group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 22px 6px;
  cursor: pointer;
}
.nav-group-header:hover .nav-label { color: var(--ink-2); }
.nav-group-header .nav-label { margin: 0; padding: 0; }
.nav-chevron {
  font-size: 9px;
  color: var(--ink-4);
  transition: transform 200ms;
  display: inline-block;
}
.nav-chevron.open { transform: rotate(90deg); }

/* ------- theme toggle ------- */
.theme-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 22px;
  cursor: pointer;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.1em;
  border-top: 1px solid var(--line);
  margin-top: 8px;
}
.theme-toggle:hover { color: var(--ink-2); }
.theme-pill {
  width: 30px; height: 14px;
  border-radius: 7px;
  background: var(--bg-3);
  border: 1px solid var(--line-2);
  position: relative;
  transition: background 200ms;
  flex-shrink: 0;
}
.theme-pill::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--ink-3);
  transition: transform 200ms, background 200ms;
}
html.light .theme-pill { background: rgba(30, 138, 62, 0.3); border-color: var(--virtual-dim); }
html.light .theme-pill::after { transform: translateX(16px); background: var(--virtual); }

/* ------- mobile hamburger ------- */
.hamburger {
  display: none;
  flex-direction: column;
  gap: 4px;
  cursor: pointer;
  padding: 6px;
  border-radius: 4px;
  background: none;
  border: none;
}
.hamburger span {
  display: block;
  width: 18px; height: 1.5px;
  background: var(--ink-2);
  border-radius: 1px;
  transition: all 150ms;
}
.hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(4px, 4px); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(4px, -4px); }

/* ------- progress tracker ------- */
.progress-track {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  margin-bottom: 16px;
}
.progress-cell {
  background: var(--bg-1);
  padding: 14px 18px;
}
.progress-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.progress-val {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: 300;
  color: var(--ink);
  line-height: 1;
}
.progress-sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  margin-top: 4px;
}

/* ------- session P&L topbar badge ------- */
.session-pnl {
  font-family: var(--mono);
  font-size: 11px;
  padding: 5px 10px;
  border: 1px solid var(--line-2);
  border-radius: 4px;
  letter-spacing: 0.06em;
  white-space: nowrap;
}

/* ------- sidebar backdrop ------- */
.sidebar-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  z-index: 299;
}

/* ------- light theme ------- */
html.light {
  --bg: #f4f3ef;
  --bg-1: #ffffff;
  --bg-2: #eceae5;
  --bg-3: #e0ded9;
  --line: #d4d1cb;
  --line-2: #c5c2bc;
  --ink: #1a1916;
  --ink-2: #4a4740;
  --ink-3: #8c8880;
  --ink-4: #b0ada8;
  --teal: #0fa191;
  --virtual: #1e7f3a;
  --virtual-dim: #156030;
  --live: #c05a10;
  --live-dim: #8a3b05;
  --up: #1e7f3a;
  --down: #c92a2a;
  --warn: #9a6a00;
  --info: #2a7eb8;
}

/* ------- mobile responsive ------- */
@media (max-width: 768px) {
  .hamburger { display: flex; }
  .shell { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    left: 0; top: 0; bottom: 0;
    width: 260px;
    z-index: 300;
    transform: translateX(-100%);
    transition: transform 280ms cubic-bezier(0.2, 0.7, 0.2, 1);
    box-shadow: 4px 0 32px rgba(0, 0, 0, 0.5);
  }
  .sidebar.mob-open { transform: translateX(0); }
  .sidebar-backdrop { display: block; }
  .topbar { padding: 12px 16px; gap: 10px; }
  .notif-strip { padding: 0 12px; }
  .tick-strip { display: none; }
  .page { padding: 16px 14px 48px; }
  .kpi-grid { grid-template-columns: 1fr 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
  .grid-2-1 { grid-template-columns: 1fr; }
  .grid-1-2 { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr; }
  .progress-track { grid-template-columns: 1fr 1fr; }
  .session-pnl { display: none; }
}

window.addEventListener('error', function(e) {

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script>
  // When the app is served behind its login and the login runs out, any server call answers 401 with
  // X-Shoal-Login: required — go to the login page instead of failing quietly.
  (function () {
    var f = window.fetch.bind(window);
    window.fetch = function () {
      return f.apply(null, arguments).then(function (r) {
        if (r.status === 401 && r.headers.get('X-Shoal-Login') === 'required' && location.pathname !== '/login') location.href = '/login';
        return r;
      });
    };
  })();

<script type="text/babel" data-presets="react">
// Mock data + sim engine for the Shoal trading bot prototype
// "Swarm" approach inspired by multi-agent prediction systems:
// each agent has a personality, votes on trades, and weights adapt over time.

const SEED = 1337;

// Backend URL — override by setting window.SHOAL_BACKEND_URL before this script loads.
// Local: page on localhost or file:// talks to the backend on :3001. Hosted (e.g. Vercel): same origin.
const BACKEND_URL = (typeof window !== 'undefined' && window.SHOAL_BACKEND_URL)
  || (location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? 'http://localhost:3001' : '');

// Brokers the backend can connect to. env stays 'paper' | 'live' everywhere; for IG 'paper' is the demo environment.
const BROKERS = {
  alpaca: {
    name: 'Alpaca Markets', short: 'Alpaca', paperLabel: 'PAPER', liveLabel: 'LIVE',
    hosts: { paper: 'paper-api.alpaca.markets', live: 'api.alpaca.markets' },
    dashboard: 'https://app.alpaca.markets/paper/dashboard/overview', dashboardLabel: 'app.alpaca.markets',
  },
  ig: {
    name: 'IG', short: 'IG', paperLabel: 'DEMO', liveLabel: 'LIVE',
    hosts: { paper: 'demo-api.ig.com', live: 'api.ig.com' },
    dashboard: 'https://labs.ig.com/', dashboardLabel: 'labs.ig.com',
  },
};
const brokerShort = (a) => (BROKERS[a?.brokerId] || BROKERS.alpaca).short;
Object.assign(window, { BACKEND_URL });

function getMarketStatus() {
  const now = new Date();
  // "Fake ET" trick: parse ET string as local time so .getHours() returns ET hours
  const etNow = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const h = etNow.getHours(), m = etNow.getMinutes();
  const day = etNow.getDay();
  const isWeekday = day >= 1 && day <= 5;
  const afterOpen = h > 9 || (h === 9 && m >= 30);
  const beforeClose = h < 16;
  const isOpen = isWeekday && afterOpen && beforeClose;
  // etOffset converts "fake ET" timestamps back to real UTC-based time
  const etOffset = now.getTime() - etNow.getTime();

  const skipToWeekday = (d) => {
    while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  };

  const nextOpenET = new Date(etNow);
  nextOpenET.setHours(9, 30, 0, 0);
  if (!isWeekday || afterOpen) {
    nextOpenET.setDate(nextOpenET.getDate() + 1);
    skipToWeekday(nextOpenET);
  }

  return {
    isOpen,
    nextOpen: new Date(nextOpenET.getTime() + etOffset),
    source: 'client',
  };
}

// Indicators, the 16 agents, regimes, ensemble and backtester live in signals.js (window.ShoalSignals),
// which runs on full OHLCV bars and is unit-tested in Node.
const SS = window.ShoalSignals;

// Weighted ensemble. opts.regimeMult / opts.corrAdj are optional per-agent multipliers.
function computeEnsemble(signals, weights, enabledSet = null, opts = {}) {
  return SS.ensemble(signals, weights, { ids: AGENTS.map(a => a.id), enabled: enabledSet, ...opts });
}

// Rolling per-agent accuracy within each market regime — last 60 closed votes per regime.
function updateAgentRegimeHistory(history, trade) {
  if (!trade.votes || trade.pnl == null || !trade.regimeKey) return history;
  const tradeSide = trade.side === 'SELL' ? -1 : 1;
  const outcome   = trade.pnl > 0 ? 1 : -1;
  const reg = { ...(history[trade.regimeKey] || {}) };
  for (const a of AGENTS) {
    const vote = trade.votes[a.id];
    if (!vote) continue;
    reg[a.id] = [...(reg[a.id] || []), vote * tradeSide * outcome > 0].slice(-60);
  }
  return { ...history, [trade.regimeKey]: reg };
}

// Rolling per-agent accuracy buffer — last 50 closed votes
function updateAgentHistory(history, trade) {
  if (!trade.votes || trade.pnl == null) return history;
  const tradeSide = trade.side === 'SELL' ? -1 : 1;
  const outcome   = trade.pnl > 0 ? 1 : -1;
  const next = { ...history };
  for (const a of AGENTS) {
    const vote = trade.votes[a.id];
    if (vote === 0 || vote === undefined || vote === null) continue;
    // Direction-aware: a SELL vote on a losing BUY trade counts as correct
    const correct = (vote * tradeSide * outcome) > 0;
    next[a.id] = [...(next[a.id] || []), correct].slice(-50);
  }
  return next;
}

function serializeWeightsCSV(agents, weights, history) {
  const maxLen = Math.max(0, ...agents.map(a => (history[a.id] || []).length));
  const voteHeaders = Array.from({ length: maxLen }, (_, i) => `vote_${i + 1}`);
  const rows = [['agent_id', 'agent_name', 'weight', ...voteHeaders].join(',')];
  for (const a of agents) {
    const hist = history[a.id] || [];
    const votes = hist.map(v => v ? 'true' : 'false');
    while (votes.length < maxLen) votes.push('');
    rows.push([a.id, `"${a.name}"`, (weights[a.id] || 0).toFixed(6), ...votes].join(','));
  }
  return rows.join('\n');
}

function parseWeightsCSV(csvText, agents) {
  const lines = csvText.trim().split(/\r?\n/);
  if (lines.length < 2) throw new Error('CSV must have at least a header row and one data row');
  const headers = lines[0].split(',');
  const idIdx = headers.indexOf('agent_id');
  const wIdx  = headers.indexOf('weight');
  if (idIdx === -1) throw new Error('Missing agent_id column');
  if (wIdx  === -1) throw new Error('Missing weight column');
  const voteIndices = headers.reduce((acc, h, i) => { if (h.startsWith('vote_')) acc.push(i); return acc; }, []);
  const validIds = new Set(agents.map(a => a.id));
  const weights = {}, history = {};
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cols = line.split(',').map(c => c.replace(/^"|"$/g, ''));
    const id = cols[idIdx];
    if (!validIds.has(id)) continue;
    const w = parseFloat(cols[wIdx]);
    if (!isNaN(w) && w >= 0) weights[id] = w;
    const votes = voteIndices
      .map(vi => cols[vi])
      .filter(v => v === 'true' || v === 'false')
      .map(v => v === 'true');
    if (votes.length > 0) history[id] = votes;
  }
  const total = Object.values(weights).reduce((s, v) => s + v, 0);
  if (total > 0) for (const k of Object.keys(weights)) weights[k] /= total;
  return { weights, history };
}

function serializeWeightHistoryCSV(agents, weightHistory) {
  const numDays = Math.max(0, ...agents.map(a => (weightHistory[a.id] || []).length));
  const headers = ['day', ...agents.map(a => a.id)].join(',');
  const rows = [];
  for (let d = 0; d < numDays; d++) {
    const vals = agents.map(a => (weightHistory[a.id]?.[d] ?? 0).toFixed(6));
    rows.push([d, ...vals].join(','));
  }
  return [headers, ...rows].join('\n');
}

function parseWeightHistoryCSV(csvText, agents) {
  const lines = csvText.trim().split(/\r?\n/);
  if (lines.length < 2) throw new Error('CSV needs a header row and at least one data row');
  const headers = lines[0].split(',');
  const agentCols = {};
  for (const a of agents) {
    const idx = headers.indexOf(a.id);
    if (idx !== -1) agentCols[a.id] = idx;
  }
  if (Object.keys(agentCols).length === 0) throw new Error('No recognised agent ID columns found');
  const series = {};
  agents.forEach(a => { series[a.id] = []; });
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    const cols = line.split(',');
    agents.forEach(a => {
      const idx = agentCols[a.id];
      const v = idx !== undefined ? parseFloat(cols[idx]) : NaN;
      series[a.id].push(isNaN(v) ? 0 : Math.max(0, v));
    });
  }
  // Re-normalise each timestep so rows sum to 1
  const numDays = Math.max(...agents.map(a => series[a.id].length));
  for (let d = 0; d < numDays; d++) {
    const sum = agents.reduce((s, a) => s + (series[a.id][d] || 0), 0);
    if (sum > 0) agents.forEach(a => { series[a.id][d] /= sum; });
  }
  return series;
}

// Exponentially weighted accuracy — recent trades count more (decay factor 1.1x per store)
function decayAccuracy(hist) {
  if (!hist || hist.length < 2) return null;
  let wSum = 0, wCorr = 0;
  for (let i = 0; i < hist.length; i++) {
    const w = Math.pow(1.12, i); // older entries have lower weight; most recent has highest
    wSum += w;
    if (hist[i]) wCorr += w;
  }
  return wCorr / wSum;
}

// Compute rolling 5-day annualized volatility from price series (returns 0 if insufficient data)
function rollingVol(prices, window = 10) {
  if (!prices || prices.length < window + 1) return 0;
  const slice = prices.slice(-(window + 1));
  const returns = slice.slice(1).map((p, i) => Math.log(p / slice[i]));
  const mean = returns.reduce((s, r) => s + r, 0) / returns.length;
  const variance = returns.reduce((s, r) => s + (r - mean) ** 2, 0) / returns.length;
  return Math.sqrt(variance * 252); // annualized
}

// Mark price for an open trade: the live broker price when there is one; for replayed trades, the
// close of the bar being replayed; otherwise the old deterministic formula (legacy demo trades).
function computeMark(trade, livePrices) {
  // replayed trades first: livePrices holds today's prices, not the replayed day's
  if (trade.replay && window.SHOAL_REPLAY) {
    const { U, g } = window.SHOAL_REPLAY, F = U.F[trade.sym];
    if (trade.replaySrc && trade.replaySrc !== replayKey(U)) return trade.price;
    if (F) return F.c[Math.max(0, Math.min(g - U.off[trade.sym], F.n - 1))];
  }
  const live = livePrices && livePrices[trade.sym];
  if (live && live > 0) return live;
  const elapsedMs = Date.now() - trade.ts;
  const symSeed = trade.sym.split('').reduce((s, c) => s + c.charCodeAt(0), 0);
  const drift = Math.sin(symSeed * 0.07 + elapsedMs * 0.000002) * 0.03;
  const elapsedH = elapsedMs / 3600000;
  const noise = Math.sin(elapsedH * 1.7 + symSeed * 0.031) * 0.012;
  return trade.price * (1 + drift + noise);
}
function unrealizedPnl(trade, livePrices) {
  if (typeof trade._upnl === 'number') return trade._upnl; // real Alpaca position
  const mark = computeMark(trade, livePrices);
  return (mark - trade.price) * trade.qty * (trade.side === 'BUY' ? 1 : -1);
}
window.computeMark = computeMark;
window.unrealizedPnl = unrealizedPnl;

// Narrative reason from top-3 agents supporting the ensemble direction
function buildReason(signals, ensemble) {
  if (!ensemble.dir || !signals) return '–';
  const targetDir = ensemble.dir === 'BUY' ? 1 : -1;
  const supporters = AGENTS
    .filter(a => signals[a.id]?.dir === targetDir)
    .sort((a, b) => (signals[b.id]?.strength || 0) - (signals[a.id]?.strength || 0))
    .slice(0, 3);
  if (!supporters.length) return ensemble.dir === 'BUY' ? 'Weak bullish ensemble' : 'Weak bearish ensemble';
  return supporters.map(a => a.name).join(' + ') + (ensemble.dir === 'BUY' ? ' → bullish' : ' → bearish');
}

// Walk-forward grid search of one parameter for one agent across the whole universe.
// Score = average return per signal over the next 5 days, in the signal's direction (expectancy),
// because hit rate alone rewards agents that win often but small. Uses the live universe when a
// broker is connected, otherwise the simulated market.
async function backtestOneAgent(agentId, universe, agentParams) {
  const okKey = AGENT_OPTIMIZE_KEYS[agentId];
  if (!okKey || !okKey.id || !universe) return null;
  const H = 5;
  let bestValue = okKey.values[0], bestScore = -Infinity;
  const results = [];
  for (const candVal of okKey.values) {
    await new Promise(r => setTimeout(r, 0)); // yield per candidate to keep UI responsive
    const P = SS.mergeParams({ ...agentParams, [agentId]: { ...(agentParams[agentId] || {}), [okKey.id]: candVal } })[agentId];
    let sum = 0, hits = 0, total = 0;
    for (const sym of universe.syms) {
      const F = universe.F[sym];
      const from = Math.max(130, F.n - 600);
      for (let i = from; i < F.n - H - 1; i += 2) {
        const sig = SS.AGENT_FNS[agentId](F, i, P, universe, sym);
        if (!sig || !sig.dir) continue;
        const r = sig.dir * (F.c[i + H] / F.o[i + 1] - 1);
        sum += r; total++; if (r > 0) hits++;
      }
    }
    const expectancy = total > 0 ? sum / total : 0;
    results.push({ value: candVal, expectancy, hitRate: total ? hits / total : 0, total });
    // need enough signals for the score to mean anything
    const score = total >= 30 ? expectancy : -Infinity;
    if (score > bestScore) { bestScore = score; bestValue = candVal; }
  }
  if (bestScore === -Infinity) return { paramKey: okKey.id, bestValue: null, bestExpectancy: null, results };
  return { paramKey: okKey.id, bestValue, bestExpectancy: bestScore, results };
}

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const IMPORT_MAX_BYTES = 40 * 1024 * 1024, IMPORT_MAX_SYMBOLS = 60, IMPORT_MAX_DAYS = 6000;
function parseBarsCsv(texts) {
  const bySym = new Map();

  for (const text of [].concat(texts)) {
  const lines = String(text).replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) throw new Error('A file has no data rows.');
  const head = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/^"|"$/g, ''));
  const col = (...names) => names.map(n => head.indexOf(n)).find(i => i >= 0);
  // also accepts Nasdaq.com exports: Date,Symbol2,Close/Last,Volume,Open,High,Low with $ prices and MM/DD/YYYY dates
  const ci = { d: col('date', 'day', 'timestamp'), s: col('symbol', 'ticker', 'symbol2'), o: col('open'), h: col('high'), l: col('low'), c: col('close', 'adj close', 'adj_close', 'close/last'), v: col('volume') };
  const toIso = (d) => { const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(d); return m ? `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}` : d.slice(0, 10); };
  const toNum = (x) => +String(x ?? '').replace(/[$,\s]/g, '');
  if (ci.d == null || ci.s == null || ci.c == null) throw new Error('Need at least date, symbol and close columns in every file.');
  for (let k = 1; k < lines.length; k++) {
    const f = lines[k].split(',').map(x => x.trim().replace(/^"|"$/g, ''));
    const sym = (f[ci.s] || '').toUpperCase(), date = toIso(f[ci.d] || ''), c = toNum(f[ci.c]);
    if (!/^[A-Z0-9.\-]{1,10}$/.test(sym) || !/^\d{4}-\d{2}-\d{2}$/.test(date) || !(c > 0) || !Number.isFinite(c)) { skipped++; continue; }
    const num = (i, d) => { const x = i == null ? NaN : toNum(f[i]); return Number.isFinite(x) && x > 0 ? x : d; };
    const o = num(ci.o, c), h = Math.max(num(ci.h, Math.max(o, c)), o, c), l = Math.min(num(ci.l, Math.min(o, c)), o, c);
    const v = ci.v == null ? 0 : (Number.isFinite(toNum(f[ci.v])) && toNum(f[ci.v]) >= 0 ? toNum(f[ci.v]) : 0);
    if (!bySym.has(sym)) { if (bySym.size >= IMPORT_MAX_SYMBOLS) { skipped++; continue; } bySym.set(sym, new Map()); }
    bySym.get(sym).set(date, { o, h, l, c, v });

  const maxLen = Math.max(...[...bySym.values()].map(m => m.size));
  const keep = [...bySym.entries()].filter(([, m]) => m.size >= 0.8 * maxLen);
  const dropped = [...bySym.keys()].filter(sym => !keep.some(([k]) => k === sym));
  let dates = [...keep[0][1].keys()].filter(d => keep.every(([, m]) => m.has(d))).sort();
  if (dates.length > IMPORT_MAX_DAYS) dates = dates.slice(-IMPORT_MAX_DAYS);
  if (dates.length < 200) throw new Error(`Only ${dates.length} dates are shared by all symbols; need at least 200.`);
  const bars = {};
  for (const [sym, m] of keep) {
    const b = { o: [], h: [], l: [], c: [], v: [], t: dates };
    for (const d of dates) { const x = m.get(d); b.o.push(x.o); b.h.push(x.h); b.l.push(x.l); b.c.push(x.c); b.v.push(x.v); }

}

function genTrades(n) {
  const rng = mulberry32(SEED + 400);
  const out = [];
  let now = Date.now();
  for (let i = 0; i < n; i++) {
    const t = TICKERS[Math.floor(rng() * TICKERS.length)];
    const side = rng() > 0.5 ? 'BUY' : 'SELL';
    const qty = Math.floor(rng() * 80) + 5;
    const price = t.last * (1 + (rng() - 0.5) * 0.04);
    const conf = 0.55 + rng() * 0.35;
    const pnl = (rng() - 0.42) * qty * price * 0.025;
    const closed = i > 4;
    const holdMs = (1000 * 60 * (20 + rng() * 60 * 8));
    // derive exit price so exit = entry + pnl/qty (sign-adjusted for side)
    const exit = closed ? price + (pnl / qty) * (side === 'BUY' ? 1 : -1) : null;
    out.push({
      id: 'TX-' + (10428 - i),
      ts: now - i * (1000 * 60 * (3 + rng() * 12)),
      exitTs: closed ? now - i * (1000 * 60 * (3 + rng() * 12)) + holdMs : null,
      sym: t.sym,
      side,
      qty,
      price,           // entry
      exit,            // exit (null if open)
      conf,
      reason: REASONS[side === 'BUY' ? 'buy' : 'sell'][Math.floor(rng() * REASONS.buy.length)],
      pnl: closed ? pnl : null,
      pnlPct: closed ? pnl / (qty * price) : null,
      status: closed ? (pnl > 0 ? 'WIN' : 'LOSS') : 'OPEN',
      mode: 'VIRTUAL',
      consensus: Math.floor(conf * 8),
    });
  }
  return out;
}

// Classify a closed trade into one regime row. New trades carry the regime detected at entry
// (ADX for trend vs range, ATR% rank for calm vs volatile); older trades fall back to their vol snapshot
// and the swarm's disagreement.
function classifyRegime(trade) {
  if (trade.regime && REGIMES.includes(trade.regime)) return trade.regime;
  const vol = trade.annVol ?? rollingVol(PRICE_HISTORY[trade.sym] || []);
  const trend = (trade.disagreement ?? 0.4) < 0.4;
  const volatile = vol > 0.35;
  return SS.REGIME_LABELS[`${trend ? 'trend' : 'range'}-${volatile ? 'volatile' : 'calm'}`];
}
function classifyOutcome(trade) {
  const p = trade.pnlPct ?? 0;
  if (p >  0.03)  return 'Strong win';
  if (p >  0.003) return 'Win';
  if (p < -0.03)  return 'Strong loss';
  if (p < -0.003) return 'Loss';
  return 'Flat';
}
function computeRegimeHeatmap(closedTrades, regimes, outcomes) {
  const grid = regimes.map(() => outcomes.map(() => 0));
  for (const t of closedTrades) {
    const r = classifyRegime(t);
    const o = classifyOutcome(t);
    const ri = regimes.indexOf(r);
    const oi = outcomes.indexOf(o);
    if (ri >= 0 && oi >= 0) grid[ri][oi]++;
  }
  return grid;
}

// predicted vs actual (last 60 days) — per-symbol
function genPredVsActual(sym = 'NVDA') {
  const seedMix = Array.from(sym).reduce((a,c) => a + c.charCodeAt(0) * 17, 0);
  const rng = mulberry32(SEED + 600 + seedMix);
  // base off latest real price if known
  const tk = TICKERS.find(t => t.sym === sym);
  const base = tk ? tk.last * 0.92 : 100 + (sym.charCodeAt(0) % 400);
  const actual = [base];
  const pred = [base];
  for (let i = 1; i < 60; i++) {
    actual.push(actual[i-1] * (1 + (rng() - 0.49) * 0.018));
    pred.push(actual[i-1] * (1 + (rng() - 0.49) * 0.022));
  }
  // compute metrics
  let mae = 0, dirCorrect = 0;
  for (let i = 1; i < actual.length; i++) {
    mae += Math.abs(pred[i] - actual[i]) / actual[i];
    const actualDir = actual[i] > actual[i-1];
    const predDir = pred[i] > actual[i-1];
    if (actualDir === predDir) dirCorrect++;
  }
  return { actual, pred, mae: mae/(actual.length-1), dirAcc: dirCorrect/(actual.length-1) };
}

function fmtMoney(n, dp = 2) {
  if (n === null || n === undefined) return '—';
  const sign = n < 0 ? '-' : '';
  const abs = Math.abs(n);
  return sign + '$' + abs.toFixed(dp).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtPct(n, dp = 2) {
  if (n === null || n === undefined) return '—';
  return (n >= 0 ? '+' : '') + (n * 100).toFixed(dp) + '%';
}
function fmtNum(n, dp = 2) {
  if (n === null || n === undefined) return '—';
  return n.toFixed(dp).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtTime(ts) {
  const utc = new Date(ts);
  const et = new Date(utc.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const hh = String(et.getHours()).padStart(2, '0');
  const mm = String(et.getMinutes()).padStart(2, '0');
  const ss = String(et.getSeconds()).padStart(2, '0');
  return `${hh}:${mm}:${ss} ET`;
}

  EQUITY, WEIGHT_HISTORY, CONFIDENCE_HISTORY, TRADES, HEATMAP, PRED_ACTUAL,
  REGIMES, OUTCOMES, PARAM_EVENTS,
  fmtMoney, fmtPct, fmtNum, fmtTime, mulberry32,
});

const Sparkline = ({ data, width = 80, height = 22, color = 'currentColor', fill = false }) => {
  if (!data || data.length < 2) return null;
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const pts = data.map((v, i) => `${(i / (data.length - 1)) * width},${height - ((v - min) / range) * (height - 2) - 1}`);
  return (
    <svg width={width} height={height} className="spark">
      {fill && <path d={`M0,${height} L${pts.join(' L')} L${width},${height} Z`} fill={color} opacity="0.15" />}
      <polyline points={pts.join(' ')} fill="none" stroke={color} strokeWidth="1.2"/>
    </svg>
  );
};

        const wobble = Math.sin((tick + t.sym.charCodeAt(0)) * 0.4) * 0.15;

        return (
          <div className="tick" key={t.sym}>
            <span className="tick-sym">{t.sym}</span>
            <span>{fmtNum(t.last, 2)}</span>

<script type="text/babel" data-presets="react">
// Charts — all hand-rolled SVG. Equity, stacked area weights, scatter pred-vs-actual,
// price chart, swarm visualization, heatmap, donut, etc.

const LineChart = ({ series, height = 220, colors = ['var(--virtual)', 'var(--ink-3)'], labels = [], yFmt = v => v.toFixed(0), fillFirst = true, solidLines = false, xLabels = null, zeroCrossColors = null, crossValue = 0, endLabels = null, hLines = null }) => {
  const [hover, setHover] = React.useState(null);
  const hasEnd = endLabels && endLabels.some(Boolean);
  const W = 700, H = height, pad = { l: 50, r: hasEnd ? 68 : 12, t: 14, b: 22 };
  const innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b;
  const all = series.flat().filter(Number.isFinite);
  if (!all.length) return null;
  const rawMin = Math.min(...all);
  const rawMax = Math.max(...all);
  const min = rawMin * (rawMin < 0 ? 1.015 : 0.985);
  const max = rawMax * (rawMax > 0 ? 1.005 : 0.985);
  const range = max - min || 1;
  const len = Math.max(...series.map(s => s.length));
  const x = i => pad.l + (i / Math.max(1, len - 1)) * innerW;
  const y = v => pad.t + innerH - ((v - min) / range) * innerH;

  // Cross-line gradient: positive colour above `crossValue`, negative colour below.
  // Default crossValue=0 → classic green-above-zero / red-below-zero behaviour.
  const useZeroCross = zeroCrossColors && series.length >= 1;
  const zeroY = y(crossValue);
  const zeroFrac = Math.max(0.001, Math.min(0.999, (zeroY - pad.t) / innerH));
  const [posCol, negCol] = zeroCrossColors || ['var(--up)', 'var(--down)'];

  const onMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const svgX = ((e.clientX - rect.left) / rect.width) * W;
    const i = Math.max(0, Math.min(len - 1, Math.round((svgX - pad.l) / innerW * (len - 1))));
    setHover({ i, ys: series.map(s => s[i]) });
  };

  const hasLabels = labels.length > 0;

  return (
    <div style={{position:'relative'}}>
      {hover && hasLabels && (
        <div style={{position:'absolute',top:2,left:pad.l,display:'flex',gap:8,flexWrap:'wrap',pointerEvents:'none',zIndex:2}}>
          {series.map((s, idx) => labels[idx] != null && s[hover.i] != null ? (
            <span key={idx} style={{fontFamily:'var(--mono)',fontSize:10,padding:'2px 7px',borderRadius:3,background:'var(--bg-2)',border:`1px solid ${colors[idx]||'var(--line)'}`,color:colors[idx]||'var(--ink)',whiteSpace:'nowrap'}}>
              {labels[idx]}: <b>{yFmt(s[hover.i])}</b>
            </span>
          ) : null)}
        </div>
      )}
      <svg viewBox={`0 0 ${W} ${H}`} className="chart" preserveAspectRatio="none" style={{height: H, cursor:'crosshair'}}
        onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
        {useZeroCross && (
          <defs>
            <linearGradient id="lc-zcg-line" x1="0" x2="0" y1={pad.t} y2={pad.t + innerH} gradientUnits="userSpaceOnUse">
              <stop offset={`${zeroFrac * 100}%`} stopColor={posCol}/>
              <stop offset={`${zeroFrac * 100}%`} stopColor={negCol}/>
            </linearGradient>
            <linearGradient id="lc-zcg-fill" x1="0" x2="0" y1={pad.t} y2={pad.t + innerH} gradientUnits="userSpaceOnUse">
              <stop offset={`${zeroFrac * 100}%`} stopColor={posCol} stopOpacity="0.12"/>
              <stop offset={`${zeroFrac * 100}%`} stopColor={negCol} stopOpacity="0.12"/>
              <stop offset="100%" stopColor={negCol} stopOpacity="0"/>
            </linearGradient>
          </defs>
        )}
        {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
          <g key={i}>
            <line x1={pad.l} x2={W - pad.r} y1={pad.t + innerH * t} y2={pad.t + innerH * t} className="gridline"/>
            <text x={pad.l - 6} y={pad.t + innerH * t + 3} textAnchor="end" className="axis-text">{yFmt(max - range * t)}</text>
          </g>
        ))}
        {/* Baseline at crossValue when the chart spans both sides of it */}
        {useZeroCross && rawMin < crossValue && rawMax > crossValue && (
          <line x1={pad.l} x2={W - pad.r} y1={zeroY} y2={zeroY} stroke="var(--ink-2)" strokeWidth="0.6" opacity="0.4"/>
        )}
        {/* Horizontal reference lines (e.g. confidence threshold) */}
        {hLines && hLines.map((hl, hli) => {
          if (hl.value < min || hl.value > max) return null;
          const hy = y(hl.value);
          return (
            <g key={hli}>
              <line x1={pad.l} x2={W - pad.r} y1={hy} y2={hy} stroke={hl.color || 'var(--warn)'} strokeWidth="1" strokeDasharray="5 4" opacity="0.75"/>
              {hl.label && <text x={W - pad.r + 3} y={hy + 3} fontSize="8" fill={hl.color || 'var(--warn)'} style={{fontFamily:'var(--mono)',opacity:0.8}}>{hl.label}</text>}
            </g>
          );
        })}
        {series.map((s, idx) => {
          // Build path with M (moveto) gaps where values are null
          let pts = '';
          s.forEach((v, i) => {
            if (v == null) return;
            pts += (i === 0 || s[i - 1] == null) ? `M${x(i)},${y(v)}` : ` L${x(i)},${y(v)}`;
          });
          const dim = hover !== null;
          const lineColor = (useZeroCross && idx === 0) ? 'url(#lc-zcg-line)' : (colors[idx] || 'var(--ink)');
          const fillColor = (useZeroCross && idx === 0) ? 'url(#lc-zcg-fill)' : colors[idx];
          return (
            <g key={idx}>
              {idx === 0 && fillFirst && (() => {
                const base = (useZeroCross && rawMin <= crossValue && rawMax >= crossValue) ? y(crossValue) : pad.t + innerH;
                const validPts = s.map((v, i) => v != null ? `${x(i)},${y(v)}` : null).filter(Boolean);
                if (!validPts.length) return null;
                const fi = s.findIndex(v => v != null), li = s.length - 1 - [...s].reverse().findIndex(v => v != null);
                const fillOp = useZeroCross ? (dim ? 0.06 : 0.13) : (dim ? 0.04 : 0.09);
                return <path d={`M${x(fi)},${base} L${validPts.join(' L')} L${x(li)},${base} Z`} fill={fillColor} opacity={fillOp}/>;
              })()}
              <path d={pts} fill="none" stroke={lineColor} strokeWidth={idx === 0 ? 1.8 : 1.3}
                strokeDasharray={(!solidLines && idx > 0) ? '4 3' : ''}
                opacity={dim ? 0.35 : 1} style={{transition:'opacity 0.1s'}}/>
            </g>
          );
        })}
        {hover && (
          <>
            <line x1={x(hover.i)} x2={x(hover.i)} y1={pad.t} y2={pad.t+innerH} stroke="var(--ink-2)" strokeWidth="0.7" strokeDasharray="3 3" opacity="0.6"/>
            {series.map((s, idx) => s[hover.i] != null && (
              <circle key={idx} cx={x(hover.i)} cy={y(s[hover.i])} r="3.5" fill={colors[idx]||'var(--ink)'} stroke="var(--bg-1)" strokeWidth="1.5"/>
            ))}
          </>
        )}
        {xLabels ? (
          [0, Math.floor((len-1)/2), len-1].map((i, idx) => xLabels[i] ? (
            <text key={idx} x={x(i)} y={H-6} textAnchor={idx===0?'start':idx===1?'middle':'end'} className="axis-text">{xLabels[i]}</text>
          ) : null)
        ) : (
          [0, 0.5, 1].map((t, i) => (
            <text key={i} x={x((len-1)*t)} y={H-6} textAnchor={i===0?'start':i===1?'middle':'end'} className="axis-text">{Math.floor((len-1)*t)}d</text>
          ))
        )}
        {hasEnd && series.map((s, idx) => {
          if (!endLabels?.[idx]) return null;
          const li = s.reduce((best, v, i) => v != null ? i : best, -1);
          if (li < 0) return null;
          const lx = x(li) + 5, ly = y(s[li]);
          const col = colors[idx] || 'var(--ink-2)';
          return <text key={idx} x={lx} y={ly + 3} fontSize="8.5" fill={col} style={{fontFamily:'var(--mono)',opacity:0.9}}>{endLabels[idx]}</text>;
        })}
      </svg>
    </div>
  );
};

const StackedArea = ({ series, keys, colors, height = 240, xSuffix = 'd', emptyText = 'No data yet — close some trades to see weight evolution', xLabels = null }) => {
  const W = 700, H = height, pad = { l: 40, r: 12, t: 12, b: 22 };
  const innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b;
  const len = series && keys[0] && series[keys[0]] ? series[keys[0]].length : 0;
  if (len === 0) return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart" preserveAspectRatio="none" style={{height: H}}>
      <text x={W/2} y={H/2} textAnchor="middle" className="axis-text" opacity="0.5">{emptyText}</text>
    </svg>
  );
  const safeLen = Math.max(len, 2);
  const x = i => pad.l + (i / (safeLen - 1)) * innerW;
  // build stacked
  const stacks = [];
  for (let i = 0; i < len; i++) {
    let acc = 0;
    const col = {};
    keys.forEach(k => { col[k] = [acc, acc + (series[k]?.[i] ?? 0)]; acc += (series[k]?.[i] ?? 0); });
    stacks.push(col);
  }
  const y = v => pad.t + innerH - v * innerH;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart" preserveAspectRatio="none" style={{height: H}}>
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
        <line key={i} x1={pad.l} x2={W - pad.r} y1={pad.t + innerH * t} y2={pad.t + innerH * t} className="gridline"/>
      ))}
      {keys.map((k, idx) => {
        const top = stacks.map((s, i) => `${x(i)},${y(s[k][1])}`).join(' L');
        const bot = stacks.map((s, i) => `${x(i)},${y(s[k][0])}`).reverse().join(' L');
        return <path key={k} d={`M${top} L${bot} Z`} fill={colors[idx]} opacity="0.85"/>;
      })}
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
        <text key={i} x={pad.l - 6} y={pad.t + innerH * t + 3} textAnchor="end" className="axis-text">{Math.round((1-t)*100)}%</text>
      ))}
      {/* x-axis: left = oldest, right = most recent (now) */}
      <text x={x(0)}       y={H - 6} textAnchor="start"  className="axis-text">{xLabels ? xLabels[0] : `−${len - 1}${xSuffix}`}</text>
      {len > 2 && <text x={x(Math.floor((len-1)/2))} y={H - 6} textAnchor="middle" className="axis-text">{xLabels ? xLabels[Math.floor((len-1)/2)] : `−${Math.floor((len-1)/2)}${xSuffix}`}</text>}
      <text x={x(len - 1)} y={H - 6} textAnchor="end"    className="axis-text">{xLabels ? xLabels[len - 1] : 'now'}</text>
    </svg>
  );
};

const PredVsActual = ({ pred, actual, height = 220 }) => {
  const W = 700, H = height, pad = { l: 46, r: 12, t: 12, b: 22 };
  const innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b;
  const all = [...pred, ...actual];
  const min = Math.min(...all) * 0.99, max = Math.max(...all) * 1.01;
  const range = max - min;
  const x = i => pad.l + (i / (pred.length - 1)) * innerW;
  const y = v => pad.t + innerH - ((v - min) / range) * innerH;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart" preserveAspectRatio="none" style={{height: H}}>
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
        <g key={i}>
          <line x1={pad.l} x2={W-pad.r} y1={pad.t+innerH*t} y2={pad.t+innerH*t} className="gridline"/>
          <text x={pad.l-6} y={pad.t+innerH*t+3} textAnchor="end" className="axis-text">${(max-range*t).toFixed(0)}</text>
        </g>
      ))}
      {/* error bands */}
      {pred.map((p, i) => i % 4 === 0 ? (
        <line key={i} x1={x(i)} x2={x(i)} y1={y(p)} y2={y(actual[i])} stroke="var(--ink-4)" strokeWidth="0.5" opacity="0.5"/>
      ) : null)}
      <path d={`M${actual.map((v,i)=>`${x(i)},${y(v)}`).join(' L')}`} fill="none" stroke="var(--ink)" strokeWidth="1.6"/>
      <path d={`M${pred.map((v,i)=>`${x(i)},${y(v)}`).join(' L')}`} fill="none" stroke="var(--virtual)" strokeWidth="1.4" strokeDasharray="4 3"/>
    </svg>
  );
};

const SwarmViz = ({ agents, decision = 'BUY', confidence = 0.71, tick = 0, agentVotes = null, excludedSet = null }) => {
  const cx = 50, cy = 50;
  const votes = React.useMemo(() => {
    // Use real per-agent votes when available
    if (agentVotes) {
      return agents.map(a => {
        const v = agentVotes[a.id];
        return v === 1 ? 'buy' : v === -1 ? 'sell' : 'hold';
      });
    }
    // Synthetic fallback (no real signals)
    const majFrac = 0.4 + confidence * 0.5;
    return agents.map((a, i) => {
      const r = (Math.sin(i * 12.9898 + decision.charCodeAt(0)) + 1) / 2;
      if (r < majFrac) return decision === 'HOLD' ? 'hold' : decision.toLowerCase();
      if (r < majFrac + (1 - majFrac) * 0.55) return decision === 'BUY' ? 'sell' : decision === 'SELL' ? 'buy' : 'buy';
      return 'hold';
    });
  }, [agents, decision, confidence, agentVotes]);
  const tally = { buy: 0, sell: 0, hold: 0 };
  votes.forEach(v => tally[v]++);
  return (
    <div className="swarm">
      <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none'}} viewBox="0 0 100 100" preserveAspectRatio="none">
        {agents.map((a, i) => {
          const angle = (i / agents.length) * Math.PI * 2 - Math.PI/2;
          const r = 36 + Math.sin(tick * 0.3 + i) * 1.5;
          const ax = cx + Math.cos(angle) * r;
          const ay = cy + Math.sin(angle) * r;
          const vote = votes[i];
          const excluded = excludedSet?.has(a.id);
          const color = excluded ? '#3a3836' : vote === 'buy' ? '#7dd87d' : vote === 'sell' ? '#ff6b6b' : '#4a4740';
          return (
            <line key={a.id} x1={cx} y1={cy} x2={ax} y2={ay}
              stroke={color} strokeWidth={excluded ? 0.4 : a.weight * 2} opacity={excluded ? 0.25 : Math.min(1, a.weight * 6)}/>
          );
        })}
        <circle cx={cx} cy={cy} r="11" fill="none" stroke="var(--virtual)" strokeWidth="0.4" opacity="0.3"/>
        <circle cx={cx} cy={cy} r="14" fill="none" stroke="var(--virtual)" strokeWidth="0.3" opacity="0.2"/>
      </svg>
      {agents.map((a, i) => {
        const angle = (i / agents.length) * Math.PI * 2 - Math.PI/2;
        const r = 36 + Math.sin(tick * 0.3 + i) * 1.5;
        const ax = 50 + Math.cos(angle) * r;
        const ay = 50 + Math.sin(angle) * r;
        const vote = votes[i];
        const excluded = excludedSet?.has(a.id);
        return (
          <div key={a.id} className="agent-node" style={{left: `${ax}%`, top: `${ay}%`, opacity: excluded ? 0.3 : 1}} title={excluded ? `${a.name} — EXCLUDED` : `${a.name} — ${vote.toUpperCase()}`}>
            <div className={`agent-disc ${excluded ? 'hold' : vote}`} style={excluded ? {filter:'grayscale(1)'} : {}}>{a.glyph}</div>
            <div className="agent-name" style={excluded ? {color:'var(--ink-4)',textDecoration:'line-through'} : {}}>{a.id}</div>
          </div>
        );
      })}
      <div className="swarm-center">
        <div className={'pill solid ' + (decision === 'BUY' ? 'buy' : decision === 'SELL' ? 'sell' : 'hold')}><span>{decision}</span></div>
        <div className="v">{Math.floor(confidence * 100)}<span style={{fontSize:14}}>%</span></div>
        <div className="l">consensus</div>
      </div>
      {/* expose tally via data attr so parents can read */}
      <div data-tally={`${tally.buy}·${tally.sell}·${tally.hold}`} style={{display:'none'}}/>
    </div>
  );
};

// Helper: compute swarm tally consistent with SwarmViz
function swarmTally(agents, decision, confidence) {
  const majFrac = 0.4 + confidence * 0.5;
  const tally = { buy: 0, sell: 0, hold: 0 };
  agents.forEach((a, i) => {
    const r = (Math.sin(i * 12.9898 + decision.charCodeAt(0)) + 1) / 2;
    let v;
    if (r < majFrac) v = decision === 'HOLD' ? 'hold' : decision.toLowerCase();
    else if (r < majFrac + (1 - majFrac) * 0.55) v = decision === 'BUY' ? 'sell' : decision === 'SELL' ? 'buy' : 'buy';
    else v = 'hold';
    tally[v]++;
  });
  return tally;
}

const Heatmap = ({ data, rows, cols, cellTitle }) => {
  const flat = data.flat();
  const max  = Math.max(1, ...flat);
  return (
    <div>
      <div className="heat" style={{gridTemplateColumns: `90px repeat(${cols.length}, 1fr)`}}>
        <div></div>
        {cols.map(c => <div key={c} className="axis-text" style={{padding:'4px 0', textAlign:'center', fontFamily:'var(--mono)', fontSize:9, color:'var(--ink-3)', letterSpacing:'0.08em'}}>{c.toUpperCase()}</div>)}
        {rows.map((r, ri) => (
          <React.Fragment key={r}>
            <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--ink-3)',letterSpacing:'0.08em',display:'flex',alignItems:'center',padding:'0 8px'}}>{r.toUpperCase()}</div>
            {cols.map((c, ci) => {
              const v = data[ri][ci];
              const t = v / max;
              // Middle column ("Flat") is neutral; left half = wins (green); right half = losses (red)
              const isFlat = /flat/i.test(c) || ci === Math.floor(cols.length / 2);
              const isWin  = !isFlat && ci < cols.length / 2;
              const bg = isFlat
                ? `rgba(170, 170, 180, ${0.05 + t * 0.18})`
                : isWin
                  ? `rgba(125, 216, 125, ${0.1 + t * 0.5})`
                  : `rgba(255, 107, 107, ${0.1 + t * 0.5})`;
              const title = cellTitle ? cellTitle(r, c, v) : `${r} × ${c}: ${v} trade${v === 1 ? '' : 's'}`;
              return <div key={ci} className="heat-cell" style={{background: bg, cursor: 'help'}} title={title}>{v}</div>;
            })}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
};

const Donut = ({ value, max = 1, label = '', size = 120, color = 'var(--virtual)' }) => {
  const r = size / 2 - 8;
  const c = 2 * Math.PI * r;
  const off = c * (1 - value / max);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bg-3)" strokeWidth="6"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="6"
        strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`}/>
      <text x={size/2} y={size/2 + 2} textAnchor="middle" fontFamily="var(--serif)" fontSize="22" fill="var(--ink)">{Math.round(value/max*100)}%</text>
      <text x={size/2} y={size/2 + 18} textAnchor="middle" fontFamily="var(--mono)" fontSize="9" fill="var(--ink-3)" letterSpacing="0.14em">{label}</text>
    </svg>
  );
};

const PriceChart = ({ data, height = 240, predicted = null }) => {
  const W = 700, H = height, pad = { l: 50, r: 12, t: 12, b: 22 };
  const innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b;
  const min = Math.min(...data) * 0.985, max = Math.max(...data) * 1.005;
  const range = max - min;
  const x = i => pad.l + (i / (data.length - 1)) * innerW;
  const y = v => pad.t + innerH - ((v - min) / range) * innerH;
  const pts = data.map((v, i) => `${x(i)},${y(v)}`).join(' L');
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart" preserveAspectRatio="none" style={{height: H}}>
      <defs>
        <linearGradient id="pf" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor="var(--virtual)" stopOpacity="0.18"/>
          <stop offset="100%" stopColor="var(--virtual)" stopOpacity="0"/>
        </linearGradient>
      </defs>
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
        <g key={i}>
          <line x1={pad.l} x2={W-pad.r} y1={pad.t+innerH*t} y2={pad.t+innerH*t} className="gridline"/>
          <text x={pad.l-6} y={pad.t+innerH*t+3} textAnchor="end" className="axis-text">${(max-range*t).toFixed(1)}</text>
        </g>
      ))}
      <path d={`M${x(0)},${y(min)} L${pts} L${x(data.length-1)},${y(min)} Z`} fill="url(#pf)"/>
      <path d={`M${pts}`} fill="none" stroke="var(--ink)" strokeWidth="1.4"/>
      {predicted && (
        <g>
          <path d={`M${predicted.map((v,i)=>`${x(data.length - 1 + i)},${y(v)}`).join(' L')}`} fill="none" stroke="var(--virtual)" strokeWidth="1.4" strokeDasharray="3 3"/>
          {/* shaded forecast band */}
          <path d={`M${predicted.map((v,i)=>`${x(data.length - 1 + i)},${y(v * 1.015)}`).join(' L')} L${predicted.map((v,i)=>`${x(data.length - 1 + i)},${y(v * 0.985)}`).reverse().join(' L')} Z`} fill="var(--virtual)" opacity="0.08"/>
        </g>
      )}
    </svg>
  );
};

Object.assign(window, { LineChart, StackedArea, PredVsActual, SwarmViz, Heatmap, Donut, PriceChart, swarmTally });

</script>

      for (const s of U.syms) { const F = U.F[s], i0 = info.anchor.g - U.off[s], i = info.g - U.off[s]; if (i0 >= 0 && i >= 0) { sum += F.c[i] / F.c[i0]; n++; } }
      bench = n ? sum / n - 1 : null;

      for (const s of U.syms) {
        const F = U.F[s]; if (!F.t) continue;
        const i0 = F.t.findIndex(t => String(t).slice(0, 10) >= from);
        if (i0 < 0) continue;
        sum += (ctx.livePrices?.[s] || F.c[F.n - 1]) / F.c[i0]; n++;

      bench = n ? sum / n - 1 : null;

        </div>

      {mode !== 'SIMULATED' && ctx?.tradeStatus && (

          <div className="tiny" style={{color:'var(--ink-2)'}}><span className="mono" style={{color: ctx.tradeStatus.warn ? 'var(--warn)' : 'var(--info)',letterSpacing:'0.12em'}}>BOT STATUS · </span>{ctx.tradeStatus.text}</div>
