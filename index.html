<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Shoal — Adaptive Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,500;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>:root {
  --bg: #0a0b0d;
  --bg-1: #101216;
  --bg-2: #161920;
  --bg-3: #1d2129;
  --line: #232832;
  --line-2: #2d3340;
  --ink: #ece8df;
  --ink-2: #b8b3a8;
  --ink-3: #6f6b62;
  --ink-4: #4a4740;
  --virtual: #7dd87d;
  --virtual-dim: #4a8a4a;
  --live: #ff8a3d;
  --live-dim: #b85a1f;
  --up: #6dd47e;
  --down: #ff6b6b;
  --warn: #f0c674;
  --info: #7ec0ee;
  --serif: 'IBM Plex Serif', Georgia, serif;
  --sans: 'IBM Plex Sans', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body, #root {
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 300;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "ss02";
}

button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-4); }

/* ------- shell ------- */
.shell {
  display: grid;
  grid-template-columns: 232px 1fr;
  height: 100vh;
  position: relative;
}

.shell.live::before {
  content: '';
  position: fixed;
  inset: 0;
  border: 3px solid var(--live);
  pointer-events: none;
  z-index: 100;
  box-shadow: inset 0 0 60px rgba(255, 138, 61, 0.15);
}

.shell.live::after {
  content: '◉ LIVE TRADING — REAL CAPITAL AT RISK';
  position: fixed;
  top: 0; left: 50%;
  transform: translateX(-50%);
  background: var(--live);
  color: #1a0a00;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.18em;
  padding: 4px 18px;
  border-radius: 0 0 4px 4px;
  z-index: 101;
}

/* ------- sidebar ------- */
.sidebar {
  background: var(--bg-1);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 18px 0;
  overflow-y: auto;
}

.brand {
  padding: 0 20px 20px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 14px;
}

.brand-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
}

.brand-mark {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, var(--virtual), var(--virtual-dim));
  position: relative;
}
.brand-mark::after {
  content: '';
  position: absolute;
  inset: -4px;
  border: 1px dashed var(--ink-4);
  border-radius: 50%;
  animation: rotate 22s linear infinite;
}
.shell.live .brand-mark { background: radial-gradient(circle at 30% 30%, var(--live), var(--live-dim)); }

@keyframes rotate {
  to { transform: rotate(360deg); }
}

.brand-name {
  font-family: var(--serif);
  font-size: 18px;
  font-weight: 400;
  letter-spacing: -0.01em;
}
.brand-sub {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-3);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  padding-left: 32px;
}

.mode-pill {
  margin: 0 16px 14px;
  border: 1px solid var(--line-2);
  border-radius: 4px;
  padding: 10px 12px;
  background: var(--bg-2);
  cursor: pointer;
  transition: border-color 120ms;
}
.mode-pill:hover { border-color: var(--ink-4); }

.mode-pill-row { display: flex; align-items: center; justify-content: space-between; }
.mode-pill-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.mode-pill-value {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.08em;
  color: var(--virtual);
}
.shell.live .mode-pill-value { color: var(--live); }
.mode-dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--virtual);
  margin-right: 6px;
  box-shadow: 0 0 8px currentColor;
  vertical-align: middle;
}
.shell.live .mode-dot { background: var(--live); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

.nav-section {
  padding: 6px 0;
}
.nav-label {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-3);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 12px 22px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 22px;
  font-size: 13px;
  color: var(--ink-2);
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all 120ms;
}
.nav-item:hover { color: var(--ink); background: var(--bg-2); }
.nav-item.active {
  color: var(--ink);
  background: var(--bg-2);
  border-left-color: var(--virtual);
}
.shell.live .nav-item.active { border-left-color: var(--live); }

.nav-icon {
  width: 14px; height: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-3);
}
.nav-item.active .nav-icon { color: inherit; }
.nav-num {
  margin-left: auto;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
}

.sidebar-foot {
  margin-top: auto;
  padding: 14px 22px;
  border-top: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.sidebar-foot .row { display: flex; justify-content: space-between; }
.sidebar-foot .ok { color: var(--virtual); }

/* ------- main ------- */
.main {
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 28px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  position: sticky;
  top: 0;
  z-index: 10;
}

.crumb {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.crumb b { color: var(--ink); font-weight: 500; }

.topbar-spacer { flex: 1; }

.tick-strip {
  display: flex;
  gap: 18px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink-2);
  overflow: hidden;
  max-width: 480px;
}
.tick {
  display: flex;
  gap: 6px;
  align-items: baseline;
  white-space: nowrap;
}
.tick-sym { color: var(--ink); font-weight: 500; }
.tick-up { color: var(--up); }
.tick-dn { color: var(--down); }

.bot-status {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 12px;
  border: 1px solid var(--line-2);
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.bot-status .led {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--virtual);
  box-shadow: 0 0 6px currentColor;
}
.bot-status.paused .led { background: var(--ink-4); box-shadow: none; }
.bot-status.paused { color: var(--ink-3); }

.bot-status button {
  margin-left: 4px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--ink);
}
.bot-status button:hover { color: var(--virtual); }
.shell.live .bot-status button:hover { color: var(--live); }

.page {
  padding: 26px 28px 60px;
  max-width: 1600px;
  width: 100%;
}

.page-head {
  margin-bottom: 22px;
}
.page-eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.page-title {
  font-family: var(--serif);
  font-size: 32px;
  font-weight: 400;
  letter-spacing: -0.015em;
  line-height: 1.1;
}
.page-title em { font-style: italic; color: var(--ink-2); }
.page-sub {
  margin-top: 8px;
  font-size: 14px;
  color: var(--ink-2);
  max-width: 640px;
  line-height: 1.5;
}

/* ------- cards ------- */
.card {
  background: var(--bg-1);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 18px;
  position: relative;
}
.card-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 14px;
}
.card-title {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 400;
  letter-spacing: -0.005em;
}
.card-meta {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
.kpi {
  background: var(--bg-1);
  padding: 18px 20px;
}
.kpi-label {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 8px;
}
.kpi-value {
  font-family: var(--serif);
  font-size: 28px;
  font-weight: 300;
  line-height: 1;
  letter-spacing: -0.01em;
}
.kpi-value.mono { font-family: var(--mono); font-weight: 400; font-size: 22px; }
.kpi-delta {
  font-family: var(--mono);
  font-size: 11px;
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.kpi-delta.up { color: var(--up); }
.kpi-delta.dn { color: var(--down); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
.grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }

/* ------- chart common ------- */
.chart-wrap {
  position: relative;
  width: 100%;
}
svg.chart { display: block; width: 100%; }
.gridline { stroke: var(--line); stroke-width: 0.5; }
.axis-text {
  font-family: var(--mono);
  font-size: 9px;
  fill: var(--ink-3);
  letter-spacing: 0.08em;
}

.legend {
  display: flex;
  gap: 14px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-2);
  letter-spacing: 0.06em;
  flex-wrap: wrap;
}
.legend-dot {
  display: inline-block;
  width: 8px; height: 8px;
  margin-right: 6px;
  vertical-align: middle;
}

/* ------- agent / swarm ------- */
.swarm {
  position: relative;
  width: 100%;
  height: 360px;
  background:
    radial-gradient(circle at 50% 50%, rgba(125, 216, 125, 0.04), transparent 70%),
    var(--bg-1);
  border-radius: 6px;
  overflow: hidden;
}
.shell.live .swarm {
  background:
    radial-gradient(circle at 50% 50%, rgba(255, 138, 61, 0.04), transparent 70%),
    var(--bg-1);
}
.agent-node {
  position: absolute;
  transform: translate(-50%, -50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  transition: transform 200ms;
}
.agent-node:hover { transform: translate(-50%, -50%) scale(1.15); z-index: 5; }
.agent-disc {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--bg-3);
  border: 1.5px solid var(--ink-4);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink);
  position: relative;
}
.agent-disc.buy { border-color: var(--up); box-shadow: 0 0 10px rgba(109, 212, 126, 0.4); }
.agent-disc.sell { border-color: var(--down); box-shadow: 0 0 10px rgba(255, 107, 107, 0.4); }
.agent-disc.hold { border-color: var(--ink-3); }
.agent-name {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 150ms;
  margin-top: 2px;
}
.agent-node:hover .agent-name { opacity: 1; }
.swarm-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
.swarm-center .v {
  font-family: var(--serif);
  font-size: 36px;
  font-style: italic;
  color: var(--ink);
}
.swarm-center .l {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* ------- table ------- */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th, .tbl td {
  text-align: left;
  padding: 12px 10px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.tbl th {
  font-family: var(--mono);
  font-size: 9px;
  color: var(--ink-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 400;
}
.tbl td { color: var(--ink-2); }
.tbl td.mono { font-family: var(--mono); color: var(--ink); }
.tbl tbody tr { transition: background 120ms; cursor: pointer; }
.tbl tbody tr:hover { background: var(--bg-2); }
.tbl tbody tr.selected { background: var(--bg-2); }

.pill {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 3px;
  border: 1px solid currentColor;
  display: inline-block;
}
.pill.buy { color: var(--up); }
.pill.sell { color: var(--down); }
.pill.hold { color: var(--ink-3); }
.pill.virtual { color: var(--virtual); }
.pill.live { color: var(--live); }
.pill.solid {
  background: currentColor;
  border: none;
}
.pill.solid span { color: var(--bg); }

/* ------- buttons ------- */
.btn {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 8px 14px;
  border: 1px solid var(--line-2);
  border-radius: 4px;
  background: var(--bg-2);
  transition: all 120ms;
}
.btn:hover { border-color: var(--ink-3); color: var(--ink); }
.btn.primary {
  background: var(--virtual);
  color: #0a1f0a;
  border-color: var(--virtual);
  font-weight: 500;
}
.btn.primary:hover { background: #95e095; }
.btn.danger {
  background: var(--live);
  color: #1a0a00;
  border-color: var(--live);
  font-weight: 500;
}
.btn.danger:hover { background: #ff9c5c; }
.btn.ghost { background: transparent; }

@keyframes equityFlash {
  0% { color: var(--virtual); text-shadow: 0 0 8px var(--virtual); }
  100% { color: var(--ink); text-shadow: none; }
}
.equity-live {
  animation: equityFlash 500ms ease-out;
}
@keyframes tickPulse {
  0%, 100% { opacity: 0.4; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.2); }
}
.tick-dot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--virtual);
  margin-right: 6px;
  vertical-align: middle;
  animation: tickPulse 1.2s ease-in-out infinite;
  box-shadow: 0 0 4px currentColor;
}
.tick-dot.fast { animation-duration: 0.5s; background: var(--virtual); }
.tick-dot.short { background: var(--down); }

/* ------- activity feed ------- */
.feed {
  display: flex;
  flex-direction: column;
}
.feed-row {
  display: grid;
  grid-template-columns: 80px 60px 80px 1fr 100px 80px;
  gap: 14px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  align-items: center;
  font-size: 13px;
  cursor: pointer;
  transition: background 120ms;
}
.feed-row:hover { background: var(--bg-2); }
.feed-row.new {
  animation: flash 1s ease-out;
}
@keyframes flash {
  from { background: rgba(125, 216, 125, 0.15); }
  to { background: transparent; }
}
.shell.live .feed-row.new { animation-name: flashLive; }
@keyframes flashLive {
  from { background: rgba(255, 138, 61, 0.15); }
  to { background: transparent; }
}
.feed-time { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.feed-sym { font-family: var(--mono); font-weight: 500; color: var(--ink); }
.feed-reason {
  color: var(--ink-2);
  font-size: 12px;
  font-style: italic;
  font-family: var(--serif);
}
.feed-pnl { font-family: var(--mono); text-align: right; }
.feed-pnl.up { color: var(--up); }
.feed-pnl.dn { color: var(--down); }

/* ------- modals ------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(5, 6, 8, 0.78);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
  animation: fadein 200ms;
}
@keyframes fadein { from { opacity: 0; } }
.modal {
  background: var(--bg-1);
  border: 1px solid var(--line-2);
  border-radius: 8px;
  max-width: 540px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  animation: rise 280ms cubic-bezier(0.2, 0.7, 0.2, 1);
}
.modal.wide { max-width: 820px; }
@keyframes rise {
  from { transform: translateY(20px); opacity: 0; }
}
.modal-head {
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-title {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 400;
}
.modal-body { padding: 24px; }
.modal-foot {
  padding: 16px 24px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

.danger-banner {
  background: linear-gradient(180deg, rgba(255, 138, 61, 0.12), rgba(255, 138, 61, 0.04));
  border: 1px solid var(--live);
  border-radius: 6px;
  padding: 16px;
  margin-bottom: 18px;
  font-size: 13px;
  color: var(--ink);
}
.danger-banner b { color: var(--live); }

.checklist {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 16px 0;
}
.check-row {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 12px;
  background: var(--bg-2);
  border-radius: 4px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-2);
  border: 1px solid transparent;
}
.check-row:hover { color: var(--ink); }
.check-row.checked { color: var(--ink); border-color: var(--live); }
.check-box {
  width: 16px; height: 16px;
  border: 1.5px solid var(--ink-3);
  border-radius: 3px;
  flex-shrink: 0;
  margin-top: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--bg);
}
.check-row.checked .check-box { background: var(--live); border-color: var(--live); }

/* ------- onboarding ------- */
.onb {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  position: relative;
  overflow: hidden;
}
.onb-top {
  display: flex;
  justify-content: space-between;
  padding: 24px 36px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
.onb-step {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: center;
  padding: 0 80px;
  max-width: 1280px;
  margin: 0 auto;
  width: 100%;
}
.onb-art {
  height: 460px;
  position: relative;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background:

<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" data-presets="react">
// Mock data + sim engine for the Shoal trading bot prototype
// "Swarm" approach inspired by multi-agent prediction systems:
// each agent has a personality, votes on trades, and weights adapt over time.

const SEED = 1337;

// Backend URL — override by setting window.SHOAL_BACKEND_URL before this script loads.
const BACKEND_URL = (typeof window !== 'undefined' && window.SHOAL_BACKEND_URL) || 'http://localhost:3001';
Object.assign(window, { BACKEND_URL });

function getMarketStatus() {
  const now = new Date();
  // "Fake ET" trick: parse ET string as local time so .getHours() returns ET hours
  const etNow = new Date(now.toLocaleString('en-US', { timeZone: 'America/New_York' }));
  const h = etNow.getHours(), m = etNow.getMinutes();
  const day = etNow.getDay();
  const isWeekday = day >= 1 && day <= 5;
  const afterOpen = h > 9 || (h === 9 && m >= 30);
  const beforeClose = h < 16;
  const isOpen = isWeekday && afterOpen && beforeClose;
  // etOffset converts "fake ET" timestamps back to real UTC-based time
  const etOffset = now.getTime() - etNow.getTime();

  const skipToWeekday = (d) => {
    while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
  };

  const nextOpenET = new Date(etNow);
  nextOpenET.setHours(9, 30, 0, 0);
  if (!isWeekday || afterOpen) {
    nextOpenET.setDate(nextOpenET.getDate() + 1);
    skipToWeekday(nextOpenET);
  }

  return {
    isOpen,
    nextOpen: new Date(nextOpenET.getTime() + etOffset),
    source: 'client',
  };
}

// ── Real signal computation ──────────────────────────────────────────────────
// agentParams: per-agent param overrides (merged with defaults inside)
// endIdx: optional slice endpoint for backtesting over historical windows
function computeSignals(sym, priceHistory, agentParams = {}, endIdx = null) {
  const raw = priceHistory[sym];
  if (!raw || raw.length < 60) return null;
  const prices = endIdx != null ? raw.slice(0, endIdx + 1) : raw;
  if (prices.length < 60) return null;
  const n    = prices.length;
  const last = prices[n - 1];
  const rets = (arr) => arr.map((p, i, a) => i > 0 ? p / a[i - 1] - 1 : 0).slice(1);
  const xp   = (s) => { const r = priceHistory[s]; return r ? (endIdx != null ? r.slice(0, endIdx + 1) : r) : []; };
  const gp   = (id, key, def) => agentParams[id]?.[key] ?? def; // param accessor

  // momo: fast/slow MA crossover
  const mFast = gp('momo','fast',5), mSlow = gp('momo','slow',20), mThr = gp('momo','thresh',0.005);
  const maF = prices.slice(n - mFast).reduce((s,p)=>s+p,0)/mFast;
  const maS = prices.slice(n - mSlow).reduce((s,p)=>s+p,0)/mSlow;
  const momoGap = (maF - maS) / maS;
  const momo = { dir: momoGap > mThr ? 1 : momoGap < -mThr ? -1 : 0, strength: Math.min(0.9, Math.abs(momoGap)*60) };

  // mean: RSI(period) — oversold → BUY, overbought → SELL
  const mPer = gp('mean','period',14), mLo = gp('mean','lo',35), mHi = gp('mean','hi',65);
  if (n < mPer + 2) return null;
  const ch14 = rets(prices.slice(n - mPer - 1));
  const avgG = ch14.reduce((s,r)=>s+Math.max(0,r),0)/mPer;
  const avgL = ch14.reduce((s,r)=>s+Math.max(0,-r),0)/mPer;
  const rsi  = avgL === 0 ? 100 : 100 - 100/(1 + avgG/avgL);
  const mean = { dir: rsi < mLo ? 1 : rsi > mHi ? -1 : 0, strength: rsi < mLo ? (mLo-rsi)/mLo : rsi > mHi ? (rsi-mHi)/(100-mHi) : 0 };

  // brkt: Donchian breakout
  const bPer = gp('brkt','period',20);
  const hiB = Math.max(...prices.slice(n - bPer - 1, n - 1));
  const loB = Math.min(...prices.slice(n - bPer - 1, n - 1));
  const brkt = {
    dir: last > hiB ? 1 : last < loB ? -1 : 0,
    strength: last > hiB ? Math.min(0.9,(last-hiB)/last*40) : last < loB ? Math.min(0.9,(loB-last)/last*40) : 0,
  };

  // vwap: EMA reversion proxy
  const vPer = gp('vwap','period',10), vThr = gp('vwap','thresh',0.012);
  if (n < vPer + 2) return null;
  const kv = 2/(vPer+1);
  let emaV = prices[n - vPer - 1];
  for (let i = n - vPer; i < n; i++) emaV = prices[i]*kv + emaV*(1-kv);
  const vwapGap = (last - emaV)/emaV;
  const vwap = { dir: vwapGap < -vThr ? 1 : vwapGap > vThr ? -1 : 0, strength: Math.min(0.9, Math.abs(vwapGap)*25) };

  // vol: realized annualized vol vs threshold
  const volPer = gp('vol','period',20), volThr = gp('vol','thr',0.28);
  const rets20 = rets(prices.slice(n - volPer - 1));
  const meanR  = rets20.reduce((s,r)=>s+r,0)/volPer;
  const vol20  = Math.sqrt(rets20.reduce((s,r)=>s+(r-meanR)**2,0)/volPer * 252);
  const vol = { dir: vol20 < volThr*0.65 ? 1 : vol20 > volThr*1.35 ? -1 : 0, strength: Math.min(0.9, Math.abs(vol20-volThr)/volThr) };

  // skew: short vs long vol direction-of-change
  const skFast = gp('skew','fast',5), skThr = gp('skew','thr',0.2);
  const retsF  = rets(prices.slice(n - skFast - 1));
  const volF   = Math.sqrt(retsF.reduce((s,r)=>s+r*r,0)/skFast * 252);
  const volChg = vol20 > 0 ? (volF - vol20)/vol20 : 0;
  const skew = { dir: volChg > skThr ? -1 : volChg < -skThr ? 1 : 0, strength: Math.min(0.9, Math.abs(volChg)) };

  // patt: cosine-similarity k-NN on N-day return pattern
  const pLen   = Math.min(gp('patt','len',20), Math.floor(n/3));
  const curPat = rets(prices.slice(n - pLen));
  let bestStart = 0, bestSim = -Infinity;
  for (let s = 0; s < n - pLen*2; s++) {
    const hisPat = rets(prices.slice(s, s+pLen));
    const dot = curPat.reduce((a,v,i)=>a+v*hisPat[i],0);
    const ma  = Math.sqrt(curPat.reduce((a,v)=>a+v*v,0));
    const mb  = Math.sqrt(hisPat.reduce((a,v)=>a+v*v,0));
    const sim = ma*mb > 0 ? dot/(ma*mb) : 0;
    if (sim > bestSim) { bestSim = sim; bestStart = s; }
  }
  const futRet = bestStart + pLen < n ? prices[bestStart+pLen]/prices[bestStart+pLen-1]-1 : 0;
  const patt = { dir: futRet > 0.004 ? 1 : futRet < -0.004 ? -1 : 0, strength: Math.min(0.9, Math.abs(futRet)*50) };

  // earn: medium-term MA drift (PEAD proxy)
  const eFast = gp('earn','fast',30), eSlow = gp('earn','slow',60), eThr = gp('earn','thresh',0.015);
  if (n < eSlow) return null;
  const maEF = prices.slice(n-eFast).reduce((s,p)=>s+p,0)/eFast;
  const maES = prices.slice(n-eSlow).reduce((s,p)=>s+p,0)/eSlow;
  const earnDrift = (maEF - maES)/maES;
  const earn = { dir: earnDrift > eThr ? 1 : earnDrift < -eThr ? -1 : 0, strength: Math.min(0.9, Math.abs(earnDrift)*20) };

  // fund: annualized Sharpe ratio (was firing zero due to non-annualized threshold)
  const fPer = gp('fund','period',20), fThr = gp('fund','thr',0.5);
  const retsFund = rets(prices.slice(n - fPer - 1));
  const meanRF   = retsFund.reduce((s,r)=>s+r,0)/fPer;
  const stdRF    = Math.sqrt(retsFund.reduce((s,r)=>s+(r-meanRF)**2,0)/fPer) + 1e-6;
  const annuSharpe = (meanRF/stdRF) * Math.sqrt(252);
  const fund = { dir: annuSharpe > fThr ? 1 : annuSharpe < -fThr ? -1 : 0, strength: Math.min(0.9, Math.abs(annuSharpe)/(fThr*4)) };

  // corr: market breadth (fraction above 5d MA) — replaces near-zero synthetic correlation
  const cHi = gp('corr','breadthHi',0.6), cLo = gp('corr','breadthLo',0.4);
  const breadthCnt = TICKERS.reduce((cnt, tk) => {
    const p = xp(tk.sym);
    if (p.length < 6) return cnt;
    const ma5c = p.slice(p.length-5).reduce((s,v)=>s+v,0)/5;
    return cnt + (p[p.length-1] > ma5c ? 1 : 0);
  }, 0);
  const breadth = breadthCnt / TICKERS.length;
  const corr = { dir: breadth > cHi ? 1 : breadth < cLo ? -1 : 0, strength: Math.min(0.9, Math.abs(breadth-0.5)*3) };

  // pair: z-score vs sector 1d return → mean-revert outliers
  const pThr   = gp('pair','thr',1.5);
  const sRets  = TICKERS.map(tk=>{const p=xp(tk.sym);return p.length>=2?p[p.length-1]/p[p.length-2]-1:0;});
  const sectMu = sRets.reduce((a,v)=>a+v,0)/sRets.length;
  const sectSd = Math.sqrt(sRets.reduce((a,v)=>a+(v-sectMu)**2,0)/sRets.length) + 1e-6;
  const dayRet = last/prices[n-2]-1;
  const zscore = (dayRet-sectMu)/sectSd;
  const pair   = { dir: zscore > pThr ? -1 : zscore < -pThr ? 1 : 0, strength: Math.min(0.9, Math.abs(zscore)/3) };

  // flow: price-change acceleration
  const acc  = (last-prices[n-2])-(prices[n-2]-prices[n-3]);
  const flow = { dir: acc > 0 ? 1 : acc < 0 ? -1 : 0, strength: Math.min(0.9, Math.abs(acc)/last*200) };

  // mm: N-day high-low range compression
  const mmPer = gp('mm','period',5), mmLo = gp('mm','loThr',0.006), mmHi = gp('mm','hiThr',0.022);
  const hiMM   = Math.max(...prices.slice(n-mmPer));
  const loMM   = Math.min(...prices.slice(n-mmPer));
  const rangeN = hiMM > 0 ? (hiMM-loMM)/hiMM : 0;
  const mm = { dir: rangeN < mmLo ? 1 : rangeN > mmHi ? -1 : 0, strength: Math.min(0.9, Math.abs(rangeN-(mmLo+mmHi)/2)*30) };

  // macr: average N-day return across all tickers
  const mPeriod = gp('macr','period',10), mThrMacr = gp('macr','thr',0.01);
  const mktRets = TICKERS.map(tk=>{const p=xp(tk.sym);return p.length>mPeriod+1?p[p.length-1]/p[p.length-mPeriod-1]-1:0;});
  const mktMu   = mktRets.reduce((a,v)=>a+v,0)/mktRets.length;
  const macr    = { dir: mktMu > mThrMacr ? 1 : mktMu < -mThrMacr ? -1 : 0, strength: Math.min(0.9, Math.abs(mktMu)*25) };

  // news: fast vs slow velocity differential
  const nFast = gp('news','fast',3), nSlow = gp('news','slow',10), nThr = gp('news','thresh',0.01);
  if (n <= nSlow + 1) return null;
  const velF   = (last-prices[n-nFast-1])/prices[n-nFast-1];
  const velS   = (last-prices[n-nSlow-1])/prices[n-nSlow-1];
  const newsSig = velF - velS;
  const news = { dir: newsSig > nThr ? 1 : newsSig < -nThr ? -1 : 0, strength: Math.min(0.9, Math.abs(newsSig)*30) };

  // soc: N-day momentum as social-sentiment proxy
  const sPer = gp('soc','period',3), sThr = gp('soc','thresh',0.006);
  const socRet = (last-prices[n-sPer-1])/prices[n-sPer-1];
  const soc    = { dir: socRet > sThr ? 1 : socRet < -sThr ? -1 : 0, strength: Math.min(0.9, Math.abs(socRet)*50) };

  return { momo, mean, brkt, vwap, vol, skew, patt, earn, fund, corr, pair, flow, mm, macr, news, soc };
}

// Weighted ensemble: signed strength × weight → net direction, confidence, consensus count
function computeEnsemble(signals, weights, enabledSet = null) {
  let wSum = 0, dirSum = 0;
  const votes = {};
  for (const a of AGENTS) {
    if (enabledSet && !enabledSet.has(a.id)) { votes[a.id] = 0; continue; }
    const sig = signals[a.id];
    const w   = weights[a.id] ?? a.weight;
    votes[a.id] = sig ? sig.dir : 0;
    if (sig && sig.dir !== 0) {
      dirSum += sig.dir * sig.strength * w;
      wSum   += sig.strength * w;
    }
  }
  const net = wSum > 0 ? dirSum / wSum : 0;
  const dir = net > 0.05 ? 'BUY' : net < -0.05 ? 'SELL' : null;
  const confidence = Math.min(0.97, Math.abs(net));
  const consensus  = dir ? AGENTS.filter(a => votes[a.id] === (dir === 'BUY' ? 1 : -1)).length : 0;
  return { dir, confidence, consensus, votes };
}

// EW reinforcement with confidence + signal-strength weighting
function updateAgentWeights(weights, trade) {
  if (!trade.votes || trade.pnl == null) return weights;
  const outcome = trade.pnl > 0 ? 1 : -1;
  const conf = Math.max(0.3, Math.min(1.0, trade.conf ?? 0.5));
  const baseLr = 0.05 + 0.04 * conf; // lr scales with conviction
  const next = { ...weights };
  for (const a of AGENTS) {
    const vote = trade.votes[a.id];
    if (!vote) continue;
    const strength = trade.signals?.[a.id]?.strength ?? 0.5;
    const correct = vote * outcome > 0;
    // Confident+strong correct calls rewarded more; weak wrong calls penalised less
    const delta = baseLr * Math.sqrt(strength) * (correct ? 0.55 : -0.45);
    next[a.id] = Math.max(0.008, Math.min(0.32, next[a.id] * (1 + delta)));
  }
  const total = Object.values(next).reduce((s, v) => s + v, 0);
  for (const id of Object.keys(next)) next[id] /= total;
  return next;
}

// Rolling per-agent accuracy buffer — last 50 closed votes
function updateAgentHistory(history, trade) {
  if (!trade.votes || trade.pnl == null) return history;
  const outcome = trade.pnl > 0 ? 1 : -1;
  const next = { ...history };
  for (const a of AGENTS) {
    const vote = trade.votes[a.id];
    if (!vote) continue;
    next[a.id] = [...(next[a.id] || []), vote * outcome > 0].slice(-50);
  }
  return next;
}

// Narrative reason from top-3 agents supporting the ensemble direction
function buildReason(signals, ensemble) {
  if (!ensemble.dir || !signals) return '–';
  const targetDir = ensemble.dir === 'BUY' ? 1 : -1;
  const supporters = AGENTS
    .filter(a => signals[a.id]?.dir === targetDir)
    .sort((a, b) => (signals[b.id]?.strength || 0) - (signals[a.id]?.strength || 0))
    .slice(0, 3);
  if (!supporters.length) return ensemble.dir === 'BUY' ? 'Weak bullish ensemble' : 'Weak bearish ensemble';
  return supporters.map(a => a.name).join(' + ') + (ensemble.dir === 'BUY' ? ' → bullish' : ' → bearish');
}

// Walk-forward accuracy backtest: grid-search one param for one agent
function backtestOneAgent(agentId, sym, agentParams) {
  const okKey = AGENT_OPTIMIZE_KEYS[agentId];
  if (!okKey || !okKey.id) return null;
  const prices = PRICE_HISTORY[sym];
  if (!prices || prices.length < 120) return null;
  let bestValue = okKey.values[0], bestScore = -Infinity;
  const results = [];
  for (const candVal of okKey.values) {
    const params = { ...agentParams, [agentId]: { ...(agentParams[agentId] || {}), [okKey.id]: candVal } };
    let correct = 0, total = 0;
    const step = 5;
    for (let ei = 80; ei < prices.length - step; ei += step) {
      const sigs = computeSignals(sym, PRICE_HISTORY, params, ei);
      if (!sigs) continue;
      const sig = sigs[agentId];
      if (!sig || sig.dir === 0) continue;
      const futRet = prices[Math.min(ei + step, prices.length - 1)] / prices[ei] - 1;
      if ((sig.dir === 1 && futRet > 0) || (sig.dir === -1 && futRet < 0)) correct++;
      total++;
    }
    const accuracy = total > 0 ? correct / total : 0;
    results.push({ value: candVal, accuracy, total });
    if (accuracy > bestScore) { bestScore = accuracy; bestValue = candVal; }
  }
  return { paramKey: okKey.id, bestValue, bestAccuracy: bestScore, results };
}

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function genSeries(seed, base, drift, vol) {
  const rng = mulberry32(seed);
  const out = [base];
  for (let i = 1; i < 252; i++) {
    const r = (rng() - 0.5) * vol + drift;
    out.push(Math.max(1, out[i - 1] * (1 + r)));
  }
  return out;
}

function genTrades(n) {
  const rng = mulberry32(SEED + 400);
  const out = [];
  let now = Date.now();
  for (let i = 0; i < n; i++) {
    const t = TICKERS[Math.floor(rng() * TICKERS.length)];
    const side = rng() > 0.5 ? 'BUY' : 'SELL';
    const qty = Math.floor(rng() * 80) + 5;
    const price = t.last * (1 + (rng() - 0.5) * 0.04);
    const conf = 0.55 + rng() * 0.35;
    const pnl = (rng() - 0.42) * qty * price * 0.025;
    const closed = i > 4;
    const holdMs = (1000 * 60 * (20 + rng() * 60 * 8));
    // derive exit price so exit = entry + pnl/qty (sign-adjusted for side)
    const exit = closed ? price + (pnl / qty) * (side === 'BUY' ? 1 : -1) : null;
    out.push({
      id: 'TX-' + (10428 - i),
      ts: now - i * (1000 * 60 * (3 + rng() * 12)),
      exitTs: closed ? now - i * (1000 * 60 * (3 + rng() * 12)) + holdMs : null,
      sym: t.sym,
      side,
      qty,
      price,           // entry
      exit,            // exit (null if open)
      conf,
      reason: REASONS[side === 'BUY' ? 'buy' : 'sell'][Math.floor(rng() * REASONS.buy.length)],
      pnl: closed ? pnl : null,
      pnlPct: closed ? pnl / (qty * price) : null,
      status: closed ? (pnl > 0 ? 'WIN' : 'LOSS') : 'OPEN',
      mode: 'VIRTUAL',
      consensus: Math.floor(conf * 8),
    });
  }
  return out;
}

function genPredVsActual(sym = 'NVDA') {
  const seedMix = Array.from(sym).reduce((a,c) => a + c.charCodeAt(0) * 17, 0);
  const rng = mulberry32(SEED + 600 + seedMix);

  const base = tk ? tk.last * 0.92 : 100 + (sym.charCodeAt(0) % 400);
  const actual = [base];
  const pred = [base];
  for (let i = 1; i < 60; i++) {
    actual.push(actual[i-1] * (1 + (rng() - 0.49) * 0.018));
    pred.push(actual[i-1] * (1 + (rng() - 0.49) * 0.022));
  }
  // compute metrics
  let mae = 0, dirCorrect = 0;
  for (let i = 1; i < actual.length; i++) {
    mae += Math.abs(pred[i] - actual[i]) / actual[i];
    const actualDir = actual[i] > actual[i-1];
    const predDir = pred[i] > actual[i-1];
    if (actualDir === predDir) dirCorrect++;
  }
  return { actual, pred, mae: mae/(actual.length-1), dirAcc: dirCorrect/(actual.length-1) };
}

function fmtPct(n, dp = 2) {
  if (n === null || n === undefined) return '—';
  return (n >= 0 ? '+' : '') + (n * 100).toFixed(dp) + '%';
}
function fmtNum(n, dp = 2) {
  if (n === null || n === undefined) return '—';
  return n.toFixed(dp).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtTime(ts) {
  const d = new Date(ts);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  const ss = String(d.getSeconds()).padStart(2, '0');
  return `${hh}:${mm}:${ss}`;
}

Object.assign(window, {
  AGENTS, TICKERS, SECTORS, SECTOR_TICKERS, PRICE_HISTORY,
  EQUITY, WEIGHT_HISTORY, CONFIDENCE_HISTORY, TRADES, HEATMAP, PRED_ACTUAL,
  REGIMES, OUTCOMES, PARAM_EVENTS,
  fmtMoney, fmtPct, fmtNum, fmtTime, mulberry32,
});

</script>

const Sparkline = ({ data, width = 80, height = 22, color = 'currentColor', fill = false }) => {

  const range = max - min || 1;
  const pts = data.map((v, i) => `${(i / (data.length - 1)) * width},${height - ((v - min) / range) * (height - 2) - 1}`);
  return (
    <svg width={width} height={height} className="spark">
      {fill && <path d={`M0,${height} L${pts.join(' L')} L${width},${height} Z`} fill={color} opacity="0.15" />}

<script type="text/babel" data-presets="react">
// Charts — all hand-rolled SVG. Equity, stacked area weights, scatter pred-vs-actual,
// price chart, swarm visualization, heatmap, donut, etc.

const LineChart = ({ series, height = 220, colors = ['var(--virtual)', 'var(--ink-3)'], labels = [], yFmt = v => v.toFixed(0), fillFirst = true, solidLines = false, xLabels = null }) => {
  const [hover, setHover] = React.useState(null);
  const W = 700, H = height, pad = { l: 50, r: 12, t: 14, b: 22 };
  const innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b;
  const all = series.flat().filter(Number.isFinite);
  if (!all.length) return null;
  const min = Math.min(...all) * 0.985;
  const max = Math.max(...all) * 1.005;
  const range = max - min || 1;
  const len = Math.max(...series.map(s => s.length));
  const x = i => pad.l + (i / Math.max(1, len - 1)) * innerW;
  const y = v => pad.t + innerH - ((v - min) / range) * innerH;

  const onMove = (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const svgX = ((e.clientX - rect.left) / rect.width) * W;
    const i = Math.max(0, Math.min(len - 1, Math.round((svgX - pad.l) / innerW * (len - 1))));
    setHover({ i, ys: series.map(s => s[i]) });
  };

  const hasLabels = labels.length > 0;

  return (
    <div style={{position:'relative'}}>
      {hover && hasLabels && (
        <div style={{position:'absolute',top:2,left:pad.l,display:'flex',gap:8,flexWrap:'wrap',pointerEvents:'none',zIndex:2}}>
          {series.map((s, idx) => labels[idx] != null && s[hover.i] != null ? (
            <span key={idx} style={{fontFamily:'var(--mono)',fontSize:10,padding:'2px 7px',borderRadius:3,background:'var(--bg-2)',border:`1px solid ${colors[idx]||'var(--line)'}`,color:colors[idx]||'var(--ink)',whiteSpace:'nowrap'}}>
              {labels[idx]}: <b>{yFmt(s[hover.i])}</b>
            </span>
          ) : null)}
        </div>
      )}
      <svg viewBox={`0 0 ${W} ${H}`} className="chart" preserveAspectRatio="none" style={{height: H, cursor:'crosshair'}}
        onMouseMove={onMove} onMouseLeave={() => setHover(null)}>
        {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
          <g key={i}>
            <line x1={pad.l} x2={W - pad.r} y1={pad.t + innerH * t} y2={pad.t + innerH * t} className="gridline"/>
            <text x={pad.l - 6} y={pad.t + innerH * t + 3} textAnchor="end" className="axis-text">{yFmt(max - range * t)}</text>
          </g>
        ))}
        {series.map((s, idx) => {
          const pts = s.map((v, i) => `${x(i)},${y(v)}`).join(' L');
          const dim = hover !== null;
          return (
            <g key={idx}>
              {idx === 0 && fillFirst && (
                <path d={`M${x(0)},${y(min)} L${pts} L${x(s.length-1)},${y(min)} Z`} fill={colors[idx]} opacity={dim ? 0.04 : 0.08}/>
              )}
              <path d={`M${pts}`} fill="none" stroke={colors[idx]} strokeWidth={idx === 0 ? 1.8 : 1.3}
                strokeDasharray={(!solidLines && idx > 0) ? '4 3' : ''}
                opacity={dim ? 0.35 : 1} style={{transition:'opacity 0.1s'}}/>
            </g>
          );
        })}
        {hover && (
          <>
            <line x1={x(hover.i)} x2={x(hover.i)} y1={pad.t} y2={pad.t+innerH} stroke="var(--ink-2)" strokeWidth="0.7" strokeDasharray="3 3" opacity="0.6"/>
            {series.map((s, idx) => s[hover.i] != null && (
              <circle key={idx} cx={x(hover.i)} cy={y(s[hover.i])} r="3.5" fill={colors[idx]||'var(--ink)'} stroke="var(--bg-1)" strokeWidth="1.5"/>
            ))}
          </>
        )}
        {xLabels ? (
          [0, Math.floor((len-1)/2), len-1].map((i, idx) => xLabels[i] ? (
            <text key={idx} x={x(i)} y={H-6} textAnchor={idx===0?'start':idx===1?'middle':'end'} className="axis-text">{xLabels[i]}</text>
          ) : null)
        ) : (
          [0, 0.5, 1].map((t, i) => (
            <text key={i} x={x((len-1)*t)} y={H-6} textAnchor={i===0?'start':i===1?'middle':'end'} className="axis-text">{Math.floor((len-1)*t)}d</text>
          ))
        )}
      </svg>
    </div>
  );
};

const StackedArea = ({ series, keys, colors, height = 240 }) => {
  const W = 700, H = height, pad = { l: 40, r: 12, t: 12, b: 22 };
  const innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b;
  const len = series[keys[0]].length;
  const x = i => pad.l + (i / (len - 1)) * innerW;
  // build stacked
  const stacks = [];
  for (let i = 0; i < len; i++) {
    let acc = 0;
    const col = {};
    keys.forEach(k => { col[k] = [acc, acc + series[k][i]]; acc += series[k][i]; });
    stacks.push(col);
  }
  const y = v => pad.t + innerH - v * innerH;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart" preserveAspectRatio="none" style={{height: H}}>
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
        <line key={i} x1={pad.l} x2={W - pad.r} y1={pad.t + innerH * t} y2={pad.t + innerH * t} className="gridline"/>
      ))}
      {keys.map((k, idx) => {
        const top = stacks.map((s, i) => `${x(i)},${y(s[k][1])}`).join(' L');
        const bot = stacks.map((s, i) => `${x(i)},${y(s[k][0])}`).reverse().join(' L');
        return <path key={k} d={`M${top} L${bot} Z`} fill={colors[idx]} opacity="0.85"/>;
      })}
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
        <text key={i} x={pad.l - 6} y={pad.t + innerH * t + 3} textAnchor="end" className="axis-text">{Math.round((1-t)*100)}%</text>
      ))}
      {[0, 0.5, 1].map((t, i) => (
        <text key={i} x={x((len - 1) * t)} y={H - 6} textAnchor={i === 0 ? 'start' : i === 1 ? 'middle' : 'end'} className="axis-text">−{Math.floor((len - 1) * (1 - t))}d</text>
      ))}
    </svg>
  );
};

const PredVsActual = ({ pred, actual, height = 220 }) => {
  const W = 700, H = height, pad = { l: 46, r: 12, t: 12, b: 22 };
  const innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b;
  const all = [...pred, ...actual];
  const min = Math.min(...all) * 0.99, max = Math.max(...all) * 1.01;
  const range = max - min;
  const x = i => pad.l + (i / (pred.length - 1)) * innerW;
  const y = v => pad.t + innerH - ((v - min) / range) * innerH;
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart" preserveAspectRatio="none" style={{height: H}}>
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
        <g key={i}>
          <line x1={pad.l} x2={W-pad.r} y1={pad.t+innerH*t} y2={pad.t+innerH*t} className="gridline"/>
          <text x={pad.l-6} y={pad.t+innerH*t+3} textAnchor="end" className="axis-text">${(max-range*t).toFixed(0)}</text>
        </g>
      ))}
      {/* error bands */}
      {pred.map((p, i) => i % 4 === 0 ? (
        <line key={i} x1={x(i)} x2={x(i)} y1={y(p)} y2={y(actual[i])} stroke="var(--ink-4)" strokeWidth="0.5" opacity="0.5"/>
      ) : null)}
      <path d={`M${actual.map((v,i)=>`${x(i)},${y(v)}`).join(' L')}`} fill="none" stroke="var(--ink)" strokeWidth="1.6"/>
      <path d={`M${pred.map((v,i)=>`${x(i)},${y(v)}`).join(' L')}`} fill="none" stroke="var(--virtual)" strokeWidth="1.4" strokeDasharray="4 3"/>
    </svg>
  );
};

const SwarmViz = ({ agents, decision = 'BUY', confidence = 0.71, tick = 0, agentVotes = null }) => {
  const cx = 50, cy = 50;
  const votes = React.useMemo(() => {
    // Use real per-agent votes when available
    if (agentVotes) {
      return agents.map(a => {
        const v = agentVotes[a.id];
        return v === 1 ? 'buy' : v === -1 ? 'sell' : 'hold';
      });
    }
    // Synthetic fallback (no real signals)
    const majFrac = 0.4 + confidence * 0.5;
    return agents.map((a, i) => {
      const r = (Math.sin(i * 12.9898 + decision.charCodeAt(0)) + 1) / 2;
      if (r < majFrac) return decision === 'HOLD' ? 'hold' : decision.toLowerCase();
      if (r < majFrac + (1 - majFrac) * 0.55) return decision === 'BUY' ? 'sell' : decision === 'SELL' ? 'buy' : 'buy';
      return 'hold';
    });
  }, [agents, decision, confidence, agentVotes]);
  const tally = { buy: 0, sell: 0, hold: 0 };
  votes.forEach(v => tally[v]++);
  return (
    <div className="swarm">
      <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none'}} viewBox="0 0 100 100" preserveAspectRatio="none">
        {agents.map((a, i) => {
          const angle = (i / agents.length) * Math.PI * 2 - Math.PI/2;
          const r = 36 + Math.sin(tick * 0.3 + i) * 1.5;
          const ax = cx + Math.cos(angle) * r;
          const ay = cy + Math.sin(angle) * r;
          const vote = votes[i];
          const color = vote === 'buy' ? '#7dd87d' : vote === 'sell' ? '#ff6b6b' : '#4a4740';
          return (
            <line key={a.id} x1={cx} y1={cy} x2={ax} y2={ay}
              stroke={color} strokeWidth={a.weight * 2} opacity={Math.min(1, a.weight * 6)}/>
          );
        })}
        <circle cx={cx} cy={cy} r="11" fill="none" stroke="var(--virtual)" strokeWidth="0.4" opacity="0.3"/>
        <circle cx={cx} cy={cy} r="14" fill="none" stroke="var(--virtual)" strokeWidth="0.3" opacity="0.2"/>
      </svg>
      {agents.map((a, i) => {
        const angle = (i / agents.length) * Math.PI * 2 - Math.PI/2;
        const r = 36 + Math.sin(tick * 0.3 + i) * 1.5;
        const ax = 50 + Math.cos(angle) * r;
        const ay = 50 + Math.sin(angle) * r;
        const vote = votes[i];
        return (
          <div key={a.id} className="agent-node" style={{left: `${ax}%`, top: `${ay}%`}} title={`${a.name} — ${vote.toUpperCase()}`}>
            <div className={`agent-disc ${vote}`}>{a.glyph}</div>
            <div className="agent-name">{a.id}</div>
          </div>
        );
      })}
      <div className="swarm-center">
        <div className={'pill solid ' + (decision === 'BUY' ? 'buy' : decision === 'SELL' ? 'sell' : 'hold')}><span>{decision}</span></div>
        <div className="v">{Math.floor(confidence * 100)}<span style={{fontSize:14}}>%</span></div>
        <div className="l">consensus</div>
      </div>
      {/* expose tally via data attr so parents can read */}
      <div data-tally={`${tally.buy}·${tally.sell}·${tally.hold}`} style={{display:'none'}}/>
    </div>
  );
};

// Helper: compute swarm tally consistent with SwarmViz
function swarmTally(agents, decision, confidence) {
  const majFrac = 0.4 + confidence * 0.5;
  const tally = { buy: 0, sell: 0, hold: 0 };
  agents.forEach((a, i) => {
    const r = (Math.sin(i * 12.9898 + decision.charCodeAt(0)) + 1) / 2;
    let v;
    if (r < majFrac) v = decision === 'HOLD' ? 'hold' : decision.toLowerCase();
    else if (r < majFrac + (1 - majFrac) * 0.55) v = decision === 'BUY' ? 'sell' : decision === 'SELL' ? 'buy' : 'buy';
    else v = 'hold';
    tally[v]++;
  });
  return tally;
}

const Heatmap = ({ data, rows, cols }) => {
  const max = Math.max(...data.flat());
  return (
    <div>
      <div className="heat" style={{gridTemplateColumns: `90px repeat(${cols.length}, 1fr)`}}>
        <div></div>
        {cols.map(c => <div key={c} className="axis-text" style={{padding:'4px 0', textAlign:'center', fontFamily:'var(--mono)', fontSize:9, color:'var(--ink-3)', letterSpacing:'0.08em'}}>{c.toUpperCase()}</div>)}
        {rows.map((r, ri) => (
          <React.Fragment key={r}>
            <div style={{fontFamily:'var(--mono)',fontSize:10,color:'var(--ink-3)',letterSpacing:'0.08em',display:'flex',alignItems:'center',padding:'0 8px'}}>{r.toUpperCase()}</div>
            {cols.map((c, ci) => {
              const v = data[ri][ci];
              const t = v / max;
              // diverge: left = wins (green), right = losses (red)
              const isWin = ci < cols.length / 2;
              const bg = isWin
                ? `rgba(125, 216, 125, ${0.1 + t * 0.5})`
                : `rgba(255, 107, 107, ${0.1 + t * 0.5})`;
              return <div key={ci} className="heat-cell" style={{background: bg}}>{v}</div>;
            })}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
};

const Donut = ({ value, max = 1, label = '', size = 120, color = 'var(--virtual)' }) => {
  const r = size / 2 - 8;
  const c = 2 * Math.PI * r;
  const off = c * (1 - value / max);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="var(--bg-3)" strokeWidth="6"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth="6"
        strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
        transform={`rotate(-90 ${size/2} ${size/2})`}/>
      <text x={size/2} y={size/2 + 2} textAnchor="middle" fontFamily="var(--serif)" fontSize="22" fill="var(--ink)">{Math.round(value/max*100)}%</text>
      <text x={size/2} y={size/2 + 18} textAnchor="middle" fontFamily="var(--mono)" fontSize="9" fill="var(--ink-3)" letterSpacing="0.14em">{label}</text>
    </svg>
  );
};

const PriceChart = ({ data, height = 240, predicted = null }) => {
  const W = 700, H = height, pad = { l: 50, r: 12, t: 12, b: 22 };
  const innerW = W - pad.l - pad.r, innerH = H - pad.t - pad.b;
  const min = Math.min(...data) * 0.985, max = Math.max(...data) * 1.005;
  const range = max - min;
  const x = i => pad.l + (i / (data.length - 1)) * innerW;
  const y = v => pad.t + innerH - ((v - min) / range) * innerH;
  const pts = data.map((v, i) => `${x(i)},${y(v)}`).join(' L');
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="chart" preserveAspectRatio="none" style={{height: H}}>
      <defs>
        <linearGradient id="pf" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stopColor="var(--virtual)" stopOpacity="0.18"/>
          <stop offset="100%" stopColor="var(--virtual)" stopOpacity="0"/>
        </linearGradient>
      </defs>
      {[0, 0.25, 0.5, 0.75, 1].map((t, i) => (
        <g key={i}>
          <line x1={pad.l} x2={W-pad.r} y1={pad.t+innerH*t} y2={pad.t+innerH*t} className="gridline"/>
          <text x={pad.l-6} y={pad.t+innerH*t+3} textAnchor="end" className="axis-text">${(max-range*t).toFixed(1)}</text>
        </g>
      ))}
      <path d={`M${x(0)},${y(min)} L${pts} L${x(data.length-1)},${y(min)} Z`} fill="url(#pf)"/>
      <path d={`M${pts}`} fill="none" stroke="var(--ink)" strokeWidth="1.4"/>
      {predicted && (
        <g>
          <path d={`M${predicted.map((v,i)=>`${x(data.length - 1 + i)},${y(v)}`).join(' L')}`} fill="none" stroke="var(--virtual)" strokeWidth="1.4" strokeDasharray="3 3"/>
          {/* shaded forecast band */}
          <path d={`M${predicted.map((v,i)=>`${x(data.length - 1 + i)},${y(v * 1.015)}`).join(' L')} L${predicted.map((v,i)=>`${x(data.length - 1 + i)},${y(v * 0.985)}`).reverse().join(' L')} Z`} fill="var(--virtual)" opacity="0.08"/>
        </g>
      )}
    </svg>
  );
};

Object.assign(window, { LineChart, StackedArea, PredVsActual, SwarmViz, Heatmap, Donut, PriceChart, swarmTally });

</script>
<script type="text/babel" data-presets="react">
// Dashboard screen — portfolio overview, swarm, KPIs, recent trades

const ScreenDashboard = ({ mode, tick, onTradeClick, onMode, ctx }) => {
  const activeSymbol = ctx?.activeSymbol || 'NVDA';
  const direction = ctx?.direction || 'BOTH';
  const equityNow = ctx?.balance ?? EQUITY.bot[EQUITY.bot.length - 1];
  const equityStart = EQUITY.bot[0];
  const totalRet = (equityNow - equityStart) / equityStart;
  const benchRet = (EQUITY.bench[EQUITY.bench.length-1] - EQUITY.bench[0]) / EQUITY.bench[0];
  const visibleTrades = ctx?.trades || [];
  const wins = visibleTrades.filter(t => t.status === 'WIN').length;
  const losses = visibleTrades.filter(t => t.status === 'LOSS').length;

  // flash equity when it changes
  const [flashKey, setFlashKey] = React.useState(0);
  const prevBalRef = React.useRef(equityNow);
  React.useEffect(() => {
    if (prevBalRef.current !== equityNow) { setFlashKey(k => k+1); prevBalRef.current = equityNow; }
  }, [equityNow]);
  const winRate = wins / (wins + losses);
  const openP = visibleTrades.filter(t => t.status === 'OPEN');

  return (
    <div className="page" data-screen-label="01 Dashboard">
      <div className="page-head" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
        <div>
          <div className="page-eyebrow">Dashboard · {mode === 'LIVE' ? 'Live trading' : mode === 'VIRTUAL' ? 'Broker paper · virtual' : 'Fully simulated'}</div>
          <h1 className="page-title">A swarm of {AGENTS.length} agents <em>currently disagreeing about the next 12 hours.</em></h1>
        </div>
        <div className="mono tiny muted">SHOAL ENGINE v0.4.2 · Last sync 3s ago</div>
      </div>

      <div className="kpi-grid" style={{marginBottom:16}}>
        <div className="kpi" style={{position:'relative'}}>
          <div className="kpi-label" style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span style={{display:'flex',alignItems:'center',gap:5}}>
              Equity {mode === 'LIVE' ? '· Live' : mode === 'VIRTUAL' ? '· Broker Paper' : '· Virtual'}
              <span title={mode==='LIVE'?'Real account equity from your Alpaca live account — updated via SSE.':mode==='VIRTUAL'?'Paper trading equity using your broker\'s paper account with live signals.':'Simulated equity running in-browser. No real capital. Resets on request. The bot learns from these paper outcomes.'} style={{cursor:'help',color:'var(--ink-3)',fontSize:11,lineHeight:1}}>ⓘ</span>
            </span>
            <span style={{fontSize:9,letterSpacing:'0.12em'}}>
              <span className={'tick-dot '+(direction==='SHORT'?'short fast':direction==='LONG'?'fast':'')}></span>
              {direction === 'BOTH' ? 'IDLE' : direction + ' BIAS'}
            </span>
          </div>
          <div key={flashKey} className="kpi-value mono equity-live">{fmtMoney(equityNow, 0)}</div>
          <div className={'kpi-delta ' + (totalRet >= 0 ? 'up' : 'dn')}>{fmtPct(totalRet)} · {Math.round(EQUITY.bot.length)}d</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">vs S&P 500</div>
          <div className="kpi-value mono">{fmtPct(totalRet - benchRet)}</div>
          <div className="kpi-delta muted">alpha · {fmtPct(benchRet)} bench</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Win rate · 30d</div>
          <div className="kpi-value mono">{(winRate * 100).toFixed(1)}%</div>
          <div className="kpi-delta up">{wins}W / {losses}L</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Sharpe · trailing</div>
          <div className="kpi-value mono">1.83</div>
          <div className="kpi-delta up">+0.21 vs last cycle</div>
        </div>
      </div>

      <div className="grid-2-1" style={{marginBottom:16}}>
        <div className="card">
          <div className="card-head">
            <div>
              <div className="card-title">Equity curve</div>
              <div className="mono tiny muted" style={{marginTop:4}}>Bot vs S&P 500 · 180 trading days</div>
            </div>
            <div className="legend">
              <span><span className="legend-dot" style={{background:'var(--virtual)'}}></span>Bot equity</span>
              <span><span className="legend-dot" style={{background:'var(--ink-3)'}}></span>S&P 500</span>
            </div>
          </div>
          <LineChart series={[EQUITY.bot, EQUITY.bench]} colors={['var(--virtual)','var(--ink-3)']} labels={['Bot','S&P 500']} yFmt={v => '$' + Math.round(v/1000) + 'k'}/>
        </div>

        <div className="card">
          <div className="card-head">
            <div className="card-title">Swarm consensus · live</div>
            <div className="card-meta">{activeSymbol} · 14:32:08</div>
          </div>
          {(() => {
            const sigs = ctx?.lastSignals;
            const wts  = ctx?.agentWeights || {};
            const ens  = sigs ? computeEnsemble(sigs, wts) : null;
            const dec  = ens?.dir || (direction === 'SHORT' ? 'SELL' : 'BUY');
            const conf = ens?.confidence || 0.71;
            const tally = { buy: 0, sell: 0, hold: 0 };
            AGENTS.forEach(a => { const v = ens?.votes?.[a.id]; tally[v === 1 ? 'buy' : v === -1 ? 'sell' : 'hold']++; });
            return (<>
              <SwarmViz agents={AGENTS} decision={dec} confidence={conf} tick={tick} agentVotes={ens?.votes || null}/>
              <div style={{marginTop:12,display:'flex',justifyContent:'space-between',fontFamily:'var(--mono)',fontSize:11}}>
                <span className="muted">{tally.buy} BUY · {tally.sell} SELL · {tally.hold} HOLD</span>
                <span className={dec === 'BUY' ? 'up' : 'dn'}>{dec === 'BUY' ? 'conviction rising →' : 'conviction falling →'}</span>
              </div>
            </>);
          })()}
        </div>
      </div>

      <div className="grid-2" style={{marginBottom:16}}>
        <div className="card">
          <div className="card-head">
            <div className="card-title">Open positions</div>
            <div className="card-meta">{openP.length} live · {fmtMoney(openP.reduce((a,t)=>a+t.qty*t.price,0), 0)}</div>
          </div>
          <table className="tbl">
            <thead><tr><th>Sym</th><th>Side</th><th>Qty</th><th>Entry</th><th>Mark</th><th style={{textAlign:'right'}}>Unreal P&L</th></tr></thead>
            <tbody>
              {openP.slice(0,5).map(t => {
                const mark = t.price * (1 + (Math.sin(tick*0.3 + t.sym.charCodeAt(0)) * 0.008));
                const upnl = (mark - t.price) * t.qty * (t.side === 'BUY' ? 1 : -1);
                return (
                  <tr key={t.id} onClick={()=>onTradeClick(t)}>
                    <td className="mono">{t.sym}</td>
                    <td><span className={'pill ' + (t.side==='BUY'?'buy':'sell')}>{t.side}</span></td>
                    <td className="mono">{t.qty}</td>
                    <td className="mono">{fmtNum(t.price)}</td>
                    <td className="mono">{fmtNum(mark)}</td>
                    <td className={'mono ' + (upnl>=0?'up':'dn')} style={{textAlign:'right'}}>{fmtMoney(upnl)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        <div className="card">
          <div className="card-head">
            <div className="card-title">Confidence over time</div>
            <div className="card-meta">90-day rolling</div>
          </div>
          <LineChart series={[CONFIDENCE_HISTORY]} colors={['var(--virtual)']} labels={['Confidence']} yFmt={v=>(v*100).toFixed(0)+'%'}/>
          <div style={{marginTop:8}} className="mono tiny muted">Calibration drifts as the market regime shifts — 0.71 today, range 0.48–0.83.</div>
        </div>
      </div>

      <div className="card">
        <div className="card-head">
          <div className="card-title">Latest decisions</div>
          <div className="card-meta">most recent first</div>
        </div>
        <div className="feed">
          {visibleTrades.length === 0 && (
            <div style={{padding:'30px 16px',textAlign:'center',color:'var(--ink-3)',fontSize:13}}>
              <div className="mono tiny" style={{letterSpacing:'0.12em',marginBottom:6,color:'var(--ink-3)'}}>FRESH ACCOUNT</div>
              No trades yet. The swarm will start executing once the next signal clears your confidence threshold.
            </div>
          )}
          {visibleTrades.slice(0, 6).map(t => (
            <div key={t.id} className="feed-row" onClick={()=>onTradeClick(t)}>
              <div className="feed-time">{fmtTime(t.ts)}</div>
              <div className="feed-sym">{t.sym}</div>
              <div><span className={'pill ' + (t.side==='BUY'?'buy':'sell')}>{t.side}</span></div>
              <div className="feed-reason">{t.reason}</div>
              <div className="mono tiny muted">conf {(t.conf*100).toFixed(0)}%</div>
              <div className={'feed-pnl ' + (t.pnl > 0 ? 'up' : t.pnl < 0 ? 'dn' : 'muted')}>{t.pnl !== null ? fmtMoney(t.pnl) : '— open —'}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

window.ScreenDashboard = ScreenDashboard;

</script>

            {['ALL','BUY','SELL','OPEN','WIN','LOSS'].map(f => (

            <div key={t.id} className={'feed-row ' + (t.isNew?'new':'')} onClick={()=>onTradeClick(t)}>

              <div className="mono tiny muted">{t.qty}@{fmtNum(t.price)}</div>
              <div className={'feed-pnl ' + (t.pnl > 0 ? 'up' : t.pnl < 0 ? 'dn' : 'muted')}>{t.pnl !== null ? fmtMoney(t.pnl) : '— open —'}</div>

          ))}
        </div>

  );
};

window.ScreenActivity = ScreenActivity;

</script>
<script type="text/babel" data-presets="react">
// Trade history — complete closed/open record with entry, exit, P&L
const ScreenHistory = ({ mode, tick, onTradeClick, ctx }) => {
  const [sort, setSort] = React.useState('time');        // time | pnl | pnlPct | sym
  const [dir, setDir] = React.useState(-1);              // 1 asc, -1 desc
  const [statusFilter, setStatusFilter] = React.useState('ALL');  // ALL | WIN | LOSS | OPEN
  const [sideFilter, setSideFilter] = React.useState('ALL');      // ALL | BUY | SELL
  const [symFilter, setSymFilter] = React.useState('ALL');        // ALL | {sym}
  const activeSymbol = ctx?.activeSymbol;
  const baseTrades = ctx?.trades || [];

  const symbols = React.useMemo(() => Array.from(new Set(baseTrades.map(t => t.sym))).sort(), [baseTrades]);

  // live mark on open positions (so open rows animate)
  const markedTrades = React.useMemo(() => baseTrades.map(t => {
    if (t.status !== 'OPEN') return t;
    // Real Alpaca positions already carry _upnl/_upnlPct from the SSE stream — don't overwrite with simulation
    if (t._real && t._upnl != null) return t;
    if (!t.price) return t; // no entry price yet (pending market order), skip mark
    const mark = t.price * (1 + Math.sin(tick * 0.3 + t.sym.charCodeAt(0)) * 0.008);
    const upnl = (mark - t.price) * t.qty * (t.side === 'BUY' ? 1 : -1);
    return { ...t, _mark: mark, _upnl: upnl, _upnlPct: upnl / (t.qty * t.price) };
  }), [tick]);

  let filtered = markedTrades.filter(t =>
    (statusFilter === 'ALL' || t.status === statusFilter) &&
    (sideFilter === 'ALL' || t.side === sideFilter) &&
    (symFilter === 'ALL' || t.sym === symFilter)
  );

  filtered = filtered.slice().sort((a, b) => {
    let av, bv;
    if (sort === 'time') { av = a.ts; bv = b.ts; }
    else if (sort === 'pnl') { av = a.pnl ?? a._upnl ?? 0; bv = b.pnl ?? b._upnl ?? 0; }
    else if (sort === 'pnlPct') { av = a.pnlPct ?? a._upnlPct ?? 0; bv = b.pnlPct ?? b._upnlPct ?? 0; }
    else if (sort === 'sym') { av = a.sym; bv = b.sym; return dir * av.localeCompare(bv); }
    return dir * (av - bv);
  });

  const closed = baseTrades.filter(t => t.status !== 'OPEN');
  const wins = closed.filter(t => t.pnl > 0);
  const losses = closed.filter(t => t.pnl <= 0);
  const totalRealized = closed.reduce((a, t) => a + (t.pnl || 0), 0);
  const totalWinAmt = wins.reduce((a, t) => a + t.pnl, 0);
  const totalLossAmt = losses.reduce((a, t) => a + t.pnl, 0);
  const avgWin = wins.length ? totalWinAmt / wins.length : 0;
  const avgLoss = losses.length ? totalLossAmt / losses.length : 0;
  const profitFactor = losses.length ? totalWinAmt / Math.abs(totalLossAmt) : Infinity;
  const winRate = closed.length ? wins.length / closed.length : 0;
  const best = closed.reduce((a, t) => (t.pnl > (a?.pnl || -Infinity) ? t : a), null);
  const worst = closed.reduce((a, t) => (t.pnl < (a?.pnl || Infinity) ? t : a), null);

  const toggleSort = (k) => {
    if (sort === k) setDir(d => d * -1);
    else { setSort(k); setDir(k === 'sym' ? 1 : -1); }
  };
  const sortArrow = (k) => sort === k ? (dir === 1 ? ' ↑' : ' ↓') : '';

  const exportCSV = () => {
    const rows = [['ID','Time','Sym','Side','Qty','Entry','Exit','P&L','P&L %','Status','Reason']];
    filtered.forEach(t => rows.push([
      t.id, new Date(t.ts).toISOString(), t.sym, t.side, t.qty,
      t.price.toFixed(2), t.exit ? t.exit.toFixed(2) : (t._mark ? t._mark.toFixed(2)+' (mark)' : ''),
      (t.pnl ?? t._upnl ?? '').toString().slice(0,10),
      ((t.pnlPct ?? t._upnlPct ?? 0) * 100).toFixed(2) + '%',
      t.status, '"' + t.reason.replace(/"/g,"'") + '"'
    ]));
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob([csv], {type: 'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'shoal_trades.csv'; a.click();
    URL.revokeObjectURL(url);
  };

  return (
    <div className="page" data-screen-label="03 Trade history">
      <div className="page-head" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div>
          <div className="page-eyebrow">Trade history · {mode === 'LIVE' ? 'Live' : 'Virtual'}</div>
          <h1 className="page-title">Every order, <em>every outcome.</em></h1>
          <p className="page-sub">The unfiltered ledger — entry, exit, and what it cost or made you. Click any row for full reasoning.</p>
        </div>
        <button className="btn" onClick={exportCSV}>EXPORT CSV ↓</button>
      </div>

      <div className="kpi-grid" style={{marginBottom:16}}>
        <div className="kpi">
          <div className="kpi-label">Realized P&L</div>
          <div className={'kpi-value mono '+(totalRealized>=0?'up':'dn')}>{fmtMoney(totalRealized,0)}</div>
          <div className="kpi-delta muted">{closed.length} closed · {markedTrades.filter(t=>t.status==='OPEN').length} open</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Win rate</div>
          <div className="kpi-value mono">{(winRate*100).toFixed(1)}%</div>
          <div className="kpi-delta up">{wins.length}W / <span className="dn">{losses.length}L</span></div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Avg win / loss</div>
          <div className="kpi-value mono"><span className="up">{fmtMoney(avgWin,0)}</span> <span className="muted">/</span> <span className="dn">{fmtMoney(avgLoss,0)}</span></div>
          <div className="kpi-delta muted">payoff {(avgLoss?Math.abs(avgWin/avgLoss):0).toFixed(2)}×</div>
        </div>
        <div className="kpi">
          <div className="kpi-label">Profit factor</div>
          <div className="kpi-value mono">{isFinite(profitFactor) ? profitFactor.toFixed(2) : '∞'}</div>
          <div className="kpi-delta muted">gross wins / gross losses</div>
        </div>
      </div>

      <div className="card" style={{marginBottom:0}}>
        <div className="card-head">
          <div className="card-title">All trades</div>
          <div className="card-meta">{filtered.length} shown · {baseTrades.length} total</div>
        </div>

        {/* filter row */}
        <div style={{display:'flex',gap:14,flexWrap:'wrap',alignItems:'center',padding:'8px 0 14px',borderBottom:'1px solid var(--line)',marginBottom:0}}>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            <span className="mono tiny muted" style={{letterSpacing:'0.1em'}}>STATUS</span>
            <div className="tweak-opts">
              {['ALL','WIN','LOSS','OPEN'].map(s =>
                <div key={s} className={'tweak-opt '+(statusFilter===s?'on':'')} onClick={()=>setStatusFilter(s)}>{s}</div>
              )}
            </div>
          </div>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            <span className="mono tiny muted" style={{letterSpacing:'0.1em'}}>SIDE</span>
            <div className="tweak-opts">
              {['ALL','BUY','SELL'].map(s =>
                <div key={s} className={'tweak-opt '+(sideFilter===s?'on':'')} onClick={()=>setSideFilter(s)}>{s}</div>
              )}
            </div>
          </div>
          <div style={{display:'flex',gap:6,alignItems:'center'}}>
            <span className="mono tiny muted" style={{letterSpacing:'0.1em'}}>SYMBOL</span>
            <select
              value={symFilter}
              onChange={e=>setSymFilter(e.target.value)}
              style={{background:'var(--bg-2)',border:'1px solid var(--line)',color:'var(--ink)',padding:'5px 10px',fontFamily:'var(--mono)',fontSize:10,letterSpacing:'0.08em',borderRadius:3}}>
              <option value="ALL">ALL SYMBOLS</option>
              {symbols.map(s => <option key={s} value={s}>{s}</option>)}
            </select>
            {activeSymbol && symFilter !== activeSymbol && (
              <button className="tweak-opt" onClick={()=>setSymFilter(activeSymbol)} title="Use the symbol selected in the topbar">◎ {activeSymbol}</button>
            )}
          </div>
          {(statusFilter !== 'ALL' || sideFilter !== 'ALL' || symFilter !== 'ALL') && (
            <button className="btn ghost" style={{marginLeft:'auto'}} onClick={()=>{setStatusFilter('ALL');setSideFilter('ALL');setSymFilter('ALL');}}>CLEAR</button>
          )}
        </div>

        <table className="tbl history">
          <thead>
            <tr>
              <th style={{cursor:'pointer'}} onClick={()=>toggleSort('time')}>Time{sortArrow('time')}</th>
              <th style={{cursor:'pointer'}} onClick={()=>toggleSort('sym')}>Symbol{sortArrow('sym')}</th>
              <th>Side</th>
              <th style={{textAlign:'right'}}>Qty</th>
              <th style={{textAlign:'right'}}>Entry</th>
              <th style={{textAlign:'right'}}>Exit</th>
              <th style={{textAlign:'right',cursor:'pointer'}} onClick={()=>toggleSort('pnl')}>P&L ($){sortArrow('pnl')}</th>
              <th style={{textAlign:'right',cursor:'pointer'}} onClick={()=>toggleSort('pnlPct')}>P&L (%){sortArrow('pnlPct')}</th>
              <th>Hold</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr><td colSpan="10" style={{textAlign:'center',padding:30,color:'var(--ink-3)'}}>No trades match these filters.</td></tr>
            )}
            {filtered.map(t => {
              const isOpen = t.status === 'OPEN';
              const pnl = t.pnl ?? t._upnl;
              const pnlPct = t.pnlPct ?? t._upnlPct;
              const exit = t.exit ?? t._mark;
              const hold = isOpen
                ? Math.round((Date.now() - t.ts) / 60000) + 'm'
                : t.exitTs ? Math.round((t.exitTs - t.ts) / 60000) + 'm' : '—';
              return (
                <tr key={t.id} onClick={()=>onTradeClick(t)} style={{cursor:'pointer'}}>
                  <td className="mono tiny">{new Date(t.ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
                  <td className="mono"><b>{t.sym}</b></td>
                  <td><span className={'pill ' + (t.side==='BUY'?'buy':'sell')}>{t.side}</span></td>
                  <td className="mono" style={{textAlign:'right'}}>{t.qty}</td>
                  <td className="mono" style={{textAlign:'right'}}>${fmtNum(t.price)}</td>
                  <td className="mono" style={{textAlign:'right',color:isOpen?'var(--ink-3)':'var(--ink-2)'}}>
                    {exit ? '$' + fmtNum(exit) : '—'}
                    {isOpen && exit && <span className="tiny muted" style={{marginLeft:4}}>mark</span>}
                  </td>
                  <td className={'mono ' + (pnl>=0?'up':'dn')} style={{textAlign:'right',fontWeight:500}}>
                    {pnl != null ? fmtMoney(pnl) : '—'}
                  </td>
                  <td className={'mono ' + (pnl>=0?'up':'dn')} style={{textAlign:'right'}}>
                    {pnlPct != null ? fmtPct(pnlPct) : '—'}
                  </td>
                  <td className="mono tiny muted">{hold}</td>
                  <td>
                    <span className={'pill ' + (t.status==='WIN'?'buy':t.status==='LOSS'?'sell':'hold')} style={{fontSize:9}}>
                      {t.status}
                    </span>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>

<script type="text/babel" data-presets="react">
// Strategy / learning insights screen

const ScreenLearning = ({ mode, ctx }) => {
  const activeSymbol  = ctx?.activeSymbol || 'NVDA';
  const predData      = React.useMemo(() => genPredVsActual(activeSymbol), [activeSymbol]);
  const colors        = AGENTS.map(a => a.color);
  const agentWeights  = ctx?.agentWeights || {};
  const agentHistory  = ctx?.agentHistory || {};
  const closedReal    = (ctx?.trades || []).filter(t => t.pnl != null && t.votes);
  const dirAcc        = closedReal.length >= 3 ? closedReal.filter(t => t.pnl > 0).length / closedReal.length : 0.647;
  const avgConf       = closedReal.length >= 3 ? closedReal.reduce((s, t) => s + t.conf, 0) / closedReal.length : 0.71;
  const wins          = closedReal.filter(t => t.pnl > 0);
  const losses        = closedReal.filter(t => t.pnl <= 0);
  const avgWin        = wins.length   ? wins.reduce((s, t)   => s + t.pnl, 0) / wins.length   : 1;
  const avgLoss       = losses.length ? Math.abs(losses.reduce((s, t) => s + t.pnl, 0) / losses.length) : 1;
  const pseudoSharpe  = Math.min(0.99, avgWin / (avgWin + avgLoss));
  return (
    <div className="page" data-screen-label="03 Learning">
      <div className="page-head">

          </div>

window.ScreenLearning = ScreenLearning;

<script type="text/babel" data-presets="react">
// Market analysis screen — sector / correlation map

const ScreenMarket = ({ tick, mode, ctx }) => {
  // build flattened universe with dynamic returns and real TA confidence where available
  const universe = [];
  SECTORS.forEach((s, si) => {
    SECTOR_TICKERS[s].forEach((sym, ti) => {
      const seed = (si * 8 + ti);
      const chg = (Math.sin(seed + tick * 0.07) + Math.cos(seed * 1.7 + tick * 0.03)) * 1.8;
      // Real TA confidence for tickers in SIGNALS_ALL; otherwise synthetic
      const realSigs = SIGNALS_ALL[sym];
      let conf;
      if (realSigs) {
        const ens = computeEnsemble(realSigs, {});
        conf = ens.confidence;
      } else {
        conf = 0.38 + (Math.abs(Math.sin(seed * 2.3 + tick * 0.11)) * 0.52);
      }
      // Sparkline: rolling 20-period mini price history
      const spark = Array.from({length:20}, (_, i) =>
        50 + Math.sin(i * 0.8 + seed + tick * 0.12) * 8 + Math.cos(i * 1.3 + seed * 0.7) * 4
      );
      universe.push({ sym, sector: s, chg, conf, spark, watched: ['NVDA','AAPL','MSFT','TSLA','META','JPM'].includes(sym) });
    });
  });

  return (
    <div className="page" data-screen-label="06 Market">
      <div className="page-head">
        <div className="page-eyebrow">Market analysis · sector correlation map</div>
        <h1 className="page-title">The whole market, <em>at one glance.</em></h1>
        <p className="page-sub">Color = today's return. Brightness = swarm confidence. The bot scans every cell every minute, looking for clusters where multiple agents simultaneously agree.</p>
      </div>

      <div className="grid-2-1" style={{marginBottom:16}}>
        <div className="card">
          <div className="card-head">
            <div className="card-title">Universe map</div>
            <div className="card-meta">{universe.length} tickers · live</div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:14}}>
            {SECTORS.map(s => (
              <div key={s}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
                  <span className="mono tiny" style={{color:'var(--ink-2)',letterSpacing:'0.14em',textTransform:'uppercase'}}>{s}</span>
                  <span className="mono tiny muted">{universe.filter(u=>u.sector===s).length} symbols</span>
                </div>
                <div className="sector-map" style={{gridTemplateColumns:'repeat(8,1fr)'}}>
                  {universe.filter(u=>u.sector===s).map(u => {
                    const isUp = u.chg >= 0;
                    const intensity = Math.min(1, Math.abs(u.chg) / 3);
                    const bg = isUp
                      ? `rgba(125, 216, 125, ${0.08 + intensity * 0.4})`
                      : `rgba(255, 107, 107, ${0.08 + intensity * 0.4})`;
                    return (
                      <div key={u.sym} className="sector-cell" style={{background:bg, border: u.watched ? '1px solid var(--virtual)' : '1px solid transparent'}}>
                        <div className="sym">{u.sym}</div>
                        <div className="pct" style={{color: isUp?'var(--up)':'var(--down)'}}>{u.chg>=0?'+':''}{u.chg.toFixed(2)}%</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="stack">
          <div className="card">
            <div className="card-head"><div className="card-title">Hot signals</div><div className="card-meta">conf ≥ 70%</div></div>
            <div style={{display:'flex',flexDirection:'column'}}>
              {universe.filter(u=>u.conf>=0.7).slice(0,8).map(u => (
                <div key={u.sym} style={{display:'grid',gridTemplateColumns:'60px 60px 1fr 60px',gap:10,padding:'10px 0',borderBottom:'1px solid var(--line)',alignItems:'center',fontSize:12}}>
                  <span className="mono" style={{color:'var(--ink)',fontWeight:500}}>{u.sym}</span>
                  <span className={'pill ' + (u.chg>=0?'buy':'sell')}>{u.chg>=0?'BUY':'SELL'}</span>
                  <span className="mono tiny muted">{u.sector} · {(u.conf*100).toFixed(0)}% conf</span>
                  <Sparkline data={u.spark} color={u.chg>=0?'var(--virtual)':'var(--down)'} width={60} height={20}/>
                </div>
              ))}
            </div>
          </div>

          <div className="card">
            <div className="card-head"><div className="card-title">Regime</div></div>
            <div style={{padding:'8px 0'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:6}}>
                <span className="mono tiny muted">CURRENT</span>
                <span className="serif" style={{fontSize:18,fontStyle:'italic'}}>Risk-on · trending</span>
              </div>
              <div style={{height:6,background:'var(--bg-3)',borderRadius:3,position:'relative',marginTop:14,marginBottom:8}}>
                <div style={{position:'absolute',left:'0',right:'0',top:'-18px',display:'flex',justifyContent:'space-between'}}>
                  <span className="mono tiny" style={{color:'var(--down)'}}>RISK-OFF</span>
