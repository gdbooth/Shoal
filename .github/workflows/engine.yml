# Free external scheduler for the Shoal server engine.
# Every 15 minutes on weekdays across US market hours (13:00–21:59 UTC covers the open and close in both
# winter and summer time), it calls the engine, which uses Alpaca's market clock to decide what is due:
# the open review, an hourly check, or the end-of-day report. Ticks with nothing due do nothing.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SHOAL_ENGINE_URL     e.g. https://shoaltrade.vercel.app
#   SHOAL_ENGINE_SECRET  the same value as CRON_SECRET in Vercel
# GitHub runs scheduled workflows only from the default branch, and may start them a few minutes late.
name: Shoal engine

on:
  schedule:
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch: {}

concurrency:
  group: shoal-engine
  cancel-in-progress: false

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Tick the engine
        env:
          URL: ${{ secrets.SHOAL_ENGINE_URL }}
          SECRET: ${{ secrets.SHOAL_ENGINE_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRET" ]; then
            echo "::warning::Set the SHOAL_ENGINE_URL and SHOAL_ENGINE_SECRET repository secrets to enable the engine."
            exit 0
          fi
          code=$(curl -sS -o out.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $SECRET" --max-time 290 "${URL%/}/api/engine/tick")
          cat out.json; echo
          if [ "$code" != "200" ]; then echo "::error::Engine tick failed (HTTP $code)"; exit 1; fi
